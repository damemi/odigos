apiVersion: odigos.io/v1alpha1
kind: Processor
metadata:
  name: copy-instrumentation-scope
  namespace: odigos-system
spec:
  type: transform
  processorConfig:
    trace_statements:
      - context: span
        statements:
        - set(attributes["otel.instrumentation.scope"], instrumentation_scope.name)
  signals:
    - TRACES
  collectorRoles:
    - CLUSTER_GATEWAY