apiVersion: odigos.io/v1alpha1
kind: Processor
metadata:
  name: insert-host-name
  namespace: odigos-system
spec:
  type: resource
  processorConfig:
    attributes:
      - key: host.name
        from_attribute: k8s.pod.name
        action: insert
  signals:
    - TRACES
  collectorRoles:
    - CLUSTER_GATEWAY