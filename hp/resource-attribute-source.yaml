apiVersion: odigos.io/v1alpha1
kind: Processor
metadata:
  name: add-attribute-to-source
  namespace: odigos-system
spec:
  type: transform
  processorConfig:
    trace_statements:
      - context: resource
        statements:
        - set(attributes["foo"], "bar") where attributes["service.name"] == "frontend"
  signals:
    - TRACES
  collectorRoles:
    - CLUSTER_GATEWAY