              owasp: "API10:2023"
            - source: d2_dangerous_port
              category: exfiltration
              weight: 30
              confidence: 1.0
              contribution: 30
              rationale: "egress to a sensitive port outside the mesh"
              mitre: "TA0010"

    LearningMode:
      type: string
      enum: [all, any, k_of]

    LearningConditionType:
      type: string
      enum: [min_observations, min_duration, stable_observations, stable_duration]

    Finding:
      type: object
      description: One unified feed row; a flattened anomaly issue or violation.
      properties:
        kind: { $ref: "#/components/schemas/FindingKind" }
        service: { type: string }
        namespace: { type: string }
        title:
          type: string
          description: >
            Human-readable headline. Anomalies use operation_name; violations
            use the guardrail rule label.
        summary:
          type: string
          description: >
            Render-ready one-line explanation of what the finding is, so the
            list conveys the gist without opening investigate. Deliberately
            omits service and title (already on the row): anomalies name the
            deviated classes; violations name the rule and what broke it.
            Display as-is.
        operation:
          type: string
          description: >
            Full canonical transaction operation (anomalies only). Omitted for
            violations.
        operation_name:
          type: string
          description: Entry-span operation without dimension suffixes (anomalies).
        identity_dimensions:
          type: array
          description: Parsed identity dimensions (anomalies only).
          items: { $ref: "#/components/schemas/TransactionIdentityValue" }
        offending: { type: string }
        score: { type: integer }
        severity: { $ref: "#/components/schemas/Severity" }
        occurrences: { type: integer, format: int64 }
        first_seen:
          type: string
          format: date-time
          description: >
            Earliest occurrence of this finding (anomaly or guardrail violation).
        last_seen: { type: string, format: date-time }
        status: { type: string }
        transaction_id:
          type: integer
          format: int64
          description: Anomaly drill-down key (with signature).
