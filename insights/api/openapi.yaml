    InterrogationEventType:
      type: string
      description: |
        Open set: ignore types you do not know. The schema of `payload` for
        each type:

        | Type | Payload schema | When |
        |---|---|---|
        | `interrogation.started` | `InterrogationEventStartedPayload` | the run's first node, after the leader picked it up |
        | `interrogation.stop_requested` | `InterrogationEventStopRequestedPayload` | the run saw the stop |
        | `interrogation.extended` | `InterrogationEventExtendedPayload` | the run saw a later deadline |
        | `interrogation.ended` | `InterrogationEventEndedPayload` | the run's last event. Absent when the server had to close an overdue run; rely on `complete` |
        | `round.started` | `InterrogationEventRoundStartedPayload` | |
        | `round.finished` | `InterrogationEventRoundFinishedPayload` | |
        | `node.finished` | `InterrogationEventNodeFinishedPayload` | the run left a node |
        | `wait.started` | `InterrogationEventWaitStartedPayload` | the run parked in a wait node |
        | `wait.finished` | `InterrogationEventWaitFinishedPayload` | |
        | `evidence.collected` | `InterrogationEventEvidencePayload` | `gather` and `observe` read the call graphs |
        | `model.called` | `InterrogationEventModelCalledPayload` | after every model call, success or not |
        | `change.proposed` | `InterrogationEventChangeProposedPayload` | the model named a change |
        | `change.denied` | `InterrogationEventChangeDeniedPayload` | validation refused it |
        | `change.requested` | `InterrogationEventChangeRequestedPayload` | validation passed, stored |
        | `change.applied` | `InterrogationEventChangeAppliedPayload` | the rule carries it |
        | `change.measured` | `InterrogationEventChangeMeasuredPayload` | `observe` read what the change's spans measured |
        | `change.failed` | `InterrogationEventChangeFailedPayload` | not in the rule in time, or blocked |
        | `change.reverted` | `InterrogationEventChangeRevertedPayload` | ended while the run was open |
        | `answer.updated` | `InterrogationAnswer` | the running answer changed |
        | `error.raised` | `InterrogationEventErrorRaisedPayload` | an attempt at a node failed and is retried |
      x-extensible-enum:
        - interrogation.started
        - interrogation.stop_requested
        - interrogation.extended
        - interrogation.ended
        - round.started
        - round.finished
        - node.finished
        - wait.started
        - wait.finished
        - evidence.collected
        - model.called
        - change.proposed
        - change.denied
        - change.requested
        - change.applied
        - change.measured
        - change.reverted
        - change.failed
        - answer.updated
        - error.raised

    InterrogationSource:
      type: object
      description: The workload a run targets. All containers of the workload.
      properties:
        namespace: { type: string }
        kind: { type: string, description: "Workload kind: Deployment, StatefulSet, DaemonSet, ..." }
        name: { type: string }
      required: [namespace, kind, name]

    InterrogationBudget:
      type: object
      properties:
        max_probes:
          type: integer
          minimum: 1
          maximum: 20
          description: Most probes the run may add. Default 5.
        max_added_spans_per_min:
          type: integer
          minimum: 1
          description: Cap on span volume the run may add. Not supported yet; omit it.
          x-go-type-skip-optional-pointer: false
        time_limit_seconds:
          type: integer
          minimum: 300
          maximum: 14400
          description: >
            Wall-clock limit from `started_at`, as requested at start.
            Default 3600. Extensions are not added here; see
            `Interrogation.extended_seconds`.
        max_rounds:
          type: integer
          description: Read-only, from server configuration. Ignored on start.
          readOnly: true

    InterrogationStart:
      type: object
      properties:
        source: { $ref: "#/components/schemas/InterrogationSource" }
        goal:
          $ref: "#/components/schemas/InterrogationGoal"
          description: Default `observability`.
        question:
          type: string
          maxLength: 2000
          description: Optional. Empty means the goal's default question.
        transaction_ids:
          type: array
          maxItems: 20
          description: >
            Endpoints to focus on, from `GET /interrogations/sources/transactions`.
            Empty or absent: the run picks.
          items: { type: integer, format: int64 }
        allow_changes:
          type: array
          description: >
            Kinds of change the run may make. Empty or absent: read-only, the
            run proposes and applies nothing.
          items: { $ref: "#/components/schemas/InterrogationChangeKind" }
        budget: { $ref: "#/components/schemas/InterrogationBudget" }
        actor:
          type: string
          maxLength: 200
          description: Free text naming who started it; stored for display only.
      required: [source]
      examples:
        - source: { namespace: claims-demo, kind: Deployment, name: claims-intake }
          goal: observability
          question: "Why is claim submission slow for some users?"
          transaction_ids: [4211, 4215]
          allow_changes: [custom_instrumentation]
          budget: { max_probes: 5, time_limit_seconds: 3600 }
          actor: alon
        - source: { namespace: claims-demo, kind: Deployment, name: claims-intake }

    InterrogationStop:
      type: object
      properties:
        changes:
          type: string
          description: "`keep` (default): leave changes until they expire. `revert`: remove them now."
          enum: [keep, revert]
        actor: { type: string, maxLength: 200 }
      examples:
        - { changes: revert, actor: alon }

    InterrogationExtend:
      type: object
      properties:
        seconds:
          type: integer
          minimum: 60
          maximum: 14400
        actor: { type: string, maxLength: 200 }
      required: [seconds]
      examples:
        - { seconds: 1800, actor: alon }

    InterrogationTrigger:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/InterrogationTriggerKind" }
        actor: { type: string }
      required: [kind]

    InterrogationStopRequest:
      type: object
      description: Present once a stop was recorded.
      properties:
        requested_at: { type: string, format: date-time }
        changes: { type: string, enum: [keep, revert] }
        actor: { type: string }
      required: [requested_at, changes]

    InterrogationScopeTransaction:
      type: object
      properties:
        transaction_id: { type: integer, format: int64 }
        operation: { type: string }
        kind: { type: string }
        selected_by: { $ref: "#/components/schemas/InterrogationScopeSelection" }
      required: [transaction_id, operation, kind, selected_by]

    InterrogationNode:
      type: object
      description: One node of the graph in one round, as the run went through it.
      properties:
        name: { $ref: "#/components/schemas/InterrogationNodeName" }
        state: { $ref: "#/components/schemas/InterrogationNodeState" }
        visits:
          type: integer
          description: >
            Times the run entered the node in this round. More than 1 for the
            nodes of a poll (`wait_apply`, `confirm`), for a retried model
            call, and after a failed attempt.
        entered_at: { type: string, format: date-time, description: "First entry in this round." }
        left_at: { type: string, format: date-time, description: "Last exit; absent while the run is in it.", x-go-type-skip-optional-pointer: false }
      required: [name, state, visits, entered_at]

    InterrogationWait:
      type: object
      description: What the run is waiting for right now.
      properties:
        reason: { $ref: "#/components/schemas/InterrogationWaitReason" }
        since: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time, description: "When the wait gives up or is checked again.", x-go-type-skip-optional-pointer: false }
      required: [reason, since]

    InterrogationProgress:
      type: object
      properties:
        round: { type: integer, description: "Current round, 1-based; 0 before the first." }
        max_rounds: { type: integer }
        node:
          $ref: "#/components/schemas/InterrogationNodeName"
          description: The node the run is in; absent before the leader picked the run up and after the end.
        wait:
          allOf: [{ $ref: "#/components/schemas/InterrogationWait" }]
          description: Present while the run is parked in a wait node.
          x-go-type-skip-optional-pointer: false
      required: [round, max_rounds]

    InterrogationAnswer:
      type: object
      description: The running answer; replaced as rounds finish, final once the run ends.
      properties:
        text: { type: string }
        certainty:
          type: integer
          minimum: 0
          maximum: 100
          description: The model's own number, 0..100. Shown only; nothing stops on it.
        final: { type: boolean }
        round: { type: integer, description: "Round that produced this version." }
        updated_at: { type: string, format: date-time }
      required: [text, certainty, final, round, updated_at]

    InterrogationChangeCounts:
      type: object
      properties:
        total: { type: integer, description: "Every change of the run: `live` + `reverting` + `reverted` + `expired` + `failed` + `denied`." }
        live: { type: integer, description: "`requested` + `blocked` + `active`, kept ones included." }
        reverting: { type: integer, description: "Ended, still in the rule until the next reconcile." }
        reverted: { type: integer, description: "Ended by a person, by stop-and-revert, or because the source is gone." }
        expired: { type: integer, description: "Left when their time ran out. The normal end of a run's changes." }
        failed: { type: integer, description: "Accepted, never took effect." }
        denied: { type: integer }
        next_expiry_at:
          type: string
          format: date-time
          description: Soonest expiry among live temporary changes. The list's "Ends" column.
          x-go-type-skip-optional-pointer: false
      required: [total, live, reverting, reverted, expired, failed, denied]

    InterrogationUsage:
      type: object
      properties:
        rounds: { type: integer }
        duration_seconds: { type: integer }
        probes_used: { type: integer }
        max_probes: { type: integer }
        model_calls: { type: integer }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        model: { type: string, description: "Model that served the calls, as the gateway reported it." }
      required: [rounds, duration_seconds, probes_used, max_probes, model_calls, input_tokens, output_tokens]

    InterrogationEvidenceCounts:
      type: object
      description: What a reading of the call graphs in scope found.
      properties:
        transactions: { type: integer, description: "Transactions with evidence in scope." }
        functions: { type: integer, description: "Application functions in the call graphs." }
        edges: { type: integer, description: "Caller-callee edges in the call graphs." }
        new_edges: { type: integer, description: "Edges that were not there at the previous reading; all of them at the first." }
      required: [transactions, functions, edges, new_edges]

    InterrogationTransactionTimings:
      type: object
      description: What the entry spans of a transaction measured in a window. Times are milliseconds.
      properties:
        transaction_id: { type: integer, format: int64 }
        window_seconds: { type: integer }
        requests: { type: integer, format: int64 }
        errors: { type: integer, format: int64, description: "Requests whose entry span errored or answered 5xx." }
        avg_ms: { type: number }
        p95_ms: { type: number, description: "Upper bound within a factor of 2. Absent below 20 requests." }
        max_ms: { type: number }
        avg_spans: { type: number, description: "Mean spans of the application in a request." }
        uncovered_avg_ms: { type: number, description: "Mean time in a request outside every probed function." }
      required: [transaction_id, window_seconds, requests, errors, avg_ms, max_ms, avg_spans, uncovered_avg_ms]

    InterrogationErrorCount:
      type: object
      properties:
        message: { type: string }
        count: { type: integer, format: int64 }
      required: [message, count]

    InterrogationChangeMeasured:
      type: object
      description: What the spans of a probe measured in the transactions in scope. Times are milliseconds.
      properties:
        window_seconds: { type: integer, description: "From the round's first applied probe to `measured_at`." }
        measured_at: { type: string, format: date-time }
        spans: { type: integer, format: int64, description: "0 when the traffic did not call the function in the window." }
        errors: { type: integer, format: int64, description: "Spans with status error." }
        avg_ms: { type: number }
        p95_ms: { type: number, description: "Upper bound within a factor of 2. Absent below 20 spans." }
        max_ms: { type: number }
        self_avg_ms: { type: number, description: "Mean time outside probed callees." }
        top_errors:
          type: array
          description: Up to 3 status messages of the errored spans. Text from the application.
          items: { $ref: "#/components/schemas/InterrogationErrorCount" }
      required: [window_seconds, measured_at, spans, errors, avg_ms, max_ms, self_avg_ms, top_errors]

    InterrogationRoundReply:
      type: object
      description: What the model replied in the round.
      properties:
        text: { type: string, description: "Its answer on the evidence of this round." }
        certainty: { type: integer, minimum: 0, maximum: 100 }
        done: { type: boolean, description: "The model decided more probes would not change the answer." }
      required: [text, certainty, done]

    InterrogationRound:
      type: object
      description: >
        One round, as the workflow recorded it. A field that is absent has
        not happened yet.
      properties:
        round: { type: integer }
        state: { $ref: "#/components/schemas/InterrogationRoundState" }
        outcome:
          $ref: "#/components/schemas/InterrogationRoundOutcome"
          description: Present once the round is `completed`.
        final: { type: boolean, description: "No probe can be added in this round." }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, x-go-type-skip-optional-pointer: false }
        nodes:
          type: array
          description: The nodes the run went through in this round, in the order it first entered them.
          items: { $ref: "#/components/schemas/InterrogationNode" }
        observed:
          allOf: [{ $ref: "#/components/schemas/InterrogationEvidenceCounts" }]
          description: The call graphs `gather` read before the model call.
          x-go-type-skip-optional-pointer: false
        reply:
          allOf: [{ $ref: "#/components/schemas/InterrogationRoundReply" }]
          x-go-type-skip-optional-pointer: false
        proposed:
          type: array
          description: >
            Ids of every change the model proposed this round, accepted or
            denied. They are the ids of `Interrogation.changes`, which also
            lists the denied ones with their reason.
          items: { type: string }
        applied:
          type: array
          description: Ids of the changes that reached the cluster this round.
          items: { type: string }
        observed_after:
          allOf: [{ $ref: "#/components/schemas/InterrogationEvidenceCounts" }]
          description: The call graphs `observe` read after the changes ran with traffic.
          x-go-type-skip-optional-pointer: false
        timings:
          type: array
          description: >
            Entry timings of the transactions in scope that had requests. Read
            by `gather` before the model call; `observe` replaces them with
            its reading after the changes ran. Absent when nothing was
            measured.
          items: { $ref: "#/components/schemas/InterrogationTransactionTimings" }
      required: [round, state, final, started_at, nodes, proposed, applied]

    Interrogation:
      type: object
      properties:
        id: { type: string }
        display_id:
          type: string
          description: Short human label, `INT-` + the first 8 hex characters of `id` in upper case. Not a key; two runs can share one. Use `id` to address a run.
        title: { type: string, description: "The question, or the goal's default question when none was given." }
        source: { $ref: "#/components/schemas/InterrogationSource" }
        goal: { $ref: "#/components/schemas/InterrogationGoal" }
        question: { type: string }
        transaction_ids:
          type: array
          description: As requested. What the run actually looked at is in `scope`.
          items: { type: integer, format: int64 }
        allow_changes:
          type: array
          items: { $ref: "#/components/schemas/InterrogationChangeKind" }
        budget: { $ref: "#/components/schemas/InterrogationBudget" }
        trigger: { $ref: "#/components/schemas/InterrogationTrigger" }
        status:
          $ref: "#/components/schemas/InterrogationStatus"
          description: >
            Changes to a terminal value only when the run is closed: the
            source is free and `complete` is true on the events from the
            same moment.
        end_reason: { $ref: "#/components/schemas/InterrogationEndReason" }
        error: { type: string, description: "Failure text when `status` is `failed`." }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, description: "When the leader picked it up; absent while queued.", x-go-type-skip-optional-pointer: false }
        deadline_at: { type: string, format: date-time, description: "When the time limit ends the run, extensions included; absent while queued.", x-go-type-skip-optional-pointer: false }
        extended_seconds:
          type: integer
          description: >
            Seconds added by extends, in total. Absent when the run was never
            extended. `budget.time_limit_seconds` + this is the run's whole
            allowance.
        ended_at: { type: string, format: date-time, x-go-type-skip-optional-pointer: false }
        stop:
          allOf: [{ $ref: "#/components/schemas/InterrogationStopRequest" }]
          x-go-type-skip-optional-pointer: false
        scope:
          type: array
          description: Transactions the run is looking at; filled in by the run when none were requested.
          items: { $ref: "#/components/schemas/InterrogationScopeTransaction" }
        progress: { $ref: "#/components/schemas/InterrogationProgress" }
        certainty:
          type: integer
          minimum: 0
          maximum: 100
