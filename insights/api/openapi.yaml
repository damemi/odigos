          scope_key: ""

    PolicyList:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/Policy" }
      required: [count, items]

    Severity:
      type: string
      enum: [info, low, medium, high, critical]

    FindingKind:
      type: string
      enum: [anomaly, violation]

    AnomalyStatus:
      type: string
      description: >
