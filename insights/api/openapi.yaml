      required: [deadline_at, max_rounds, max_probes, allow_changes, revision]

    InterrogationEventStopRequestedPayload:
      type: object
      properties:
        changes: { type: string, enum: [keep, revert] }
        actor: { type: string }
      required: [changes]

    InterrogationEventExtendedPayload:
      type: object
      properties:
        deadline_at: { type: string, format: date-time, description: "The new deadline." }
