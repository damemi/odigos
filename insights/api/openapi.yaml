          x-go-type-skip-optional-pointer: false
        answer:
          allOf: [{ $ref: "#/components/schemas/InterrogationAnswer" }]
          x-go-type-skip-optional-pointer: false
        change_counts: { $ref: "#/components/schemas/InterrogationChangeCounts" }
        changes:
          type: array
          description: >
            Detail only; absent on the list. The run's changes, denied
            proposals included, oldest `requested_at` first.
          items: { $ref: "#/components/schemas/InterrogationChange" }
        usage: { $ref: "#/components/schemas/InterrogationUsage" }
        last_sequence:
          type: integer
          format: int64
          description: Highest event sequence written so far.
        rounds:
          type: array
          description: Detail only; absent on the list.
          items: { $ref: "#/components/schemas/InterrogationRound" }
      required:
