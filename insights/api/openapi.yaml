      type: string
      enum: [info, low, medium, high, critical]

    FindingKind:
      type: string
      enum: [anomaly, violation]

    AnomalyStatus:
      type: string
      description: >
        Lifecycle bucket. `accepted` means the operator confirmed the behaviour
        is legitimate and folded it into the baseline (it stops re-alerting) -
        the shared affirmative term with ViolationStatus.
      enum: [open, accepted, dismissed]

    ViolationStatus:
      type: string
      description: >
