      required: [deadline_at, seconds]

    InterrogationEventEndedPayload:
      type: object
      properties:
        status: { $ref: "#/components/schemas/InterrogationStatus" }
        end_reason: { $ref: "#/components/schemas/InterrogationEndReason" }
