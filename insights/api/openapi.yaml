          span_highlights:
            - span_id: "a1b2c3d4"
              severity: high
              reason: unauthorized callee

    GuardrailRuleConfig:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        mode: { $ref: "#/components/schemas/RuleMode" }
        allowlist:
          type: array
          items: { type: string }
        correlations:
          type: array
          description: >
            Cross-span correlation specs. Only used by the
            `attribute_correlation` rule (transaction-scoped): each spec asserts
            two captured span attributes stay consistent within one trace.
          items: { $ref: "#/components/schemas/CorrelationSpec" }
        origin:
          type: string
          description: >
            How this rule was created. `auto_transaction_guardrail` means it was
            created automatically when the service's transactions promoted
            (not a manual edit). `recommendation` means an operator applied a
            mined recommendation.
      required: [key, label, mode]

    CorrelationSelector:
      type: object
      description: Locates one attribute on one span within a trace.
      properties:
        service: { type: string, description: Owning service name of the span. }
        span:
          type: string
          description: >
            Span match - the span name or the captured `code.function.name`
            (e.g. resolvePrincipal, getAccount).
        attr:
          type: string
          description: >
            Attribute key to read (e.g. return.value, arg.0, url.full).
        extract:
          type: string
          description: >
            Optional regex applied to the attribute value. Capture group 1 is
            used when present, otherwise the whole match. Empty = use the value
            verbatim.
      required: [service, span, attr]

    CorrelationSpec:
      type: object
      description: >
        One cross-span consistency assertion: compare `left` vs `right` within a
        single trace and fire a violation when they do not satisfy `relation`.
      properties:
        name: { type: string }
        left: { $ref: "#/components/schemas/CorrelationSelector" }
        right: { $ref: "#/components/schemas/CorrelationSelector" }
        relation:
          type: string
          enum: [equals, not_equals]
          description: Required relation between the two extracted values.
        severity:
          allOf: [{ $ref: "#/components/schemas/Severity" }]
          default: critical
          description: Risk of a violation of this rule. Defaults to critical.
        why:
          type: string
          description: Operator rationale, shown in the finding.
      required: [name, left, right, relation]

    ServiceGuardrail:
      type: object
      properties:
        scope: { $ref: "#/components/schemas/PolicyScope" }
        scope_key: { type: string }
        rules:
          type: array
          items: { $ref: "#/components/schemas/GuardrailRuleConfig" }
        delivery: { $ref: "#/components/schemas/DeliverySettings" }
      required: [scope, scope_key, rules]
      examples:
        - scope: service
          scope_key: default/frontend
          rules:
            - key: allowed_callers
              label: Allowed callers
              mode: enforce
              allowlist: ["default/gateway"]
            - key: allowed_egress
              label: Allowed egress destinations
              mode: suggest
              allowlist: ["checkout.stripe.com:443"]

    ServiceGuardrailList:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/ServiceGuardrail" }
      required: [count, items]

    RecommendationKind:
      type: string
      description: >
        What apply would write. `attribute_correlation`: one cross-span rule on
        a transaction guardrail. `service_guardrail`: a service's allowlist
        rules, pre-filled from what was learned.
      enum: [attribute_correlation, service_guardrail]

    RecommendationState:
      type: string
      description: >
        Lifecycle bucket. `open` awaits a decision, `applied` became a guardrail
        rule, `dismissed` was rejected (sticky across re-mining).
      enum: [open, applied, dismissed]

    RecommendationConfidenceLevel:
      type: string
      enum: [high, medium, low]

    RecommendationConfidence:
      type: object
      description: >
        Why the engine believes the recommendation. `level` and `reasons` are
        render-ready for every kind. Sample stats come from what the miner read;
        live counters come from checking the open recommendation silently
        against real traffic and keep growing until it is applied or dismissed.
        For `service_guardrail` the live counters are summed over the proposed
        rules; each rule carries its own on `rules[]`.
      properties:
        level: { $ref: "#/components/schemas/RecommendationConfidenceLevel" }
        reasons:
          type: array
          description: Human-readable evidence lines, e.g. "Held on 50 of 50 samples".
          items: { type: string }
        sample_count:
          type: integer
          description: >
            What was mined: stored relation samples for `attribute_correlation`,
            promoted transactions the profile was learned from for
            `service_guardrail`.
        live_held:
          type: integer
          format: int64
          description: Live traces on which the recommendation held.
        live_broken:
          type: integer
          format: int64
          description: >
            Live traces on which it broke. Non-zero means real traffic already
            disagrees with what was learned - look before applying.
        live_since:
          type: string
          format: date-time
          description: Omitted until the first live trace was evaluated.
        live_last:
          type: string
          format: date-time
          description: Omitted until the first live trace was evaluated.
        hold_ratio:
          type: number
          format: double
          description: "`attribute_correlation` only: held / observed on stored samples (0..1)."
        observed:
          type: integer
          description: "`attribute_correlation` only: stored samples where both values were present."
        held:
          type: integer
          description: "`attribute_correlation` only: of those, how many satisfied the relation."
        distinct:
          type: integer
          description: "`attribute_correlation` only: distinct left-hand values seen agreeing."
      required: [level, reasons, sample_count, live_held, live_broken]

    RecommendationExample:
      type: object
      description: One stored sample the relation held on, with the two values.
      properties:
        trace_id: { type: string }
        left_value: { type: string }
        right_value: { type: string }
        observed_at: { type: string, format: date-time }
      required: [trace_id, left_value, right_value, observed_at]

    Recommendation:
      type: object
      description: >
        One suggestion of any `kind`. The envelope (identity, scope, lifecycle,
        headline, confidence) is the same for every kind so a screen can list,
        filter and act on them together; the fields of one kind are absent on
        the others. Switch on `kind` to read them.
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/RecommendationKind" }
        state: { $ref: "#/components/schemas/RecommendationState" }
        stale:
          type: boolean
          description: >
            The latest mining run no longer produced this recommendation: the
            relation stopped holding or its samples aged out, or a service has
            nothing left to enforce.
        rank:
          type: integer
          description: Position among the scope's recommendations, 0 = strongest.
        scope:
          allOf: [{ $ref: "#/components/schemas/PolicyScope" }]
          description: >
            The guardrail apply would extend, with the same meaning as a
            guardrail's scope/scope_key: `transaction` for
            `attribute_correlation`, `service` for `service_guardrail`.
        scope_key: { type: string }
        namespace: { type: string }
        service: { type: string }
        title:
          type: string
          description: >
            One-line headline, e.g. "resolvePrincipal return.value matches
            getAccount arg.0" or "Lock down account-service - 3 rules ready".
        summary:
          type: string
          description: One or two sentences on what was learned and what apply does.
        why_it_matters:
          type: string
          description: The security story - what enforcing buys.
        confidence: { $ref: "#/components/schemas/RecommendationConfidence" }
        mined_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

        transaction_id:
          type: integer
          format: int64
          description: "`attribute_correlation`: the transaction the rule belongs to."
        operation:
          type: string
          description: "`attribute_correlation`: that transaction's operation."
        transaction_kind:
          allOf: [{ $ref: "#/components/schemas/TransactionKind" }]
          description: "`attribute_correlation`: that transaction's kind."
        spec:
          allOf: [{ $ref: "#/components/schemas/CorrelationSpec" }]
          description: "`attribute_correlation`: the exact rule `apply` adds to the transaction guardrail."
          x-go-type-skip-optional-pointer: false
        transform:
          type: string
          description: >
            `attribute_correlation`: how the two values relate - `exact`
            (identical), `core` (identical after a constant prefix/suffix),
            `digits` (same numeric id), `contains` (one value is embedded in the
            other).
        transport:
          type: boolean
          description: >
            `attribute_correlation`: guaranteed by the transport rather than by
            business logic - the same field on both ends of one hop (a Kafka
            message key on producer and consumer). A break means in-flight
            tampering or misattribution, so it is mined at `low` severity and
            ranked after every business relation. Shown as a tag on the row.
        examples:
          type: array
          description: "`attribute_correlation`: up to three stored samples the relation held on."
          items: { $ref: "#/components/schemas/RecommendationExample" }
        already_covered:
          type: boolean
          description: >
            `attribute_correlation`: the transaction's guardrail already has a
            rule on the same two attributes (e.g. added by hand). Apply would
            replace it.

        rules:
          type: array
          description: >
            `service_guardrail`: the allowlist rules proposed for enforcement, in
            catalog order. Only rules the service does not enforce yet are
            listed - a rule already enforced by an operator or by the automatic
            transaction guardrail, or switched off, is not - so applying extends
            the guardrail and never overrides an existing rule.
          items: { $ref: "#/components/schemas/RecommendationRule" }
        applied_rules:
          type: array
          description: >
            `service_guardrail`: rule keys an apply turned on. Set while `state`
            is `applied`; rules listed but not here were deselected by the
            operator.
          items: { type: string }
      required:
        - id
        - kind
        - state
        - stale
        - rank
        - scope
        - scope_key
        - namespace
        - service
        - title
        - summary
        - why_it_matters
        - confidence
        - mined_at
        - created_at
        - updated_at

    RecommendationList:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
      required: [count, items]

    RecommendationIDsRequest:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          items: { type: string }
      required: [ids]

    RecommendationApplyItem:
      type: object
      properties:
        id: { type: string }
        spec:
          allOf: [{ $ref: "#/components/schemas/CorrelationSpec" }]
          description: >
            Optional edited rule. Left/right service, span and attr must match
            the recommendation; name, severity, why, relation and extract
            regexes may differ.
          x-go-type-skip-optional-pointer: false
        rules:
          type: array
          description: >
            `service_guardrail` only: the rule keys to enable, a subset of the
            recommendation's `rules`. Omitted or empty enables every rule.
            Ignored for other kinds.
          items: { type: string }
      required: [id]

    RecommendationApplyRequest:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RecommendationApplyItem" }
      required: [items]

    RecommendationItemError:
      type: object
      properties:
        id: { type: string }
        error: { type: string }
      required: [id, error]

    RecommendationBulkResult:
      type: object
      properties:
        done: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items: { $ref: "#/components/schemas/RecommendationItemError" }
      required: [done, failed, errors]

    RecommendationPreviewRequest:
      type: object
      properties:
        transaction_id: { type: integer, format: int64 }
        spec: { $ref: "#/components/schemas/CorrelationSpec" }
      required: [transaction_id, spec]

    RecommendationPreview:
      type: object
      description: How a spec fares on the transaction's stored relation samples.
      properties:
        sample_count: { type: integer }
        observed: { type: integer }
        held: { type: integer }
        distinct: { type: integer }
        hold_ratio: { type: number, format: double }
        examples:
          type: array
          items: { $ref: "#/components/schemas/RecommendationExample" }
        counter_examples:
          type: array
          description: Up to three samples where the relation did not hold.
          items: { $ref: "#/components/schemas/RecommendationExample" }
      required: [sample_count, observed, held, distinct, hold_ratio, examples, counter_examples]

    RecommendationRecomputeRequest:
      type: object
      properties:
        transaction_id:
          type: integer
          format: int64
          description: Re-mine one transaction's rule recommendations.
        namespace:
          type: string
          description: With `service`, re-mine that service's guardrail recommendation.
        service:
          type: string
      description: >
        Empty (or all fields unset) sweeps everything: every promoted transaction
        with unmined samples and every fully-learned service.

    RecommendationRule:
      type: object
      description: >
        One allowlist rule a `service_guardrail` recommendation proposes,
        pre-filled from what was learned. Applying it enforces exactly `items`;
        an empty list is a valid, strict rule (e.g. "this service makes no
        external calls"). Each rule is checked silently against live traffic
        while the recommendation is open and carries its own counters.
      properties:
        rule:
          type: string
          description: Rule key - allowed_callers | allowed_callees | allowed_egress | allowed_transactions.
        label:
          type: string
          description: Catalog label, e.g. "Allowed egress".
        description:
          type: string
          description: One line on what the rule enforces, from the catalog.
        items:
          type: array
          description: The allowlist apply would write - services, host[:port]s, or transaction identities.
          items: { type: string }
        confidence: { $ref: "#/components/schemas/RecommendationConfidenceLevel" }
        live_checked:
          type: integer
          format: int64
          description: Live traces of this service checked silently against the proposed list.
        live_violated:
          type: integer
          format: int64
          description: >
            Of those, how many carried something outside the list. Non-zero
            means real traffic already disagrees with what was learned - look
            before enforcing.
        live_since:
          type: string
          format: date-time
          description: Omitted until the first live trace was checked.
        live_last:
          type: string
          format: date-time
          description: Omitted until the first live trace was checked.
      required: [rule, label, description, items, confidence, live_checked, live_violated]

    LearningCondition:
      type: object
      properties:
        type: { $ref: "#/components/schemas/LearningConditionType" }
        minObservations: { type: integer, format: int64 }
        minDurationMinutes: { type: integer, format: int64 }
        stableObservations: { type: integer, format: int64 }
        stableMinutes: { type: integer, format: int64 }
      required: [type]

    LearningPolicy:
      type: object
      properties:
        class: { $ref: "#/components/schemas/DeviationClass" }
        mode: { $ref: "#/components/schemas/LearningMode" }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/LearningCondition" }
        min_matches: { type: integer }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        scope_key: { type: string }
      required: [class, mode, scope, scope_key]
      examples:
        - class: D2_egress
          mode: any
          conditions:
            - type: stable_observations
              stableObservations: 5000
            - type: stable_duration
              stableMinutes: 1440
          min_matches: 1
          scope: global
          scope_key: ""

    LearningPolicyList:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/LearningPolicy" }
      required: [count, items]

    CatalogClass:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        baseline_label:
          type: string
          description: Transaction-baseline name for this class (what is learned). Distinct from finding-oriented `label`.
        baseline_description:
          type: string
          description: Tooltip for what this class learns on a transaction baseline.
        category: { type: string }
        category_label: { type: string }
        weight: { type: integer }
        mitre: { type: string }
        owasp: { type: string }
      required: [id, label, baseline_label, category, weight]

    EnricherList:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        hint: { type: string }
        default:
          type: array
          items: { type: string }
      required: [key, label]

    CatalogEnricher:
      type: object
      properties:
        source: { type: string }
        parent_class: { type: string }
        category: { type: string }
        weight: { type: integer }
        label: { type: string }
        description: { type: string }
        list:
          allOf: [{ $ref: "#/components/schemas/EnricherList" }]
          x-go-type-skip-optional-pointer: false
      required: [source, parent_class, category, weight, label]

    CatalogCategory:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        base: { type: integer }
        mitre: { type: string }
        owasp: { type: string }
      required: [id, label, base]

    CatalogGuardrailRule:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        description: { type: string }
        category: { type: string }
        weight: { type: integer }
        hint: { type: string }
      required: [key, label, category, weight]

    SeverityBand:
      type: object
      properties:
        severity: { $ref: "#/components/schemas/Severity" }
        min_score: { type: integer }
      required: [severity, min_score]

    Catalog:
      type: object
      properties:
        deviation_classes:
          type: array
          items: { $ref: "#/components/schemas/CatalogClass" }
        enrichers:
          type: array
          items: { $ref: "#/components/schemas/CatalogEnricher" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/CatalogCategory" }
        guardrail_rules:
          type: array
          items: { $ref: "#/components/schemas/CatalogGuardrailRule" }
        severity_bands:
          type: array
          items: { $ref: "#/components/schemas/SeverityBand" }
        correlation_bonus: { type: integer }
        tags:
          type: object
          additionalProperties: { type: string }
      required: [deviation_classes, enrichers, categories, guardrail_rules, severity_bands, correlation_bonus, tags]

    SystemSamplingSettings:
      type: object
      description: >
        Learning-phase example sampling only: collect up to N examples per
        transaction (throttled by interval), then stop. Anomaly and guardrail
        evidence each keep a single write-once sample; occurrences are counted
        separately.
      properties:
        examples_per_transaction: { type: integer, minimum: 1 }
        example_sample_interval_seconds: { type: integer, minimum: 1 }
        relation_samples_per_transaction:
          type: integer
          minimum: 1
          maximum: 500
          description: >
            Whole traces kept per learning transaction for the correlation
            recommendation miner (default 50). More samples = stronger evidence
            for a mined relation, at the cost of storage for 14 days. Omit to
            keep the default.
        relation_sample_interval_seconds:
          type: integer
          minimum: 1
          description: Minimum seconds between two relation samples (default 5).
      required:
        - examples_per_transaction
        - example_sample_interval_seconds

    SystemRetentionSettings:
      type: object
      properties:
        observation_retention_days:
          type: integer
          minimum: 1
          maximum: 120
          description: >
            Days to keep sample traces (default 120); enforced by the hourly
            retention job and applied right away on save. Matches the 120-day
            findings lookback ceiling.
      required: [observation_retention_days]

    SystemCapacitySettings:
      type: object
      description: >
        In-memory limits for learned baselines. Higher values use more RAM;
        lower values may evict cold transactions or truncate large sets.
      properties:
        max_resident_transactions:
          type: integer
          minimum: 1
          description: >
            Max transactions whose baselines stay hot in process memory.
            Least-recently used entries are dropped when the cap is exceeded.
        max_baseline_set_members:
          type: integer
          minimum: 1
          default: 1000
          description: >
            Max unique members remembered in one baseline set (e.g. call edges
            or paths for one class). A class that crosses it is frozen as
            saturated: it stops learning, is never promoted or enforced, and is
            listed in the transaction's `saturated_classes`.
        max_transactions_per_service:
          type: integer
          minimum: 1
          default: 200
          description: >
            Max distinct transactions one service may add to the inventory
            (default 200). Once reached, operations not seen before are dropped
            before anything is stored, so span names that carry request ids
            cannot grow the transactions and baseline tables without bound.
            Transactions already in the inventory keep being learned and
            scored, and raising the limit resumes admission. Services at the
            limit are reported with `transaction_limit_reached` on `GET /services`.
            Optional on PUT so clients built before it existed stay valid; when
            omitted the default applies.
      required: [max_resident_transactions, max_baseline_set_members]

    SystemWritebackSettings:
      type: object
      description: >
        How often the engine writes pending baseline learning and occurrence
        counters to the database. Raise to reduce DB load; lower for fresher UI counts.
      properties:
        flush_interval_seconds:
          type: integer
          minimum: 1
          maximum: 300
          description: >
            Seconds between write-behind flushes (default 15). Applies live -
            no pod restart. Also covers anomaly and guardrail occurrence drains.
            Time-based promotion is re-evaluated after each flush.
      required: [flush_interval_seconds]

    SystemDetectionSettings:
      type: object
      description: >
        Global detection toggles (Threat detection → Detection config).
      properties:
        auto_transaction_guardrail:
          type: boolean
          description: >
            When true, automatically create an enforced allowed_transactions
            guardrail when a service finishes promoting (every transaction leaves
            learning). Applies only going forward - already-promoted services are
            not backfilled when this is turned on. Per-service disable uses rule
            mode off.
        recommendation_min_distinct:
          type: integer
          minimum: 1
          description: >
            A mined correlation is only recommended when at least this many
            different values were seen agreeing (default 5). Guards against
            two attributes that merely share a constant.
        recommendation_min_hold_percent:
          type: integer
          minimum: 1
          maximum: 100
          description: >
            Share of samples (with both values present) on which the relation
            must hold to be recommended (default 98).
      required: [auto_transaction_guardrail]

    SystemTransactionIdentityDimension:
      type: object
      description: >
        One low-cardinality attribute (or built-in resolver key) folded into
        transaction identity from the sub-transaction entry span only.
      properties:
        key:
          type: string
          minLength: 1
          description: >
            Attribute key or built-in resolver (e.g. http.response.status_code,
            rpc.grpc.status_code). Must be low-cardinality - high-cardinality
            keys explode transaction count, memory (max_resident_transactions),
            and baseline rows.
        enabled:
          type: boolean
          description: When true, this dimension is applied to new traffic.
      required: [key, enabled]

    SystemIdentitySettings:
      type: object
      description: >
        Extra dimensions appended to transaction Operation before hashing.
        Each enabled dimension multiplies cardinality. Use only low-cardinality
        attributes (e.g. status codes). Do not use user.id, http.url,
        request ids, emails, or other high-cardinality keys. Changing this
        setting does not migrate existing baselines - new traffic creates new
        transaction identities.
      properties:
        transaction_identity_dimensions:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/SystemTransactionIdentityDimension" }
      required: [transaction_identity_dimensions]

    SystemSettings:
      type: object
      properties:
        sampling: { $ref: "#/components/schemas/SystemSamplingSettings" }
        retention: { $ref: "#/components/schemas/SystemRetentionSettings" }
        capacity: { $ref: "#/components/schemas/SystemCapacitySettings" }
        writeback: { $ref: "#/components/schemas/SystemWritebackSettings" }
        detection: { $ref: "#/components/schemas/SystemDetectionSettings" }
        identity: { $ref: "#/components/schemas/SystemIdentitySettings" }
        reset_transactions:
          type: boolean
          description: >
            Write-only. When true and identity.transaction_identity_dimensions
            changed vs the stored settings, delete all transactions and related
            baselines/samples/findings before applying. Ignored when dimensions
            are unchanged. Never returned by GET.
          x-go-type-skip-optional-pointer: false
      required: [sampling, retention, capacity, writeback, detection, identity]

    StorageHealthStatus:
      type: string
      enum: [healthy, degraded, critical, unreachable]

    StorageDiskStatus:
      type: string
      enum: [ok, warning, critical]

    StorageConnection:
      type: object
      properties:
        reachable: { type: boolean }
        ping_latency_ms: { type: integer, format: int64 }
        version: { type: string }
        database: { type: string }
        error: { type: string }
        uptime_seconds: { type: number, format: double }
      required: [reachable, ping_latency_ms, version, database, uptime_seconds]

    StorageDisk:
      type: object
      properties:
        database_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Size of the Insights database on disk.
        volume_bytes:
          type: integer
          format: int64
          minimum: 0
          description: >
            Size of the volume backing the bundled database. 0 when unknown
            (external Postgres), in which case used_percent is 0.
        used_percent: { type: number, format: double }
        status: { $ref: "#/components/schemas/StorageDiskStatus" }
      required: [database_bytes, volume_bytes, used_percent, status]

    StorageConnections:
      type: object
      description: >
        Server-side connections to the Insights database by state, and this
        replica's client pool.
      properties:
        active: { type: integer, minimum: 0 }
        idle: { type: integer, minimum: 0 }
        idle_in_transaction: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        max: { type: integer, minimum: 0, description: The server's max_connections. }
        pool_acquired: { type: integer, minimum: 0 }
        pool_idle: { type: integer, minimum: 0 }
        pool_total: { type: integer, minimum: 0 }
        pool_max: { type: integer, minimum: 0 }
        pool_wait_count:
          type: integer
          format: int64
          minimum: 0
          description: Acquires that had to wait for a free connection.
        pool_wait_seconds: { type: number, format: double }
      required: [active, idle, idle_in_transaction, total, max, pool_acquired, pool_idle, pool_total, pool_max, pool_wait_count, pool_wait_seconds]

    StorageDatabaseStats:
      type: object
      description: Cumulative counters from pg_stat_database since stats_since.
      properties:
        cache_hit_percent: { type: number, format: double }
        commits: { type: integer, format: int64, minimum: 0 }
        rollbacks: { type: integer, format: int64, minimum: 0 }
        deadlocks: { type: integer, format: int64, minimum: 0 }
        temp_bytes: { type: integer, format: int64, minimum: 0 }
        stats_since:
          type: string
          format: date-time
          description: Omitted when the counters were never reset.
      required: [cache_hit_percent, commits, rollbacks, deadlocks, temp_bytes]

    StorageQuery:
      type: object
      properties:
        elapsed_seconds: { type: number, format: double }
        user: { type: string }
        state: { type: string }
        wait_event:
          type: string
          description: "<type>:<event> the query is waiting on, empty when running."
        query: { type: string }
      required: [elapsed_seconds, user, state, wait_event, query]

    StorageStatement:
      type: object
      properties:
        query: { type: string }
        calls: { type: integer, format: int64, minimum: 0 }
        total_seconds: { type: number, format: double }
        mean_ms: { type: number, format: double }
        rows: { type: integer, format: int64, minimum: 0 }
      required: [query, calls, total_seconds, mean_ms, rows]

    StorageQueries:
      type: object
      properties:
        active: { type: integer, minimum: 0 }
        longest_seconds: { type: number, format: double }
        running:
          type: array
          description: Queries executing now, longest first. Capped at 20.
          items: { $ref: "#/components/schemas/StorageQuery" }
        top_statements:
          type: array
          description: >
            Statements with the most total execution time, from
            pg_stat_statements. Capped at 10. Empty when the extension is not
            installed (see statements_available).
          items: { $ref: "#/components/schemas/StorageStatement" }
        statements_available: { type: boolean }
      required: [active, longest_seconds, running, top_statements, statements_available]

    StorageTable:
      type: object
      properties:
        name: { type: string }
        rows: { type: integer, format: int64, minimum: 0 }
        dead_rows: { type: integer, format: int64, minimum: 0 }
        bytes_on_disk: { type: integer, format: int64, minimum: 0 }
        last_vacuum_at:
          type: string
          format: date-time
          description: Newest manual or auto vacuum. Omitted when never vacuumed.
      required: [name, rows, dead_rows, bytes_on_disk]

    StorageMaintenance:
      type: object
      properties:
        dead_rows: { type: integer, format: int64, minimum: 0 }
        vacuums_running: { type: integer, minimum: 0 }
        waiting_locks:
          type: integer
          minimum: 0
          description: Sessions blocked on a lock right now.
        oldest_transaction_seconds: { type: number, format: double }
      required: [dead_rows, vacuums_running, waiting_locks, oldest_transaction_seconds]

    StorageRetention:
      type: object
      description: >
        Retention policy and the last run of the job that deletes expired
        sample traces and delivery attempts (runs hourly on the leader).
      properties:
        observation_retention_days: { type: integer, minimum: 0 }
        relation_retention_days: { type: integer, minimum: 0 }
        attempt_retention_days: { type: integer, minimum: 0 }
        ever_ran: { type: boolean }
        last_run_at:
          type: string
          format: date-time
          description: Omitted when the job has not run yet.
        last_run_ok: { type: boolean }
        last_error: { type: string }
        observations_deleted: { type: integer, format: int64, minimum: 0 }
        attempts_deleted: { type: integer, format: int64, minimum: 0 }
      required: [observation_retention_days, relation_retention_days, attempt_retention_days, ever_ran, last_run_ok, observations_deleted, attempts_deleted]

    StorageWriteback:
      type: object
      properties:
        flush_interval_seconds: { type: integer, minimum: 1 }
        ever_flushed: { type: boolean }
        last_flush_ok: { type: boolean }
        last_flush_at:
          type: string
          format: date-time
          description: Omitted when no flush has been observed yet.
        last_flush_error: { type: string }
      required: [flush_interval_seconds, ever_flushed, last_flush_ok]

    StorageHealth:
      type: object
      properties:
        checked_at: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/StorageHealthStatus" }
        connection: { $ref: "#/components/schemas/StorageConnection" }
        disk: { $ref: "#/components/schemas/StorageDisk" }
        connections: { $ref: "#/components/schemas/StorageConnections" }
        database: { $ref: "#/components/schemas/StorageDatabaseStats" }
        queries: { $ref: "#/components/schemas/StorageQueries" }
        tables:
          type: array
          items: { $ref: "#/components/schemas/StorageTable" }
        maintenance: { $ref: "#/components/schemas/StorageMaintenance" }
        retention: { $ref: "#/components/schemas/StorageRetention" }
        writeback: { $ref: "#/components/schemas/StorageWriteback" }
      required:
        - checked_at
        - status
        - connection
        - disk
        - connections
        - database
        - queries
        - tables
        - maintenance
        - retention
        - writeback

    IntegrationFieldType:
      type: string
      description: >
        Drives the form control and validation for one config key. `secret`
        values are write-only and read back as a redacted placeholder.
      enum: [string, secret, url, number, bool, select]

    IntegrationFieldSpec:
      type: object
      description: One key of a backend's config, as rendered in its editor.
      properties:
        key: { type: string }
        label: { type: string }
        type: { $ref: "#/components/schemas/IntegrationFieldType" }
        required: { type: boolean }
        help: { type: string }
        placeholder: { type: string }
        default: { type: string }
        options:
          type: array
          items: { type: string }
          description: Allowed values for `select` fields.
      required: [key, label, type, required]

    IntegrationCapabilities:
      type: object
      description: >
        How the backend models alerts; informs what the notifier sends.
        `needs_heartbeat`: active findings are re-asserted every poll so the
        backend does not expire them. `supports_resolve`: the backend tracks
        open/closed per finding, so accepted/dismissed findings are always
        sent as resolved (other backends only get resolve events when the
        integration opts in via `filters.notify_on_resolve`).
      properties:
        needs_heartbeat: { type: boolean }
        supports_resolve: { type: boolean }
        returns_external_id: { type: boolean }
        max_batch:
          type: integer
          description: Most findings one request to the backend carries.
      required: [needs_heartbeat, supports_resolve, returns_external_id, max_batch]

    IntegrationDescriptor:
      type: object
      description: A supported backend and how to configure it.
      properties:
        type:
          type: string
          description: Stable backend id used as `Integration.type`.
        name: { type: string }
        description: { type: string }
        docs_url: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/IntegrationFieldSpec" }
        capabilities: { $ref: "#/components/schemas/IntegrationCapabilities" }
      required: [type, name, description, fields, capabilities]

    IntegrationCatalog:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/IntegrationDescriptor" }
      required: [count, items]

    IntegrationFilters:
      type: object
      description: Per-integration gate applied after routing.
      properties:
        min_severity:
          allOf: [{ $ref: "#/components/schemas/Severity" }]
          description: Drop findings below this tier. Omitted = deliver all.
        kinds:
          type: array
          items: { $ref: "#/components/schemas/FindingKind" }
          description: Only deliver these kinds. Omitted/empty = both.
        notify_on_resolve:
          type: boolean
          description: >
            Also send a resolved event when a finding is accepted or dismissed,
            for backends without native resolve (Slack, webhook). Backends with
            `supports_resolve` always receive resolves.

    IntegrationHealth:
      type: object
      description: >
        Derived from the attempt audit (last 24h) and the delivery ledger.
        `consecutive_failures` is the trailing run of failed attempts since the
        last success.
      properties:
        last_success_at: { type: string, format: date-time }
        last_failure_at: { type: string, format: date-time }
        last_error: { type: string }
        consecutive_failures: { type: integer }
        pending: { type: integer, description: Deliveries awaiting the next tick. }
        failed: { type: integer, description: Deliveries awaiting a backoff retry. }
        dead: { type: integer, description: Deliveries that exhausted retries or hit a permanent error. }
      required: [consecutive_failures, pending, failed, dead]

    IntegrationWrite:
      type: object
      description: Create/update body. `config` keys come from the catalog descriptor's `fields`.
      properties:
        name: { type: string }
        type:
          type: string
          description: Backend id from the catalog. Ignored on update.
        enabled:
          type: boolean
          description: Disabled integrations keep their config but receive nothing. Defaults to true.
          x-go-type-skip-optional-pointer: false
        config:
          type: object
          additionalProperties: true
          description: Backend config keyed by field; values typed per field type.
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        filters: { $ref: "#/components/schemas/IntegrationFilters" }
      required: [name, type, config]

    Integration:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        enabled: { type: boolean }
        config:
          type: object
          additionalProperties: true
          description: Stored config with secret fields redacted.
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        filters: { $ref: "#/components/schemas/IntegrationFilters" }
        health: { $ref: "#/components/schemas/IntegrationHealth" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, type, enabled, config, filters, health, created_at, updated_at]
      examples:
        - id: "9c1f0c4e-2a7b-4f3b-9a1e-6b1f0c0d2e11"
          name: platform-alertmanager
          type: alertmanager
          enabled: true
          config:
            url: http://alertmanager.monitoring:9093
            username: insights
            password: "••••••••"
          filters:
            min_severity: medium
          health:
            last_success_at: "2026-10-11T09:30:15Z"
            consecutive_failures: 0
            pending: 0
            failed: 0
            dead: 0
          created_at: "2026-10-01T08:00:00Z"
          updated_at: "2026-10-01T08:00:00Z"

    IntegrationList:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/Integration" }
      required: [count, items]

    DeliveryAction:
      type: string
      enum: [firing, resolved]

    DeliveryState:
      type: string
      description: >
        `sent`: last action delivered. `failed`: last attempt failed with a
        retryable error; `next_attempt_at` says when it retries. `dead`:
        retries exhausted or a permanent error (bad credentials, rejected
        payload); needs a manual retry. `pending`: re-armed, sends next tick.
      enum: [pending, sent, failed, dead]

    Delivery:
      type: object
      description: Ledger row for one (integration, finding) pair.
      properties:
        integration_id: { type: string }
        finding_key: { type: string }
        last_action: { $ref: "#/components/schemas/DeliveryAction" }
        state: { $ref: "#/components/schemas/DeliveryState" }
        attempts:
          type: integer
          description: Consecutive failed attempts for the current action.
        next_attempt_at: { type: string, format: date-time }
        last_error: { type: string }
        sent_at: { type: string, format: date-time }
        occurrences_at_send: { type: integer, format: int64 }
        severity_at_send: { type: string }
        status_at_send: { type: string }
        external_id:
          type: string
          description: Backend-side id when the backend returns one.
        updated_at: { type: string, format: date-time }
      required: [integration_id, finding_key, last_action, state, attempts, updated_at]

    DeliveryList:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/Delivery" }
      required: [count, items]

    DeliveryRetryRequest:
      type: object
      properties:
        finding_keys:
          type: array
          items: { type: string }
          description: Findings to re-arm. Empty or omitted = every failed and dead delivery.

    DeliveryAttemptOutcome:
      type: string
      enum: [ok, error, dead]

    DeliveryAttempt:
      type: object
      description: One send to a backend for one finding.
      properties:
        integration_id: { type: string }
        finding_key: { type: string }
        action: { $ref: "#/components/schemas/DeliveryAction" }
        attempt: { type: integer }
        outcome: { $ref: "#/components/schemas/DeliveryAttemptOutcome" }
        http_status: { type: integer }
        error: { type: string }
        duration_ms: { type: integer }
        event_count:
          type: integer
          description: Findings carried by the same request (batched backends).
        attempted_at: { type: string, format: date-time }
      required: [integration_id, finding_key, action, attempt, outcome, duration_ms, event_count, attempted_at]

    DeliveryAttemptList:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/DeliveryAttempt" }
      required: [count, items]

    InterrogationErrorResponse:
      type: object
      description: >
        The standard `ErrorResponse` envelope with `error.details` typed:
        the existing `ErrorBody.details` is an untyped object, and this
        schema says what this tag puts in it. `code` keeps the existing
        closed set; the typed reason is in `details.reason`. The server
        writes the one `ErrorResponse` type (`x-go-type`).
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [bad_request, not_found, conflict, unprocessable_entity, unavailable, internal_error]
            message: { type: string }
            details: { $ref: "#/components/schemas/InterrogationErrorDetails" }
          required: [code, message]
      required: [error]
      x-go-type: ErrorResponse

    InterrogationErrorReason:
      type: string
      description: >
        `source_busy` (409): the source has an open run; `interrogation_id`
        and `display_id` name it. `at_capacity` (503): too many open runs,
        `open` and `max_open`; or too many runs started in the last 24 hours,
        `max_per_day`. `not_enabled` (503): autopilot is off; `requires`.
        `not_ready` (503): tables or the runner are not available yet; retry.
        `not_supported_yet` (422): the option named in `option` is in the
        contract but not built. `no_evidence` (422): the source has
        no call-graph evidence. `invalid_argument` (422): `field` names the
        bad field. `not_running` (409): the run is not open, is stopping, or
        is past its deadline. `invalid_change_state` (409): the change is not
        in a state the action accepts; `state` has the current one. Open set.
      x-extensible-enum:
        - source_busy
        - at_capacity
        - not_enabled
        - not_ready
        - not_supported_yet
        - no_evidence
        - invalid_argument
        - not_running
        - invalid_change_state

    InterrogationErrorDetails:
      type: object
      additionalProperties: true
      properties:
        reason: { $ref: "#/components/schemas/InterrogationErrorReason" }
        option:
          type: string
          description: >
            With `not_supported_yet`: `<field>=<value>` for an option value
            (`goal=security`, `allow_changes=kernel_spans`), or the field path
            for a field (`budget.max_added_spans_per_min`).
        field:
          type: string
          description: >
            With `invalid_argument`: path of the field in the REST body or
            query, snake_case (`budget.max_probes`, `transaction_ids`). A
            GraphQL client maps it to its own input field.
        value:
          type: string
          description: "With `invalid_argument` on a list: the element at fault, e.g. the unknown id in `transaction_ids`."
        interrogation_id: { type: string }
        display_id: { type: string }
        state: { type: string }
        requires: { type: string }
        open: { type: integer }
        max_open: { type: integer }
        max_per_day: { type: integer }
      required: [reason]

    InterrogationStatus:
      type: string
      description: >
        `queued`: recorded, waiting for the leader. `running`: rounds in
        progress. `stopping`: a stop was recorded, the run is winding down.
        `completed`: ended on its own (`end_reason` says why). `stopped`:
        ended by a person. `failed`: ended on an error (`error` has the
        text). Terminal: `completed`, `stopped`, `failed`. Open set: treat an
        unknown value as non-terminal and keep polling. `queued` normally
        lasts about 2 s, up to about 20 s after a leader change, and
        `stopping` a few seconds; past 30 s (from `created_at`, or from
        `stop.requested_at`) show that it is taking longer than expected. A
        run that cannot finish is closed as `failed` (`interrupted`) 5
        minutes after its deadline. A run that has been `queued` for 5
        minutes is ended the same way by the next start on its source.
      x-extensible-enum: [queued, running, stopping, completed, stopped, failed]

    InterrogationEndReason:
      type: string
      description: >
        Why the run ended; empty while open. `done`: the model decided it has
        the answer. `max_rounds`, `max_model_calls`, `time_limit`,
        `probe_budget`: a limit was reached. `changes_denied`: the model was
        not done and every probe it asked for was refused. `no_evidence`: no
        call graph was found for the transactions in scope.
        `stopped_by_user`. `source_gone`: the source is no longer
        instrumented. `model_unavailable`: the gateway kept refusing until
        the deadline. `interrupted`: the run was written by another version
        of the server and could not be continued. `error`: anything else.
        Status by reason: `completed` for the first seven, `stopped` for
        `stopped_by_user`, `failed` for the rest. Open set.
      x-extensible-enum:
        - done
        - max_rounds
        - max_model_calls
        - time_limit
        - probe_budget
        - changes_denied
        - no_evidence
        - stopped_by_user
        - source_gone
        - model_unavailable
        - interrupted
        - error

    InterrogationGoal:
      type: string
      description: Open set. `security` is in the contract and not supported yet.
      x-extensible-enum: [observability, security]

    InterrogationTriggerKind:
      type: string
      description: >
        What started the run. This API creates only `manual`. Open set.
      x-extensible-enum: [manual, alertmanager, insights, red_metrics, runtime_metrics, proactive]

    InterrogationChangeKind:
      type: string
      description: >
        `custom_instrumentation` is supported; the others are in the contract
        and rejected at start. Open set.
      x-extensible-enum: [custom_instrumentation, head_sampling, payload_collection, kernel_spans]

    InterrogationChangeState:
      type: string
      description: >
        `denied`: proposed by the model, refused by validation
        (`deny_reason`); not a stored change.
        `requested`: accepted, waiting to be written to the instrumentation
        rule. `blocked`: accepted, but it cannot be placed in the rule
        (`block_reason`). `active`: in the rule. `reverting`: ended, still in
        the rule until the next reconcile. `reverted`: ended by a person, by
        stop-and-revert or because the source is gone (`end_reason`; `remove`
        means it was permanent). `expired`: its time ran out (`end_reason`
        `expired`). `failed`: given up before it took effect (`end_reason`
        says why). Live = `requested`, `blocked`, `active`. A kept change is
        live with `lifetime` `permanent`. Open set.
      x-extensible-enum: [denied, requested, blocked, active, reverting, reverted, expired, failed]

    InterrogationChangeLifetime:
      type: string
      description: "`temporary` changes have `expires_at`; `permanent` ones were kept by a person. Open set."
      x-extensible-enum: [temporary, permanent]

    InterrogationChangeActionName:
      type: string
      description: An action the UI may offer on a change. `undo` is planned and never offered. Open set.
      x-extensible-enum: [keep, revert, remove, undo]

    InterrogationChangeDenyReason:
      type: string
      description: Open set.
      x-extensible-enum:
        - changes_not_allowed
        - final_round
        - unsupported_language
        - invalid_probe
        - not_in_call_graph
        - not_application_code
        - source_not_instrumented
        - rule_disabled
        - rule_not_managed
        - already_probed
        - already_requested
        - workload_cap_reached
        - run_budget_exceeded

    InterrogationNodeName:
      type: string
      description: >
        A node of the run's workflow graph. `prepare`: check the source is
        instrumented and open round 1. `wait_baseline`: wait for traffic
        before the first reading. `gate`: check the run's limits and the
        model gateway before paying for a call. `wait_model`: the gateway is
        paused; wait. `gather`: flush and read the call graphs and build the
        model request. `analyze`: the model call. `record`: validate the
        reply, record the answer and the changes it proposes. `apply`:
        validate each proposed change and store the accepted ones.
        `wait_apply`, `confirm`: wait until the accepted changes are in the
        instrumentation rule. `wait_observe`, `observe`: let traffic run with
        them, then read the call graph again. `conclude`: end the run. A
        round runs `gate` to `observe`; round 1 also holds `prepare` and
        `wait_baseline`, and the last round `conclude`. Open set: the graph
        can gain nodes; show an unknown name as it is.
      x-extensible-enum:
        - prepare
        - wait_baseline
        - gate
        - wait_model
        - gather
        - analyze
        - record
        - apply
        - wait_apply
        - confirm
        - wait_observe
        - observe
        - conclude

    InterrogationNodeState:
      type: string
      description: >
        `running`: the run is in the node. `waiting`: the node is a wait and
        the run is parked in it. `done`: the run left it. `failed`: the last
        attempt at it failed; the run retries from its last recorded point.
