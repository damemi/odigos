        reason: { type: string }
      required: [span_id, severity, reason]

    AnomalyAttrHighlight:
      type: object
      description: Attribute on a span worth surfacing (e.g. offending db.statement).
      properties:
        span_id: { type: string }
        key: { type: string }
        value: { type: string }
      required: [span_id, key, value]

    AnomalyMetricComparison:
      type: object
      description: Observed value vs learned baseline threshold for a metric class.
      properties:
        observed: { type: integer, format: int64 }
        baseline: { type: integer, format: int64 }
        unit: { type: string, description: "us | bytes" }
      required: [observed, baseline, unit]

    AnomalyClassFinding:
      type: object
      description: >
        Render-ready explanation of one deviation class within an anomaly issue.
        Built at read time from stored evidence (+ anomaly spans when available).
        The UI should render title/summary/highlights and not parse raw evidence.
      properties:
        class: { $ref: "#/components/schemas/DeviationClass" }
        kind: { $ref: "#/components/schemas/AnomalyClassFindingKind" }
        title: { type: string }
        summary: { type: string }
        span_highlights:
          type: array
          items: { $ref: "#/components/schemas/AnomalySpanHighlight" }
        attr_highlights:
          type: array
          items: { $ref: "#/components/schemas/AnomalyAttrHighlight" }
        metric:
          allOf: [{ $ref: "#/components/schemas/AnomalyMetricComparison" }]
          x-go-type-skip-optional-pointer: false
        raw_evidence:
          type: object
          additionalProperties: true
          description: Original per-class evidence blob (fallback / debug).
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
      required: [class, kind, title, summary]

    AnomalyIssue:
      type: object
      description: >
        Full anomaly for investigate/compare. **Detail path only** - includes
        `evidence`, optional `risk`, render-ready `class_findings`, and optional
        `anomaly_trace` / `baseline_trace` for the compare waterfall. Never
        returned by `listAnomalies` or `listFindings`.
      properties:
        transaction_id: { type: integer, format: int64 }
        signature: { type: string }
        service: { type: string }
        namespace: { type: string }
        operation:
          type: string
          description: Full canonical identity string.
        operation_name:
          type: string
          description: Entry-span operation without dimension suffixes.
        identity_dimensions:
          type: array
          items: { $ref: "#/components/schemas/TransactionIdentityValue" }
        kind: { $ref: "#/components/schemas/TransactionKind" }
        triggered_classes:
          type: array
          items: { $ref: "#/components/schemas/DeviationClass" }
        offending: { type: string }
        evidence:
          type: object
          additionalProperties: true
          description: Raw per-class deviation evidence.
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        policy_id: { type: integer, format: int64 }
        occurrences: { type: integer, format: int64 }
        max_score: { type: integer }
        severity: { $ref: "#/components/schemas/Severity" }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        last_trace_id: { type: string }
        status: { $ref: "#/components/schemas/AnomalyStatus" }
        risk:
          allOf: [{ $ref: "#/components/schemas/RiskAssessment" }]
          x-go-type-skip-optional-pointer: false
        class_findings:
          type: array
          description: >
            One render-ready finding per triggered class (title, summary,
            highlights). Always present on detail; empty only if the issue has
            no triggered classes.
          items: { $ref: "#/components/schemas/AnomalyClassFinding" }
        anomaly_trace:
          allOf: [{ $ref: "#/components/schemas/Observation" }]
          description: >
            Evidence sample for this issue (`sample_reason=anomaly:<signature>`),
            including `raw_otlp`. Omitted when no sample was retained.
          x-go-type-skip-optional-pointer: false
        baseline_trace:
          allOf: [{ $ref: "#/components/schemas/Observation" }]
          description: >
            One learning-phase `example` sample for the same transaction,
            including `raw_otlp`, for baseline compare. Omitted when none exist.
          x-go-type-skip-optional-pointer: false
      required:
        - transaction_id
        - signature
        - service
        - namespace
        - operation
        - operation_name
        - identity_dimensions
        - triggered_classes
        - evidence
        - occurrences
        - max_score
        - severity
        - status
        - class_findings
      examples:
        - transaction_id: 4211
          signature: "7f3c2a9e5b1d4c8a"
          service: frontend
          namespace: default
          operation: "POST /buy [http.response.status_code=403]"
          operation_name: POST /buy
          identity_dimensions:
            - key: http.response.status_code
              value: "403"
          kind: HTTP
          triggered_classes: [D2_egress]
          offending: "new egress to 45.83.12.7:8443"
          evidence:
            D2_egress:
              new_peers: ["45.83.12.7:8443"]
              baseline_peers: ["default/pricing", "checkout.stripe.com:443"]
          policy_id: 1
          occurrences: 342
          max_score: 70
          severity: high
          first_seen: "2026-07-20T09:15:01Z"
          last_seen: "2026-07-20T14:03:22Z"
          last_trace_id: "3a5f9c7e1b2d4a6c8e0f1a2b3c4d5e6f"
          status: open
          class_findings:
            - class: D2_egress
              kind: structural
              title: Unexpected egress
              summary: New peer 45.83.12.7:8443 not in the learned baseline.

