        Full violation for investigate. **Detail path only** - includes a
        render-ready `summary`, span highlights, and optional `evidence_trace`.
        Never returned by `listGuardrailViolations` or `listFindings`. Identity
        is (`scope_key`, `rule_key`, `offending`), analogous to an anomaly's
