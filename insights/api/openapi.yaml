    InterrogationEventStartedPayload:
      type: object
      properties:
        deadline_at: { type: string, format: date-time }
        max_rounds: { type: integer }
        max_probes: { type: integer }
        allow_changes:
          type: array
          items: { $ref: "#/components/schemas/InterrogationChangeKind" }
