          anyOf:
            - $ref: "#/components/schemas/InterrogationEventStartedPayload"
            - $ref: "#/components/schemas/InterrogationEventStopRequestedPayload"
            - $ref: "#/components/schemas/InterrogationEventExtendedPayload"
            - $ref: "#/components/schemas/InterrogationEventEndedPayload"
            - $ref: "#/components/schemas/InterrogationEventRoundStartedPayload"
            - $ref: "#/components/schemas/InterrogationEventRoundFinishedPayload"
            - $ref: "#/components/schemas/InterrogationEventNodeFinishedPayload"
            - $ref: "#/components/schemas/InterrogationEventWaitStartedPayload"
            - $ref: "#/components/schemas/InterrogationEventWaitFinishedPayload"
            - $ref: "#/components/schemas/InterrogationEventEvidencePayload"
            - $ref: "#/components/schemas/InterrogationEventModelCalledPayload"
            - $ref: "#/components/schemas/InterrogationEventChangeProposedPayload"
            - $ref: "#/components/schemas/InterrogationEventChangeDeniedPayload"
            - $ref: "#/components/schemas/InterrogationEventChangeRequestedPayload"
            - $ref: "#/components/schemas/InterrogationEventChangeAppliedPayload"
            - $ref: "#/components/schemas/InterrogationEventChangeMeasuredPayload"
            - $ref: "#/components/schemas/InterrogationEventChangeFailedPayload"
            - $ref: "#/components/schemas/InterrogationEventChangeRevertedPayload"
            - $ref: "#/components/schemas/InterrogationAnswer"
            - $ref: "#/components/schemas/InterrogationEventErrorRaisedPayload"
            - type: object
