        transactions: { type: integer }
        functions: { type: integer }
        edges: { type: integer }
        new_edges: { type: integer }
        sample_edges:
          type: array
          description: At most 50.
          items: { $ref: "#/components/schemas/InterrogationCallEdge" }
        truncated: { type: boolean, description: "A call graph was larger than the request allows and was cut." }
      required: [kind]

    InterrogationEventModelCalledPayload:
      type: object
      properties:
        model: { type: string }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64 }
        outcome: { $ref: "#/components/schemas/InterrogationModelCallOutcome" }
        error: { type: string }
        attempt: { type: integer, description: "1 for the round's first call." }
      required: [outcome]

    InterrogationEventChangeProposedPayload:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/InterrogationChangeKind" }
        target: { type: string }
        probe: { $ref: "#/components/schemas/InterrogationProbe" }
        category: { $ref: "#/components/schemas/InterrogationChangeCategory" }
        reason: { type: string }
      required: [kind, target]

    InterrogationEventChangeDeniedPayload:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/InterrogationChangeKind" }
        target: { type: string }
        deny_reason: { $ref: "#/components/schemas/InterrogationChangeDenyReason" }
        detail: { type: string }
        checks:
          type: array
          description: The checks passed before the one that refused it.
          items: { $ref: "#/components/schemas/InterrogationChangeCheck" }
      required: [kind, target, deny_reason, checks]

    InterrogationEventChangeRequestedPayload:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/InterrogationChangeKind" }
        target: { type: string }
        checks:
          type: array
          items: { $ref: "#/components/schemas/InterrogationChangeCheck" }
      required: [kind, target, checks]

    InterrogationEventChangeAppliedPayload:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/InterrogationChangeKind" }
        target: { type: string }
        rule_name: { type: string }
        expires_at: { type: string, format: date-time }
      required: [kind, target]

    InterrogationEventChangeMeasuredPayload:
      allOf:
        - $ref: "#/components/schemas/InterrogationChangeMeasured"
        - type: object
          properties:
            kind: { $ref: "#/components/schemas/InterrogationChangeKind" }
            target: { type: string }
          required: [kind, target]

    InterrogationEventChangeFailedPayload:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/InterrogationChangeKind" }
        target: { type: string }
        reason: { $ref: "#/components/schemas/InterrogationChangeEndReason" }
      required: [kind, target, reason]

    InterrogationEventChangeRevertedPayload:
      type: object
      properties:
        kind: { $ref: "#/components/schemas/InterrogationChangeKind" }
        target: { type: string }
        end_reason: { $ref: "#/components/schemas/InterrogationChangeEndReason" }
        by: { type: string, description: "Actor of the stop, when it named one." }
      required: [kind, target, end_reason]

    InterrogationEventErrorRaisedPayload:
      type: object
      properties:
        node: { $ref: "#/components/schemas/InterrogationNodeName" }
        error: { type: string }
        retry_in_seconds: { type: integer }
      required: [node, error]

    InterrogationEventList:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/InterrogationEvent" }
        last_sequence:
          type: integer
          format: int64
          description: Highest sequence in `items`, or the `after` given when the page is empty. Pass it as the next `after`.
        complete:
          type: boolean
          description: True when the run has ended and no event follows `last_sequence`. Stop polling.
      required: [count, items, last_sequence, complete]

    InterrogationProbe:
      type: object
      description: The probe of a `custom_instrumentation` change. Fields used depend on `language`.
      properties:
        language: { type: string, description: "Open set: `java`, `go`, `php`, `cpp`." }
        class_name: { type: string }
        method_name: { type: string }
        package_name: { type: string }
        function_name: { type: string }
        receiver_name: { type: string }
        receiver_method_name: { type: string }
        signature: { type: string }
      required: [language]

    InterrogationChangeTarget:
      type: object
      description: The function a probe instruments. Only the fields its language uses are set.
      properties:
        class_name: { type: string }
        method_name: { type: string }
        package_name: { type: string }
        function_name: { type: string }
        receiver_name: { type: string }
        receiver_method_name: { type: string }
        signature: { type: string }

    InterrogationChange:
      type: object
      description: One change of a run, or a proposal it denied.
      properties:
        id: { type: string, description: "`chg_` + 20 hex characters; the id in `rounds[].proposed`, `rounds[].applied` and `change_id` on events." }
        round: { type: integer, description: "Round that proposed it." }
        language: { type: string, description: "`java` today." }
        target: { $ref: "#/components/schemas/InterrogationChangeTarget" }
        state: { $ref: "#/components/schemas/InterrogationChangeState" }
        deny_reason: { $ref: "#/components/schemas/InterrogationChangeDenyReason" }
        block_reason: { $ref: "#/components/schemas/InterrogationChangeBlockReason" }
        checks:
          type: array
          description: Checks passed, in order. All six for a stored change; those before the failing one for a denied proposal.
          items: { $ref: "#/components/schemas/InterrogationChangeCheck" }
        requested_at: { type: string, format: date-time, description: "When the model proposed it." }
        applied_at: { type: string, format: date-time, x-go-type-skip-optional-pointer: false }
        expires_at:
          type: string
          format: date-time
          description: Temporary stored changes only. Never later than the run's `deadline_at`; moved by extend.
          x-go-type-skip-optional-pointer: false
        ended_at: { type: string, format: date-time, description: "When it left the cluster.", x-go-type-skip-optional-pointer: false }
        end_reason:
          $ref: "#/components/schemas/InterrogationChangeEndReason"
          description: Set once the change is ending or ended. For `failed` it is why the change never took effect.
        measured:
          allOf: [{ $ref: "#/components/schemas/InterrogationChangeMeasured" }]
          description: Absent until `observe` has read the change's spans, and when none could be read.
          x-go-type-skip-optional-pointer: false
        reason: { type: string, description: "Why the model chose it, in its words, at most 500 characters." }
        lifetime: { $ref: "#/components/schemas/InterrogationChangeLifetime" }
        actions:
          type: array
          description: >
            Actions valid right now; each is `POST
            /interrogation-changes/{id}/<action>`. Empty for a denied
            proposal and an ended change.
          items: { $ref: "#/components/schemas/InterrogationChangeActionName" }
      required: [id, round, language, target, state, checks, requested_at]
      examples:
        - id: "chg_3f9a1c07b2d44e6a8c51"
          round: 1
          language: java
          target: { class_name: com.claims.intake.ClaimValidator, method_name: validate }
          state: active
          checks: [changes_allowed, in_call_graph, application_code, not_already_probed, within_workload_cap, within_run_budget]
          requested_at: "2026-11-17T09:41:02Z"
          applied_at: "2026-11-17T09:41:07Z"
          expires_at: "2026-11-17T10:38:03Z"

    InterrogationChangeRef:
      type: object
      description: The interrogation that made the change, enough for a row. Absent once the run aged out.
      properties:
        id: { type: string }
        display_id: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/InterrogationStatus" }
        round: { type: integer, description: "The run's current round." }
        trigger: { $ref: "#/components/schemas/InterrogationTrigger" }
      required: [id, display_id, title, status, round, trigger]

    InterrogationChangeDetail:
      type: object
      description: >
        A change as the changes resource serves it, with its run and the
        actions a person may take on it. The fields it shares with
        `InterrogationChange` mean the same, but `target`, a string here,
        and `proposed_at`, which is `requested_at` there.
      properties:
        id: { type: string, description: "`chg_` + 20 hex characters; the same proposal always gets the same id." }
        interrogation_id: { type: string }
        interrogation:
          allOf: [{ $ref: "#/components/schemas/InterrogationChangeRef" }]
          x-go-type-skip-optional-pointer: false
        source: { $ref: "#/components/schemas/InterrogationSource" }
        target: { type: string, description: "What it changes; for a probe the function, e.g. `com.acme.Foo.bar`." }
        probe:
          allOf: [{ $ref: "#/components/schemas/InterrogationProbe" }]
          x-go-type-skip-optional-pointer: false
        category: { $ref: "#/components/schemas/InterrogationChangeCategory" }
        round: { type: integer, description: "Round that proposed it." }
        reason: { type: string, description: "Why the model chose it, in its words, at most 500 characters." }
        checks:
          type: array
          description: Checks passed, in order. All six for a stored change; those before the failing one for a denied proposal.
          items: { $ref: "#/components/schemas/InterrogationChangeCheck" }
        state: { $ref: "#/components/schemas/InterrogationChangeState" }
        lifetime: { $ref: "#/components/schemas/InterrogationChangeLifetime" }
        deny_reason: { $ref: "#/components/schemas/InterrogationChangeDenyReason" }
        block_reason: { $ref: "#/components/schemas/InterrogationChangeBlockReason" }
        end_reason:
          $ref: "#/components/schemas/InterrogationChangeEndReason"
          description: Set once the change is ending or ended. For `failed` it is why the change never took effect.
        proposed_at: { type: string, format: date-time, description: "When the model proposed it." }
        applied_at: { type: string, format: date-time, x-go-type-skip-optional-pointer: false }
        expires_at: { type: string, format: date-time, description: "Temporary stored changes only. Moved by extend.", x-go-type-skip-optional-pointer: false }
        kept_at: { type: string, format: date-time, x-go-type-skip-optional-pointer: false }
        kept_by: { type: string, description: "The actor of the keep, when it named one." }
        ended_at: { type: string, format: date-time, description: "When it left the cluster.", x-go-type-skip-optional-pointer: false }
        actions:
          type: array
          description: Actions valid right now, so the UI does not re-derive the rules.
          items: { $ref: "#/components/schemas/InterrogationChangeActionName" }
      required: [id, interrogation_id, source, target, round, reason, checks, state, lifetime, proposed_at, actions]
      examples:
        - id: "chg_3f9a1c07b2d44e6a8c51"
          interrogation_id: "0b6f6c1e-5d0a-4b53-9f3e-0c1d7a9e4f21"
          interrogation:
            id: "0b6f6c1e-5d0a-4b53-9f3e-0c1d7a9e4f21"
            display_id: INT-0B6F6C1E
            title: "Why is claim submission slow for some users?"
            status: running
            round: 2
            trigger: { kind: manual, actor: alon }
          source: { namespace: claims-demo, kind: Deployment, name: claims-intake }
          target: com.claims.intake.ClaimValidator.validate
          probe: { language: java, class_name: com.claims.intake.ClaimValidator, method_name: validate }
          category: observability
          round: 1
          reason: "ClaimValidator.validate is called from ClaimController.submit and sits before FraudClient.score."
          checks: [changes_allowed, in_call_graph, application_code, not_already_probed, within_workload_cap, within_run_budget]
          state: active
          lifetime: temporary
          proposed_at: "2026-11-17T09:41:02Z"
          applied_at: "2026-11-17T09:41:07Z"
          expires_at: "2026-11-17T10:38:00Z"
          actions: [keep, revert]

    InterrogationChangeList:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/InterrogationChangeDetail" }
      required: [count, items]

    InterrogationChangeAction:
      type: object
      properties:
        actor: { type: string, maxLength: 200 }
      examples:
        - { actor: dana }

    InterrogationChangesRevertAll:
      type: object
      properties:
        source:
          $ref: "#/components/schemas/InterrogationSource"
          description: Only this source. Absent means the whole cluster.
        actor: { type: string, maxLength: 200 }

    InterrogationChangesReverted:
      type: object
      properties:
        count: { type: integer, description: "Changes ended by this call." }
      required: [count]

    InterrogationChangesBySource:
      type: object
      properties:
        source: { $ref: "#/components/schemas/InterrogationSource" }
        language: { type: string }
        live: { type: integer }
        probes: { type: integer, description: "Live interrogation changes on the workload; probes from other rules are not counted." }
        max_probes: { type: integer, description: "The per-workload cap over every rule, enforced when a probe is requested." }
      required: [source, live, probes, max_probes]

    InterrogationChangesSummary:
      type: object
      properties:
        live: { type: integer }
        temporary: { type: integer, description: "Live and temporary." }
        permanent: { type: integer, description: "Live and kept permanently." }
        by_kind:
          type: object
          description: Live changes per `InterrogationChangeKind`.
          additionalProperties: { type: integer }
        next_expiry_at: { type: string, format: date-time, description: "Soonest expiry among live temporary changes.", x-go-type-skip-optional-pointer: false }
        next_expiry_change_id: { type: string }
        by_source:
          type: array
          items: { $ref: "#/components/schemas/InterrogationChangesBySource" }
      required: [live, temporary, permanent, by_kind, by_source]
      examples:
        - live: 3
          temporary: 2
          permanent: 1
          by_kind: { custom_instrumentation: 3 }
          next_expiry_at: "2026-11-17T10:38:00Z"
          next_expiry_change_id: "chg_3f9a1c07b2d44e6a8c51"
          by_source:
            - source: { namespace: claims-demo, kind: Deployment, name: claims-intake }
              language: java
              live: 3
              probes: 3
              max_probes: 20

    InterrogationModelUsage:
      type: object
      description: Model calls made by the interrogations the server has (30 days). The background loop's calls are not counted.
      properties:
        calls: { type: integer }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        model: { type: string, description: "Model of the most recent call; empty when there were none." }
        gateway: { type: string, description: "`litellm`." }
      required: [calls, input_tokens, output_tokens, model, gateway]

    InterrogationSummary:
      type: object
      properties:
        queued: { type: integer }
        running: { type: integer, description: "`running` + `stopping`. The nav badge." }
        running_sources:
          type: array
          items: { $ref: "#/components/schemas/InterrogationSource" }
        total: { type: integer, description: "Interrogations the server has (30 days). The tab count." }
        concluded: { type: integer, description: "Of those, the ended ones, any terminal status." }
        avg_rounds:
          type: number
          description: Mean rounds of the runs counted in `concluded`. Absent when there are none.
          x-go-type-skip-optional-pointer: false
        avg_duration_seconds:
          type: integer
          description: Mean `ended_at` - `started_at` of the runs counted in `concluded`. Absent when there are none.
          x-go-type-skip-optional-pointer: false
        changes: { $ref: "#/components/schemas/InterrogationChangesSummary" }
        model_usage: { $ref: "#/components/schemas/InterrogationModelUsage" }
      required: [queued, running, running_sources, total, concluded, changes, model_usage]

    InterrogationOptionValue:
      type: object
      properties:
        value: { type: string }
        supported: { type: boolean, description: "False: sending it is rejected with `not_supported_yet`. Show it disabled." }
        default: { type: boolean, description: "Preselect it in the form." }
      required: [value, supported, default]

    InterrogationBudgetOption:
      type: object
      properties:
        supported: { type: boolean }
        default: { type: integer, x-go-type-skip-optional-pointer: false }
        min: { type: integer, x-go-type-skip-optional-pointer: false }
        max: { type: integer, x-go-type-skip-optional-pointer: false }
        choices:
          type: array
          description: Values the mockup offers as a select. Any value within min..max is accepted.
          items: { type: integer }
      required: [supported, choices]

    InterrogationOptions:
      type: object
      properties:
        enabled: { type: boolean }
        goals:
          type: array
          items: { $ref: "#/components/schemas/InterrogationOptionValue" }
        change_kinds:
          type: array
          items: { $ref: "#/components/schemas/InterrogationOptionValue" }
        budget:
          type: object
          properties:
            max_probes: { $ref: "#/components/schemas/InterrogationBudgetOption" }
            max_added_spans_per_min: { $ref: "#/components/schemas/InterrogationBudgetOption" }
            time_limit_seconds: { $ref: "#/components/schemas/InterrogationBudgetOption" }
          required: [max_probes, max_added_spans_per_min, time_limit_seconds]
        max_rounds: { type: integer }
        extend:
          type: object
          properties:
            default_seconds: { type: integer }
            max_total_seconds: { type: integer, description: "Ceiling for the time limit after extensions." }
          required: [default_seconds, max_total_seconds]
        max_open: { type: integer, description: "Open runs (queued + running) the cluster accepts." }
        max_transaction_ids: { type: integer }
      required: [enabled, goals, change_kinds, budget, max_rounds, extend, max_open, max_transaction_ids]
      examples:
        - enabled: true
          goals:
            - { value: observability, supported: true, default: true }
            - { value: security, supported: false, default: false }
          change_kinds:
            - { value: custom_instrumentation, supported: true, default: true }
            - { value: head_sampling, supported: false, default: false }
            - { value: payload_collection, supported: false, default: false }
            - { value: kernel_spans, supported: false, default: false }
          budget:
            max_probes: { supported: true, default: 5, min: 1, max: 20, choices: [] }
            max_added_spans_per_min: { supported: false, choices: [500, 1000, 5000] }
            time_limit_seconds: { supported: true, default: 3600, min: 300, max: 14400, choices: [900, 3600, 14400] }
          max_rounds: 5
          extend: { default_seconds: 1800, max_total_seconds: 28800 }
          max_open: 10
          max_transaction_ids: 20

    InterrogationPickerSource:
      type: object
      properties:
        namespace: { type: string }
        kind: { type: string }
        name: { type: string }
        language: { type: string, description: "`java` today." }
        transactions: { type: integer, description: "Transactions with call-graph evidence." }
        last_seen: { type: string, format: date-time, description: "Latest traffic on any of them.", x-go-type-skip-optional-pointer: false }
        busy: { type: boolean, description: "An interrogation is open on it; starting another answers 409." }
        active_interrogation_id: { type: string }
        active_display_id: { type: string }
        probes: { type: integer, description: "Live interrogation changes on the workload; probes from other rules are not counted." }
        max_probes: { type: integer, description: "The per-workload cap over every rule, enforced when a probe is requested." }
      required: [namespace, kind, name, language, transactions, busy]

    InterrogationSourceList:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/InterrogationPickerSource" }
      required: [count, items]

    InterrogationSourceTransaction:
      type: object
      properties:
        transaction_id: { type: integer, format: int64 }
        operation: { type: string, description: "E.g. `POST /api/claims`." }
        kind: { type: string, description: "Transaction kind: HTTP, GRPC, ..." }
        volume: { type: integer, format: int64, description: "Requests seen since the transaction was first learned." }
        last_seen: { type: string, format: date-time, x-go-type-skip-optional-pointer: false }
        functions: { type: integer, description: "Application functions in its call graph." }
      required: [transaction_id, operation, kind, volume, functions]

    InterrogationSourceTransactionList:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/InterrogationSourceTransaction" }
      required: [count, items]
