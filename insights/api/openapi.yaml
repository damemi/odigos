            deviated classes; violations name the rule and what broke it.
            Display as-is.
        operation:
          type: string
          description: >
            Full canonical transaction operation (anomalies only). Omitted for
            violations.
        operation_name:
          type: string
          description: Entry-span operation without dimension suffixes (anomalies).
        identity_dimensions:
          type: array
