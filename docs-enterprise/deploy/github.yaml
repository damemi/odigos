AWSTemplateFormatVersion: '2010-09-09'
Description: Main-branch GitHub OIDC access for enterprise docs image releases. Bootstrap separately from the application stack.
Parameters:
  DocsStackName:
    Type: String
    Default: odigos-enterprise-docs
  DocsFunctionName:
    Type: String
  DocsExecutionRoleArn:
    Type: String
  DocsSessionSecretArn:
    Type: String
Resources:
  GitHubRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: odigos-enterprise-docs-github
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:odigos-io/odigos-enterprise:ref:refs/heads/main
      Policies:
        - PolicyName: ReleaseEnterpriseDocsImage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ECRLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: DocsImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/odigos-enterprise-docs'
              - Sid: DocsStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:UpdateStack
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${DocsStackName}/*'
              - Sid: DocsFunction
                Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:ListTags
                  - lambda:TagResource
                  - lambda:UntagResource
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${DocsFunctionName}'
              - Sid: KeepExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Ref DocsExecutionRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              # CloudFormation resolves this reference when updating the function.
              # This is the docs session secret, never the license signing key.
              - Sid: ResolveDocsSessionSecret
                Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret]
                Resource: !Ref DocsSessionSecretArn
Outputs:
  RoleArn:
    Value: !GetAtt GitHubRole.Arn
