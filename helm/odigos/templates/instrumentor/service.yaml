apiVersion: v1
kind: Service
metadata:
  name: odigos-instrumentor
  namespace: {{ .Release.Namespace }}
  labels:
    odigos.io/system-object: "true"
    app.kubernetes.io/name: odigos-instrumentor
spec:
  ports:
    - name: webhook-server
      port: 9443
      targetPort: {{ .Values.instrumentor.ports.webhook }}
    - name: metrics
      port: 8080
      targetPort: {{ .Values.instrumentor.ports.metrics }}
  selector:
    app.kubernetes.io/name: odigos-instrumentor
