{{- if .Values.insights.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odigos-insights
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: odigos-insights
    odigos.io/system-object: "true"
spec:
  # No replicas field: the HPA (templates/insights/hpa.yaml) always owns the
  # replica count, so setting it here would make helm and the HPA fight over it
  # on every reconcile. Replicas scale freely anyway — schema migrations run once
  # via a separate Job and baseline writes merge in Postgres upserts.
  selector:
    matchLabels:
      app.kubernetes.io/name: odigos-insights
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odigos-insights
    spec:
      serviceAccountName: odigos-insights
      {{- if .Values.insights.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.insights.nodeSelector | nindent 8 }}
      {{- else if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.insights.priorityClassName }}
      priorityClassName: {{ .Values.insights.priorityClassName }}
      {{- end }}
      {{ include "odigos.renderPullSecrets" . | nindent 6 }}
      containers:
        - name: odigos-insights
          {{ $imageTag := .Values.image.tag | default .Chart.AppVersion }}
          image: {{ template "utils.imageName" (dict "Values" .Values "Release" .Release "Component" "enterprise-insights" "Tag" $imageTag) }}
          ports:
            - name: http
              containerPort: 8080
            - name: otlp-grpc
              containerPort: 4317
            - name: pprof
              containerPort: 6060
          env:
            - name: CURRENT_NS
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Identity for the notifier leader Lease.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ODIGOS_ONPREM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: odigos-pro
                  key: odigos-onprem-token
            - name: GOMEMLIMIT
              value: {{ include "odigos.gomemlimitFromResources" (dict "Resources" .Values.insights.resources) }}
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "insights.database.dsnSecretName" . }}
                  key: {{ include "insights.database.dsnSecretKey" . }}
            {{- if and (include "insights.database.bundled" .) (ne .Values.insights.database.storage.persistence false) }}
            # Lets the Storage page report how full the bundled volume is.
            - name: POSTGRES_VOLUME_SIZE
              value: {{ .Values.insights.database.storage.size | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # /readyz stays 503 until the DB is reachable AND the migration Job
          # has applied the schema (waitForSchemaReady in insights/cmd/main.go),
          # so a replica is kept out of the Service until its schema is ready.
          # This is what guarantees no pod serves a stale/absent schema in the
          # bootstrap case (fresh install / first enable, where migration runs
          # post-install/post-upgrade) -- no wait-for-migration init container
          # needed.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.insights.resources.requests.cpu }}
              memory: {{ .Values.insights.resources.requests.memory }}
            limits:
              cpu: {{ .Values.insights.resources.limits.cpu }}
              memory: {{ .Values.insights.resources.limits.memory }}
      {{- with .Values.insights.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.insights.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
