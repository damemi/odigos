{{- if and .Values.insights.enabled (not (include "insights.database.usesExistingSecret" .)) }}
{{- /*
Holds the connection URI every Insights component reads (key "dsn").

Bundled Postgres password lifecycle:
  - First install: generate a 24-char random password and store it here.
  - Subsequent upgrades: lookup the existing Secret and reuse its password,
    so `helm upgrade` doesn't rotate the credential out from under a running
    Postgres pod (the password is only applied when the data dir is created).
  - `helm template` (no cluster): lookup returns empty, so a new password is
    rendered each call. That is OK for offline rendering / testing.
*/}}
{{- $dsn := .Values.insights.database.external.dsn }}
{{- $password := "" }}
{{- if include "insights.database.bundled" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "odigos-insights-db" }}
{{- if and $existing $existing.data $existing.data.password }}
{{- $password = $existing.data.password | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- /* randAlphaNum only produces URL-safe chars, so the password needs no encoding. */}}
{{- $dsn = printf "postgres://odigos_insights:%s@odigos-insights-db.%s:5432/odigos_insights?sslmode=disable" $password .Release.Namespace }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: odigos-insights-db
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: odigos-insights-db
    odigos.io/system-object: "true"
type: Opaque
data:
  dsn: {{ $dsn | b64enc | quote }}
  {{- if $password }}
  password: {{ $password | b64enc | quote }}
  {{- end }}
{{- end }}
