{{- if and .Values.insights.enabled (include "insights.database.bundled" .) }}
apiVersion: v1
kind: Service
metadata:
  name: odigos-insights-db
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: odigos-insights-db
    odigos.io/system-object: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: odigos-insights-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
