{{- if and .Values.centralProxy.centralBackendURL .Values.clusterName }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: central-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    odigos.io/system-object: "true"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
{{- end }}
