{{- if and (include "odigos.litellmEnabled" .) (include "odigos.secretExists" .) }}
{{- /*
Master-key lifecycle matches bundled ClickHouse:
  - First install: use values.masterKey or generate a 24-char key.
  - Subsequent upgrades: lookup the existing Secret and reuse it unless
    values.masterKey is explicitly set.
  - helm template (no cluster): lookup is empty, so a new key is rendered.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "odigos-litellm" }}
{{- $masterKey := .Values.interrogation.modelGateway.litellm.masterKey | default "" }}
{{- if not $masterKey }}
{{- if and $existing $existing.data (index $existing.data "master-key") }}
{{- $masterKey = index $existing.data "master-key" | b64dec }}
{{- else }}
{{- $masterKey = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: odigos-litellm
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: odigos-litellm
    odigos.io/system-object: "true"
type: Opaque
data:
  master-key: {{ $masterKey | b64enc | quote }}
  {{- if and .Values.interrogation.modelGateway.litellm.upstreamApiKey (not .Values.interrogation.modelGateway.litellm.existingSecret) }}
  upstream-api-key: {{ .Values.interrogation.modelGateway.litellm.upstreamApiKey | b64enc | quote }}
  {{- else if and $existing $existing.data (index $existing.data "upstream-api-key") (not .Values.interrogation.modelGateway.litellm.existingSecret) }}
  upstream-api-key: {{ index $existing.data "upstream-api-key" }}
  {{- end }}
{{- end }}
