{{- if and .Values.interrogation.enabled (include "odigos.secretExists" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odigos-interrogation-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: odigos-interrogation-redis
    odigos.io/system-object: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: odigos-interrogation-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odigos-interrogation-redis
    spec:
      {{- if .Values.interrogation.redis.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.interrogation.redis.nodeSelector | nindent 8 }}
      {{- else if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- with .Values.interrogation.redis.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.interrogation.redis.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ .Values.interrogation.redis.image | quote }}
          command: ["redis-server"]
          args:
            - "--port"
            - "{{ .Values.interrogation.redis.port }}"
            {{- if .Values.interrogation.redis.maxmemory }}
            - "--maxmemory"
            - "{{ .Values.interrogation.redis.maxmemory }}"
            {{- end }}
            {{- if .Values.interrogation.redis.maxmemoryPolicy }}
            - "--maxmemory-policy"
            - "{{ .Values.interrogation.redis.maxmemoryPolicy }}"
            {{- end }}
            {{- if .Values.interrogation.redis.tcpKeepalive }}
            - "--tcp-keepalive"
            - "{{ .Values.interrogation.redis.tcpKeepalive }}"
            {{- end }}
          ports:
            - containerPort: {{ .Values.interrogation.redis.port }}
              name: {{ .Values.interrogation.redis.portName }}
          {{- if .Values.interrogation.redis.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command: ["redis-cli", "-p", "{{ .Values.interrogation.redis.port }}", "ping"]
            initialDelaySeconds: {{ .Values.interrogation.redis.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.interrogation.redis.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.interrogation.redis.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.interrogation.redis.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.interrogation.redis.livenessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.interrogation.redis.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "{{ .Values.interrogation.redis.port }}", "ping"]
            initialDelaySeconds: {{ .Values.interrogation.redis.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.interrogation.redis.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.interrogation.redis.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.interrogation.redis.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.interrogation.redis.readinessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.interrogation.redis.resources }}
          resources:
            {{- toYaml .Values.interrogation.redis.resources | nindent 12 }}
          {{- end }}
{{- end }}
