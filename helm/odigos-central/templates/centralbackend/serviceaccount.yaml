{{- if (include "odigos.secretExists" .) }}
{{- if include "odigos.createServiceAccount" (dict "values" .Values.centralBackend) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "odigos.serviceAccountName" (dict "values" .Values.centralBackend "default" "central-backend") }}
  namespace: {{ .Release.Namespace }}
  labels:
    odigos.io/system-object: "true"
{{- end }}
{{- end }}


