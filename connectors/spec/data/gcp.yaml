provider: gcp
displayName: Google Cloud Platform

# Provider boundary and non-secret connector configuration (not authentication).
# The connector scans every location/zone in the project via location wildcards (parent
# ".../locations/-"), so there is no location selection field.
connector:
  fields:
    - name: projectId
      displayName: GCP Project ID
      componentType: input
      required: true
      tooltip: The Google Cloud project this connector manages.

# Authentication: either the connector pod's ambient credentials (Application Default Credentials /
# GKE Workload Identity) or a service account JSON key stored in the credentials Secret. Unlike AWS,
# GCP credentials are not bound to a single project — the connector always scopes its calls to the
# configured project id, so there is no cross-account boundary to assume.
auth:
  permissions:
    - resourcemanager.projects.get
  methods:
    - id: workload-identity
      displayName: Workload identity
      description: >-
        Uses the connector pod's ambient credentials (GKE Workload Identity / Application Default
        Credentials). No credentials Secret keys are required.
      fields: []

    - id: service-account-key
      displayName: Service account key
      description: A Google Cloud service account JSON key stored in the credentials Secret.
      fields:
        - name: credentialsJson
          displayName: Service Account Key (JSON)
          componentType: textarea
          secret: true
          required: true
          tooltip: The full JSON key for a service account with the required roles.
          envVar: ODIGOS_GCP_CREDENTIALS_JSON

# Two parallel hierarchies (domains), completely separate, sharing only the codebase and running pod.
#   workloads        -> discovery + instrumentation (instrument a discovered workload directly).
#   computePlatforms -> discovery + installation    (install a separate Odigos agent onto the platform).
# Every type name is unique across both domains.

# workloads: directly-instrumentable resources — discovered, then instrumented in place.
workloads:
  discovery:
    enabled: true
    displayName: Workload discovery
    description: >-
      Enumerate Cloud Run services across every location in the project, so they can be surfaced as
      Odigos Source candidates.
    types:
      - name: gcp.cloud-run
        displayName: Cloud Run
        description: List Cloud Run services in every location in the project.
        permissions:
          - run.services.list
          - run.services.get
          # Cloud Run revisions are immutable: Service.template describes the NEXT revision, while traffic
          # can keep serving an older one indefinitely. Confirming what is ACTUALLY running — and therefore
          # whether instrumentation is effective rather than merely declared — requires the Revision
          # resource, which carries its own containers, volumes and conditions. Read-only, and needed by
          # manual (IaC) mode, which observes through discovery alone.
          - run.revisions.list
          - run.revisions.get

  # instrumentation: instrument a discovered workload DIRECTLY. Each type references a workload-discovery
  # type and declares how instrumentation is injected. Gated on an OTLP destination.
  #   gcp.cloud-run -> service (OpenTelemetry agent injected into the service revision)
  instrumentation:
    enabled: true
    displayName: Workload instrumentation
    description: >-
      Attach OpenTelemetry instrumentation directly to discovered Cloud Run services. Requires an
      OTLP destination.
    types:
      - name: gcp.cloud-run
        displayName: Cloud Run
        description: >-
          Inject the OpenTelemetry agent into the Cloud Run service revision. An init-ordered sidecar
          stages the language agent into a shared in-memory volume and the ingress container is
          configured (activation + OTLP export env vars) to load it — the same non-eBPF mechanism
          Odigos uses on Kubernetes. Supported languages: Java, Python, Node.js, .NET.
        method: service
        permissions:
          - run.services.get
          - run.services.update
          - run.operations.get
          # Required to update a Cloud Run service that runs as a runtime service account
          # (PermissionDenied on iam.serviceAccounts.actAs without this).
          - iam.serviceAccounts.actAs
          # Optional: read the service image's Cloud Native Buildpack metadata for language detection
          # (roles/artifactregistry.reader). Only needed for the buildpack-label detection layer; the
          # static heuristics and the source runtime override work without it.
          - artifactregistry.repositories.downloadArtifacts

# computePlatforms: managed environments — discovered, then a separate Odigos agent is installed onto
# them. Installation is NOT supported yet, so discovered compute platforms are reported but never
# instrumented (surfaced as NotImplemented).
computePlatforms:
  discovery:
    enabled: true
    displayName: Compute-platform discovery
    description: >-
      Detect managed environments — GKE clusters and Compute Engine instances — across the project,
      so they can be surfaced as compute-platform candidates.
    types:
      - name: gcp.gke
        displayName: Google Kubernetes Engine
        description: >-
          Detect GKE clusters in the project. Instrumented by installing Odigos for Kubernetes
          (odiglet) in the cluster.
        permissions:
          - container.clusters.list
          - container.clusters.get
      - name: gcp.gce
        displayName: Compute Engine (VM)
        description: >-
          Detect Compute Engine instances across every zone in the project. Instrumented by installing
          the Odigos VM agent on the instance.
        permissions:
          - compute.instances.list

  # installation: install a separate Odigos agent onto a discovered compute platform (Odigos for
  # Kubernetes on GKE, or the Odigos VM agent on Compute Engine). This is NOT supported yet, so it
  # declares no types: discovered compute platforms are reported but never instrumented (surfaced as
  # NotImplemented). When support lands, each installable compute-platform type is referenced here with
  # its install method (method: agent) and the GCP permissions the install requires.
  installation:
    enabled: false
    displayName: Compute-platform installation
    description: >-
      Install a separate Odigos agent onto a discovered compute platform (Odigos for Kubernetes on
      GKE, the Odigos VM agent on Compute Engine). Not supported yet.
    types: []

# setup: declarative onboarding artifacts rendered in the create-connector UI. The UI fills the literal
# {{permissions}} placeholder from the aggregated spec permissions for the selected access level, so the
# preview always matches what test-connection validates. Provider-owned: GCP renders a custom IAM role
# definition (the YAML `gcloud iam roles create --file=` consumes); the shared UI renderer stays agnostic.
# create-role variants drive step-2 "Choose setup method" + create instructions. Save the policy-preview
# YAML from step 1 as odigos-connector-role.yaml — gcloud/terraform consume that file for the custom role.
setup:
  subtitle: Configure the Google Cloud project and the identity Odigos uses to access it.
  artifacts:
    - id: policy-preview
      section: permissions
      title: Policy preview
      description: The custom IAM role Odigos needs for the selected access level.
      format: yaml
      itemTemplate: '- {{permission}}'
      itemSeparator: "\n"
      template: |-
        title: OdigosCloudConnector
        description: Role for the Odigos cloud connector.
        stage: GA
        includedPermissions:
          {{permissions}}

    # create-role variants: create the service account, custom role, project IAM binding, and (for the
    # service-account-key auth method) a JSON key. {{projectId}} is filled from the account field.
    - id: create-role-gcloud
      section: create-role
      variant: gcloud
      variantLabel: gcloud
      title: Create service account & role
      description: >-
        Create a service account, a project-level custom role from the policy preview, bind the role,
        and download a JSON key to paste below.
      format: shell
      steps:
        - Save the policy preview from the previous step as odigos-connector-role.yaml in your working directory.
        - Set PROJECT_ID (pre-filled below from the project id you entered) and authenticate the gcloud CLI.
        - Run the script to enable APIs, create the service account, create the custom role, and bind it.
        - For the service-account-key auth method, create a JSON key and paste its contents below.
        - For workload identity, skip the key step and bind the Kubernetes service account instead (see GCP docs).
      template: |-
        export PROJECT_ID="{{projectId}}"
        gcloud config set project "$PROJECT_ID"

        gcloud services enable \
          cloudresourcemanager.googleapis.com \
          run.googleapis.com \
          container.googleapis.com \
          compute.googleapis.com \
          iam.googleapis.com

        gcloud iam service-accounts create odigos-connector \
          --display-name="Odigos Cloud Connector"
        export SA_EMAIL="odigos-connector@${PROJECT_ID}.iam.gserviceaccount.com"

        gcloud iam roles create odigosCloudConnector --project="$PROJECT_ID" \
          --file=odigos-connector-role.yaml
        gcloud projects add-iam-policy-binding "$PROJECT_ID" \
          --member="serviceAccount:${SA_EMAIL}" \
          --role="projects/${PROJECT_ID}/roles/odigosCloudConnector"

        gcloud iam service-accounts keys create ./odigos-connector-key.json \
          --iam-account="$SA_EMAIL"
        cat ./odigos-connector-key.json

    - id: create-role-terraform
      section: create-role
      variant: terraform
      variantLabel: Terraform
      title: Create service account & role
      description: >-
        Provision the service account, custom role, IAM binding, and key as code. The custom role
        permissions are loaded from the policy-preview YAML file.
      format: shell
      steps:
        - Save the policy preview from the previous step as odigos-connector-role.yaml next to your Terraform files.
        - Add the configuration below (or an equivalent module) and set project_id if needed.
        - Run terraform init, then terraform apply.
        - Read the credentials_json output and paste it below (service-account-key auth).
      template: |-
        # Save as main.tf (policy preview must be odigos-connector-role.yaml alongside it).
        terraform {
          required_providers {
            google = { source = "hashicorp/google" }
          }
        }

        variable "project_id" {
          type    = string
          default = "{{projectId}}"
        }

        locals {
          role = yamldecode(file("odigos-connector-role.yaml"))
        }

        resource "google_service_account" "odigos" {
          project      = var.project_id
          account_id   = "odigos-connector"
          display_name = "Odigos Cloud Connector"
        }

        resource "google_project_iam_custom_role" "odigos" {
          project     = var.project_id
          role_id     = "odigosCloudConnector"
          title       = local.role.title
          description = local.role.description
          permissions = local.role.includedPermissions
        }

        resource "google_project_iam_member" "odigos" {
          project = var.project_id
          role    = google_project_iam_custom_role.odigos.id
          member  = "serviceAccount:${google_service_account.odigos.email}"
        }

        resource "google_service_account_key" "odigos" {
          service_account_id = google_service_account.odigos.name
        }

        output "credentials_json" {
          value     = base64decode(google_service_account_key.odigos.private_key)
          sensitive = true
        }

        # terraform init && terraform apply
        # terraform output -raw credentials_json

    - id: create-role-console
      section: create-role
      variant: console
      variantLabel: Console
      title: Create service account & role
      description: >-
        Create the service account, custom role, and project IAM binding in the Google Cloud Console,
        then download a JSON key to paste below.
      format: yaml
      itemTemplate: '- {{permission}}'
      itemSeparator: "\n"
      steps:
        - Open Google Cloud Console → IAM & Admin → Roles → Create role.
        - Title it OdigosCloudConnector and paste or add every permission from the YAML below.
        - Open IAM & Admin → Service Accounts → Create service account (e.g. odigos-connector).
        - Grant that service account the custom role on the project (IAM → Grant access).
        - Open the service account → Keys → Add key → Create new key → JSON.
        - Paste the downloaded JSON key below.
      template: |-
        # Bind this role to serviceAccount:odigos-connector@{{projectId}}.iam.gserviceaccount.com
        title: OdigosCloudConnector
        description: Role for the Odigos cloud connector.
        stage: GA
        includedPermissions:
          {{permissions}}

    - id: enter-credentials
      section: credentials
      title: Enter service account credentials
      description: >-
        Paste the complete JSON key for the service account created above. Skip this when using
        workload identity (no key is required).
      format: text
      template: ""

    # ---------------------------------------------------------------------------------------------------
    # MANUAL (IaC) INSTRUMENTATION INSTRUCTIONS — section "instrumentation:gcp.cloud-run".
    #
    # A workload type whose capability is {discovery: true, instrumentation: false} is instrumented BY THE
    # CUSTOMER: Odigos discovers it, publishes what to apply, observes the result and reports conformance,
    # and never mutates it. <ANGLE_BRACKETED> tokens are values the customer substitutes — deliberately not
    # the {{token}} syntax, which is filled from create-connector form values and left verbatim when there
    # is none.
    #
    # Checked against the connector's own injection recipes by TestInstrumentationArtifactsMatchPlans
    # (providers/gcp): every variable, path, container name and staging command below is asserted to be what
    # the instrumentor would apply. Nothing converges a manual-mode service, so instructions that have
    # drifted leave a customer applying a previous release's configuration and reading a drift verdict they
    # cannot attribute. Do not hand-edit a value here to silence a failure.
    # ---------------------------------------------------------------------------------------------------

    - id: instrument-cloud-run-manual
      section: instrumentation:gcp.cloud-run
      variant: manual
      variantLabel: Reference
      title: Instrument a Cloud Run service yourself
      description: >-
        The complete change, per language. Read this first: it is the reference the Terraform and gcloud
        variants show one worked example of.
      format: text
      steps:
        - Add the shared in-memory volume and the agent-staging sidecar to the service template.
        - Mount the volume into your ingress container and make it depend on the sidecar.
        - Set the environment variables for your language.
        - Deploy. Cloud Run revisions are immutable, so this creates a new revision — make sure traffic moves to it.
      template: |-
        The agent is staged by a container, not baked into your image: "odigos-agent" copies the language
        agent into a shared in-memory volume your ingress container reads at /var/odigos.

        Cloud Run has NO run-to-completion containers, so the stager cannot exit. It holds TCP port 2400
        once staging is done, and your container's dependency on it waits for that startup probe. That
        dependency is what keeps the application from starting before the agent files exist.

        SERVICE TEMPLATE (template.*)
          volumes: add
            name     = odigos-agent
            emptyDir = { medium = MEMORY, sizeLimit = 500Mi }
          containers: add
            name    = odigos-agent
            image   = us-central1-docker.pkg.dev/odigos-cloud/components/cloud-run-agents:v0.1.0
            command = ["sh", "-c", "<the staging command for your language, below>"]
            volumeMounts = [{ name = odigos-agent, mountPath = /var/odigos }]
            startupProbe = { tcpSocket = { port = 2400 }, periodSeconds = 3, timeoutSeconds = 1, failureThreshold = 30 }

        YOUR INGRESS CONTAINER
          volumeMounts += { name = odigos-agent, mountPath = /var/odigos }
          dependsOn    += odigos-agent
          env          += the variables below
          (A multi-container service requires every container to be named. If yours was created
           single-container with no name, give it one before adding the sidecar.)

        ALWAYS, every language:
          ODIGOS_MANAGED              = {"v":1,"lang":"<your language>"}
          OTEL_SERVICE_NAME           = <ODIGOS_SOURCE_NAME>
          OTEL_RESOURCE_ATTRIBUTES    = cloud.provider=gcp,cloud.platform=gcp_cloud_run,cloud.region=<REGION>
          ODIGOS_OTLP_ENDPOINT        = <OTLP_ENDPOINT>
          OTEL_EXPORTER_OTLP_ENDPOINT = <OTLP_ENDPOINT_URL>
          OTEL_EXPORTER_OTLP_PROTOCOL = grpc
          OTEL_TRACES_EXPORTER        = otlp
          OTEL_METRICS_EXPORTER       = otlp
          OTEL_LOGS_EXPORTER          = otlp
        OTEL_LOG_LEVEL must NOT be set (compared against unset; a value is reported as drift) unless this
        connector has debug telemetry enabled, in which case set it to "debug".

        The two endpoint variables are not interchangeable: ODIGOS_OTLP_ENDPOINT is the raw host:port, and
        OTEL_EXPORTER_OTLP_ENDPOINT is the scheme-qualified URL. The SDK accepts a bare host:port and then
        exports nowhere.

        PER LANGUAGE — staging command, and the activation environment.
        APPEND means: keep the value your container already has, then add ours joined by the separator
        shown. Assigning it instead discards your value.

        java   {"v":1,"lang":"java"}
               command: mkdir -p /var/odigos && cp -r /instrumentations/java /var/odigos/java && while true; do nc -l -p 2400 >/dev/null 2>&1; done
               JAVA_TOOL_OPTIONS  APPEND " "  -javaagent:/var/odigos/java/javaagent.jar

        python {"v":1,"lang":"python"}
               command: mkdir -p /var/odigos && cp -r /instrumentations/python /var/odigos/python && while true; do nc -l -p 2400 >/dev/null 2>&1; done
               PYTHONPATH  APPEND ":"  /var/odigos/python:/var/odigos/python/opentelemetry/instrumentation/auto_instrumentation
               OTEL_PYTHON_CONFIGURATOR = odigos-python-configurator

        nodejs {"v":1,"lang":"nodejs"}
               command: mkdir -p /var/odigos && cp -r /instrumentations/nodejs /var/odigos/nodejs && while true; do nc -l -p 2400 >/dev/null 2>&1; done
               NODE_OPTIONS  APPEND " "  --require /var/odigos/nodejs/node_modules/@opentelemetry/auto-instrumentations-node/build/src/register.js

        dotnet {"v":1,"lang":"dotnet"}
               command: mkdir -p /var/odigos && cp -r /instrumentations/dotnet /var/odigos/dotnet && while true; do nc -l -p 2400 >/dev/null 2>&1; done
               CORECLR_ENABLE_PROFILING = 1
               CORECLR_PROFILER         = {918728DD-259F-4A6A-AC2B-B85E1B658318}
               CORECLR_PROFILER_PATH    = /var/odigos/dotnet/linux-glibc/OpenTelemetry.AutoInstrumentation.Native.so
               OTEL_DOTNET_AUTO_HOME    = /var/odigos/dotnet
               DOTNET_STARTUP_HOOKS     = /var/odigos/dotnet/net/OpenTelemetry.AutoInstrumentation.StartupHook.dll
               DOTNET_ADDITIONAL_DEPS   = /var/odigos/dotnet/AdditionalDeps
               DOTNET_SHARED_STORE      = /var/odigos/dotnet/store
               glibc only — a musl (Alpine) based image is not supported.

        NOTES
        - ODIGOS_MANAGED is the ONLY thing that tells Odigos this service is instrumented. Without it the
          service is reported as awaiting your deployment however completely the rest is applied, and the
          recorded language is what Odigos compares the activation environment against.
        - OTEL_SERVICE_NAME must match the workload's name in Odigos, or it is reported as drift.
        - Set any exporter to "none" for a signal your destination does not accept.
        - The in-memory volume counts against the instance memory, which is why it is capped at 500Mi.
        - The agent image is pulled by YOUR service. Cloud Run only accepts images from *.gcr.io,
          *-docker.pkg.dev or docker.io, so mirror it into your own Artifact Registry if this one is
          unreachable — and use that reference here.
        - If this connector is configured with an agent-image override (ODIGOS_CLOUDRUN_AGENT_IMAGE), use
          that image instead.
        - If you later hand instrumentation over to Odigos, add a "prevEnv" object to ODIGOS_MANAGED
          recording your pre-Odigos value for each variable above, so it can restore them on rollback.

    - id: instrument-cloud-run-terraform
      section: instrumentation:gcp.cloud-run
      variant: terraform
      variantLabel: Terraform
      title: Instrument a Cloud Run service (Terraform)
      description: >-
        Anchored fragments for google_cloud_run_v2_service. Shown for Java; see the Reference variant for
        the other languages.
      format: shell
      steps:
        - Add the volume and the odigos-agent container blocks inside template.
        - Add the volume mount, depends_on and env to your ingress container.
        - Apply, then make sure traffic is serving the new revision.
      template: |-
        resource "google_cloud_run_v2_service" "app" {
          # ... your existing configuration ...

          template {
            volumes {
              name = "odigos-agent"
              empty_dir {
                medium = "MEMORY"
                # Counts against the instance memory, so it is deliberately modest.
                size_limit = "500Mi"
              }
            }

            # --- the agent-staging sidecar ---
            containers {
              name  = "odigos-agent"
              image = "us-central1-docker.pkg.dev/odigos-cloud/components/cloud-run-agents:v0.1.0"
              # Cloud Run has no run-to-completion containers, so the stager holds a port instead of
              # exiting, and the startup probe below is what tells Cloud Run staging has finished.
              command = ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/java /var/odigos/java && while true; do nc -l -p 2400 >/dev/null 2>&1; done"]
              volume_mounts {
                name       = "odigos-agent"
                mount_path = "/var/odigos"
              }
              startup_probe {
                tcp_socket { port = 2400 }
                period_seconds    = 3
                timeout_seconds   = 1
                failure_threshold = 30
              }
            }

            # --- your ingress container ---
            containers {
              name  = "<YOUR_CONTAINER>" # a multi-container service requires every container to be named
              image = var.app_image
              # ... your existing configuration ...

              volume_mounts {
                name       = "odigos-agent"
                mount_path = "/var/odigos"
              }
              # Gates the application's start on the agent files existing.
              depends_on = ["odigos-agent"]

              env {
                name  = "ODIGOS_MANAGED"
                value = "{\"v\":1,\"lang\":\"java\"}"
              }
              env {
                name  = "OTEL_SERVICE_NAME"
                value = "<ODIGOS_SOURCE_NAME>"
              }
              env {
                name  = "OTEL_RESOURCE_ATTRIBUTES"
                value = "cloud.provider=gcp,cloud.platform=gcp_cloud_run,cloud.region=<REGION>"
              }
              env {
                name  = "ODIGOS_OTLP_ENDPOINT"
                value = "<OTLP_ENDPOINT>"
              }
              env {
                # The scheme-qualified form. A bare host:port is accepted here and then exports nowhere.
                name  = "OTEL_EXPORTER_OTLP_ENDPOINT"
                value = "<OTLP_ENDPOINT_URL>"
              }
              env {
                name  = "OTEL_EXPORTER_OTLP_PROTOCOL"
                value = "grpc"
              }
              env {
                name  = "OTEL_TRACES_EXPORTER"
                value = "otlp"
              }
              env {
                name  = "OTEL_METRICS_EXPORTER"
                value = "otlp"
              }
              env {
                name  = "OTEL_LOGS_EXPORTER"
                value = "otlp"
              }
              env {
                # APPEND, never assign: keep whatever the container already carries and add ours after it.
                name  = "JAVA_TOOL_OPTIONS"
                value = trimspace("${var.java_tool_options} -javaagent:/var/odigos/java/javaagent.jar")
              }
              # Do NOT set OTEL_LOG_LEVEL — compared against unset, so a value is reported as drift.
            }
          }
        }

        # Other languages differ in the staging command, the marker's "lang" and the activation variables —
        # see the Reference variant. PYTHONPATH is appended with ":", not a space.

    - id: instrument-cloud-run-gcloud
      section: instrumentation:gcp.cloud-run
      variant: gcloud
      variantLabel: gcloud
      title: Instrument a Cloud Run service (gcloud)
      description: >-
        The service YAML `gcloud run services replace` consumes. Note that this is a WHOLE-OBJECT replace —
        export the live service first and edit that, rather than applying this file as-is.
      format: shell
      steps:
        - Export the live service - gcloud run services describe SERVICE --region REGION --format export > service.yaml
        - Merge the volume, the odigos-agent container and your container's mount/dependency/env into it, as shown.
        - Apply it - gcloud run services replace service.yaml --region REGION
        - Check that traffic is serving the new revision.
      template: |-
        # gcloud run services replace takes the WHOLE object, so start from the live service:
        #   gcloud run services describe SERVICE --region REGION --format export > service.yaml
        # then merge the pieces below into spec.template.spec. Applying this file as-is would drop
        # everything your service already declares.

        # spec.template.spec.volumes: add
        #   - name: odigos-agent
        #     emptyDir: { medium: Memory, sizeLimit: 500Mi }
        #
        # spec.template.spec.containers: add the staging sidecar
        #   - name: odigos-agent
        #     image: us-central1-docker.pkg.dev/odigos-cloud/components/cloud-run-agents:v0.1.0
        #     command: ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/java /var/odigos/java && while true; do nc -l -p 2400 >/dev/null 2>&1; done"]
        #     volumeMounts: [{ name: odigos-agent, mountPath: /var/odigos }]
        #     startupProbe: { tcpSocket: { port: 2400 }, periodSeconds: 3, timeoutSeconds: 1, failureThreshold: 30 }
        #
        # and on your own container <YOUR_CONTAINER>:
        #   volumeMounts: += { name: odigos-agent, mountPath: /var/odigos }
        #   the container-dependency annotation naming odigos-agent
        #   env: += the variables below
        #
        #   ODIGOS_MANAGED              {"v":1,"lang":"java"}
        #   OTEL_SERVICE_NAME           <ODIGOS_SOURCE_NAME>
        #   OTEL_RESOURCE_ATTRIBUTES    cloud.provider=gcp,cloud.platform=gcp_cloud_run,cloud.region=<REGION>
        #   ODIGOS_OTLP_ENDPOINT        <OTLP_ENDPOINT>
        #   OTEL_EXPORTER_OTLP_ENDPOINT <OTLP_ENDPOINT_URL>
        #   OTEL_EXPORTER_OTLP_PROTOCOL grpc
        #   OTEL_TRACES_EXPORTER        otlp
        #   OTEL_METRICS_EXPORTER       otlp
        #   OTEL_LOGS_EXPORTER          otlp
        #   JAVA_TOOL_OPTIONS           APPEND " " -javaagent:/var/odigos/java/javaagent.jar
        #   (do NOT set OTEL_LOG_LEVEL — compared against unset, so a value is reported as drift)
        #
        # Other languages differ in the staging command, the marker's "lang" and the activation variables —
        # see the Reference variant. PYTHONPATH is appended with ":", not a space.

        gcloud run services replace service.yaml --region "<REGION>"

# gateway: connector-wide collector wiring; not part of either domain. Implemented in a later phase.
gateway:
  enabled: false
  displayName: Gateway / collector wiring
  description: >-
    Wire instrumented workloads to managed-otelcol regional collectors. Implemented in a later phase.
  types: []
