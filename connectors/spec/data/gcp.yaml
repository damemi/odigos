           single-container with no name, give it one before adding the sidecar.)

        ENVIRONMENT — identity and export
          ODIGOS_IAC                  = {"v":1,"lang":"nodejs"}

        Do NOT set ODIGOS_MANAGED — that is the connector's own record of a mutation IT
        performed, including the rollback snapshot; setting it by hand claims a rollback that
        was never recorded.
          OTEL_SERVICE_NAME           = <ODIGOS_SOURCE_NAME>
          OTEL_RESOURCE_ATTRIBUTES    = cloud.provider=gcp,cloud.platform=gcp_cloud_run,cloud.region=<REGION>
          ODIGOS_OTLP_ENDPOINT        = <OTLP_ENDPOINT>
          OTEL_EXPORTER_OTLP_ENDPOINT = <OTLP_ENDPOINT_URL>
          OTEL_EXPORTER_OTLP_PROTOCOL = grpc
          OTEL_TRACES_EXPORTER        = otlp
          OTEL_METRICS_EXPORTER       = otlp
          OTEL_LOGS_EXPORTER          = otlp
        Leave OTEL_LOG_LEVEL unset unless debug telemetry is enabled on this connector (then set it to "debug").

        ODIGOS_OTLP_ENDPOINT is host:port; OTEL_EXPORTER_OTLP_ENDPOINT is the scheme-qualified URL — they are not interchangeable.

        ENVIRONMENT — Node.js activation
        APPEND, never assign — keep your existing value and put ours after it, joined by the separator shown.
          NODE_OPTIONS                APPEND a space  --require /var/odigos/nodejs/node_modules/@opentelemetry/auto-instrumentations-node/build/src/register.js

