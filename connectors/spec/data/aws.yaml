provider: aws
displayName: Amazon Web Services

# Provider boundary and non-secret connector configuration (not authentication).
# The connector scans every region enabled in the account (resolved at runtime via ec2:DescribeRegions),
# so there is no region selection field.
connector:
  fields:
    - name: accountId
      displayName: AWS Account ID
      componentType: input
      required: true
      tooltip: The 12-digit AWS account this connector manages.

# Authentication: composable methods. Base methods establish caller identity; assume-role adds
# cross-account role assumption on top of a base method (workload identity or static keys).
auth:
  permissions:
    - sts:GetCallerIdentity
  defaultMethod: assume-role
  methods:
    - id: workload-identity
      displayName: Pod / workload identity
      description: >-
        Uses the connector pod's ambient credentials (e.g. IRSA). No credentials Secret keys are
        required.
      fields: []

    - id: static-keys
      displayName: Access keys
      description: Long-lived or temporary IAM access keys stored in the credentials Secret.
      fields:
        - name: accessKeyId
          displayName: Access Key ID
          componentType: input
          required: true
          showInUi: true
          envVar: AWS_ACCESS_KEY_ID
        - name: secretAccessKey
          displayName: Secret Access Key
          componentType: input
          secret: true
          required: true
          showInUi: true
          envVar: AWS_SECRET_ACCESS_KEY
        - name: sessionToken
          displayName: Session Token
          componentType: input
          secret: true
          required: false
          showInUi: false
          tooltip: Required only for temporary access keys.
          envVar: AWS_SESSION_TOKEN

    - id: assume-role
      displayName: Assume IAM role
      description: >-
        Assumes a cross-account role after establishing base credentials via workload identity or
        static keys.
      baseMethods:
        - workload-identity
        - static-keys
      fields:
        - name: roleArn
          displayName: IAM Role ARN
          componentType: input
          required: true
          showInUi: true
          tooltip: ARN of the cross-account role Odigos assumes.
          envVar: ODIGOS_AWS_ROLE_ARN
        # Optional at the protocol level (a trust policy without an ExternalId condition is assumable
        # without one), but every create-role artifact below builds a trust policy that REQUIRES it.
        # Set this before copying a setup snippet: a trust policy generated with an empty external id
        # can never be satisfied, because the connector omits ExternalId entirely when the value is
        # blank — the role would be permanently unassumable.
        - name: externalId
          displayName: External ID
          componentType: input
          required: false
          showInUi: true
          tooltip: >-
            A secret string Odigos presents when assuming the role; the trust policy in the setup
            snippets enforces it. Strongly recommended — set it before copying the snippet, since a
            role created with a blank external ID cannot be assumed.
          envVar: ODIGOS_AWS_EXTERNAL_ID

# Two parallel hierarchies (domains), completely separate, sharing only the codebase and running pod.
# Each domain owns a `discovery` feature (enumerate its resources) plus a second feature for acting on
# them; which feature/type pairs actually run is selected per connector by spec.capabilities on the CR.
#   workloads        -> discovery + instrumentation (instrument a discovered workload directly).
#   computePlatforms -> discovery + installation    (install a separate Odigos agent onto the platform).
# A type is declared under its domain's discovery, and referenced by name under the domain's second
# feature. Every type name is unique across both domains.

# workloads: directly-instrumentable resources — discovered, then instrumented in place.
workloads:
  discovery:
    enabled: true
    displayName: Workload discovery
    description: >-
      Enumerate Lambda functions and ECS/Fargate tasks across every region enabled in the account, so
      they can be surfaced as Odigos Source candidates.
    # Baseline permission, not tied to a type: enumerate the account's enabled regions to scan.
    permissions:
      - ec2:DescribeRegions
    types:
      - name: aws.lambda
        displayName: AWS Lambda
        description: List Lambda functions in each configured region.
        permissions:
          - lambda:ListFunctions
          # ListFunctions does not return tags, so a discovery tag selector costs one ListTags per
          # function. Only exercised when the connector is configured with discovery tags, but it is a
          # hard requirement there: a denial aborts the whole region scan, not just the tag filter.
          - lambda:ListTags
      # Fargate discovery runs ONE region scan (clusters + Fargate services + Fargate tasks). EC2-backed
      # services/tasks are NOT discovered — ecs-cluster instrumentation is delivered by the cluster agent
      # (the eBPF odigos-ecs-agent daemon), a different solution.
      - name: aws.fargate-task
        displayName: Amazon ECS (Fargate task)
        description: >-
          Discover Fargate ECS services and tasks per region. The service is the per-workload
          instrumentation unit (sidecar injected into its task definition); standalone tasks are
          discovered for coverage. A single ECS scan enumerates clusters, Fargate services and tasks.
        # No ecs:DescribeClusters here: workload discovery only needs the cluster ARNs from
        # ListClusters before descending into services/tasks. Describing the cluster itself is
        # compute-platform discovery's job (EC2 capacity + Fargate classification).
        permissions:
          - ecs:ListClusters
          - ecs:ListServices
          # DescribeServices/DescribeTasks return tags inline (Include: TAGS), so tag-filtered
          # discovery needs no extra tag API.
          - ecs:DescribeServices
          - ecs:ListTasks
          - ecs:DescribeTasks
          # Observation, not mutation. DescribeServices yields only the task-definition ARN, never the
          # definition itself, so deriving whether a service actually carries Odigos instrumentation needs
          # this read. Declared on DISCOVERY (not only on the instrumentation type) because manual mode runs
          # on discovery alone: a connector the customer instruments themselves must still be able to see
          # what they applied. Automatic mode also declares it, for the mutation path.
          - ecs:DescribeTaskDefinition

  # instrumentation: instrument a discovered workload DIRECTLY. Each type references a workload-discovery
  # type and declares how instrumentation is injected. Gated on an OTLP destination.
  #   aws.lambda        -> service (Lambda layer/extension on the function itself)
  #   aws.fargate-task  -> sidecar (an agent-staging sidecar injected into the service's task definition)
  instrumentation:
    enabled: true
    displayName: Workload instrumentation
    description: >-
      Attach OpenTelemetry instrumentation directly to discovered workloads. The method depends on the
      resource type: Lambda is instrumented at the service level, ECS Fargate via a per-task sidecar.
      Requires an OTLP destination.
    types:
      - name: aws.lambda
        displayName: AWS Lambda
        description: Attach an OpenTelemetry layer/extension and OTEL_* configuration to the function.
        method: service
        permissions:
          - lambda:GetFunctionConfiguration
          - lambda:UpdateFunctionConfiguration
          - lambda:GetLayerVersion
          - lambda:ListLayers
          - lambda:PublishLayerVersion
          - lambda:DeleteLayerVersion
      - name: aws.fargate-task
        displayName: Amazon ECS (Fargate task)
        description: >-
          Register an instrumented task-definition revision (agent-staging sidecar + shared volume +
          OpenTelemetry activation/export env) and roll the Fargate service to it. Only ECS
          rolling-update services are instrumentable; standalone tasks report Unsupported.
        method: sidecar
        permissions:
          - ecs:DescribeServices
          - ecs:DescribeTaskDefinition
          - ecs:RegisterTaskDefinition
          - ecs:UpdateService
          # A new revision carries over the customer's task-definition tags, and ECS treats that as
          # tag-on-create: with tagging authorization enabled on the account, RegisterTaskDefinition
          # with a `tags` payload is denied unless ecs:TagResource is also granted. Task definitions
          # are tagged often enough that this is required, not optional.
          - ecs:TagResource
          # Registering a task definition that carries a task/execution role — Fargate task definitions
          # virtually always carry an execution role for the image pull — requires passing those roles.
          # Scope the grant with the condition iam:PassedToService=ecs-tasks.amazonaws.com.
          - iam:PassRole
          # Optional: best-effort language detection from the container image config in ECR (CNB
          # buildpack labels + entrypoint/cmd/env). Absent permissions only degrade detection — the
          # task-definition heuristics still run, and a source runtime override always works.
          - ecr:GetAuthorizationToken
          - ecr:BatchGetImage
          - ecr:GetDownloadUrlForLayer

# computePlatforms: managed environments — discovered, then a separate Odigos agent is installed onto
# them. Installation is NOT supported yet, so discovered compute platforms are reported but never
# instrumented (surfaced as NotImplemented).
computePlatforms:
  discovery:
    enabled: true
    displayName: Compute-platform discovery
    description: >-
      Detect managed environments — EC2-backed and Fargate ECS clusters, EKS clusters and EC2 instances —
      across every region enabled in the account, so they can be surfaced as compute-platform candidates.
    # Baseline permission, not tied to a type: enumerate the account's enabled regions to scan.
    permissions:
      - ec2:DescribeRegions
    types:
      - name: aws.ecs-cluster
        displayName: Amazon ECS (EC2 cluster)
        description: >-
          Detect EC2-backed ECS clusters per region (clusters with registered EC2 container instances).
          The cluster is the unit; a global Odigos ecs-agent would be installed on it.
        # One scan serves both cluster types: ListClusters + DescribeClusters for EC2 capacity, plus a
        # Fargate-filtered ListTasks per cluster to tell an ecs-cluster from a fargate-cluster. The
        # ListTasks denial is fatal to the scan, so it belongs on both types.
        permissions:
          - ecs:ListClusters
          - ecs:DescribeClusters
          - ecs:ListTasks
      - name: aws.fargate-cluster
        displayName: Amazon ECS (Fargate cluster)
        description: >-
          Detect ECS clusters that run Fargate tasks per region. A cluster grouping over Fargate tasks
          used to report Odigos coverage; no agent is installed — the per-task sidecar (aws.fargate-task)
          does the instrumentation.
        # Same scan as aws.ecs-cluster (one detector serves both); see the note there.
        permissions:
          - ecs:ListClusters
          - ecs:DescribeClusters
          - ecs:ListTasks
      # aws.eks and aws.ec2 are declared SEAMS: the types, permissions and UI copy are pinned so the
      # capability exists and its IAM cost is documented, but no detector is wired for them yet
      # (awsprovider.ComputePlatformDetectors registers the ECS detector only). Enabling either
      # capability today adds its permissions to the generated policy and discovers nothing — say so in
      # customer docs until the detectors land.
      - name: aws.eks
        displayName: Amazon EKS (Kubernetes)
        description: >-
          Detect EKS clusters per region. NOT DETECTED YET — the type is declared for the upcoming
          detector; once discovered, it is instrumented by installing Odigos for Kubernetes (odiglet)
          in the cluster.
        permissions:
          - eks:ListClusters
          - eks:DescribeCluster
      - name: aws.ec2
        displayName: Amazon EC2 (VM)
        description: >-
          Detect EC2 instances per region. NOT DETECTED YET — the type is declared for the upcoming
          detector; once discovered, it is instrumented by installing the Odigos VM agent on the
          instance.
        permissions:
          - ec2:DescribeInstances

  # installation: install a separate Odigos agent onto a discovered compute platform (the ECS-EC2 cluster
  # agent, Odigos for Kubernetes on EKS, or the EC2 VM agent). This is NOT supported yet, so it declares no
  # types: discovered compute platforms are reported but never instrumented (surfaced as NotImplemented).
  # When support lands, each installable compute-platform type is referenced here with its install method
  # (method: agent) and the IAM permissions the install requires.
  installation:
    enabled: false
    displayName: Compute-platform installation
    description: >-
      Install a separate Odigos agent onto a discovered compute platform (ECS-EC2 cluster agent, Odigos
      for Kubernetes on EKS, the Odigos VM agent on EC2). Not supported yet.
    types: []

# setup: declarative onboarding artifacts rendered in the create-connector UI. The UI fills
# {{permissions}} from the selected access level and scalar {{vars}} from form values, so the
# preview always matches what test-connection validates. Provider-owned: AWS renders an IAM policy
# JSON and create-role variants (CloudFormation / Terraform / CLI / Manual); other providers declare
# their own artifacts without any UI changes.
setup:
  subtitle: Apply the selected IAM policy in your AWS account.
  artifacts:
    # KNOWN GAP — unscoped iam:PassRole. Fargate instrumentation needs iam:PassRole, and the comment on
    # that permission (and test-connection's remediation text) both say to scope it with
    # iam:PassedToService=ecs-tasks.amazonaws.com. This template cannot express that: the renderer
    # expands {{permissions}} into one Action list, with no way to split a permission into its own
    # statement or attach a per-permission Condition. Fixing it properly needs a renderer/model change
    # (e.g. permission groups, each with its own Resource/Condition) in ui-kit + spec. Until then the
    # generated policy grants iam:PassRole on "*", which is broader than what Odigos actually needs —
    # call this out for customers who review the policy before applying it.
    - id: policy-preview
      section: permissions
      title: Policy preview
      description: >-
        The IAM policy Odigos needs for the selected access level. The AWS CLI and IAM-user setup
        methods expect this saved as odigos-policy.json.
      format: json
      itemTemplate: '"{{permission}}"'
      itemSeparator: ",\n"
      template: |-
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "OdigosCloudConnector",
              "Effect": "Allow",
              "Action": [
                {{permissions}}
              ],
              "Resource": "*"
            }
          ]
        }

    # create-role variants drive step-2 "Choose setup method" + "Create IAM role". The selected
    # variant's steps + template are rendered; scalar tokens like {{externalId}} come from the form.
    #
    # Every variant must be self-contained and runnable as shown: the snippet either IS the artifact
    # the steps tell the user to apply, or it references a file the steps told them to save. The one
    # cross-artifact reference allowed is the policy preview above, saved as odigos-policy.json — the
    # steps always say so explicitly (mirrors the gcp.yaml convention).
    #
    # ODIGOS_TRUST_ACCOUNT: 657451249928 is the AWS account allowed to assume the connector role. It is
    # the Odigos Central platform account and is duplicated in each trust policy below — change all of
    # them together, and keep them in sync with whatever Central actually runs as.
    - id: create-role-cloudformation
      section: create-role
      variant: cloudformation
      variantLabel: CloudFormation
      title: Create IAM role
      description: >-
        Deploy the CloudFormation template below. It creates the IAM role with the permissions policy
        inline and returns the Role ARN as a stack output.
      format: yaml
      itemTemplate: '- {{permission}}'
      itemSeparator: "\n"
      steps:
        - Enter an External ID in the field below first — it is baked into the template's trust policy.
        - Save the template below as odigos-connector.yaml.
        - "Console: open CloudFormation → Create stack → With new resources → Upload a template file."
        - "CLI: aws cloudformation deploy --stack-name odigos-connector --template-file odigos-connector.yaml --capabilities CAPABILITY_NAMED_IAM"
        - Acknowledge that the stack creates a named IAM resource, then deploy it.
        - Open the stack's Outputs tab and copy the RoleArn value into the field below.
      template: |-
        AWSTemplateFormatVersion: "2010-09-09"
        Description: IAM role assumed by the Odigos cloud connector.

        Parameters:
          OdigosExternalId:
            Type: String
            MinLength: 1
            Description: >-
              External ID Odigos presents when assuming this role. Pre-filled from the Odigos setup
              form; the stack will not deploy while it is empty.
            Default: "{{externalId}}"

        Resources:
          OdigosConnectorRole:
            Type: AWS::IAM::Role
            Properties:
              RoleName: OdigosConnectorRole
              Description: Lets Odigos Central discover and instrument workloads in this account.
              AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Principal:
                      AWS: arn:aws:iam::657451249928:root
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        sts:ExternalId: !Ref OdigosExternalId
              Policies:
                - PolicyName: OdigosCloudConnector
                  PolicyDocument:
                    Version: "2012-10-17"
                    Statement:
                      - Sid: OdigosCloudConnector
                        Effect: Allow
                        Resource: "*"
                        Action:
                          {{permissions}}

        Outputs:
          RoleArn:
            Description: Paste this value into the Odigos setup form.
            Value: !GetAtt OdigosConnectorRole.Arn

    - id: create-role-terraform
      section: create-role
      variant: terraform
      variantLabel: Terraform
      title: Create IAM role
      description: >-
        Provision the IAM role as code. The configuration below is complete — drop it into your
        Terraform workspace and apply it; role_arn is exposed as an output.
      format: shell
      itemTemplate: '"{{permission}}"'
      itemSeparator: ",\n"
      steps:
        - Enter an External ID in the field below first — it becomes the variable default.
        - Save the configuration below as odigos-connector.tf in your Terraform workspace.
        - Run terraform init, then terraform apply and confirm the plan.
        - Run terraform output -raw role_arn and paste the value into the field below.
      template: |-
        # odigos-connector.tf — requires the hashicorp/aws provider.

        variable "odigos_external_id" {
          type        = string
          description = "External ID Odigos presents when assuming the role."
          default     = "{{externalId}}"

          validation {
            condition     = length(var.odigos_external_id) > 0
            error_message = "Set an external ID: the connector role's trust policy requires one."
          }
        }

        data "aws_iam_policy_document" "odigos_trust" {
          statement {
            effect  = "Allow"
            actions = ["sts:AssumeRole"]

            principals {
              type        = "AWS"
              identifiers = ["arn:aws:iam::657451249928:root"]
            }

            condition {
              test     = "StringEquals"
              variable = "sts:ExternalId"
              values   = [var.odigos_external_id]
            }
          }
        }

        data "aws_iam_policy_document" "odigos_permissions" {
          statement {
            sid       = "OdigosCloudConnector"
            effect    = "Allow"
            resources = ["*"]

            actions = [
              {{permissions}}
            ]
          }
        }

        resource "aws_iam_role" "odigos_connector" {
          name               = "OdigosConnectorRole"
          description        = "Lets Odigos Central discover and instrument workloads in this account."
          assume_role_policy = data.aws_iam_policy_document.odigos_trust.json
        }

        resource "aws_iam_role_policy" "odigos_connector" {
          name   = "OdigosCloudConnector"
          role   = aws_iam_role.odigos_connector.id
          policy = data.aws_iam_policy_document.odigos_permissions.json
        }

        output "role_arn" {
          value = aws_iam_role.odigos_connector.arn
        }

    - id: create-role-aws-cli
      section: create-role
      variant: aws-cli
      variantLabel: AWS CLI
      title: Create IAM role
      description: >-
        Create the role from your terminal. The script writes the trust policy, creates the role,
        attaches the permissions policy, and prints the Role ARN.
      format: shell
      steps:
        - Enter an External ID in the field below first — the script embeds it in the trust policy.
        - Save the policy preview from the previous step as odigos-policy.json in your working directory.
        - Make sure the AWS CLI is configured for the target account (aws configure).
        - Run the script below.
        - Copy the Role ARN it prints into the field below.
      template: |-
        export ODIGOS_EXTERNAL_ID="{{externalId}}"
        [ -n "$ODIGOS_EXTERNAL_ID" ] || echo "WARNING: no external ID set — the role will not be assumable."

        cat > odigos-trust-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "AWS": "arn:aws:iam::657451249928:root" },
              "Action": "sts:AssumeRole",
              "Condition": {
                "StringEquals": { "sts:ExternalId": "${ODIGOS_EXTERNAL_ID}" }
              }
            }
          ]
        }
        EOF

        aws iam create-role \
          --role-name OdigosConnectorRole \
          --description "Lets Odigos Central discover and instrument workloads in this account." \
          --assume-role-policy-document file://odigos-trust-policy.json

        aws iam put-role-policy \
          --role-name OdigosConnectorRole \
          --policy-name OdigosCloudConnector \
          --policy-document file://odigos-policy.json

        aws iam get-role \
          --role-name OdigosConnectorRole \
          --query 'Role.Arn' \
          --output text

    - id: create-role-manual
      section: create-role
      variant: manual
      variantLabel: Manual
      title: Create IAM role
      description: >-
        Create the IAM role by hand in the AWS Console using the trust policy below, then return the
        Role ARN.
      format: json
      steps:
        - Enter an External ID in the field below first — it is interpolated into the trust policy.
        - Open the AWS Console → IAM → Roles → Create role.
        - Select Custom trust policy and paste the policy below.
        - On the next screen, attach the permissions policy from the previous step.
        - Name the role OdigosConnectorRole and create it.
        - Open the role summary and copy the Role ARN into the field below.
      template: |-
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "AWS": "arn:aws:iam::657451249928:root" },
              "Action": "sts:AssumeRole",
              "Condition": {
                "StringEquals": { "sts:ExternalId": "{{externalId}}" }
              }
            }
          ]
        }

    # The access-keys path (auth method "static-keys"): no role, no trust policy — an IAM user in the
    # target account carrying the same permissions policy. Declared as a create-role-section variant so
    # it appears in the same "Setup method" chooser; the artifact title reflects what it actually makes.
    - id: create-user-aws-cli
      section: create-role
      variant: iam-user
      variantLabel: IAM user (access keys)
      title: Create IAM user
      description: >-
        For the access-keys authentication method. Creates a programmatic-only IAM user with the
        permissions policy attached, and prints an access key pair to paste below.
      format: shell
      steps:
        - Save the policy preview from the previous step as odigos-policy.json in your working directory.
        - Make sure the AWS CLI is configured for the target account (aws configure).
        - Run the script below.
        - Copy AccessKeyId and SecretAccessKey from the output into the fields below.
        - Store the secret key somewhere safe — AWS will not show it again.
      template: |-
        aws iam create-user --user-name odigos-connector

        aws iam put-user-policy \
          --user-name odigos-connector \
          --policy-name OdigosCloudConnector \
          --policy-document file://odigos-policy.json

        aws iam create-access-key \
          --user-name odigos-connector \
          --query 'AccessKey.{AccessKeyId:AccessKeyId,SecretAccessKey:SecretAccessKey}' \
          --output table

    # credentials section metadata: title/description for the final "enter credentials" panel.
    # Template is unused; fields come from auth.methods[].fields + connector.fields. Method-neutral
    # copy: the same panel serves assume-role (Role ARN), static-keys (access keys) and
    # workload-identity (nothing to paste).
    - id: enter-credentials
      section: credentials
      title: Enter connector credentials
      description: >-
        Paste the Role ARN generated above, plus the External ID you used in its trust policy. For the
        access-keys method, paste the access key pair instead. Using pod / workload identity (IRSA)?
        Leave these fields empty.
      format: text
      template: ""

    # ---------------------------------------------------------------------------------------------------
    # MANUAL (IaC) INSTRUMENTATION INSTRUCTIONS — sections "instrumentation:<type>".
    #
    # A workload type whose capability is {discovery: true, instrumentation: false} is instrumented BY THE
    # CUSTOMER: Odigos discovers it, publishes what to apply, observes the result and reports conformance,
    # and never mutates it. These artifacts are what "publishes what to apply" means. They are declared here
    # rather than in a new spec hierarchy because central-backend maps the artifact list through
    # uninterpreted, so they reach the catalog with no backend change and no agents-api bump.
    #
    # <ANGLE_BRACKETED> tokens are values the CUSTOMER substitutes. They deliberately do NOT use the
    # {{token}} syntax: that is filled client-side from create-connector form values, and a token with no
    # form value is left verbatim — so a per-workload token spelled that way renders as a bug rather than as
    # a field to fill in.
    #
    # Each artifact is one DELIVERY VARIANT for one LANGUAGE (Terraform, CloudFormation, AWS CLI and AWS CDK
    # per Lambda language; Terraform and CloudFormation per Fargate language), and both halves of that are load-bearing.
    # `language` is the connector language key the plan carries — the workload's detected runtime, or its
    # runtime override when the customer set one — and a connector serves only the matching set, so a
    # customer opening a Java service is handed the Java documents alone. Before that, one artifact per
    # variant had to document every language it might be opened for, which put five runtimes' environment
    # variables in front of a reader who has one and left the paragraph that applies to them to be found
    # rather than copied. Every variant still has to stand on its own within its language: a customer opens
    # one document and applies it.
    #
    # A language declared here that no plan builds is unreachable — the selection finds nothing and falls
    # back to the language-neutral artifacts, of which an instrumentation section may declare none — so a
    # misspelled key silently serves prose. The coverage guard below fails on it.
    #
    # These templates are checked against the connector's own injection recipes by
    # TestLambdaInstrumentationArtifactsMatchPlans and TestFargateInstrumentationArtifactsMatchPlans
    # (providers/aws, pkg/workload/instrumentor). Every environment variable name, value, agent path,
    # container name and staging command below is asserted to be what the instrumentor would actually apply
    # — because nothing converges a manual-mode workload, so instructions that have drifted from the
    # injector leave a customer applying a previous release's configuration and reading a drift verdict they
    # cannot attribute. Do not hand-edit a value here to "fix" a failure; fix the recipe or update both.
    #
    # The coverage guard runs PER LANGUAGE, over the artifacts that language is actually served: every value
    # every plan for it needs must appear in EVERY one of them, so a variant that omits the marker or the
    # collector configuration fails rather than shipping half a recipe — and a language whose own agent path
    # or loader variable is missing from its own documents fails too, which a check over the flat list could
    # not see as long as some other language's document happened to mention the value.
    # ---------------------------------------------------------------------------------------------------

    - id: instrument-lambda-terraform-java
      section: instrumentation:aws.lambda
      language: java
      variant: terraform
      variantLabel: Terraform
      title: Instrument a Java Lambda function (Terraform)
      description: >-
        Anchored fragments for aws_lambda_function, for a Java function. Handler activation is the worked
        example; web-server activation follows the resource block.
      format: shell
      steps:
        - Add the layer to your function's layers list — keep the ones already there.
        - Add the environment variables to environment.variables.
        - Replace every <ANGLE_BRACKETED> value.
        - Behind the AWS Lambda Web Adapter, follow the web-server activation at the end instead — it swaps the wrapper for JAVA_TOOL_OPTIONS.
      prerequisites:
        - >-
          Make sure Odigos Lambda layers are preloaded into your AWS account (https://docs.odigos.io/cloud-connectors/add-connectors/add-aws-connector).
      template: |-
        resource "aws_lambda_function" "app" {
          # ... your existing configuration ...

          # Keep your existing layers; the OpenTelemetry layer is added alongside them.
          layers = concat(var.existing_layers, ["<OTEL_LAYER_ARN>"])

          environment {
            variables = {
              # The value, unescaped, is exactly: {"v":1,"layer":"<OTEL_LAYER_ARN>"}
              ODIGOS_IAC              = "{\"v\":1,\"layer\":\"<OTEL_LAYER_ARN>\"}"
              # The Java layer's own wrapper script: it instruments the handler invocation. The script name
              # is language-specific, and a name the layer does not ship fails the function at cold start with
              # "does not exist".
              AWS_LAMBDA_EXEC_WRAPPER = "/opt/otel-handler"
              OTEL_SERVICE_NAME       = "<ODIGOS_SOURCE_NAME>"
              # The in-Lambda collector's entire configuration. Substitute the two placeholders and change
              # nothing else — Odigos compares the whole value. The space after every colon is required.
              # The value, unescaped, is exactly:
              #   yaml:{receivers: {otlp: {protocols: {grpc: {endpoint: "localhost:4317"}, http: {endpoint: "localhost:4318"}}}}, processors: {memory_limiter: {check_interval: 1s, limit_percentage: 50, spike_limit_percentage: 20}, batch: {send_batch_size: 512, timeout: 200ms}, decouple: null}, exporters: {otlp: {endpoint: "<OTLP_ENDPOINT>", tls: {insecure: <OTLP_INSECURE>}}}, service: {telemetry: {metrics: {level: none}}, pipelines: {traces: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, metrics: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, logs: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}}}}
              OPENTELEMETRY_COLLECTOR_CONFIG_URI = "yaml:{receivers: {otlp: {protocols: {grpc: {endpoint: \"localhost:4317\"}, http: {endpoint: \"localhost:4318\"}}}}, processors: {memory_limiter: {check_interval: 1s, limit_percentage: 50, spike_limit_percentage: 20}, batch: {send_batch_size: 512, timeout: 200ms}, decouple: null}, exporters: {otlp: {endpoint: \"<OTLP_ENDPOINT>\", tls: {insecure: <OTLP_INSECURE>}}}, service: {telemetry: {metrics: {level: none}}, pipelines: {traces: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, metrics: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, logs: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}}}}"

              # Do NOT add OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_HEADERS, ODIGOS_OTLP_ENDPOINT
              # or ODIGOS_OTLP_INSECURE. Odigos compares each against unset, so a value here is reported as
              # instrumentation drift.
              #
              # OTEL_LOG_LEVEL is different: it is compared against "debug" when this connector has debug telemetry
              # enabled and against unset otherwise, so leave it unset unless debug telemetry is on — in which case
              # it must be exactly "debug".
              #
              # OTEL_TRACES_EXPORTER, OTEL_METRICS_EXPORTER and OTEL_LOGS_EXPORTER must be UNSET for a signal your
              # destination accepts, and "none" for one it does not (also delete that signal's pipeline above).
            }
          }
        }

        # WEB-SERVER ACTIVATION (AWS Lambda Web Adapter). The adapter owns AWS_LAMBDA_EXEC_WRAPPER, so remove
        # it from the block above and load the agent through JAVA_TOOL_OPTIONS instead. Our value is APPENDED to
        # whatever the function already carries, joined by a space — never assign JAVA_TOOL_OPTIONS outright,
        # which would discard your value:
        #
        #   JAVA_TOOL_OPTIONS = trimspace("${var.java_tool_options} -javaagent:/opt/opentelemetry-javaagent.jar")

    - id: instrument-lambda-cloudformation-java
      section: instrumentation:aws.lambda
      language: java
      variant: cloudformation
      variantLabel: CloudFormation
      title: Instrument a Java Lambda function (CloudFormation)
      description: >-
        The AWS::Lambda::Function properties to merge, for a Java function. Handler activation is the worked
        example; web-server activation follows it.
      format: yaml
      steps:
        - Merge these properties into your function resource.
        - Keep any layers already listed — add the OpenTelemetry layer to them.
        - Replace every <ANGLE_BRACKETED> value.
        - Behind the AWS Lambda Web Adapter, follow the web-server activation at the end instead — it swaps the wrapper for JAVA_TOOL_OPTIONS.
      prerequisites:
        - >-
          Make sure Odigos Lambda layers are preloaded into your AWS account (https://docs.odigos.io/cloud-connectors/add-connectors/add-aws-connector).
      template: |-
        # Merge into Resources.<YourFunction>.Properties
        Layers:
          # Keep your existing layers and add this one.
          - "<OTEL_LAYER_ARN>"
        Environment:
          Variables:
            ODIGOS_IAC: '{"v":1,"layer":"<OTEL_LAYER_ARN>"}'
            # The Java layer's own wrapper script: it instruments the handler invocation. The script name
            # is language-specific, and a name the layer does not ship fails the function at cold start with
            # "does not exist".
            AWS_LAMBDA_EXEC_WRAPPER: "/opt/otel-handler"
            OTEL_SERVICE_NAME: "<ODIGOS_SOURCE_NAME>"
            # The in-Lambda collector's entire configuration. Substitute the two placeholders and change
            # nothing else — Odigos compares the whole value. The space after every colon is required.
            OPENTELEMETRY_COLLECTOR_CONFIG_URI: 'yaml:{receivers: {otlp: {protocols: {grpc: {endpoint: "localhost:4317"}, http: {endpoint: "localhost:4318"}}}}, processors: {memory_limiter: {check_interval: 1s, limit_percentage: 50, spike_limit_percentage: 20}, batch: {send_batch_size: 512, timeout: 200ms}, decouple: null}, exporters: {otlp: {endpoint: "<OTLP_ENDPOINT>", tls: {insecure: <OTLP_INSECURE>}}}, service: {telemetry: {metrics: {level: none}}, pipelines: {traces: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, metrics: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, logs: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}}}}'
            # Do NOT add OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_HEADERS, ODIGOS_OTLP_ENDPOINT
            # or ODIGOS_OTLP_INSECURE. Odigos compares each against unset, so a value here is reported as
            # instrumentation drift.
            #
            # OTEL_LOG_LEVEL is different: it is compared against "debug" when this connector has debug telemetry
            # enabled and against unset otherwise, so leave it unset unless debug telemetry is on — in which case
            # it must be exactly "debug".
            #
            # OTEL_TRACES_EXPORTER, OTEL_METRICS_EXPORTER and OTEL_LOGS_EXPORTER must be UNSET for a signal your
            # destination accepts, and "none" for one it does not (also delete that signal's pipeline above).

        # WEB-SERVER ACTIVATION (AWS Lambda Web Adapter). The adapter owns AWS_LAMBDA_EXEC_WRAPPER: remove it
        # and load the agent through JAVA_TOOL_OPTIONS, APPENDED to your existing value and joined by a space.
        # CloudFormation cannot read a variable back, so fold your own value in by hand rather than assigning
        # ours over it:
        #
        #   JAVA_TOOL_OPTIONS: "<YOUR_EXISTING_VALUE> -javaagent:/opt/opentelemetry-javaagent.jar"

    - id: instrument-lambda-aws-cli-java
      section: instrumentation:aws.lambda
      language: java
      variant: aws-cli
      variantLabel: AWS CLI
      title: Instrument a Java Lambda function (AWS CLI)
      description: >-
        One update-function-configuration call for a Java function. Use this to try instrumentation on a
        single function; put it in your IaC to keep it.
      format: shell
      steps:
        - Set the variables at the top, including the layer ARN for your function's region, runtime and architecture.
        - Replace <OTLP_ENDPOINT> and <OTLP_INSECURE> inside odigos-env.json, and re-list any variables your function already needs.
        - Run the script. It merges the OpenTelemetry layer into the function's existing layers.
        - Re-run it after any deploy that resets the function configuration.
      prerequisites:
        - >-
          Make sure Odigos Lambda layers are preloaded into your AWS account (https://docs.odigos.io/cloud-connectors/add-connectors/add-aws-connector).
      template: |-
        FUNCTION="<YOUR_FUNCTION_NAME>"
        LAYER="<OTEL_LAYER_ARN>"
        # The Java layer's wrapper script. A name the layer does not ship fails the function at cold start.
        WRAPPER="/opt/otel-handler"

        # The environment goes through a JSON file rather than the Variables={...} shorthand: the collector
        # configuration contains commas and braces, which that shorthand cannot represent.
        #
        # The two JSON-escaped values below are, unescaped, exactly:
        #   ODIGOS_IAC                         {"v":1,"layer":"<OTEL_LAYER_ARN>"}
        #   OPENTELEMETRY_COLLECTOR_CONFIG_URI yaml:{receivers: {otlp: {protocols: {grpc: {endpoint: "localhost:4317"}, http: {endpoint: "localhost:4318"}}}}, processors: {memory_limiter: {check_interval: 1s, limit_percentage: 50, spike_limit_percentage: 20}, batch: {send_batch_size: 512, timeout: 200ms}, decouple: null}, exporters: {otlp: {endpoint: "<OTLP_ENDPOINT>", tls: {insecure: <OTLP_INSECURE>}}}, service: {telemetry: {metrics: {level: none}}, pipelines: {traces: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, metrics: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, logs: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}}}}
        #
        # --environment REPLACES the whole map, so add any variables your function already needs here too.
        # Substitute <OTLP_ENDPOINT> and <OTLP_INSECURE>; change nothing else in the collector configuration,
        # including the space after every colon.
        cat > odigos-env.json <<'JSON'
        {
          "Variables": {
            "ODIGOS_IAC": "{\"v\":1,\"layer\":\"<OTEL_LAYER_ARN>\"}",
            "AWS_LAMBDA_EXEC_WRAPPER": "<WRAPPER>",
            "OTEL_SERVICE_NAME": "<ODIGOS_SOURCE_NAME>",
            "OPENTELEMETRY_COLLECTOR_CONFIG_URI": "yaml:{receivers: {otlp: {protocols: {grpc: {endpoint: \"localhost:4317\"}, http: {endpoint: \"localhost:4318\"}}}}, processors: {memory_limiter: {check_interval: 1s, limit_percentage: 50, spike_limit_percentage: 20}, batch: {send_batch_size: 512, timeout: 200ms}, decouple: null}, exporters: {otlp: {endpoint: \"<OTLP_ENDPOINT>\", tls: {insecure: <OTLP_INSECURE>}}}, service: {telemetry: {metrics: {level: none}}, pipelines: {traces: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, metrics: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, logs: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}}}}"
          }
        }
        JSON
        sed -i.bak -e "s|<OTEL_LAYER_ARN>|$LAYER|g" -e "s|<WRAPPER>|$WRAPPER|g" odigos-env.json && rm -f odigos-env.json.bak

        # Keep the layers already attached — this appends ours rather than replacing them.
        EXISTING=$(aws lambda get-function-configuration --function-name "$FUNCTION" \
          --query 'Layers[].Arn' --output text | tr '\t' ' ')
        # A function with no layers has no Layers key at all, and the query then renders as the literal
        # "None" — which would be passed on as a layer ARN and fail the update. Blank it.
        [ "$EXISTING" = "None" ] && EXISTING=""

        aws lambda update-function-configuration \
          --function-name "$FUNCTION" \
          --layers $EXISTING "$LAYER" \
          --environment file://odigos-env.json

        # Do NOT add OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_HEADERS, ODIGOS_OTLP_ENDPOINT
        # or ODIGOS_OTLP_INSECURE. Odigos compares each against unset, so a value here is reported as
        # instrumentation drift.
        #
        # OTEL_LOG_LEVEL is different: it is compared against "debug" when this connector has debug telemetry
        # enabled and against unset otherwise, so leave it unset unless debug telemetry is on — in which case
        # it must be exactly "debug".
        #
        # OTEL_TRACES_EXPORTER, OTEL_METRICS_EXPORTER and OTEL_LOGS_EXPORTER must be UNSET for a signal your
        # destination accepts, and "none" for one it does not (also delete that signal's pipeline above).

        # WEB-SERVER ACTIVATION (AWS Lambda Web Adapter). The adapter owns AWS_LAMBDA_EXEC_WRAPPER, so drop
        # AWS_LAMBDA_EXEC_WRAPPER from odigos-env.json and add JAVA_TOOL_OPTIONS instead:
        #
        #   JAVA_TOOL_OPTIONS=-javaagent:/opt/opentelemetry-javaagent.jar
        #
        # JAVA_TOOL_OPTIONS is APPENDED — your value first, then ours, joined by a space.
        # --environment replaces the whole map, so include the value the function already had in it.

    - id: instrument-lambda-cdk-java
      section: instrumentation:aws.lambda
      language: java
      variant: cdk
      variantLabel: AWS CDK
      title: Instrument a Java Lambda function (AWS CDK)
      description: >-
        For a Java function defined in a TypeScript/JavaScript CDK app, using the Odigos CDK constructs, which
        resolve the layer ARN, render the collector configuration and write the IaC marker for you.
      format: text
      steps:
        - Install @odigos/aws-cdk in the app that defines the function, pinned to an exact version — the package version IS the layer version.
        - Add one OdigosLambdaInstrumentation per function, passing serviceName explicitly.
        - Run cdk diff to check the layer and the variables, then cdk deploy. Your function code is untouched, so this is a configuration-only update.
      prerequisites:
        - >-
          Make sure Odigos Lambda layers are preloaded into your AWS account (https://docs.odigos.io/cloud-connectors/add-connectors/add-aws-connector).
      template: |-
        npm install @odigos/aws-cdk@<PACKAGE_VERSION>    # Python CDK: pip install odigos-aws-cdk==<PACKAGE_VERSION>

        WHAT THE CONSTRUCT DOES for a Java function. It attaches the Java layer for the function's
        architecture, sets AWS_LAMBDA_EXEC_WRAPPER to /opt/otel-handler, sets OTEL_SERVICE_NAME, renders
        OPENTELEMETRY_COLLECTOR_CONFIG_URI — the same renderer this connector uses, so the value matches byte for
        byte — and writes ODIGOS_IAC recording the layer it attached, which is what makes Odigos report the
        function as instrumented rather than as awaiting your deployment. Nothing below has to be added by hand.

        What it does NOT set is ODIGOS_MANAGED. That is the connector's record of a mutation IT performed,
        including the snapshot it rolls back from, and the package will not claim ownership of a function on
        your behalf. Do not add it yourself.

        import { Stack } from 'aws-cdk-lib';
        import { LAYER_ARNS, OdigosLambdaInstrumentation } from '@odigos/aws-cdk';

        // ONE CONSTRUCT PER FUNCTION. serviceName applies to every function a construct instruments, and
        // left unset it falls back to the CDK CONSTRUCT ID rather than the deployed function name —
        // lambda.Function.functionName resolves to a CloudFormation Ref even when you set it explicitly, so
        // the package cannot read it. OTEL_SERVICE_NAME must match the workload's name in Odigos, so pass it.
        new OdigosLambdaInstrumentation(this, 'OdigosApi', {
          destination: {
            endpoint: '<OTLP_ENDPOINT>',      // OTLP/gRPC as host:port, no scheme
            insecure: <OTLP_INSECURE>,        // plaintext destination only; must match this connector
            // httpEndpoint: 'https://...'    // instead of endpoint, for an OTLP/HTTP destination
            // headers: { authorization: 'Bearer ...' },  // see the credential warning below
          },
          serviceName: '<ODIGOS_SOURCE_NAME>',
          functions: [fn],
        });

        // THE MARKER IS WRITTEN FOR YOU — shown here so you recognise it in a cdk diff, not to be added by
        // hand. It records the ARN the construct actually attached, and Odigos checks the function against
        // the version recorded in it, so a version you pinned is respected instead of being reported as
        // drift. What it writes is ODIGOS_IAC = {"v":1,"layer":"<OTEL_LAYER_ARN>"}, with the package that
        // wrote it named alongside:
        //   ODIGOS_IAC = {"v":1,"source":"cdk","version":"<PACKAGE_VERSION>","layer":"<OTEL_LAYER_ARN>"}
        //
        // LAYER_ARNS is that same table, exported for a stack that needs the ARN for its own reasons:
        //   const layerArn = LAYER_ARNS[`${Stack.of(this).region}/java/${fn.architecture.name}`];

        WHERE THE LAYER COMES FROM
          layerSource: OdigosLayerSource.ODIGOS_PUBLIC   (default) the public Odigos layer version in the
            stack's region, resolved at SYNTH time from a table in the package. No extra resources, no
            deploy-time lookup — but it needs a concrete region, so an environment-agnostic stack throws.
          layerSource: OdigosLayerSource.IN_ACCOUNT      deploys the Odigos Serverless Application
            Repository application into your account as a nested stack (one per language/architecture) and
            wires its LayerVersionArn output into the function. Identical bytes, owned by your own stack —
            for organisations whose policy forbids attaching a layer owned by another AWS account. Needs
            serverlessrepo:CreateCloudFormationTemplate and serverlessrepo:GetApplication at deploy time.
          layerVersion: <your ILayerVersion>             a layer you mirrored yourself; neither path is used.

        The marker needs the ARN, and only the ODIGOS_PUBLIC path exposes it — LAYER_ARNS is a plain table
        you can index. IN_ACCOUNT resolves the ARN from a nested stack output that the construct does not
        hand back, so to record the marker there, either pass the layer in yourself through layerVersion and
        read its layerVersionArn, or read the nested application's LayerVersionArn output directly.

        HANDLER vs WEB-SERVER. The default mode is HANDLER, which sets AWS_LAMBDA_EXEC_WRAPPER to
        /opt/otel-handler. A function behind the AWS Lambda Web Adapter needs
        mode: OdigosInstrumentationMode.WEB_SERVER, which leaves the wrapper to the adapter and loads the agent
        through JAVA_TOOL_OPTIONS instead:

          JAVA_TOOL_OPTIONS = -javaagent:/opt/opentelemetry-javaagent.jar

        There, pass existingLoaderValue with whatever your function already needs in JAVA_TOOL_OPTIONS — CDK cannot
        read an environment variable back, and the construct's value is APPENDED to it, joined by a space, so without it yours is
        replaced. Applying HANDLER to a web-adapter function stops it serving.

        javaHandlerDistro selects the wrapper script for your handler interface. The default suits a
        RequestHandler; a RequestStreamHandler needs OdigosJavaHandlerDistro.OTEL_STREAM_HANDLER, and the
        default BREAKS it rather than producing thinner spans — the two interfaces have different signatures.

        Signals: destination.traces / metrics / logs default to true. Setting one false drops that pipeline
        from the configuration AND sets that signal's OTEL_TRACES_EXPORTER / OTEL_METRICS_EXPORTER /
        OTEL_LOGS_EXPORTER to "none" — which is exactly what this connector expects for a signal your
        destination does not accept. Leave a signal enabled and its variable stays unset, because "otlp" is
        already the SDK default. Turning all three off throws at synth.

        MUST NOT be set (Odigos compares each against unset, so a leftover value is reported as drift). The
        construct sets none of them; this list matters if an earlier attempt did:
          OTEL_EXPORTER_OTLP_ENDPOINT   OTEL_EXPORTER_OTLP_HEADERS
          ODIGOS_OTLP_ENDPOINT          ODIGOS_OTLP_INSECURE      (replaced by the configuration below)
          OTEL_LOG_LEVEL                (unless this connector has debug telemetry enabled: then "debug",
                                         which the construct writes for you when you pass debug: true)

        For reference, the OPENTELEMETRY_COLLECTOR_CONFIG_URI value the construct renders for a gRPC
        destination with all three signals on — this is what Odigos compares the live variable against:
          yaml:{receivers: {otlp: {protocols: {grpc: {endpoint: "localhost:4317"}, http: {endpoint: "localhost:4318"}}}}, processors: {memory_limiter: {check_interval: 1s, limit_percentage: 50, spike_limit_percentage: 20}, batch: {send_batch_size: 512, timeout: 200ms}, decouple: null}, exporters: {otlp: {endpoint: "<OTLP_ENDPOINT>", tls: {insecure: <OTLP_INSECURE>}}}, service: {telemetry: {metrics: {level: none}}, pipelines: {traces: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, metrics: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, logs: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}}}}

    - id: instrument-lambda-terraform-nodejs
