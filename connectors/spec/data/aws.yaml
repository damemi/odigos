    - id: instrument-agentcore-aws-cli-python
      section: instrumentation:aws.bedrock-agentcore-runtime
      language: python
      variant: aws-cli
      variantLabel: AWS CLI
      title: Instrument a Python Bedrock AgentCore runtime (AWS CLI)
      description: Activate <AGENTCORE_DISTRO> on <AGENTCORE_RUNTIME_NAME> from the Odigos package (route A), or configure the ADOT the artifact already runs (route B), with the same recipes automatic mode applies.
      format: shell
      steps:
        - 'Prepare and upload the artifact for your route (see the prerequisites). Set ROUTE=adot when it carries ADOT only (route B), and ARTIFACT_JSON if this update should switch to the new artifact. For a ZIP on route A, set ENTRY_SCRIPT=<YOUR_ENTRY_POINT> and point ARTIFACT_JSON at the start wrapper alone.'
        - 'Replace every <ANGLE_BRACKETED> value, then run the script with credentials that can read and update the runtime.'
        - 'Deploy, wait for the runtime and its DEFAULT endpoint to serve the new version, then invoke with a new session. Endpoints pinned to older versions keep them until you update them.'
      prerequisites:
        - 'Prepare the artifact before applying this (https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare), on one of two routes. Route A (recommended): add the Odigos package to the agent''s dependencies, pip install "odigos-agentcore[adot]" or "odigos-agentcore[openllmetry]" (the extra must match <AGENTCORE_DISTRO>), or copy the bundle from <AGENTCORE_AGENTS_IMAGE>; environment settings alone install nothing, and the bootstrap stays dormant until this environment enables it.'
        - 'Route B: the artifact carries ADOT only: pip install aws-opentelemetry-distro and start the agent through the opentelemetry-instrument launcher (the ZIP entry point or the image CMD). No Odigos package is needed, but ADOT cannot root an invocation at the agent, so AgentCore''s own service span stays missing from the trace; route A adds it. Only the ADOT distribution can be adopted.'
        - 'Only for the carrier image route (copying the bundle from <AGENTCORE_AGENTS_IMAGE>): make sure that registry.odigos.io is accessible to your image build or packaging step, or mirror the image into your own registry (https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare). The package routes need only your usual package registry (PyPI).'
        - 'Use a global OTLP/HTTP destination. Supply destination authentication through your deployment''s secret mechanism; Odigos never puts credentials in these instructions.'
      template: |-
        # Prepare the artifact first: https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare
        # Route A ZIP: entry point ["odigos_agentcore_start.py"] with ODIGOS_AGENTCORE_ENTRYPOINT=<YOUR_ENTRY_POINT>.
        # Route B: start through the launcher, entry point ["opentelemetry-instrument", "<YOUR_ENTRY_POINT>"] or the image CMD.
        #
        # Requires AWS CLI v2 and jq. Reads the runtime's current configuration and changes only what is listed here.
        RUNTIME_ID='<AGENTCORE_RUNTIME_ID>'
        # odigos: the artifact carries the Odigos package or carrier bundle (route A).
        # adot:   the artifact carries ADOT only (route B).
        ROUTE="${ROUTE:-odigos}"
        # To switch to the prepared artifact in the same update, set ARTIFACT_JSON. Direct code, route A:
        #   ARTIFACT_JSON='{"codeConfiguration":{"code":{"s3":{"bucket":"<PREPARED_ARTIFACT_BUCKET>","prefix":"<PREPARED_ARTIFACT_KEY>"}},"runtime":"PYTHON_3_12","entryPoint":["odigos_agentcore_start.py"]}}'
        # Direct code, route B:
        #   ARTIFACT_JSON='{"codeConfiguration":{"code":{"s3":{"bucket":"<PREPARED_ARTIFACT_BUCKET>","prefix":"<PREPARED_ARTIFACT_KEY>"}},"runtime":"PYTHON_3_12","entryPoint":["opentelemetry-instrument","<YOUR_ENTRY_POINT>"]}}'
        # Container (either route):
        #   ARTIFACT_JSON='{"containerConfiguration":{"containerUri":"<PREPARED_IMAGE_URI>"}}'
        ARTIFACT_JSON="${ARTIFACT_JSON:-null}"
        # Direct code, route A: your entry point script, which the start wrapper reads from ODIGOS_AGENTCORE_ENTRYPOINT.
        ENTRY_SCRIPT="${ENTRY_SCRIPT:-}"

        aws bedrock-agentcore-control get-agent-runtime --agent-runtime-id "$RUNTIME_ID" > current.json

        if [ "$ROUTE" = adot ]; then
          # Route B: the ADOT recipe. No bootstrap switches, and no X-Ray propagator.
          jq -n \
            --arg ODIGOS_IAC '{"distro":"python-agentcore-adot","recipe":"1","v":1}' \
            --arg ODIGOS_AGENTCORE_PACKAGE '{"v":1,"language":"python","distros":["python-agentcore-adot"],"mode":"adopt"}' \
            '{
              ODIGOS_IAC: $ODIGOS_IAC,
              ODIGOS_AGENTCORE_PACKAGE: $ODIGOS_AGENTCORE_PACKAGE,
              DISABLE_ADOT_OBSERVABILITY: "true",
              AGENT_OBSERVABILITY_ENABLED: "false",
              OTEL_SERVICE_NAME: "<AGENTCORE_SERVICE_NAME>",
              OTEL_SDK_DISABLED: "false",
              OTEL_EXPORTER_OTLP_ENDPOINT: "<AGENTCORE_OTLP_ENDPOINT>",
              OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf",
              OTEL_TRACES_EXPORTER: "<AGENTCORE_TRACES_EXPORTER>",
              OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "<AGENTCORE_OTLP_ENDPOINT>/v1/traces",
              OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "http/protobuf",
              OTEL_METRICS_EXPORTER: "<AGENTCORE_METRICS_EXPORTER>",
              OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "<AGENTCORE_OTLP_ENDPOINT>/v1/metrics",
              OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: "http/protobuf",
              OTEL_LOGS_EXPORTER: "<AGENTCORE_LOGS_EXPORTER>",
              OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "<AGENTCORE_OTLP_ENDPOINT>/v1/logs",
              OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: "http/protobuf",
              OTEL_PROPAGATORS: "tracecontext,baggage",
              OTEL_TRACES_SAMPLER: "parentbased_always_on",
              OTEL_AWS_APPLICATION_SIGNALS_ENABLED: "false",
              OTEL_AWS_DYNAMIC_INSTRUMENTATION_ENABLED: "false",
              OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false",
              TRACELOOP_TRACE_CONTENT: "false",
              OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true",
              OTEL_PYTHON_DISTRO: "aws_distro",
              OTEL_PYTHON_CONFIGURATOR: "aws_configurator",
              OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: "boto3",
              OTEL_EXPORTER_OTLP_HEADERS: "<OTLP_AUTH_HEADERS>"
            }' > odigos-env.json
        else
          # Route A: the Odigos package recipe.
          jq -n \
            --arg ODIGOS_IAC '{"distro":"<AGENTCORE_DISTRO>","recipe":"1","v":1}' \
            --arg ODIGOS_AGENTCORE_PACKAGE '{"v":1,"language":"python","distros":["<AGENTCORE_DISTRO>"]}' \
            '{
              ODIGOS_IAC: $ODIGOS_IAC,
              ODIGOS_AGENTCORE_PACKAGE: $ODIGOS_AGENTCORE_PACKAGE,
              ODIGOS_AGENTCORE_ENABLED: "true",
              ODIGOS_AGENTCORE_DISTRO: "<AGENTCORE_DISTRO>",
              DISABLE_ADOT_OBSERVABILITY: "true",
              AGENT_OBSERVABILITY_ENABLED: "false",
              OTEL_SERVICE_NAME: "<AGENTCORE_SERVICE_NAME>",
              OTEL_SDK_DISABLED: "false",
              OTEL_EXPORTER_OTLP_ENDPOINT: "<AGENTCORE_OTLP_ENDPOINT>",
              OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf",
              OTEL_TRACES_EXPORTER: "<AGENTCORE_TRACES_EXPORTER>",
              OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "<AGENTCORE_OTLP_ENDPOINT>/v1/traces",
              OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "http/protobuf",
              OTEL_METRICS_EXPORTER: "<AGENTCORE_METRICS_EXPORTER>",
              OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "<AGENTCORE_OTLP_ENDPOINT>/v1/metrics",
              OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: "http/protobuf",
              OTEL_LOGS_EXPORTER: "<AGENTCORE_LOGS_EXPORTER>",
              OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "<AGENTCORE_OTLP_ENDPOINT>/v1/logs",
              OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: "http/protobuf",
              OTEL_PROPAGATORS: "tracecontext,baggage,xray",
              OTEL_TRACES_SAMPLER: "parentbased_always_on",
              OTEL_AWS_APPLICATION_SIGNALS_ENABLED: "false",
              OTEL_AWS_DYNAMIC_INSTRUMENTATION_ENABLED: "false",
              OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false",
              TRACELOOP_TRACE_CONTENT: "false",
              OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true",
              OTEL_PYTHON_DISTRO: "<AGENTCORE_PYTHON_DISTRO>",
              OTEL_PYTHON_CONFIGURATOR: "<AGENTCORE_PYTHON_CONFIGURATOR>",
              OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: "<AGENTCORE_PYTHON_DISABLED_INSTRUMENTATIONS>",
              OTEL_EXPORTER_OTLP_HEADERS: "<OTLP_AUTH_HEADERS>"
            }' > odigos-env.json
        fi

        # The per-signal header keys are removed: a signal-specific value replaces the shared headers. The bootstrap
        # switches (and ODIGOS_AGENTCORE_ENTRYPOINT) are removed too, and route A sets them again.
        jq --slurpfile odigos odigos-env.json --argjson artifact "$ARTIFACT_JSON" --arg route "$ROUTE" --arg entry "$ENTRY_SCRIPT" '
          {agentRuntimeId, agentRuntimeArtifact: ($artifact // .agentRuntimeArtifact), roleArn, networkConfiguration,
           description, authorizerConfiguration, requestHeaderConfiguration, protocolConfiguration,
           lifecycleConfiguration, filesystemConfigurations, metadataConfiguration,
           environmentVariables: ((.environmentVariables // {})
             | del(.OTEL_EXPORTER_OTLP_TRACES_HEADERS, .OTEL_EXPORTER_OTLP_METRICS_HEADERS, .OTEL_EXPORTER_OTLP_LOGS_HEADERS)
             | del(.ODIGOS_MANAGED, .ODIGOS_AGENTCORE_ENABLED, .ODIGOS_AGENTCORE_DISTRO, .ODIGOS_AGENTCORE_ENTRYPOINT)
             + $odigos[0]
             + (if $route == "odigos" and $entry != "" then {ODIGOS_AGENTCORE_ENTRYPOINT: $entry} else {} end))}
          | with_entries(select(.value != null))' current.json > update.json

        aws bedrock-agentcore-control update-agent-runtime --cli-input-json file://update.json

    - id: instrument-agentcore-cdk-python
      section: instrumentation:aws.bedrock-agentcore-runtime
      language: python
      variant: cdk
      variantLabel: AWS CDK
      title: Instrument a Python Bedrock AgentCore runtime (AWS CDK)
      description: Activate <AGENTCORE_DISTRO> on <AGENTCORE_RUNTIME_NAME> from the Odigos package (route A), or configure the ADOT the artifact already runs (route B), with the same recipes automatic mode applies.
      format: text
      steps:
        - 'From the CDK project, run `npm install @odigos/aws-cdk@<PACKAGE_VERSION>`. Paste only the TypeScript into your stack.'
        - 'Point the runtime''s artifact at the prepared image or ZIP (see the prerequisites); the construct writes only the environment. For an artifact carrying ADOT only (route B), set `sdk: OdigosAgentCoreSdk.ADOT`.'
        - '`cdk diff`, then `cdk deploy`. Deploy, wait for the runtime and its DEFAULT endpoint to serve the new version, then invoke with a new session. Endpoints pinned to older versions keep them until you update them.'
      prerequisites:
        - 'Prepare the artifact before applying this (https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare), on one of two routes. Route A (recommended): add the Odigos package to the agent''s dependencies, pip install "odigos-agentcore[adot]" or "odigos-agentcore[openllmetry]" (the extra must match <AGENTCORE_DISTRO>), or copy the bundle from <AGENTCORE_AGENTS_IMAGE>; environment settings alone install nothing, and the bootstrap stays dormant until this environment enables it.'
        - 'Route B: the artifact carries ADOT only: pip install aws-opentelemetry-distro and start the agent through the opentelemetry-instrument launcher (the ZIP entry point or the image CMD). No Odigos package is needed, but ADOT cannot root an invocation at the agent, so AgentCore''s own service span stays missing from the trace; route A adds it. Only the ADOT distribution can be adopted.'
        - 'Only for the carrier image route (copying the bundle from <AGENTCORE_AGENTS_IMAGE>): make sure that registry.odigos.io is accessible to your image build or packaging step, or mirror the image into your own registry (https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare). The package routes need only your usual package registry (PyPI).'
        - 'Use a global OTLP/HTTP destination. Supply destination authentication through your deployment''s secret mechanism; Odigos never puts credentials in these instructions.'
      template: |-
        import { OdigosAgentCoreDistribution, OdigosAgentCoreInstrumentation, OdigosAgentCoreLanguage, OdigosAgentCoreSdk } from '@odigos/aws-cdk';

        new OdigosAgentCoreInstrumentation(this, 'Odigos', {
          destination: {
            httpEndpoint: '<AGENTCORE_OTLP_ENDPOINT>',
            traces: <AGENTCORE_TRACES_ENABLED>,
            metrics: <AGENTCORE_METRICS_ENABLED>,
            logs: <AGENTCORE_LOGS_ENABLED>,
            // headers: { Authorization: authorization }, // destination authentication, from your secret mechanism
          },
          targets: [{
            runtime: agentRuntime, // CfnRuntime, Runtime, or a CfnInclude resource of type AWS::BedrockAgentCore::Runtime
            language: OdigosAgentCoreLanguage.PYTHON,
            distribution: OdigosAgentCoreDistribution.<AGENTCORE_CDK_DISTRIBUTION>,
            // ODIGOS: the artifact carries the Odigos package or carrier bundle (route A).
            // ADOT: the artifact carries ADOT only (route B); the distribution must then be ADOT.
            sdk: OdigosAgentCoreSdk.ODIGOS,
            // entryPointScript: '<YOUR_ENTRY_POINT>',   // direct-code ZIP on route A: the wrapper is the EntryPoint alone
            serviceName: '<AGENTCORE_SERVICE_NAME>',
          }],
        });

        // Prepare the artifact first: https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare
        // Route A ZIP: entry point ["odigos_agentcore_start.py"] with ODIGOS_AGENTCORE_ENTRYPOINT=<YOUR_ENTRY_POINT>.
        // Route B: start through the launcher, entry point ["opentelemetry-instrument", "<YOUR_ENTRY_POINT>"] or the image CMD.

        // What the construct writes to EnvironmentVariables with sdk ODIGOS (route A):
        //   ODIGOS_IAC={"distro":"<AGENTCORE_DISTRO>","recipe":"1","v":1}
        //   ODIGOS_AGENTCORE_PACKAGE={"v":1,"language":"python","distros":["<AGENTCORE_DISTRO>"]}
        //   ODIGOS_AGENTCORE_ENABLED=true
        //   ODIGOS_AGENTCORE_DISTRO=<AGENTCORE_DISTRO>
        //   ODIGOS_AGENTCORE_ENTRYPOINT=<YOUR_ENTRY_POINT>  (route A direct-code ZIP only, from entryPointScript; the runtime's EntryPoint is the wrapper alone)
        //   DISABLE_ADOT_OBSERVABILITY=true
        //   AGENT_OBSERVABILITY_ENABLED=false
        //   OTEL_SERVICE_NAME=<AGENTCORE_SERVICE_NAME>
        //   OTEL_SDK_DISABLED=false
        //   OTEL_EXPORTER_OTLP_ENDPOINT=<AGENTCORE_OTLP_ENDPOINT>
        //   OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
        //   OTEL_TRACES_EXPORTER=<AGENTCORE_TRACES_EXPORTER>
        //   OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=<AGENTCORE_OTLP_ENDPOINT>/v1/traces
        //   OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=http/protobuf
        //   OTEL_METRICS_EXPORTER=<AGENTCORE_METRICS_EXPORTER>
        //   OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=<AGENTCORE_OTLP_ENDPOINT>/v1/metrics
        //   OTEL_EXPORTER_OTLP_METRICS_PROTOCOL=http/protobuf
        //   OTEL_LOGS_EXPORTER=<AGENTCORE_LOGS_EXPORTER>
        //   OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=<AGENTCORE_OTLP_ENDPOINT>/v1/logs
        //   OTEL_EXPORTER_OTLP_LOGS_PROTOCOL=http/protobuf
        //   OTEL_PROPAGATORS=tracecontext,baggage,xray
        //   OTEL_TRACES_SAMPLER=parentbased_always_on
        //   OTEL_AWS_APPLICATION_SIGNALS_ENABLED=false
        //   OTEL_AWS_DYNAMIC_INSTRUMENTATION_ENABLED=false
        //   OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=false
        //   TRACELOOP_TRACE_CONTENT=false
        //   OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
        //   OTEL_PYTHON_DISTRO=<AGENTCORE_PYTHON_DISTRO>
        //   OTEL_PYTHON_CONFIGURATOR=<AGENTCORE_PYTHON_CONFIGURATOR>
        //   OTEL_PYTHON_DISABLED_INSTRUMENTATIONS=<AGENTCORE_PYTHON_DISABLED_INSTRUMENTATIONS>
        //   OTEL_EXPORTER_OTLP_HEADERS=<OTLP_AUTH_HEADERS>  (encoded from destination.headers; removed when there are none)
        //
        // With sdk ADOT (route B) it writes the same, except:
        //   ODIGOS_IAC={"distro":"python-agentcore-adot","recipe":"1","v":1}
        //   ODIGOS_AGENTCORE_PACKAGE={"v":1,"language":"python","distros":["python-agentcore-adot"],"mode":"adopt"}
        //   OTEL_PROPAGATORS=tracecontext,baggage
        //   OTEL_PYTHON_DISTRO=aws_distro
        //   OTEL_PYTHON_CONFIGURATOR=aws_configurator
        //   OTEL_PYTHON_DISABLED_INSTRUMENTATIONS=boto3
        // and it removes ODIGOS_AGENTCORE_ENABLED and ODIGOS_AGENTCORE_DISTRO instead of setting them (entryPointScript throws at synth).
        //
        // Either way it removes, if present: ODIGOS_MANAGED, OTEL_EXPORTER_OTLP_TRACES_HEADERS, OTEL_EXPORTER_OTLP_METRICS_HEADERS, OTEL_EXPORTER_OTLP_LOGS_HEADERS

    - id: instrument-agentcore-cloudformation-python
      section: instrumentation:aws.bedrock-agentcore-runtime
      language: python
      variant: cloudformation
      variantLabel: CloudFormation
      title: Instrument a Python Bedrock AgentCore runtime (CloudFormation)
      description: Activate <AGENTCORE_DISTRO> on <AGENTCORE_RUNTIME_NAME> from the Odigos package (route A), or configure the ADOT the artifact already runs (route B), with the same recipes automatic mode applies.
      format: yaml
      steps:
        - 'Prepare and upload the artifact for your route (see the prerequisites).'
        - 'Add the OdigosAgentCoreRoute parameter and the OdigosADOT condition to the template, and merge this fragment into your AWS::BedrockAgentCore::Runtime. Keep the runtime''s other properties and environment variables, and remove the listed header keys.'
        - 'Replace every <ANGLE_BRACKETED> value and update the stack with OdigosAgentCoreRoute=odigos (route A) or adot (route B). Deploy, wait for the runtime and its DEFAULT endpoint to serve the new version, then invoke with a new session. Endpoints pinned to older versions keep them until you update them.'
      prerequisites:
        - 'Prepare the artifact before applying this (https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare), on one of two routes. Route A (recommended): add the Odigos package to the agent''s dependencies, pip install "odigos-agentcore[adot]" or "odigos-agentcore[openllmetry]" (the extra must match <AGENTCORE_DISTRO>), or copy the bundle from <AGENTCORE_AGENTS_IMAGE>; environment settings alone install nothing, and the bootstrap stays dormant until this environment enables it.'
        - 'Route B: the artifact carries ADOT only: pip install aws-opentelemetry-distro and start the agent through the opentelemetry-instrument launcher (the ZIP entry point or the image CMD). No Odigos package is needed, but ADOT cannot root an invocation at the agent, so AgentCore''s own service span stays missing from the trace; route A adds it. Only the ADOT distribution can be adopted.'
        - 'Only for the carrier image route (copying the bundle from <AGENTCORE_AGENTS_IMAGE>): make sure that registry.odigos.io is accessible to your image build or packaging step, or mirror the image into your own registry (https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare). The package routes need only your usual package registry (PyPI).'
        - 'Use a global OTLP/HTTP destination. Supply destination authentication through your deployment''s secret mechanism; Odigos never puts credentials in these instructions.'
      template: |-
        # Prepare the artifact first: https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare
        # Route A ZIP: entry point ["odigos_agentcore_start.py"] with ODIGOS_AGENTCORE_ENTRYPOINT=<YOUR_ENTRY_POINT>.
        # Route B: start through the launcher, entry point ["opentelemetry-instrument", "<YOUR_ENTRY_POINT>"] or the image CMD.
        #
        # Add to the template's top level: the route parameter and its condition.
        #   Parameters:
        #     OdigosAgentCoreRoute:
        #       Type: String
        #       AllowedValues: [odigos, adot]   # odigos: route A (Odigos package); adot: route B (ADOT only)
        #       Default: odigos
        #   Conditions:
        #     OdigosADOT: !Equals [!Ref OdigosAgentCoreRoute, adot]
        #
        # Merge into Resources.<YOUR_RUNTIME>.Properties of your AWS::BedrockAgentCore::Runtime and keep its other
        # settings and EnvironmentVariables. Never set ODIGOS_MANAGED here: that marker belongs to the connector.
        AgentRuntimeArtifact:
          # Direct code: point at the prepared ZIP and start through the wrapper (route A) or the launcher (route B).
          # Containers: ContainerUri: <PREPARED_IMAGE_URI>
          CodeConfiguration:
            Code:
              S3:
                Bucket: <PREPARED_ARTIFACT_BUCKET>
                Prefix: <PREPARED_ARTIFACT_KEY>
            Runtime: PYTHON_3_12
            EntryPoint: !If [OdigosADOT, [opentelemetry-instrument, <YOUR_ENTRY_POINT>], [odigos_agentcore_start.py]]
        EnvironmentVariables:
          # Values that differ by route are !If [OdigosADOT, <route B>, <route A>]; AWS::NoValue removes the key.
          ODIGOS_IAC: !If [OdigosADOT, '{"distro":"python-agentcore-adot","recipe":"1","v":1}', '{"distro":"<AGENTCORE_DISTRO>","recipe":"1","v":1}']
          ODIGOS_AGENTCORE_PACKAGE: !If [OdigosADOT, '{"v":1,"language":"python","distros":["python-agentcore-adot"],"mode":"adopt"}', '{"v":1,"language":"python","distros":["<AGENTCORE_DISTRO>"]}']
          ODIGOS_AGENTCORE_ENABLED: !If [OdigosADOT, !Ref 'AWS::NoValue', 'true']
          ODIGOS_AGENTCORE_DISTRO: !If [OdigosADOT, !Ref 'AWS::NoValue', '<AGENTCORE_DISTRO>']
          # Direct code (route A ZIP) only: the script the start wrapper runs. Delete this line for a container image.
          ODIGOS_AGENTCORE_ENTRYPOINT: !If [OdigosADOT, !Ref 'AWS::NoValue', '<YOUR_ENTRY_POINT>']
          DISABLE_ADOT_OBSERVABILITY: 'true'
          AGENT_OBSERVABILITY_ENABLED: 'false'
          OTEL_SERVICE_NAME: '<AGENTCORE_SERVICE_NAME>'
          OTEL_SDK_DISABLED: 'false'
          OTEL_EXPORTER_OTLP_ENDPOINT: '<AGENTCORE_OTLP_ENDPOINT>'
          OTEL_EXPORTER_OTLP_PROTOCOL: 'http/protobuf'
          OTEL_TRACES_EXPORTER: '<AGENTCORE_TRACES_EXPORTER>'
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: '<AGENTCORE_OTLP_ENDPOINT>/v1/traces'
          OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: 'http/protobuf'
          OTEL_METRICS_EXPORTER: '<AGENTCORE_METRICS_EXPORTER>'
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: '<AGENTCORE_OTLP_ENDPOINT>/v1/metrics'
          OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: 'http/protobuf'
          OTEL_LOGS_EXPORTER: '<AGENTCORE_LOGS_EXPORTER>'
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: '<AGENTCORE_OTLP_ENDPOINT>/v1/logs'
          OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: 'http/protobuf'
          OTEL_PROPAGATORS: !If [OdigosADOT, 'tracecontext,baggage', 'tracecontext,baggage,xray']
          OTEL_TRACES_SAMPLER: 'parentbased_always_on'
          OTEL_AWS_APPLICATION_SIGNALS_ENABLED: 'false'
          OTEL_AWS_DYNAMIC_INSTRUMENTATION_ENABLED: 'false'
          OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
          TRACELOOP_TRACE_CONTENT: 'false'
          OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: 'true'
          OTEL_PYTHON_DISTRO: !If [OdigosADOT, 'aws_distro', '<AGENTCORE_PYTHON_DISTRO>']
          OTEL_PYTHON_CONFIGURATOR: !If [OdigosADOT, 'aws_configurator', '<AGENTCORE_PYTHON_CONFIGURATOR>']
          OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: !If [OdigosADOT, 'boto3', '<AGENTCORE_PYTHON_DISABLED_INSTRUMENTATIONS>']
          OTEL_EXPORTER_OTLP_HEADERS: '<OTLP_AUTH_HEADERS>'
          # Remove these keys if present: a signal-specific value replaces the shared headers above.
          # OTEL_EXPORTER_OTLP_TRACES_HEADERS, OTEL_EXPORTER_OTLP_METRICS_HEADERS, OTEL_EXPORTER_OTLP_LOGS_HEADERS

    - id: instrument-agentcore-terraform-python
      section: instrumentation:aws.bedrock-agentcore-runtime
      language: python
      variant: terraform
      variantLabel: Terraform
      title: Instrument a Python Bedrock AgentCore runtime (Terraform)
      description: Activate <AGENTCORE_DISTRO> on <AGENTCORE_RUNTIME_NAME> from the Odigos package (route A), or configure the ADOT the artifact already runs (route B), with the same recipes automatic mode applies.
      format: shell
      steps:
        - 'Prepare and upload the artifact for your route (see the prerequisites).'
        - 'Merge this fragment into your aws_bedrockagentcore_agent_runtime resource in its existing workspace; do not replace the rest of the resource. Set odigos_agentcore_route to odigos (route A) or adot (route B), and pass the destination authentication as a sensitive variable.'
        - 'Review `terraform plan`, then `terraform apply` (OpenTofu: `tofu plan` and `tofu apply`). Deploy, wait for the runtime and its DEFAULT endpoint to serve the new version, then invoke with a new session. Endpoints pinned to older versions keep them until you update them.'
      prerequisites:
        - 'Prepare the artifact before applying this (https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare), on one of two routes. Route A (recommended): add the Odigos package to the agent''s dependencies, pip install "odigos-agentcore[adot]" or "odigos-agentcore[openllmetry]" (the extra must match <AGENTCORE_DISTRO>), or copy the bundle from <AGENTCORE_AGENTS_IMAGE>; environment settings alone install nothing, and the bootstrap stays dormant until this environment enables it.'
        - 'Route B: the artifact carries ADOT only: pip install aws-opentelemetry-distro and start the agent through the opentelemetry-instrument launcher (the ZIP entry point or the image CMD). No Odigos package is needed, but ADOT cannot root an invocation at the agent, so AgentCore''s own service span stays missing from the trace; route A adds it. Only the ADOT distribution can be adopted.'
        - 'Only for the carrier image route (copying the bundle from <AGENTCORE_AGENTS_IMAGE>): make sure that registry.odigos.io is accessible to your image build or packaging step, or mirror the image into your own registry (https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare). The package routes need only your usual package registry (PyPI).'
        - 'Use a global OTLP/HTTP destination. Supply destination authentication through your deployment''s secret mechanism; Odigos never puts credentials in these instructions.'
      template: |-
        # Prepare the artifact first: https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare
        # Route A ZIP: entry point ["odigos_agentcore_start.py"] with ODIGOS_AGENTCORE_ENTRYPOINT=<YOUR_ENTRY_POINT>.
        # Route B: start through the launcher, entry point ["opentelemetry-instrument", "<YOUR_ENTRY_POINT>"] or the image CMD.
        #
        # Requires hashicorp/aws >= 6.17.0. Merge into your existing runtime and keep its other arguments;
        # var.existing_environment holds the runtime's other variables.
        variable "odigos_agentcore_route" {
          description = "odigos: the artifact carries the Odigos package or carrier bundle (route A). adot: it carries ADOT only (route B)."
          type        = string
          default     = "odigos"
          validation {
            condition     = contains(["odigos", "adot"], var.odigos_agentcore_route)
            error_message = "odigos_agentcore_route must be odigos or adot."
          }
        }

        locals {
          odigos_adot = var.odigos_agentcore_route == "adot"
        }

        resource "aws_bedrockagentcore_agent_runtime" "<YOUR_RUNTIME>" {
          # Direct code: point at the prepared ZIP and start through the wrapper (route A) or the launcher (route B).
          # Containers: agent_runtime_artifact { container_configuration { container_uri = "<PREPARED_IMAGE_URI>" } }
          agent_runtime_artifact {
            code_configuration {
              entry_point = local.odigos_adot ? ["opentelemetry-instrument", "<YOUR_ENTRY_POINT>"] : ["odigos_agentcore_start.py"]
              runtime     = "PYTHON_3_12"
              code {
                s3 {
                  bucket = "<PREPARED_ARTIFACT_BUCKET>"
                  prefix = "<PREPARED_ARTIFACT_KEY>"
                }
              }
            }
          }

          # The per-signal header keys are removed: a signal-specific value replaces the shared headers. ODIGOS_MANAGED
          # belongs to connector-managed runtimes and is never set by IaC. The bootstrap switches exist only on route A.
          environment_variables = merge(
            { for key, value in var.existing_environment : key => value if !contains(["ODIGOS_MANAGED", "ODIGOS_AGENTCORE_ENABLED", "ODIGOS_AGENTCORE_DISTRO", "ODIGOS_AGENTCORE_ENTRYPOINT", "OTEL_EXPORTER_OTLP_TRACES_HEADERS", "OTEL_EXPORTER_OTLP_METRICS_HEADERS", "OTEL_EXPORTER_OTLP_LOGS_HEADERS"], key) },

            {
              ODIGOS_IAC                                         = local.odigos_adot ? "{\"distro\":\"python-agentcore-adot\",\"recipe\":\"1\",\"v\":1}" : "{\"distro\":\"<AGENTCORE_DISTRO>\",\"recipe\":\"1\",\"v\":1}"
              ODIGOS_AGENTCORE_PACKAGE                           = local.odigos_adot ? "{\"v\":1,\"language\":\"python\",\"distros\":[\"python-agentcore-adot\"],\"mode\":\"adopt\"}" : "{\"v\":1,\"language\":\"python\",\"distros\":[\"<AGENTCORE_DISTRO>\"]}"
              DISABLE_ADOT_OBSERVABILITY                         = "true"
              AGENT_OBSERVABILITY_ENABLED                        = "false"
              OTEL_SERVICE_NAME                                  = "<AGENTCORE_SERVICE_NAME>"
              OTEL_SDK_DISABLED                                  = "false"
              OTEL_EXPORTER_OTLP_ENDPOINT                        = "<AGENTCORE_OTLP_ENDPOINT>"
              OTEL_EXPORTER_OTLP_PROTOCOL                        = "http/protobuf"
              OTEL_TRACES_EXPORTER                               = "<AGENTCORE_TRACES_EXPORTER>"
              OTEL_EXPORTER_OTLP_TRACES_ENDPOINT                 = "<AGENTCORE_OTLP_ENDPOINT>/v1/traces"
              OTEL_EXPORTER_OTLP_TRACES_PROTOCOL                 = "http/protobuf"
              OTEL_METRICS_EXPORTER                              = "<AGENTCORE_METRICS_EXPORTER>"
              OTEL_EXPORTER_OTLP_METRICS_ENDPOINT                = "<AGENTCORE_OTLP_ENDPOINT>/v1/metrics"
              OTEL_EXPORTER_OTLP_METRICS_PROTOCOL                = "http/protobuf"
              OTEL_LOGS_EXPORTER                                 = "<AGENTCORE_LOGS_EXPORTER>"
              OTEL_EXPORTER_OTLP_LOGS_ENDPOINT                   = "<AGENTCORE_OTLP_ENDPOINT>/v1/logs"
              OTEL_EXPORTER_OTLP_LOGS_PROTOCOL                   = "http/protobuf"
              OTEL_PROPAGATORS                                   = local.odigos_adot ? "tracecontext,baggage" : "tracecontext,baggage,xray"
              OTEL_TRACES_SAMPLER                                = "parentbased_always_on"
              OTEL_AWS_APPLICATION_SIGNALS_ENABLED               = "false"
              OTEL_AWS_DYNAMIC_INSTRUMENTATION_ENABLED           = "false"
              OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT = "false"
              TRACELOOP_TRACE_CONTENT                            = "false"
              OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED   = "true"
              OTEL_PYTHON_DISTRO                                 = local.odigos_adot ? "aws_distro" : "<AGENTCORE_PYTHON_DISTRO>"
              OTEL_PYTHON_CONFIGURATOR                           = local.odigos_adot ? "aws_configurator" : "<AGENTCORE_PYTHON_CONFIGURATOR>"
              OTEL_PYTHON_DISABLED_INSTRUMENTATIONS              = local.odigos_adot ? "boto3" : "<AGENTCORE_PYTHON_DISABLED_INSTRUMENTATIONS>"
              OTEL_EXPORTER_OTLP_HEADERS                         = var.otlp_auth_headers # sensitive; "<OTLP_AUTH_HEADERS>", or "" when the destination needs no authentication
            },

            # Route A only: the switches that start the Odigos bootstrap.
            { for key, value in {
              ODIGOS_AGENTCORE_ENABLED = "true"
              ODIGOS_AGENTCORE_DISTRO  = "<AGENTCORE_DISTRO>"
              # Direct code only: the script the start wrapper runs. Delete this line for a container image.
              ODIGOS_AGENTCORE_ENTRYPOINT = "<YOUR_ENTRY_POINT>"
            } : key => value if !local.odigos_adot },
          )
        }

    - id: instrument-agentcore-aws-cli-nodejs
      section: instrumentation:aws.bedrock-agentcore-runtime
      language: nodejs
      variant: aws-cli
      variantLabel: AWS CLI
      title: Instrument a Node.js Bedrock AgentCore runtime (AWS CLI)
      description: Activate <AGENTCORE_DISTRO> on <AGENTCORE_RUNTIME_NAME> from the Odigos package (route A), or configure the ADOT the artifact already runs (route B), with the same recipes automatic mode applies.
      format: shell
      steps:
        - 'Prepare and upload the artifact for your route (see the prerequisites). Set ROUTE=adot when it carries ADOT only (route B), and ARTIFACT_JSON if this update should switch to the new artifact. For a ZIP on route A, set ENTRY_SCRIPT=<YOUR_ENTRY_POINT> and point ARTIFACT_JSON at the start wrapper alone.'
        - 'Replace every <ANGLE_BRACKETED> value, then run the script with credentials that can read and update the runtime.'
        - 'Deploy, wait for the runtime and its DEFAULT endpoint to serve the new version, then invoke with a new session. Endpoints pinned to older versions keep them until you update them.'
      prerequisites:
        - 'Prepare the artifact before applying this (https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare), on one of two routes. Route A (recommended): add the Odigos package to the agent''s dependencies, npm install @odigos/agentcore, or copy the bundle from <AGENTCORE_AGENTS_IMAGE>; environment settings alone install nothing, and the bootstrap stays dormant until this environment enables it.'
        - 'Route B: the artifact carries ADOT only: npm install @aws/aws-distro-opentelemetry-node-autoinstrumentation and append --require @aws/aws-distro-opentelemetry-node-autoinstrumentation/register to NODE_OPTIONS. No Odigos package is needed, but ADOT cannot root an invocation at the agent, so AgentCore''s own service span stays missing from the trace; route A adds it. Only the ADOT distribution can be adopted.'
        - 'Only for the carrier image route (copying the bundle from <AGENTCORE_AGENTS_IMAGE>): make sure that registry.odigos.io is accessible to your image build or packaging step, or mirror the image into your own registry (https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare). The package routes need only your usual package registry (npm).'
        - 'Use a global OTLP/HTTP destination. Supply destination authentication through your deployment''s secret mechanism; Odigos never puts credentials in these instructions.'
      template: |-
        # Prepare the artifact first: https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare
        # Route A ZIP: the start wrapper alone (node_modules/@odigos/agentcore/odigos_agentcore_start.js, or odigos_agentcore_start.js from the carrier bundle) with ODIGOS_AGENTCORE_ENTRYPOINT=<YOUR_ENTRY_POINT>.
        # Route B: the ADOT register hook in NODE_OPTIONS starts the SDK.
        #
        # Requires AWS CLI v2 and jq. Reads the runtime's current configuration and changes only what is listed here.
        RUNTIME_ID='<AGENTCORE_RUNTIME_ID>'
        # odigos: the artifact carries the Odigos package or carrier bundle (route A).
        # adot:   the artifact carries ADOT only (route B).
        ROUTE="${ROUTE:-odigos}"
        # To switch to the prepared artifact in the same update, set ARTIFACT_JSON. Direct code, route A:
        #   ARTIFACT_JSON='{"codeConfiguration":{"code":{"s3":{"bucket":"<PREPARED_ARTIFACT_BUCKET>","prefix":"<PREPARED_ARTIFACT_KEY>"}},"runtime":"NODE_22","entryPoint":["odigos_agentcore_start.js"]}}'
        # Direct code, route B:
        #   ARTIFACT_JSON='{"codeConfiguration":{"code":{"s3":{"bucket":"<PREPARED_ARTIFACT_BUCKET>","prefix":"<PREPARED_ARTIFACT_KEY>"}},"runtime":"NODE_22","entryPoint":["<YOUR_ENTRY_POINT>"]}}'
        # Container (either route):
        #   ARTIFACT_JSON='{"containerConfiguration":{"containerUri":"<PREPARED_IMAGE_URI>"}}'
        ARTIFACT_JSON="${ARTIFACT_JSON:-null}"
        # Direct code, route A: your entry point script, which the start wrapper reads from ODIGOS_AGENTCORE_ENTRYPOINT.
        ENTRY_SCRIPT="${ENTRY_SCRIPT:-}"

        aws bedrock-agentcore-control get-agent-runtime --agent-runtime-id "$RUNTIME_ID" > current.json

        if [ "$ROUTE" = adot ]; then
          # Route B: the ADOT recipe. No bootstrap switches, and no X-Ray propagator.
          jq -n \
            --arg ODIGOS_IAC '{"distro":"nodejs-agentcore-adot","recipe":"1","v":1}' \
            --arg ODIGOS_AGENTCORE_PACKAGE '{"v":1,"language":"nodejs","distros":["nodejs-agentcore-adot"],"moduleFormat":"commonjs","mode":"adopt"}' \
            '{
              ODIGOS_IAC: $ODIGOS_IAC,
              ODIGOS_AGENTCORE_PACKAGE: $ODIGOS_AGENTCORE_PACKAGE,
              DISABLE_ADOT_OBSERVABILITY: "true",
              AGENT_OBSERVABILITY_ENABLED: "false",
              OTEL_SERVICE_NAME: "<AGENTCORE_SERVICE_NAME>",
              OTEL_SDK_DISABLED: "false",
              OTEL_EXPORTER_OTLP_ENDPOINT: "<AGENTCORE_OTLP_ENDPOINT>",
              OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf",
              OTEL_TRACES_EXPORTER: "<AGENTCORE_TRACES_EXPORTER>",
              OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "<AGENTCORE_OTLP_ENDPOINT>/v1/traces",
              OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "http/protobuf",
              OTEL_METRICS_EXPORTER: "<AGENTCORE_METRICS_EXPORTER>",
              OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "<AGENTCORE_OTLP_ENDPOINT>/v1/metrics",
              OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: "http/protobuf",
              OTEL_LOGS_EXPORTER: "<AGENTCORE_LOGS_EXPORTER>",
              OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "<AGENTCORE_OTLP_ENDPOINT>/v1/logs",
              OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: "http/protobuf",
              OTEL_PROPAGATORS: "tracecontext,baggage",
              OTEL_TRACES_SAMPLER: "parentbased_always_on",
              OTEL_AWS_APPLICATION_SIGNALS_ENABLED: "false",
              OTEL_AWS_DYNAMIC_INSTRUMENTATION_ENABLED: "false",
              OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false",
              TRACELOOP_TRACE_CONTENT: "false",
              OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true",
              OTEL_EXPORTER_OTLP_HEADERS: "<OTLP_AUTH_HEADERS>"
            }' > odigos-env.json
        else
          # Route A: the Odigos package recipe.
          jq -n \
            --arg ODIGOS_IAC '{"distro":"<AGENTCORE_DISTRO>","recipe":"1","v":1}' \
            --arg ODIGOS_AGENTCORE_PACKAGE '{"v":1,"language":"nodejs","distros":["<AGENTCORE_DISTRO>"],"moduleFormat":"commonjs"}' \
            '{
              ODIGOS_IAC: $ODIGOS_IAC,
              ODIGOS_AGENTCORE_PACKAGE: $ODIGOS_AGENTCORE_PACKAGE,
              ODIGOS_AGENTCORE_ENABLED: "true",
              ODIGOS_AGENTCORE_DISTRO: "<AGENTCORE_DISTRO>",
              DISABLE_ADOT_OBSERVABILITY: "true",
              AGENT_OBSERVABILITY_ENABLED: "false",
              OTEL_SERVICE_NAME: "<AGENTCORE_SERVICE_NAME>",
              OTEL_SDK_DISABLED: "false",
              OTEL_EXPORTER_OTLP_ENDPOINT: "<AGENTCORE_OTLP_ENDPOINT>",
              OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf",
              OTEL_TRACES_EXPORTER: "<AGENTCORE_TRACES_EXPORTER>",
              OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "<AGENTCORE_OTLP_ENDPOINT>/v1/traces",
              OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "http/protobuf",
              OTEL_METRICS_EXPORTER: "<AGENTCORE_METRICS_EXPORTER>",
              OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "<AGENTCORE_OTLP_ENDPOINT>/v1/metrics",
              OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: "http/protobuf",
              OTEL_LOGS_EXPORTER: "<AGENTCORE_LOGS_EXPORTER>",
              OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "<AGENTCORE_OTLP_ENDPOINT>/v1/logs",
              OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: "http/protobuf",
              OTEL_PROPAGATORS: "tracecontext,baggage,xray",
              OTEL_TRACES_SAMPLER: "parentbased_always_on",
              OTEL_AWS_APPLICATION_SIGNALS_ENABLED: "false",
              OTEL_AWS_DYNAMIC_INSTRUMENTATION_ENABLED: "false",
              OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false",
              TRACELOOP_TRACE_CONTENT: "false",
              OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true",
              OTEL_EXPORTER_OTLP_HEADERS: "<OTLP_AUTH_HEADERS>"
            }' > odigos-env.json
        fi

        # Removes the per-signal headers and the bootstrap switches; route A sets the switches again, route B appends the ADOT hook to NODE_OPTIONS.
        jq --slurpfile odigos odigos-env.json --argjson artifact "$ARTIFACT_JSON" --arg route "$ROUTE" --arg entry "$ENTRY_SCRIPT" --arg hook '--require @aws/aws-distro-opentelemetry-node-autoinstrumentation/register' '
          {agentRuntimeId, agentRuntimeArtifact: ($artifact // .agentRuntimeArtifact), roleArn, networkConfiguration,
           description, authorizerConfiguration, requestHeaderConfiguration, protocolConfiguration,
           lifecycleConfiguration, filesystemConfigurations, metadataConfiguration,
           environmentVariables: ((.environmentVariables // {})
             | del(.OTEL_EXPORTER_OTLP_TRACES_HEADERS, .OTEL_EXPORTER_OTLP_METRICS_HEADERS, .OTEL_EXPORTER_OTLP_LOGS_HEADERS)
             | del(.ODIGOS_MANAGED, .ODIGOS_AGENTCORE_ENABLED, .ODIGOS_AGENTCORE_DISTRO, .ODIGOS_AGENTCORE_ENTRYPOINT)
             | if $route == "adot" and ((.NODE_OPTIONS // "") | contains($hook) | not)
               then .NODE_OPTIONS = ([.NODE_OPTIONS // empty, $hook] | join(" ") | ltrimstr(" ")) else . end
             + $odigos[0]
             + (if $route == "odigos" and $entry != "" then {ODIGOS_AGENTCORE_ENTRYPOINT: $entry} else {} end))}
          | with_entries(select(.value != null))' current.json > update.json

        aws bedrock-agentcore-control update-agent-runtime --cli-input-json file://update.json

    - id: instrument-agentcore-cdk-nodejs
      section: instrumentation:aws.bedrock-agentcore-runtime
      language: nodejs
      variant: cdk
      variantLabel: AWS CDK
      title: Instrument a Node.js Bedrock AgentCore runtime (AWS CDK)
      description: Activate <AGENTCORE_DISTRO> on <AGENTCORE_RUNTIME_NAME> from the Odigos package (route A), or configure the ADOT the artifact already runs (route B), with the same recipes automatic mode applies.
      format: text
      steps:
        - 'From the CDK project, run `npm install @odigos/aws-cdk@<PACKAGE_VERSION>`. Paste only the TypeScript into your stack.'
        - 'Point the runtime''s artifact at the prepared image or ZIP (see the prerequisites); the construct writes only the environment. For an artifact carrying ADOT only (route B), set `sdk: OdigosAgentCoreSdk.ADOT`.'
        - '`cdk diff`, then `cdk deploy`. Deploy, wait for the runtime and its DEFAULT endpoint to serve the new version, then invoke with a new session. Endpoints pinned to older versions keep them until you update them.'
      prerequisites:
        - 'Prepare the artifact before applying this (https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare), on one of two routes. Route A (recommended): add the Odigos package to the agent''s dependencies, npm install @odigos/agentcore, or copy the bundle from <AGENTCORE_AGENTS_IMAGE>; environment settings alone install nothing, and the bootstrap stays dormant until this environment enables it.'
        - 'Route B: the artifact carries ADOT only: npm install @aws/aws-distro-opentelemetry-node-autoinstrumentation and append --require @aws/aws-distro-opentelemetry-node-autoinstrumentation/register to NODE_OPTIONS. No Odigos package is needed, but ADOT cannot root an invocation at the agent, so AgentCore''s own service span stays missing from the trace; route A adds it. Only the ADOT distribution can be adopted.'
        - 'Only for the carrier image route (copying the bundle from <AGENTCORE_AGENTS_IMAGE>): make sure that registry.odigos.io is accessible to your image build or packaging step, or mirror the image into your own registry (https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare). The package routes need only your usual package registry (npm).'
        - 'Use a global OTLP/HTTP destination. Supply destination authentication through your deployment''s secret mechanism; Odigos never puts credentials in these instructions.'
      template: |-
        import { OdigosAgentCoreDistribution, OdigosAgentCoreInstrumentation, OdigosAgentCoreLanguage, OdigosAgentCoreSdk } from '@odigos/aws-cdk';

        new OdigosAgentCoreInstrumentation(this, 'Odigos', {
          destination: {
            httpEndpoint: '<AGENTCORE_OTLP_ENDPOINT>',
            traces: <AGENTCORE_TRACES_ENABLED>,
            metrics: <AGENTCORE_METRICS_ENABLED>,
            logs: <AGENTCORE_LOGS_ENABLED>,
            // headers: { Authorization: authorization }, // destination authentication, from your secret mechanism
          },
          targets: [{
            runtime: agentRuntime, // CfnRuntime, Runtime, or a CfnInclude resource of type AWS::BedrockAgentCore::Runtime
            language: OdigosAgentCoreLanguage.NODEJS,
            distribution: OdigosAgentCoreDistribution.<AGENTCORE_CDK_DISTRIBUTION>,
            // ODIGOS: the artifact carries the Odigos package or carrier bundle (route A).
            // ADOT: the artifact carries ADOT only (route B); the distribution must then be ADOT.
            sdk: OdigosAgentCoreSdk.ODIGOS,
            // entryPointScript: '<YOUR_ENTRY_POINT>',   // direct-code ZIP on route A: the wrapper is the EntryPoint alone
            serviceName: '<AGENTCORE_SERVICE_NAME>',
          }],
        });

        // Prepare the artifact first: https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare
        // Route A ZIP: the start wrapper alone (node_modules/@odigos/agentcore/odigos_agentcore_start.js, or odigos_agentcore_start.js from the carrier bundle) with ODIGOS_AGENTCORE_ENTRYPOINT=<YOUR_ENTRY_POINT>.
        // Route B: the ADOT register hook in NODE_OPTIONS starts the SDK.

        // What the construct writes to EnvironmentVariables with sdk ODIGOS (route A):
        //   ODIGOS_IAC={"distro":"<AGENTCORE_DISTRO>","recipe":"1","v":1}
        //   ODIGOS_AGENTCORE_PACKAGE={"v":1,"language":"nodejs","distros":["<AGENTCORE_DISTRO>"],"moduleFormat":"commonjs"}
        //   ODIGOS_AGENTCORE_ENABLED=true
        //   ODIGOS_AGENTCORE_DISTRO=<AGENTCORE_DISTRO>
        //   ODIGOS_AGENTCORE_ENTRYPOINT=<YOUR_ENTRY_POINT>  (route A direct-code ZIP only, from entryPointScript; the runtime's EntryPoint is the wrapper alone)
        //   DISABLE_ADOT_OBSERVABILITY=true
        //   AGENT_OBSERVABILITY_ENABLED=false
        //   OTEL_SERVICE_NAME=<AGENTCORE_SERVICE_NAME>
        //   OTEL_SDK_DISABLED=false
        //   OTEL_EXPORTER_OTLP_ENDPOINT=<AGENTCORE_OTLP_ENDPOINT>
        //   OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
        //   OTEL_TRACES_EXPORTER=<AGENTCORE_TRACES_EXPORTER>
        //   OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=<AGENTCORE_OTLP_ENDPOINT>/v1/traces
        //   OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=http/protobuf
        //   OTEL_METRICS_EXPORTER=<AGENTCORE_METRICS_EXPORTER>
        //   OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=<AGENTCORE_OTLP_ENDPOINT>/v1/metrics
        //   OTEL_EXPORTER_OTLP_METRICS_PROTOCOL=http/protobuf
        //   OTEL_LOGS_EXPORTER=<AGENTCORE_LOGS_EXPORTER>
        //   OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=<AGENTCORE_OTLP_ENDPOINT>/v1/logs
        //   OTEL_EXPORTER_OTLP_LOGS_PROTOCOL=http/protobuf
        //   OTEL_PROPAGATORS=tracecontext,baggage,xray
        //   OTEL_TRACES_SAMPLER=parentbased_always_on
        //   OTEL_AWS_APPLICATION_SIGNALS_ENABLED=false
        //   OTEL_AWS_DYNAMIC_INSTRUMENTATION_ENABLED=false
        //   OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=false
        //   TRACELOOP_TRACE_CONTENT=false
        //   OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=true
        //   OTEL_EXPORTER_OTLP_HEADERS=<OTLP_AUTH_HEADERS>  (encoded from destination.headers; removed when there are none)
        //
        // With sdk ADOT (route B) it writes the same, except:
        //   ODIGOS_IAC={"distro":"nodejs-agentcore-adot","recipe":"1","v":1}
        //   ODIGOS_AGENTCORE_PACKAGE={"v":1,"language":"nodejs","distros":["nodejs-agentcore-adot"],"moduleFormat":"commonjs","mode":"adopt"}
        //   OTEL_PROPAGATORS=tracecontext,baggage
        // and it removes ODIGOS_AGENTCORE_ENABLED and ODIGOS_AGENTCORE_DISTRO instead of setting them (entryPointScript throws at synth).
        //
        // Either way it removes, if present: ODIGOS_MANAGED, OTEL_EXPORTER_OTLP_TRACES_HEADERS, OTEL_EXPORTER_OTLP_METRICS_HEADERS, OTEL_EXPORTER_OTLP_LOGS_HEADERS

    - id: instrument-agentcore-cloudformation-nodejs
      section: instrumentation:aws.bedrock-agentcore-runtime
      language: nodejs
      variant: cloudformation
      variantLabel: CloudFormation
      title: Instrument a Node.js Bedrock AgentCore runtime (CloudFormation)
      description: Activate <AGENTCORE_DISTRO> on <AGENTCORE_RUNTIME_NAME> from the Odigos package (route A), or configure the ADOT the artifact already runs (route B), with the same recipes automatic mode applies.
      format: yaml
      steps:
        - 'Prepare and upload the artifact for your route (see the prerequisites).'
        - 'Add the OdigosAgentCoreRoute parameter and the OdigosADOT condition to the template, and merge this fragment into your AWS::BedrockAgentCore::Runtime. Keep the runtime''s other properties and environment variables, and remove the listed header keys.'
        - 'Replace every <ANGLE_BRACKETED> value and update the stack with OdigosAgentCoreRoute=odigos (route A) or adot (route B). Deploy, wait for the runtime and its DEFAULT endpoint to serve the new version, then invoke with a new session. Endpoints pinned to older versions keep them until you update them.'
      prerequisites:
        - 'Prepare the artifact before applying this (https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare), on one of two routes. Route A (recommended): add the Odigos package to the agent''s dependencies, npm install @odigos/agentcore, or copy the bundle from <AGENTCORE_AGENTS_IMAGE>; environment settings alone install nothing, and the bootstrap stays dormant until this environment enables it.'
        - 'Route B: the artifact carries ADOT only: npm install @aws/aws-distro-opentelemetry-node-autoinstrumentation and append --require @aws/aws-distro-opentelemetry-node-autoinstrumentation/register to NODE_OPTIONS. No Odigos package is needed, but ADOT cannot root an invocation at the agent, so AgentCore''s own service span stays missing from the trace; route A adds it. Only the ADOT distribution can be adopted.'
        - 'Only for the carrier image route (copying the bundle from <AGENTCORE_AGENTS_IMAGE>): make sure that registry.odigos.io is accessible to your image build or packaging step, or mirror the image into your own registry (https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare). The package routes need only your usual package registry (npm).'
        - 'Use a global OTLP/HTTP destination. Supply destination authentication through your deployment''s secret mechanism; Odigos never puts credentials in these instructions.'
      template: |-
        # Prepare the artifact first: https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare
        # Route A ZIP: the start wrapper alone (node_modules/@odigos/agentcore/odigos_agentcore_start.js, or odigos_agentcore_start.js from the carrier bundle) with ODIGOS_AGENTCORE_ENTRYPOINT=<YOUR_ENTRY_POINT>.
        # Route B: the ADOT register hook in NODE_OPTIONS starts the SDK.
        #
        # Add to the template's top level: the route parameter and its condition.
        #   Parameters:
        #     OdigosAgentCoreRoute:
        #       Type: String
        #       AllowedValues: [odigos, adot]   # odigos: route A (Odigos package); adot: route B (ADOT only)
        #       Default: odigos
        #   Conditions:
        #     OdigosADOT: !Equals [!Ref OdigosAgentCoreRoute, adot]
        #
        # Merge into Resources.<YOUR_RUNTIME>.Properties of your AWS::BedrockAgentCore::Runtime and keep its other
        # settings and EnvironmentVariables. Never set ODIGOS_MANAGED here: that marker belongs to the connector.
        AgentRuntimeArtifact:
          # Direct code: point at the prepared ZIP and start through the wrapper (route A) or the launcher (route B).
          # Containers: ContainerUri: <PREPARED_IMAGE_URI>
          CodeConfiguration:
            Code:
              S3:
                Bucket: <PREPARED_ARTIFACT_BUCKET>
                Prefix: <PREPARED_ARTIFACT_KEY>
            Runtime: NODE_22
            EntryPoint: !If [OdigosADOT, [<YOUR_ENTRY_POINT>], [odigos_agentcore_start.js]]
        EnvironmentVariables:
          # Values that differ by route are !If [OdigosADOT, <route B>, <route A>]; AWS::NoValue removes the key.
          ODIGOS_IAC: !If [OdigosADOT, '{"distro":"nodejs-agentcore-adot","recipe":"1","v":1}', '{"distro":"<AGENTCORE_DISTRO>","recipe":"1","v":1}']
          ODIGOS_AGENTCORE_PACKAGE: !If [OdigosADOT, '{"v":1,"language":"nodejs","distros":["nodejs-agentcore-adot"],"moduleFormat":"commonjs","mode":"adopt"}', '{"v":1,"language":"nodejs","distros":["<AGENTCORE_DISTRO>"],"moduleFormat":"commonjs"}']
          ODIGOS_AGENTCORE_ENABLED: !If [OdigosADOT, !Ref 'AWS::NoValue', 'true']
          ODIGOS_AGENTCORE_DISTRO: !If [OdigosADOT, !Ref 'AWS::NoValue', '<AGENTCORE_DISTRO>']
          # Direct code (route A ZIP) only: the script the start wrapper runs. Delete this line for a container image.
          ODIGOS_AGENTCORE_ENTRYPOINT: !If [OdigosADOT, !Ref 'AWS::NoValue', '<YOUR_ENTRY_POINT>']
          DISABLE_ADOT_OBSERVABILITY: 'true'
          AGENT_OBSERVABILITY_ENABLED: 'false'
          OTEL_SERVICE_NAME: '<AGENTCORE_SERVICE_NAME>'
          OTEL_SDK_DISABLED: 'false'
          OTEL_EXPORTER_OTLP_ENDPOINT: '<AGENTCORE_OTLP_ENDPOINT>'
          OTEL_EXPORTER_OTLP_PROTOCOL: 'http/protobuf'
          OTEL_TRACES_EXPORTER: '<AGENTCORE_TRACES_EXPORTER>'
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: '<AGENTCORE_OTLP_ENDPOINT>/v1/traces'
          OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: 'http/protobuf'
          OTEL_METRICS_EXPORTER: '<AGENTCORE_METRICS_EXPORTER>'
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: '<AGENTCORE_OTLP_ENDPOINT>/v1/metrics'
          OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: 'http/protobuf'
          OTEL_LOGS_EXPORTER: '<AGENTCORE_LOGS_EXPORTER>'
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: '<AGENTCORE_OTLP_ENDPOINT>/v1/logs'
          OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: 'http/protobuf'
          OTEL_PROPAGATORS: !If [OdigosADOT, 'tracecontext,baggage', 'tracecontext,baggage,xray']
          OTEL_TRACES_SAMPLER: 'parentbased_always_on'
          OTEL_AWS_APPLICATION_SIGNALS_ENABLED: 'false'
          OTEL_AWS_DYNAMIC_INSTRUMENTATION_ENABLED: 'false'
          OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
          TRACELOOP_TRACE_CONTENT: 'false'
          OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: 'true'
          OTEL_EXPORTER_OTLP_HEADERS: '<OTLP_AUTH_HEADERS>'
          # Route B loads ADOT through NODE_OPTIONS. If the runtime already sets NODE_OPTIONS, keep that key instead and
          # append the hook to its value on route B.
          NODE_OPTIONS: !If [OdigosADOT, '--require @aws/aws-distro-opentelemetry-node-autoinstrumentation/register', !Ref 'AWS::NoValue']
          # Remove these keys if present: a signal-specific value replaces the shared headers above.
          # OTEL_EXPORTER_OTLP_TRACES_HEADERS, OTEL_EXPORTER_OTLP_METRICS_HEADERS, OTEL_EXPORTER_OTLP_LOGS_HEADERS

    - id: instrument-agentcore-terraform-nodejs
      section: instrumentation:aws.bedrock-agentcore-runtime
      language: nodejs
      variant: terraform
      variantLabel: Terraform
      title: Instrument a Node.js Bedrock AgentCore runtime (Terraform)
      description: Activate <AGENTCORE_DISTRO> on <AGENTCORE_RUNTIME_NAME> from the Odigos package (route A), or configure the ADOT the artifact already runs (route B), with the same recipes automatic mode applies.
      format: shell
      steps:
        - 'Prepare and upload the artifact for your route (see the prerequisites).'
        - 'Merge this fragment into your aws_bedrockagentcore_agent_runtime resource in its existing workspace; do not replace the rest of the resource. Set odigos_agentcore_route to odigos (route A) or adot (route B), and pass the destination authentication as a sensitive variable.'
        - 'Review `terraform plan`, then `terraform apply` (OpenTofu: `tofu plan` and `tofu apply`). Deploy, wait for the runtime and its DEFAULT endpoint to serve the new version, then invoke with a new session. Endpoints pinned to older versions keep them until you update them.'
      prerequisites:
        - 'Prepare the artifact before applying this (https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare), on one of two routes. Route A (recommended): add the Odigos package to the agent''s dependencies, npm install @odigos/agentcore, or copy the bundle from <AGENTCORE_AGENTS_IMAGE>; environment settings alone install nothing, and the bootstrap stays dormant until this environment enables it.'
        - 'Route B: the artifact carries ADOT only: npm install @aws/aws-distro-opentelemetry-node-autoinstrumentation and append --require @aws/aws-distro-opentelemetry-node-autoinstrumentation/register to NODE_OPTIONS. No Odigos package is needed, but ADOT cannot root an invocation at the agent, so AgentCore''s own service span stays missing from the trace; route A adds it. Only the ADOT distribution can be adopted.'
        - 'Only for the carrier image route (copying the bundle from <AGENTCORE_AGENTS_IMAGE>): make sure that registry.odigos.io is accessible to your image build or packaging step, or mirror the image into your own registry (https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare). The package routes need only your usual package registry (npm).'
        - 'Use a global OTLP/HTTP destination. Supply destination authentication through your deployment''s secret mechanism; Odigos never puts credentials in these instructions.'
      template: |-
        # Prepare the artifact first: https://docs.odigos.io/cloud-connectors/aws/workloads/agentcore/prepare
        # Route A ZIP: the start wrapper alone (node_modules/@odigos/agentcore/odigos_agentcore_start.js, or odigos_agentcore_start.js from the carrier bundle) with ODIGOS_AGENTCORE_ENTRYPOINT=<YOUR_ENTRY_POINT>.
        # Route B: the ADOT register hook in NODE_OPTIONS starts the SDK.
        #
        # Requires hashicorp/aws >= 6.17.0. Merge into your existing runtime and keep its other arguments;
        # var.existing_environment holds the runtime's other variables.
        variable "odigos_agentcore_route" {
          description = "odigos: the artifact carries the Odigos package or carrier bundle (route A). adot: it carries ADOT only (route B)."
          type        = string
          default     = "odigos"
          validation {
            condition     = contains(["odigos", "adot"], var.odigos_agentcore_route)
            error_message = "odigos_agentcore_route must be odigos or adot."
          }
        }

        locals {
          odigos_adot = var.odigos_agentcore_route == "adot"
        }

        resource "aws_bedrockagentcore_agent_runtime" "<YOUR_RUNTIME>" {
          # Direct code: point at the prepared ZIP and start through the wrapper (route A) or the launcher (route B).
          # Containers: agent_runtime_artifact { container_configuration { container_uri = "<PREPARED_IMAGE_URI>" } }
          agent_runtime_artifact {
            code_configuration {
              entry_point = local.odigos_adot ? ["<YOUR_ENTRY_POINT>"] : ["odigos_agentcore_start.js"]
              runtime     = "NODE_22"
              code {
                s3 {
                  bucket = "<PREPARED_ARTIFACT_BUCKET>"
                  prefix = "<PREPARED_ARTIFACT_KEY>"
                }
              }
            }
          }

          # The per-signal header keys are removed: a signal-specific value replaces the shared headers. ODIGOS_MANAGED
          # belongs to connector-managed runtimes and is never set by IaC. The bootstrap switches exist only on route A.
          environment_variables = merge(
            { for key, value in var.existing_environment : key => value if !contains(["ODIGOS_MANAGED", "ODIGOS_AGENTCORE_ENABLED", "ODIGOS_AGENTCORE_DISTRO", "ODIGOS_AGENTCORE_ENTRYPOINT", "OTEL_EXPORTER_OTLP_TRACES_HEADERS", "OTEL_EXPORTER_OTLP_METRICS_HEADERS", "OTEL_EXPORTER_OTLP_LOGS_HEADERS"], key) },

            {
              ODIGOS_IAC                                         = local.odigos_adot ? "{\"distro\":\"nodejs-agentcore-adot\",\"recipe\":\"1\",\"v\":1}" : "{\"distro\":\"<AGENTCORE_DISTRO>\",\"recipe\":\"1\",\"v\":1}"
              ODIGOS_AGENTCORE_PACKAGE                           = local.odigos_adot ? "{\"v\":1,\"language\":\"nodejs\",\"distros\":[\"nodejs-agentcore-adot\"],\"moduleFormat\":\"commonjs\",\"mode\":\"adopt\"}" : "{\"v\":1,\"language\":\"nodejs\",\"distros\":[\"<AGENTCORE_DISTRO>\"],\"moduleFormat\":\"commonjs\"}"
              DISABLE_ADOT_OBSERVABILITY                         = "true"
              AGENT_OBSERVABILITY_ENABLED                        = "false"
              OTEL_SERVICE_NAME                                  = "<AGENTCORE_SERVICE_NAME>"
              OTEL_SDK_DISABLED                                  = "false"
              OTEL_EXPORTER_OTLP_ENDPOINT                        = "<AGENTCORE_OTLP_ENDPOINT>"
              OTEL_EXPORTER_OTLP_PROTOCOL                        = "http/protobuf"
              OTEL_TRACES_EXPORTER                               = "<AGENTCORE_TRACES_EXPORTER>"
              OTEL_EXPORTER_OTLP_TRACES_ENDPOINT                 = "<AGENTCORE_OTLP_ENDPOINT>/v1/traces"
              OTEL_EXPORTER_OTLP_TRACES_PROTOCOL                 = "http/protobuf"
              OTEL_METRICS_EXPORTER                              = "<AGENTCORE_METRICS_EXPORTER>"
              OTEL_EXPORTER_OTLP_METRICS_ENDPOINT                = "<AGENTCORE_OTLP_ENDPOINT>/v1/metrics"
              OTEL_EXPORTER_OTLP_METRICS_PROTOCOL                = "http/protobuf"
              OTEL_LOGS_EXPORTER                                 = "<AGENTCORE_LOGS_EXPORTER>"
              OTEL_EXPORTER_OTLP_LOGS_ENDPOINT                   = "<AGENTCORE_OTLP_ENDPOINT>/v1/logs"
              OTEL_EXPORTER_OTLP_LOGS_PROTOCOL                   = "http/protobuf"
              OTEL_PROPAGATORS                                   = local.odigos_adot ? "tracecontext,baggage" : "tracecontext,baggage,xray"
              OTEL_TRACES_SAMPLER                                = "parentbased_always_on"
              OTEL_AWS_APPLICATION_SIGNALS_ENABLED               = "false"
              OTEL_AWS_DYNAMIC_INSTRUMENTATION_ENABLED           = "false"
              OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT = "false"
              TRACELOOP_TRACE_CONTENT                            = "false"
              OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED   = "true"
              OTEL_EXPORTER_OTLP_HEADERS                         = var.otlp_auth_headers # sensitive; "<OTLP_AUTH_HEADERS>", or "" when the destination needs no authentication
            },

            # Route A only: the switches that start the Odigos bootstrap.
            { for key, value in {
              ODIGOS_AGENTCORE_ENABLED = "true"
              ODIGOS_AGENTCORE_DISTRO  = "<AGENTCORE_DISTRO>"
              # Direct code only: the script the start wrapper runs. Delete this line for a container image.
              ODIGOS_AGENTCORE_ENTRYPOINT = "<YOUR_ENTRY_POINT>"
            } : key => value if !local.odigos_adot },

            # Route B only: load ADOT, appended to the NODE_OPTIONS the runtime already has.
            { for key, value in {
              NODE_OPTIONS = trimspace("${lookup(var.existing_environment, "NODE_OPTIONS", "")} --require @aws/aws-distro-opentelemetry-node-autoinstrumentation/register")
            } : key => value if local.odigos_adot },
          )
        }

    - id: instrument-lambda-terraform-java
      section: instrumentation:aws.lambda
      language: java
      variant: terraform
      variantLabel: Terraform
      title: Instrument a java Lambda function (Terraform)
      description: >-
        <LAMBDA_DISTRO_DESCRIPTION>
      format: shell
      steps:
        - Keep unrelated layers and customer environment variables; replace previous Odigos SDK/collector layers.
        - Set the wrapper and compact configuration; record attribution with Lambda resource tags.
        - Replace every <ANGLE_BRACKETED> value.
        - 'Merge this fragment into the function in its existing workspace, review `terraform plan`, then run `terraform apply` (OpenTofu: `tofu plan` and `tofu apply`). Do not replace the rest of the function resource with this fragment.'
        - Verify the function update succeeds and invoke it. If traffic uses published versions or aliases, publish an updated instrumented version and update all relevant aliases and weighted traffic targets; changing $LATEST does not modify existing published versions.
      prerequisites:
        - "<LAMBDA_DISTRO_PREREQUISITES>"
        - "Use preloaded Lambda layers v0.0.19 or newer: https://docs.odigos.io/cloud-connectors/aws/workloads/lambda/preload"
        - "Use newly built layers that contain the compact configuration launcher. SDK defaults and collector pipelines are expanded only at process startup."
        - "For AWS Lambda Web Adapter, select /opt/odigos-webserver and put the original AWS_LAMBDA_EXEC_WRAPPER in configuration field webWrapper (empty when none). ADOT supports handler mode only."
      template: |-
        # Compact settings: <ODIGOS_LAMBDA_CONFIG>
        # <LAMBDA_SDK_INSTRUCTIONS>
        resource "aws_lambda_function" "app" {
          # ... existing configuration ...
          layers = distinct(concat([for arn in var.existing_layers : arn if !can(regex(":layer:odigos-otel-", arn))], [<LAMBDA_LAYER_ARNS_JSON>]))
          tags = merge(var.existing_tags, {
            <LAMBDA_TAGS_TERRAFORM>
          })
          environment {
            variables = merge({ for key, value in var.existing_environment : key => value if !contains(["ODIGOS_MANAGED", "ODIGOS_IAC"], key) }, {
              AWS_LAMBDA_EXEC_WRAPPER = "<JAVA_LAMBDA_EXEC_WRAPPER>"
              ODIGOS_LAMBDA_CONFIG = <LAMBDA_CONFIG_QUOTED>
            })
          }
        }
        # Web Adapter: use /opt/odigos-webserver and set configuration field webWrapper to the original wrapper.

    - id: instrument-lambda-cloudformation-java
      section: instrumentation:aws.lambda
      language: java
      variant: cloudformation
      variantLabel: CloudFormation
      title: Instrument a java Lambda function (CloudFormation)
      description: >-
        <LAMBDA_DISTRO_DESCRIPTION>
      format: yaml
      steps:
        - Keep unrelated layers and customer environment variables; replace previous Odigos SDK/collector layers.
        - Set the wrapper and compact configuration; record attribution with Lambda resource tags.
        - Replace every <ANGLE_BRACKETED> value.
        - Merge this fragment into the existing function resource in its application template. Create and review a CloudFormation change set, then update that application stack; this fragment is not a standalone stack.
        - Verify the function update succeeds and invoke it. If traffic uses published versions or aliases, publish an updated instrumented version and update all relevant aliases and weighted traffic targets; changing $LATEST does not modify existing published versions.
      prerequisites:
        - "<LAMBDA_DISTRO_PREREQUISITES>"
        - "Use preloaded Lambda layers v0.0.19 or newer: https://docs.odigos.io/cloud-connectors/aws/workloads/lambda/preload"
        - "Use newly built layers that contain the compact configuration launcher. SDK defaults and collector pipelines are expanded only at process startup."
        - "For AWS Lambda Web Adapter, select /opt/odigos-webserver and put the original AWS_LAMBDA_EXEC_WRAPPER in configuration field webWrapper (empty when none). ADOT supports handler mode only."
      template: |-
        # Compact settings: <ODIGOS_LAMBDA_CONFIG>
        # <LAMBDA_SDK_INSTRUCTIONS>
        # Merge into the function properties and keep existing customer variables.
        Layers: [<LAMBDA_LAYER_ARNS_JSON>]
        Tags:
          <LAMBDA_TAGS_CLOUDFORMATION>
        Environment:
          Variables:
            AWS_LAMBDA_EXEC_WRAPPER: "<JAVA_LAMBDA_EXEC_WRAPPER>"
            ODIGOS_LAMBDA_CONFIG: <LAMBDA_CONFIG_QUOTED>
        # Web Adapter: use /opt/odigos-webserver and set configuration field webWrapper to the original wrapper.

    - id: instrument-lambda-aws-cli-java
      section: instrumentation:aws.lambda
      language: java
      variant: aws-cli
      variantLabel: AWS CLI
      title: Instrument a java Lambda function (AWS CLI)
      description: >-
        <LAMBDA_DISTRO_DESCRIPTION>
      format: shell
      steps:
        - Keep unrelated layers and customer environment variables; replace previous Odigos SDK/collector layers.
        - Set the wrapper and compact configuration; record attribution with Lambda resource tags.
        - Replace every <ANGLE_BRACKETED> value.
        - Run the complete script with AWS CLI and jq installed. It waits for the function configuration update before applying tags.
        - Verify the function update succeeds and invoke it. If traffic uses published versions or aliases, publish an updated instrumented version and update all relevant aliases and weighted traffic targets; changing $LATEST does not modify existing published versions.
      prerequisites:
        - "<LAMBDA_DISTRO_PREREQUISITES>"
        - "Use preloaded Lambda layers v0.0.19 or newer: https://docs.odigos.io/cloud-connectors/aws/workloads/lambda/preload"
        - "Use newly built layers that contain the compact configuration launcher. SDK defaults and collector pipelines are expanded only at process startup."
        - "For AWS Lambda Web Adapter, select /opt/odigos-webserver and put the original AWS_LAMBDA_EXEC_WRAPPER in configuration field webWrapper (empty when none). ADOT supports handler mode only."
      template: |-
        # Compact settings: <ODIGOS_LAMBDA_CONFIG>
        # <LAMBDA_SDK_INSTRUCTIONS>
        FUNCTION="<FUNCTION_NAME>"
        REGION="<REGION>"
        WRAPPER="<JAVA_LAMBDA_EXEC_WRAPPER>"
        set -eu
        # Compatible with bash and zsh; AWS CLI and jq are required.
        # This JSON document contains only Odigos additions. Merge it with the live environment.
        cat > odigos-env.json <<'JSON'
        {
          "Variables": {
            "AWS_LAMBDA_EXEC_WRAPPER": "<WRAPPER>",
            "ODIGOS_LAMBDA_CONFIG": <LAMBDA_CONFIG_QUOTED>
          }
        }
        JSON
        aws lambda get-function-configuration --function-name "$FUNCTION" --region "$REGION" > current.json
        jq -s --arg wrapper "$WRAPPER" '{Variables: ((.[0].Environment.Variables // {}) + .[1].Variables + {AWS_LAMBDA_EXEC_WRAPPER: $wrapper} | del(.ODIGOS_MANAGED, .ODIGOS_IAC))}' current.json odigos-env.json > merged-env.json
        jq --argjson layers '[<LAMBDA_LAYER_ARNS_JSON>]' --slurpfile env merged-env.json '{FunctionName: .FunctionArn, RevisionId: .RevisionId, Layers: ([.Layers[]?.Arn | select(contains(":layer:odigos-otel-") | not)] + $layers | unique), Environment: $env[0]}' current.json > odigos-update.json
        aws lambda update-function-configuration --region "$REGION" --cli-input-json file://odigos-update.json
        aws lambda wait function-updated-v2 --region "$REGION" --function-name "$FUNCTION"
        cat > odigos-tags.json <<'JSON'
        <LAMBDA_TAGS_JSON>
        JSON
        aws lambda tag-resource --region "$REGION" --resource "$(jq -r .FunctionArn current.json)" --tags file://odigos-tags.json
        # Web Adapter: use /opt/odigos-webserver and set configuration field webWrapper to the original wrapper.

    - id: instrument-lambda-cdk-java
      section: instrumentation:aws.lambda
      language: java
      variant: cdk
      variantLabel: AWS CDK
      title: Instrument a java Lambda function (AWS CDK)
      description: >-
        <LAMBDA_DISTRO_DESCRIPTION>
      format: text
      steps:
        - Keep unrelated layers and customer environment variables; replace previous Odigos SDK/collector layers.
