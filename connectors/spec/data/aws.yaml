    - id: instrument-fargate-terraform-nodejs
      section: instrumentation:aws.fargate-task
      language: nodejs
      variant: terraform
      variantLabel: Terraform
      title: Instrument a Node.js ECS Fargate service (Terraform)
      description: >-
        Anchored fragments for aws_ecs_task_definition, staging and activating the Node.js agent.
      format: shell
      steps:
        - Add the volume and the odigos-agent container to your task definition.
        - Add the mount, dependency and environment to each application container.
        - Apply, then roll the service onto the new revision.
      prerequisites:
        - >-
          Make sure that registry.odigos.io is accessible to the workload or change the connector to use a local image override (https://docs.odigos.io/cloud-connectors/add-connectors/add-aws-connector).
      template: |-
        resource "aws_ecs_task_definition" "app" {
          # ... your existing configuration ...

          # Bare-name volume: on Fargate this is an ephemeral-storage bind mount scoped to the task.
          volume {
            name = "odigos-agent"
          }

          container_definitions = jsonencode([
            {
              # --- the agent-staging container: it copies the Node.js agent into the shared volume and exits ---
              name      = "odigos-agent"
              image     = "registry.odigos.io/odigos-fargate-agents:v0.0.15"
              essential = false # stages the agent and exits 0; SUCCESS below requires non-essential
              command   = ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/nodejs /var/odigos/nodejs"]
              mountPoints = [{
                sourceVolume  = "odigos-agent"
                containerPath = "/var/odigos"
              }]
            },
            {
              # --- your Node.js application container ---
              name = "<YOUR_CONTAINER>"
              # ... your existing configuration ...
              mountPoints = [{
                sourceVolume  = "odigos-agent"
                containerPath = "/var/odigos"
                readOnly      = true
              }]
              dependsOn = [{
                containerName = "odigos-agent"
                condition     = "SUCCESS"
              }]
              environment = [
                # The IaC marker: it is what attributes this container to Odigos, and its recorded
                # language is the agent the activation environment below is checked against.
                # The value, unescaped, is exactly: {"v":1,"lang":"nodejs"}
                { name = "ODIGOS_IAC", value = "{\"v\":1,\"lang\":\"nodejs\"}" },

                # Do NOT add ODIGOS_MANAGED. That is the connector's own record of a mutation IT
                # performed, including the rollback snapshot; setting it by hand claims a rollback that
                # was never recorded. Remove it if an earlier attempt left one.

                { name = "OTEL_SERVICE_NAME", value = "<ODIGOS_SOURCE_NAME>" },
                { name = "OTEL_RESOURCE_ATTRIBUTES", value = "cloud.provider=aws,cloud.platform=aws_ecs,cloud.region=<REGION>" },
                # Endpoint and protocol are one decision — both compared exactly against the destination on this connector.
                { name = "OTEL_EXPORTER_OTLP_ENDPOINT", value = "<OTLP_ENDPOINT_URL>" },
                { name = "OTEL_EXPORTER_OTLP_PROTOCOL", value = "http/protobuf" },
                { name = "OTEL_TRACES_EXPORTER", value = "otlp" },
                { name = "OTEL_METRICS_EXPORTER", value = "otlp" },
                { name = "OTEL_LOGS_EXPORTER", value = "otlp" },

                # --- Node.js activation ---
                # Keep whatever the container already carries and add ours after it, joined by a space.
                # APPEND, never assign — assigning it discards your value.
                { name = "NODE_OPTIONS", value = trimspace("${var.node_options} --require /var/odigos/nodejs/node_modules/@opentelemetry/auto-instrumentations-node/build/src/register.js") },

                # Do NOT set OTEL_LOG_LEVEL — it is compared against unset and a value is reported as drift.
              ]
            },
          ])
        }

