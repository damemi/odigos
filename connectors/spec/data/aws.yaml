        # destination accepts, and "none" for one it does not (also delete that signal's pipeline above).

        # THERE IS NO WEB-SERVER ACTIVATION FOR RUBY. The other runtimes can be instrumented behind the AWS
        # Lambda Web Adapter through their own loader variable, but the OpenTelemetry Ruby layer publishes no
        # verified equivalent — so the exec wrapper above is the only activation Ruby has.
        #
        # Applying this to a Ruby function that DOES run behind the adapter does not work and is not reported as
        # an unsupported workload: Odigos sees the marker, judges the function as a web-server one, finds no
        # loader, and reports it as instrumentation drift with the agent loader missing. Do not try to reproduce
        # another language's loader here either — the adapter already owns AWS_LAMBDA_EXEC_WRAPPER, and setting
        # it on such a function stops it serving.

    - id: instrument-lambda-cdk-ruby
      section: instrumentation:aws.lambda
      language: ruby
      variant: cdk
      variantLabel: AWS CDK
      title: Instrument a Ruby Lambda function (AWS CDK)
      description: >-
        For a Ruby function defined in a TypeScript/JavaScript CDK app, using the Odigos CDK constructs, which
        resolve the layer ARN, render the collector configuration and write the IaC marker for you.
      format: text
      steps:
        - Install @odigos/aws-cdk in the app that defines the function, pinned to an exact version — the package version IS the layer version.
        - Add one OdigosLambdaInstrumentation per function, passing serviceName explicitly.
        - Run cdk diff to check the layer and the variables, then cdk deploy. Your function code is untouched, so this is a configuration-only update.
      prerequisites:
        - >-
          Make sure Odigos Lambda layers are preloaded into your AWS account (https://docs.odigos.io/cloud-connectors/add-connectors/add-aws-connector).
      template: |-
        npm install @odigos/aws-cdk@<PACKAGE_VERSION>    # Python CDK: pip install odigos-aws-cdk==<PACKAGE_VERSION>

        WHAT THE CONSTRUCT DOES for a Ruby function. It attaches the Ruby layer for the function's
        architecture, sets AWS_LAMBDA_EXEC_WRAPPER to /opt/otel-handler, sets OTEL_SERVICE_NAME, renders
        OPENTELEMETRY_COLLECTOR_CONFIG_URI — the same renderer this connector uses, so the value matches byte for
        byte — and writes ODIGOS_IAC recording the layer it attached, which is what makes Odigos report the
        function as instrumented rather than as awaiting your deployment. Nothing below has to be added by hand.

        What it does NOT set is ODIGOS_MANAGED. That is the connector's record of a mutation IT performed,
        including the snapshot it rolls back from, and the package will not claim ownership of a function on
        your behalf. Do not add it yourself.

        import { Stack } from 'aws-cdk-lib';
        import { LAYER_ARNS, OdigosLambdaInstrumentation } from '@odigos/aws-cdk';

        // ONE CONSTRUCT PER FUNCTION. serviceName applies to every function a construct instruments, and
        // left unset it falls back to the CDK CONSTRUCT ID rather than the deployed function name —
        // lambda.Function.functionName resolves to a CloudFormation Ref even when you set it explicitly, so
        // the package cannot read it. OTEL_SERVICE_NAME must match the workload's name in Odigos, so pass it.
        new OdigosLambdaInstrumentation(this, 'OdigosApi', {
          destination: {
            endpoint: '<OTLP_ENDPOINT>',      // OTLP/gRPC as host:port, no scheme
            insecure: <OTLP_INSECURE>,        // plaintext destination only; must match this connector
            // httpEndpoint: 'https://...'    // instead of endpoint, for an OTLP/HTTP destination
            // headers: { authorization: 'Bearer ...' },  // see the credential warning below
          },
          serviceName: '<ODIGOS_SOURCE_NAME>',
          functions: [fn],
        });

        // THE MARKER IS WRITTEN FOR YOU — shown here so you recognise it in a cdk diff, not to be added by
        // hand. It records the ARN the construct actually attached, and Odigos checks the function against
        // the version recorded in it, so a version you pinned is respected instead of being reported as
        // drift. What it writes is ODIGOS_IAC = {"v":1,"layer":"<OTEL_LAYER_ARN>"}, with the package that
        // wrote it named alongside:
        //   ODIGOS_IAC = {"v":1,"source":"cdk","version":"<PACKAGE_VERSION>","layer":"<OTEL_LAYER_ARN>"}
        //
        // LAYER_ARNS is that same table, exported for a stack that needs the ARN for its own reasons:
        //   const layerArn = LAYER_ARNS[`${Stack.of(this).region}/ruby/${fn.architecture.name}`];

        WHERE THE LAYER COMES FROM
          layerSource: OdigosLayerSource.ODIGOS_PUBLIC   (default) the public Odigos layer version in the
            stack's region, resolved at SYNTH time from a table in the package. No extra resources, no
            deploy-time lookup — but it needs a concrete region, so an environment-agnostic stack throws.
          layerSource: OdigosLayerSource.IN_ACCOUNT      deploys the Odigos Serverless Application
            Repository application into your account as a nested stack (one per language/architecture) and
            wires its LayerVersionArn output into the function. Identical bytes, owned by your own stack —
            for organisations whose policy forbids attaching a layer owned by another AWS account. Needs
            serverlessrepo:CreateCloudFormationTemplate and serverlessrepo:GetApplication at deploy time.
          layerVersion: <your ILayerVersion>             a layer you mirrored yourself; neither path is used.

        The marker needs the ARN, and only the ODIGOS_PUBLIC path exposes it — LAYER_ARNS is a plain table
        you can index. IN_ACCOUNT resolves the ARN from a nested stack output that the construct does not
        hand back, so to record the marker there, either pass the layer in yourself through layerVersion and
        read its layerVersionArn, or read the nested application's LayerVersionArn output directly.

        THERE IS NO WEB-SERVER MODE FOR RUBY. OdigosInstrumentationMode.WEB_SERVER loads the agent through the
        language's own loader variable, and the OpenTelemetry Ruby layer publishes no verified equivalent — so a
        Ruby function behind the AWS Lambda Web Adapter cannot be instrumented, and the construct throws rather
        than attaching an activation that would stop the function serving.

        Signals: destination.traces / metrics / logs default to true. Setting one false drops that pipeline
        from the configuration AND sets that signal's OTEL_TRACES_EXPORTER / OTEL_METRICS_EXPORTER /
        OTEL_LOGS_EXPORTER to "none" — which is exactly what this connector expects for a signal your
        destination does not accept. Leave a signal enabled and its variable stays unset, because "otlp" is
        already the SDK default. Turning all three off throws at synth.

        MUST NOT be set (Odigos compares each against unset, so a leftover value is reported as drift). The
        construct sets none of them; this list matters if an earlier attempt did:
          OTEL_EXPORTER_OTLP_ENDPOINT   OTEL_EXPORTER_OTLP_HEADERS
          ODIGOS_OTLP_ENDPOINT          ODIGOS_OTLP_INSECURE      (replaced by the configuration below)
          OTEL_LOG_LEVEL                (unless this connector has debug telemetry enabled: then "debug",
                                         which the construct writes for you when you pass debug: true)

        For reference, the OPENTELEMETRY_COLLECTOR_CONFIG_URI value the construct renders for a gRPC
        destination with all three signals on — this is what Odigos compares the live variable against:
          yaml:{receivers: {otlp: {protocols: {grpc: {endpoint: "localhost:4317"}, http: {endpoint: "localhost:4318"}}}}, processors: {memory_limiter: {check_interval: 1s, limit_percentage: 50, spike_limit_percentage: 20}, batch: {send_batch_size: 512, timeout: 200ms}, decouple: null}, exporters: {otlp: {endpoint: "<OTLP_ENDPOINT>", tls: {insecure: <OTLP_INSECURE>}}}, service: {telemetry: {metrics: {level: none}}, pipelines: {traces: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, metrics: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, logs: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}}}}

    - id: instrument-fargate-terraform-java
      section: instrumentation:aws.fargate-task
      language: java
      variant: terraform
      variantLabel: Terraform
      title: Instrument a Java ECS Fargate service (Terraform)
      description: >-
        Anchored fragments for aws_ecs_task_definition, staging and activating the Java agent.
      format: shell
      steps:
        - Add the volume and the odigos-agent container to your task definition.
        - Add the mount, dependency and environment to each application container.
        - Apply, then roll the service onto the new revision.
      prerequisites:
        - >-
          Make sure that registry.odigos.io is accessible to the workload or change the connector to use a local image override (https://docs.odigos.io/cloud-connectors/add-connectors/add-aws-connector).
      template: |-
        resource "aws_ecs_task_definition" "app" {
          # ... your existing configuration ...

          # Bare-name volume: on Fargate this is an ephemeral-storage bind mount scoped to the task.
          volume {
            name = "odigos-agent"
          }

          container_definitions = jsonencode([
            {
              # --- the agent-staging container: it copies the Java agent into the shared volume and exits ---
              name      = "odigos-agent"
              image     = "registry.odigos.io/odigos-fargate-agents:v0.0.15"
              essential = false # stages the agent and exits 0; SUCCESS below requires non-essential
              command   = ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/java /var/odigos/java"]
              mountPoints = [{
                sourceVolume  = "odigos-agent"
                containerPath = "/var/odigos"
              }]
            },
            {
              # --- your Java application container ---
              name = "<YOUR_CONTAINER>"
              # ... your existing configuration ...
              mountPoints = [{
                sourceVolume  = "odigos-agent"
                containerPath = "/var/odigos"
                readOnly      = true
              }]
              dependsOn = [{
                containerName = "odigos-agent"
                condition     = "SUCCESS"
              }]
              environment = [
                # The IaC marker: it is what attributes this container to Odigos, and its recorded
                # language is the agent the activation environment below is checked against.
                # The value, unescaped, is exactly: {"v":1,"lang":"java"}
                { name = "ODIGOS_IAC", value = "{\"v\":1,\"lang\":\"java\"}" },

                # Do NOT add ODIGOS_MANAGED. That is the connector's own record of a mutation IT
                # performed, including the rollback snapshot; setting it by hand claims a rollback that
                # was never recorded. Remove it if an earlier attempt left one.

                { name = "OTEL_SERVICE_NAME", value = "<ODIGOS_SOURCE_NAME>" },
                { name = "OTEL_RESOURCE_ATTRIBUTES", value = "cloud.provider=aws,cloud.platform=aws_ecs,cloud.region=<REGION>" },
                # Endpoint and protocol are one decision — both compared exactly against the destination on this connector.
                { name = "OTEL_EXPORTER_OTLP_ENDPOINT", value = "<OTLP_ENDPOINT_URL>" },
                { name = "OTEL_EXPORTER_OTLP_PROTOCOL", value = "http/protobuf" },
                { name = "OTEL_TRACES_EXPORTER", value = "otlp" },
                { name = "OTEL_METRICS_EXPORTER", value = "otlp" },
                { name = "OTEL_LOGS_EXPORTER", value = "otlp" },

                # --- Java activation ---
                # Keep whatever the container already carries and add ours after it, joined by a space.
                # APPEND, never assign — assigning it discards your value.
                { name = "JAVA_TOOL_OPTIONS", value = trimspace("${var.java_tool_options} -javaagent:/var/odigos/java/javaagent.jar") },

                # Do NOT set OTEL_LOG_LEVEL — it is compared against unset and a value is reported as drift.
              ]
            },
          ])
        }

    - id: instrument-fargate-cloudformation-java
      section: instrumentation:aws.fargate-task
      language: java
      variant: cloudformation
      variantLabel: CloudFormation
      title: Instrument a Java ECS Fargate service (CloudFormation)
      description: >-
        The AWS::ECS::TaskDefinition properties to merge, staging and activating the Java agent.
      format: yaml
      steps:
        - Merge Volumes and the odigos-agent entry into your task definition.
        - Add the mount, dependency and environment to each application container.
        - Deploy, then roll the service onto the new revision.
      prerequisites:
        - >-
          Make sure that registry.odigos.io is accessible to the workload or change the connector to use a local image override (https://docs.odigos.io/cloud-connectors/add-connectors/add-aws-connector).
      template: |-
        # Merge into Resources.<YourTaskDefinition>.Properties
        Volumes:
          # Bare-name volume: Fargate ephemeral-storage bind mount scoped to the task.
          - Name: odigos-agent
        ContainerDefinitions:
          - Name: odigos-agent
            Image: "registry.odigos.io/odigos-fargate-agents:v0.0.15"
            # Non-essential: stages the agent and exits 0; SUCCESS below requires non-essential.
            Essential: false
            Command: ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/java /var/odigos/java"]
            MountPoints:
              - SourceVolume: odigos-agent
                ContainerPath: /var/odigos
          - Name: "<YOUR_CONTAINER>"
            # ... your existing configuration ...
            MountPoints:
              - SourceVolume: odigos-agent
                ContainerPath: /var/odigos
                ReadOnly: true
            DependsOn:
              - ContainerName: odigos-agent
                Condition: SUCCESS
            Environment:
              # The IaC marker: it is what attributes this container to Odigos, and its recorded
              # language is the agent the activation environment below is checked against.
              # The value, unescaped, is exactly: {"v":1,"lang":"java"}
              - Name: ODIGOS_IAC
                Value: '{"v":1,"lang":"java"}'

              # Do NOT add ODIGOS_MANAGED. That is the connector's own record of a mutation IT
              # performed, including the rollback snapshot; setting it by hand claims a rollback that
              # was never recorded. Remove it if an earlier attempt left one.
              - Name: OTEL_SERVICE_NAME
                Value: "<ODIGOS_SOURCE_NAME>"
              - Name: OTEL_RESOURCE_ATTRIBUTES
                Value: "cloud.provider=aws,cloud.platform=aws_ecs,cloud.region=<REGION>"
              # Endpoint and protocol are one decision — both compared exactly against the destination on this connector.
              - Name: OTEL_EXPORTER_OTLP_ENDPOINT
                Value: "<OTLP_ENDPOINT_URL>"
              - Name: OTEL_EXPORTER_OTLP_PROTOCOL
                Value: "http/protobuf"
              - Name: OTEL_TRACES_EXPORTER
                Value: "otlp"
              - Name: OTEL_METRICS_EXPORTER
                Value: "otlp"
              - Name: OTEL_LOGS_EXPORTER
                Value: "otlp"
              # --- Java activation ---
              # APPEND — CloudFormation cannot read a variable back; fold your value in by hand.
              - Name: JAVA_TOOL_OPTIONS
                Value: "<YOUR_EXISTING_VALUE> -javaagent:/var/odigos/java/javaagent.jar"
              # Do NOT set OTEL_LOG_LEVEL: compared against unset, so a value is reported as drift.

    - id: instrument-fargate-cdk-java
      section: instrumentation:aws.fargate-task
      language: java
      variant: cdk
      variantLabel: AWS CDK
      title: Instrument a Java ECS Fargate service (AWS CDK)
      description: >-
        Minimal AWS CDK usage for a Java container. Full construct reference:
        https://docs.odigos.io/cloud-connectors/aws/cdk/fargate
      format: text
      steps:
        - Install @odigos/aws-cdk (pin the exact version).
        - Create one OdigosFargateInstrumentation and call instrument() once per container.
        - cdk diff, then cdk deploy — the service must roll onto the new revision.
      prerequisites:
        - >-
          Make sure that registry.odigos.io is accessible to the workload or change the connector to use a local image override (https://docs.odigos.io/cloud-connectors/add-connectors/add-aws-connector).
      template: |-
        npm install @odigos/aws-cdk@<PACKAGE_VERSION>    # Python CDK: pip install odigos-aws-cdk==<PACKAGE_VERSION>

        import { OdigosFargateInstrumentation, OdigosFargateLanguage } from '@odigos/aws-cdk';

        const odigos = new OdigosFargateInstrumentation(this, 'Odigos', {
          destination: {
            httpEndpoint: '<OTLP_ENDPOINT_URL>', // OTLP/HTTP, scheme-qualified
            // endpoint: 'host:4317',            // OTLP/gRPC as host:port, no scheme
          },
          // Optional: the construct RECORDS whichever image it stages and Odigos holds you to that,
          // so a package ahead of this connector is not drift. Pin only to match a mirror.
          agentsImage: 'registry.odigos.io/odigos-fargate-agents:v0.0.15',
        });

        odigos.instrument({
          container: appContainer,
          language: OdigosFargateLanguage.JAVA,
          service: appService, // OTEL_SERVICE_NAME = ECS service name
          // serviceName: '<ODIGOS_SOURCE_NAME>',
        });

        // Full construct reference: https://docs.odigos.io/cloud-connectors/aws/cdk/fargate
        // What the construct writes (for cdk diff). Do NOT set ODIGOS_MANAGED or OTEL_LOG_LEVEL.
        // Staging: volume odigos-agent + non-essential container odigos-agent
        //   command ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/java /var/odigos/java"]
        //   mount /var/odigos read-only, DependsOn SUCCESS
          ODIGOS_IAC                  = {"v":1,"lang":"java"}
          OTEL_SERVICE_NAME           = <ODIGOS_SOURCE_NAME>
          OTEL_RESOURCE_ATTRIBUTES    = cloud.provider=aws,cloud.platform=aws_ecs,cloud.region=<REGION>
          OTEL_EXPORTER_OTLP_ENDPOINT = <OTLP_ENDPOINT_URL>
          OTEL_EXPORTER_OTLP_PROTOCOL = http/protobuf
          OTEL_TRACES_EXPORTER        = otlp
          OTEL_METRICS_EXPORTER       = otlp
          OTEL_LOGS_EXPORTER          = otlp
          JAVA_TOOL_OPTIONS           = <existing> -javaagent:/var/odigos/java/javaagent.jar
              # APPEND — joined by a space

