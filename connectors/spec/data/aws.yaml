            MountPoints:
              - SourceVolume: odigos-agent
                ContainerPath: /var/odigos
          - Name: "<YOUR_CONTAINER>"
            # ... your existing configuration ...
            MountPoints:
              - SourceVolume: odigos-agent
                ContainerPath: /var/odigos
                ReadOnly: true
            DependsOn:
              - ContainerName: odigos-agent
                Condition: SUCCESS
            Environment:
              # The IaC marker, unescaped: {"v":1,"lang":"php"}
              - Name: ODIGOS_IAC
                Value: '{"v":1,"lang":"php"}'

