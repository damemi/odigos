            MountPoints:
              - SourceVolume: odigos-agent
                ContainerPath: /var/odigos
          - Name: "<YOUR_CONTAINER>"
            # ... your existing configuration ...
            MountPoints:
              - SourceVolume: odigos-agent
                ContainerPath: /var/odigos
                ReadOnly: true
            DependsOn:
              - ContainerName: odigos-agent
                Condition: SUCCESS
            Environment:
              # The IaC marker, unescaped: {"v":1,"lang":"nodejs"}
              - Name: ODIGOS_IAC
                Value: '{"v":1,"lang":"nodejs"}'

              # Do NOT add ODIGOS_MANAGED; remove it if an earlier attempt left one.
              - Name: OTEL_SERVICE_NAME
                Value: "<ODIGOS_SOURCE_NAME>"
              - Name: OTEL_RESOURCE_ATTRIBUTES
                Value: "cloud.provider=aws,cloud.platform=aws_ecs,cloud.region=<REGION>"
