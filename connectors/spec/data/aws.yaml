provider: aws
displayName: Amazon Web Services

connector:
  # Commercial AWS regions: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions.html
  bootstrapRegion:
    defaultRegion: us-east-1
    supportedRegions:
      - af-south-1
      - ap-east-1
      - ap-east-2
      - ap-northeast-1
      - ap-northeast-2
      - ap-northeast-3
      - ap-south-1
      - ap-south-2
      - ap-southeast-1
      - ap-southeast-2
      - ap-southeast-3
      - ap-southeast-4
      - ap-southeast-5
      - ap-southeast-6
      - ap-southeast-7
      - ca-central-1
      - ca-west-1
      - eu-central-1
      - eu-central-2
      - eu-north-1
      - eu-south-1
      - eu-south-2
      - eu-west-1
      - eu-west-2
      - eu-west-3
      - il-central-1
      - me-central-1
      - me-south-1
      - mx-central-1
      - sa-east-1
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
  fields:
    - name: accountId
      displayName: AWS Account ID
      componentType: input
      required: true
      tooltip: The 12-digit AWS account this connector manages.

# Authentication: composable methods. Base methods establish caller identity; assume-role adds
# cross-account role assumption on top of a base method (workload identity or static keys).
auth:
  permissions:
    - sts:GetCallerIdentity
  defaultMethod: assume-role
  methods:
    - id: workload-identity
      displayName: Pod / workload identity
      description: >-
        Uses the connector pod's ambient credentials (e.g. IRSA). No credentials Secret keys are
        required.
      fields: []

    - id: static-keys
      displayName: Access keys
      description: Long-lived or temporary IAM access keys stored in the credentials Secret.
      fields:
        - name: accessKeyId
          displayName: Access Key ID
          componentType: input
          required: true
          showInUi: true
          envVar: AWS_ACCESS_KEY_ID
        - name: secretAccessKey
          displayName: Secret Access Key
          componentType: input
          secret: true
          required: true
          showInUi: true
          envVar: AWS_SECRET_ACCESS_KEY
        - name: sessionToken
          displayName: Session Token
          componentType: input
          secret: true
          required: false
          showInUi: false
          tooltip: Required only for temporary access keys.
          envVar: AWS_SESSION_TOKEN

    - id: assume-role
      displayName: Assume IAM role
      description: >-
        Provision a scoped IAM role and caller credentials permitted to assume it.
        Enter the caller credentials, Role ARN and External ID below.
      baseMethods:
        - workload-identity
        - static-keys
      fields:
        - name: roleArn
          displayName: IAM Role ARN
          componentType: input
          required: true
          showInUi: true
          tooltip: ARN of the IAM role the connector assumes in the selected AWS account.
          envVar: ODIGOS_AWS_ROLE_ARN
        - name: externalId
          displayName: External ID
          componentType: input
          required: false
          showInUi: true
          tooltip: >-
            A customer-specific identifier Odigos presents when assuming the role; the trust policy in the setup
            snippets enforces it. Strongly recommended — set it before copying the snippet, since a
            role created with a blank external ID cannot be assumed.
          envVar: ODIGOS_AWS_EXTERNAL_ID

# workloads: directly-instrumentable resources — discovered, then instrumented in place.
workloads:
  discovery:
    enabled: true
    displayName: Workload discovery
    description: >-
      Enumerate Lambda functions, ECS/Fargate tasks and Bedrock AgentCore runtimes across supported regions enabled in the account, so
      they can be surfaced as Odigos Source candidates.
    # Baseline permission, not tied to a type: enumerate the account's enabled regions to scan.
    permissions:
      - ec2:DescribeRegions
    types:
      - name: aws.lambda
        displayName: AWS Lambda
        description: List Lambda functions in each configured region.
        permissions:
          - lambda:ListFunctions
          - lambda:ListAliases
          - lambda:GetFunctionConfiguration
          # Read ownership/attribution tags and optional discovery selectors for every function.
          - lambda:ListTags
      - name: aws.bedrock-agentcore-runtime
        displayName: Amazon Bedrock AgentCore Runtime
        description: Discover runtime artifacts, instrumentation metadata and endpoint versions across enabled regions. Manual observation is read-only.
        permissions:
          - bedrock-agentcore:ListAgentRuntimes
          - bedrock-agentcore:GetAgentRuntime
          - bedrock-agentcore:ListAgentRuntimeEndpoints
          - bedrock-agentcore:GetAgentRuntimeEndpoint
          - bedrock-agentcore:ListTagsForResource
      - name: aws.fargate-task
        displayName: Amazon ECS (Fargate task)
        description: >-
          Discover Fargate ECS services and tasks per region. The service is the per-workload
          instrumentation unit (sidecar injected into its task definition); standalone tasks are
          discovered for coverage. A single ECS scan enumerates clusters, Fargate services and tasks.
        permissions:
          - ecs:ListClusters
          - ecs:ListServices
          # DescribeServices/DescribeTasks return tags inline (Include: TAGS), so tag-filtered
          # discovery needs no extra tag API.
          - ecs:DescribeServices
          - ecs:ListTasks
          - ecs:DescribeTasks
          - ecs:DescribeTaskDefinition

  instrumentation:
    enabled: true
    displayName: Workload instrumentation
    description: >-
      Attach OpenTelemetry instrumentation directly to discovered workloads. The method depends on the
      resource type: Lambda uses a layer, ECS Fargate uses a per-task sidecar, and AgentCore configures the SDK the artifact already carries through the runtime's environment, and never rewrites or republishes the artifact.
      Requires an OTLP destination.
    types:
      - name: aws.bedrock-agentcore-runtime
        displayName: Amazon Bedrock AgentCore Runtime
        description: >-
          Configure the OpenTelemetry SDK the agent's artifact already carries (the odigos-agentcore PyPI or
          @odigos/agentcore npm package, or AWS Distro for OpenTelemetry) through the runtime's environment only;
          the artifact is never rewritten or republished. Python and CommonJS Node.js,
          ZIPs and container images. Manual mode observes customer deployments.
          Requires a global OTLP/HTTP destination. Managed collector routing is deferred.
          DEFAULT follows new versions; existing sessions and pinned custom endpoints can retain older code.
        method: service
        permissions:
          - bedrock-agentcore:GetAgentRuntime
          - bedrock-agentcore:UpdateAgentRuntime
          - bedrock-agentcore:ListAgentRuntimeEndpoints
          - bedrock-agentcore:GetAgentRuntimeEndpoint
          # Automatic ZIP detection reads the source ZIP (never executes it) to find which SDK it carries.
          # Scope object reads to the source keys.
          - s3:GetObject
          - s3:GetObjectVersion
          # Automatic container detection reads the image config and layers in the existing same-account/region
          # ECR repository to find which SDK the image carries.
          - ecr:GetAuthorizationToken
          - ecr:BatchGetImage
          - ecr:GetDownloadUrlForLayer
          - ecr:BatchCheckLayerAvailability
          # Restrict this to existing execution roles and iam:PassedToService=bedrock-agentcore.amazonaws.com.
          - iam:PassRole
      - name: aws.lambda
        displayName: AWS Lambda
        description: >-
          Attach an OpenTelemetry layer/extension and OTEL_* configuration to the function. When an
          Odigos managed regional Collector destination is selected, VPC-attached functions use its
          ready same-region ingress only after VPC routing and security-group access are proven;
          non-VPC and unreachable functions retain direct export. Odigos never attaches or moves a
          function into a VPC.
        method: service
        permissions:
          - lambda:GetFunctionConfiguration
          - lambda:UpdateFunctionConfiguration
          - lambda:TagResource
          - lambda:UntagResource
          - lambda:GetLayerVersion
          - lambda:ListLayers
          - lambda:PublishLayerVersion
          - lambda:DeleteLayerVersion
          # Used only by the ADOT + Application Signals preset. Attach the existing
          # CloudWatchLambdaApplicationSignalsExecutionRolePolicy; never create policies.
          - iam:GetPolicy
          - iam:ListAttachedRolePolicies
          - iam:AttachRolePolicy
          - iam:GetRole
          - application-signals:StartDiscovery
          - iam:CreateServiceLinkedRole
          - cloudtrail:CreateServiceLinkedChannel
      - name: aws.fargate-task
        displayName: Amazon ECS (Fargate task)
        description: >-
          Register an instrumented task-definition revision (agent-staging sidecar + shared volume +
          OpenTelemetry activation/export env) and roll the Fargate service to it. Only ECS
          rolling-update services are instrumentable; standalone tasks report Unsupported.
        method: sidecar
        permissions:
          - ecs:DescribeServices
          - ecs:DescribeTaskDefinition
          - ecs:RegisterTaskDefinition
          - ecs:UpdateService
          - ecs:TagResource
          - iam:PassRole
          - ecr:GetAuthorizationToken
          - ecr:BatchGetImage
          - ecr:GetDownloadUrlForLayer

computePlatforms:
  discovery:
    enabled: true
    displayName: Compute-platform discovery
    description: >-
      Detect managed environments — EC2-backed and Fargate ECS clusters, EKS clusters and EC2 instances —
      across every region enabled in the account, so they can be surfaced as compute-platform candidates.
    # Baseline permission, not tied to a type: enumerate the account's enabled regions to scan.
    permissions:
      - ec2:DescribeRegions
    types:
      - name: aws.ecs-cluster
        displayName: Amazon ECS (EC2 cluster)
        description: >-
          Detect EC2-backed ECS clusters per region (clusters with registered EC2 container instances).
          The cluster is the unit; a global Odigos ecs-agent would be installed on it.
        permissions:
          - ecs:ListClusters
          - ecs:DescribeClusters
          - ecs:ListTasks
      - name: aws.fargate-cluster
        displayName: Amazon ECS (Fargate cluster)
        description: >-
          Detect ECS clusters that run Fargate tasks per region. A cluster grouping over Fargate tasks
          used to report Odigos coverage; no agent is installed — the per-task sidecar (aws.fargate-task)
          does the instrumentation.
        # Same scan as aws.ecs-cluster (one detector serves both); see the note there.
        permissions:
          - ecs:ListClusters
          - ecs:DescribeClusters
          - ecs:ListTasks
      - name: aws.eks
        displayName: Amazon EKS (Kubernetes)
        description: >-
          Detect EKS clusters per region. NOT DETECTED YET — the type is declared for the upcoming
          detector; once discovered, it is instrumented by installing Odigos for Kubernetes (odiglet)
          in the cluster.
        permissions:
          - eks:ListClusters
          - eks:DescribeCluster
      - name: aws.ec2
        displayName: Amazon EC2 (VM)
        description: >-
          Detect EC2 instances per region. NOT DETECTED YET — the type is declared for the upcoming
          detector; once discovered, it is instrumented by installing the Odigos VM agent on the
          instance.
        permissions:
          - ec2:DescribeInstances

  installation:
    enabled: false
    displayName: Compute-platform installation
    description: >-
      Install a separate Odigos agent onto a discovered compute platform (ECS-EC2 cluster agent, Odigos
      for Kubernetes on EKS, the Odigos VM agent on EC2). Not supported yet.
    types: []

collectors:
  management:
    enabled: true
    displayName: Managed Collector configuration
    description: >-
      Own the configuration of an Odigos Collector running in your account and push it over OpAMP, and
      observe and report the Collector's health. Runs in both modes; needs read-only permissions only.
    # Management reads are granted to the connector identity in manual and automatic mode.
    permissions: []
    types:
      - name: aws.fargate-collector
        displayName: Odigos Collector (ECS Fargate)
        description: >-
          Configure and observe an Odigos Collector running as an ECS Fargate service behind an internal
          network load balancer, one per region in an explicit host VPC.
        permissions:
          # The service, its tasks and the definition they run — running count, health, and the image and
          # environment actually deployed, which is what a drift verdict compares against.
          - ecs:DescribeClusters
          - ecs:ListClusters
          - ecs:DescribeServices
          - ecs:ListTasks
          - ecs:DescribeTasks
          - ecs:DescribeTaskDefinition
          # The published endpoint and whether anything is behind it.
          - elasticloadbalancing:DescribeLoadBalancers
          - elasticloadbalancing:DescribeListeners
          - elasticloadbalancing:DescribeTargetGroups
          - elasticloadbalancing:DescribeTargetHealth
          - ec2:DescribeVpcs
          - ec2:DescribeRegions
          - ec2:DescribeSubnets
          - ec2:DescribeSecurityGroups
          - ec2:DescribeRouteTables
          - ec2:DescribeVpcPeeringConnections
          - ec2:DescribeNetworkAcls
          - ec2:DescribeVpcAttribute

  deployment:
    enabled: true
    displayName: Managed Collector deployment
    description: >-
      Create and converge the AWS resources that run an Odigos Collector in a customer-provisioned ECS
      cluster: an ECS Fargate service, an internal network load balancer, a security group, a log group,
      the credential secret and the autoscaling target. The cluster and task execution role must already
      exist. Automatic mode only — omit this capability to deploy the Collector yourself.
    types:
      - name: aws.fargate-collector
        displayName: Odigos Collector (ECS Fargate)
        description: >-
          Deploy the Collector as an ECS Fargate service behind an internal NLB, one per region in the
          selected host VPC, using the existing cluster named by clusterArn and execution role named by
          executionRoleArn. Odigos never creates, modifies or deletes either prerequisite. Every object
          Odigos does create is tagged for ownership so only those objects are ever changed or removed.
        method: fargate-service
        permissions:
          - ecs:DescribeClusters
          - ecs:RegisterTaskDefinition
          - ecs:CreateService
          - ecs:UpdateService
          - ecs:DeleteService
          - ecs:StopTask
          # Ownership tagging is what separates an Odigos-created object from the customer's, and it is
          # the only licence teardown has to remove one — so tagging is required, not optional.
          - ecs:TagResource
          # ELBv2: the internal NLB, its listeners and target groups. Created with the security group
          # attached, because an NLB created without one can never have one added.
          - elasticloadbalancing:CreateLoadBalancer
          - elasticloadbalancing:DeleteLoadBalancer
          - elasticloadbalancing:CreateTargetGroup
          - elasticloadbalancing:DeleteTargetGroup
          - elasticloadbalancing:ModifyTargetGroupAttributes
          - elasticloadbalancing:CreateListener
          # ModifyListener rather than delete-and-recreate for a TLS mode change: two listeners cannot
          # share a port, so recreating means a window in which the port refuses connections.
          - elasticloadbalancing:ModifyListener
          - elasticloadbalancing:SetSecurityGroups
          - elasticloadbalancing:AddTags
          - elasticloadbalancing:DescribeTags
          - ec2:CreateSecurityGroup
          - ec2:DeleteSecurityGroup
          - ec2:AuthorizeSecurityGroupIngress
          - ec2:RevokeSecurityGroupIngress
          - ec2:AuthorizeSecurityGroupEgress
          - ec2:CreateTags
          # Logs: one group per region, with a retention policy so a Collector does not accumulate
          # unbounded log cost in the customer's account.
          - logs:CreateLogGroup
          - logs:DeleteLogGroup
          - logs:PutRetentionPolicy
          - logs:TagResource
          - logs:ListTagsForResource
          - secretsmanager:CreateSecret
          - secretsmanager:PutSecretValue
          - secretsmanager:DescribeSecret
          - secretsmanager:DeleteSecret
          - secretsmanager:TagResource
          - secretsmanager:RestoreSecret
          - iam:PassRole
          - application-autoscaling:RegisterScalableTarget
          - application-autoscaling:DeregisterScalableTarget
          - application-autoscaling:PutScalingPolicy
          - application-autoscaling:DescribeScalableTargets
          - application-autoscaling:DescribeScalingPolicies
          - application-autoscaling:ListTagsForResource
          # RegisterScalableTarget sends Tags on creation, which requires TagResource authorization.
          - application-autoscaling:TagResource
          - cloudwatch:PutMetricAlarm
          - cloudwatch:DeleteAlarms
          - cloudwatch:DescribeAlarms

  # The regional IaC documents and their guidance are authored here; the connector fills
  # values discovered or configured at runtime and evaluates the scaling-mode branches.
  instructions:
    notes:
      - "In manual mode the connector reads Collector state with its existing AWS credentials. Apply the infrastructure documents with your own IaC principal."
      - "These artifacts are customer-owned. They set odigos-iac for attribution and deliberately omit odigos-managed, so Odigos observes the Collector and never deletes or converges these resources."
      - "Create odigos/collector/{{.ConnectorName}}/{{.Region}}/credential first, issue the one-time manual credential through the authenticated admin API, and put the returned Bearer header into that secret. Create odigos/collector/{{.ConnectorName}}/{{.Region}}/license as JSON with username odigos and password equal to the on-prem token. The execution role must read both secrets and write /odigos/collector/{{.ConnectorName}}."
      - "The NLB and tasks share a security group. Allow TCP 13133 from that same group for target health checks, and give the task egress to the OpAMP endpoint and destination endpoints."
    documents:
      - id: aws-fargate-collector-cloudformation
        variant: "cloudformation"
        variantLabel: "CloudFormation"
        title: "Deploy the regional Collector"
        description: "Deploy this customer-owned ECS Fargate service in {{.Region}}."
        format: "yaml"
        steps:
          - "Apply with your own IaC principal. The connector observes the finished Collector using its configured AWS credentials."
          - "Create the credential secret first, issue its one-time Bearer header through the authenticated admin API, and store that header as its value. The licence secret must contain JSON with username odigos and password equal to your on-prem token."
          - "Save the template as `odigos-collector-regional.yaml`. The cluster, role, subnets, security group and credential secret are filled from the values saved during setup. Use your own provisioning principal."
          - "Run `LICENSE_SECRET_ARN=$(aws secretsmanager describe-secret --region {{.Region}} --secret-id {{quote .LicenseSecretName}} --query ARN --output text) && aws cloudformation deploy --region {{.Region}} --stack-name odigos-collector-{{.ConnectorName}}-{{.Region}} --template-file odigos-collector-regional.yaml --parameter-overrides LicenseSecretArn=\"${LICENSE_SECRET_ARN}\"` after creating the licence secret. All other required stack parameters have defaults from this Collector configuration."
          - "If Collector scaling is automatic, pre-create the ECS Application Auto Scaling service-linked role or give the stack principal `iam:CreateServiceLinkedRole` for its first use in this account."
          - "Use the existing cluster, /odigos/collector/{{.ConnectorName}} log group, security group and subnets in {{.Network}}. The connector discovers the NLB endpoint; do not set endpointOverride."
          - "After deployment, verify the ECS service with `aws ecs describe-services --region {{.Region}} --cluster {{.ClusterRef}} --services odigos-collector-{{.Region}} --query 'services[].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount}' --output table`, then wait for the Collector to report Healthy in Odigos."
          - "When adding a routing destination, replace <WORKLOAD_SECURITY_GROUP_ID> with the sender group and allow ingress using `aws ec2 authorize-security-group-ingress --region {{.Region}} --group-id {{.SecurityGroupID}} --protocol tcp --port 4317 --source-group \"<WORKLOAD_SECURITY_GROUP_ID>\"` and `aws ec2 authorize-security-group-ingress --region {{.Region}} --group-id {{.SecurityGroupID}} --protocol tcp --port 4318 --source-group \"<WORKLOAD_SECURITY_GROUP_ID>\"`. Repeat for each sender group; an existing identical rule needs no change. Preserve your workload egress, routes and subnet ACLs."
        template: |
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Customer-owned Odigos regional Collector for {{.Region}}
          Parameters:
            ClusterArn: { Type: String, Default: {{quote .ClusterRef}} }
            ClusterName: { Type: String, Default: {{quote .ClusterName}} }
            ExecutionRoleArn: { Type: String, Default: {{quote .ExecutionRoleARN}} }
            CloudWatchLogGroup: { Type: String, Default: {{quote .LogGroupName}}, AllowedValues: [{{quote .LogGroupName}}] }
            SubnetIds: { Type: 'List<AWS::EC2::Subnet::Id>', Default: {{quote .SubnetIDsCSV}} }
            SecurityGroupId: { Type: 'AWS::EC2::SecurityGroup::Id', Default: {{quote .SecurityGroupID}} }
            LicenseSecretArn: { Type: String, NoEcho: true, Description: 'JSON registry credential under odigos/collector/{{.ConnectorName}}/{{.Region}}/license' }
            OpampAuthorizationSecretArn: { Type: String, Default: {{quote .CredentialSecretARN}}, NoEcho: true, Description: 'Bearer header secret under odigos/collector/{{.ConnectorName}}/{{.Region}}/credential' }
            BootstrapSecretArn: { Type: String, Default: '', NoEcho: true }
          Conditions:
            HasBootstrapSecret: !Not [!Equals [!Ref BootstrapSecretArn, '']]
          Resources:
            CollectorTaskDefinition:
              Type: AWS::ECS::TaskDefinition
              Properties:
                Family: {{.TaskDefinitionFamily}}
                Cpu: '{{.CPU}}'
                Memory: '{{.Memory}}'
                NetworkMode: awsvpc
                RequiresCompatibilities: [FARGATE]
                RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: {{.Arch}} }
                ExecutionRoleArn: !Ref ExecutionRoleArn
                ContainerDefinitions:
                  - Name: collector
                    Image: {{.Image}}
                    Essential: true
          {{if not .PublicECRImage}}          RepositoryCredentials: { CredentialsParameter: !Ref LicenseSecretArn }{{end}}
                    Command: [/odigosopampsupervisor, --config=/etc/odigos/managed-collector/supervisor.yaml]
                    PortMappings: [{ContainerPort: 4317}, {ContainerPort: 4318}, {ContainerPort: 13133}, {ContainerPort: 13134}]
                    Environment:
                      - { Name: ODIGOS_CLOUD_PROVIDER, Value: aws }
                      - { Name: ODIGOS_CLOUD_CONNECTOR_ID, Value: '{{.ConnectorID}}' }
                      - { Name: ODIGOS_OPAMP_ENDPOINT, Value: '{{.OpAMPEndpoint}}' }
                    Secrets:
                      - { Name: ODIGOS_ONPREM_TOKEN, ValueFrom: !Sub '${LicenseSecretArn}:password::' }
                      - { Name: ODIGOS_OPAMP_AUTHORIZATION, ValueFrom: !Ref OpampAuthorizationSecretArn }
                      - !If [HasBootstrapSecret, { Name: ODIGOS_COLLECTOR_BOOTSTRAP_CONFIG, ValueFrom: !Ref BootstrapSecretArn }, !Ref 'AWS::NoValue']
                    LogConfiguration: { LogDriver: awslogs, Options: { awslogs-group: !Ref CloudWatchLogGroup, awslogs-region: {{.Region}}, awslogs-stream-prefix: collector } }
                Tags:
                  - { Key: odigos-component, Value: collector }
                  - { Key: odigos-connector, Value: {{.ConnectorName}} }
                  - { Key: odigos-connector-id, Value: {{.ConnectorID}} }
                  - { Key: odigos-region, Value: {{.Region}} }
                  - { Key: odigos-network, Value: {{.Network}} }
                  - { Key: odigos-iac, Value: customer }
            CollectorService:
              Type: AWS::ECS::Service
              DependsOn: [GrpcListener, HttpListener]
              Properties:
                Cluster: !Ref ClusterArn
                ServiceName: {{.ServiceName}}
                TaskDefinition: !Ref CollectorTaskDefinition
                LaunchType: FARGATE{{if not .ScalingAutomatic}}
                DesiredCount: {{.DesiredCount}}{{end}}
                HealthCheckGracePeriodSeconds: 120
                DeploymentConfiguration: { MinimumHealthyPercent: 100, MaximumPercent: 200 }
                PropagateTags: SERVICE
                LoadBalancers:
                  - { ContainerName: collector, ContainerPort: 4317, TargetGroupArn: !Ref GrpcTargetGroup }
                  - { ContainerName: collector, ContainerPort: 4318, TargetGroupArn: !Ref HttpTargetGroup }
                NetworkConfiguration: { AwsvpcConfiguration: { AssignPublicIp: {{.PublicIPString}}, Subnets: !Ref SubnetIds, SecurityGroups: [!Ref SecurityGroupId] } }
                Tags:
                  - { Key: odigos-component, Value: collector }
                  - { Key: odigos-connector, Value: {{.ConnectorName}} }
                  - { Key: odigos-connector-id, Value: {{.ConnectorID}} }
                  - { Key: odigos-region, Value: {{.Region}} }
                  - { Key: odigos-network, Value: {{.Network}} }
                  - { Key: odigos-iac, Value: customer }

            CollectorNlb:
              Type: AWS::ElasticLoadBalancingV2::LoadBalancer
              Properties:
                Name: {{.LoadBalancerName}}
                Type: network
                Scheme: internal
                Subnets: !Ref SubnetIds
                SecurityGroups: [!Ref SecurityGroupId]
                Tags:
                  - { Key: odigos-component, Value: collector }
                  - { Key: odigos-connector, Value: {{.ConnectorName}} }
                  - { Key: odigos-connector-id, Value: {{.ConnectorID}} }
                  - { Key: odigos-region, Value: {{.Region}} }
                  - { Key: odigos-network, Value: {{.Network}} }
                  - { Key: odigos-iac, Value: customer }
            GrpcTargetGroup:
              Type: AWS::ElasticLoadBalancingV2::TargetGroup
              Properties: { Name: {{.TargetGroupGRPC}}, Port: 4317, Protocol: TCP, TargetType: ip, VpcId: '{{.Network}}', HealthCheckPort: '13133', HealthCheckProtocol: TCP, TargetGroupAttributes: [{Key: preserve_client_ip.enabled, Value: 'true'}, {Key: load_balancing.cross_zone.enabled, Value: 'true'}], Tags: [{Key: odigos-component, Value: collector}, {Key: odigos-connector, Value: {{.ConnectorName}}}, {Key: odigos-connector-id, Value: {{.ConnectorID}}}, {Key: odigos-region, Value: {{.Region}}}, {Key: odigos-network, Value: {{.Network}}}, {Key: odigos-iac, Value: customer}] }
            HttpTargetGroup:
              Type: AWS::ElasticLoadBalancingV2::TargetGroup
              Properties: { Name: {{.TargetGroupHTTP}}, Port: 4318, Protocol: TCP, TargetType: ip, VpcId: '{{.Network}}', HealthCheckPort: '13133', HealthCheckProtocol: TCP, TargetGroupAttributes: [{Key: preserve_client_ip.enabled, Value: 'true'}, {Key: load_balancing.cross_zone.enabled, Value: 'true'}], Tags: [{Key: odigos-component, Value: collector}, {Key: odigos-connector, Value: {{.ConnectorName}}}, {Key: odigos-connector-id, Value: {{.ConnectorID}}}, {Key: odigos-region, Value: {{.Region}}}, {Key: odigos-network, Value: {{.Network}}}, {Key: odigos-iac, Value: customer}] }
            GrpcListener:
              Type: AWS::ElasticLoadBalancingV2::Listener
              Properties: { LoadBalancerArn: !Ref CollectorNlb, Port: 4317, Protocol: TCP, DefaultActions: [{Type: forward, TargetGroupArn: !Ref GrpcTargetGroup}] }
            HttpListener:
              Type: AWS::ElasticLoadBalancingV2::Listener
              Properties: { LoadBalancerArn: !Ref CollectorNlb, Port: 4318, Protocol: TCP, DefaultActions: [{Type: forward, TargetGroupArn: !Ref HttpTargetGroup}] }{{if .ScalingAutomatic}}
            CollectorScalableTarget:
              Type: AWS::ApplicationAutoScaling::ScalableTarget
              DependsOn: CollectorService
              Properties: { MaxCapacity: {{.ScalingMax}}, MinCapacity: {{.ScalingMin}}, ResourceId: !Sub 'service/${ClusterName}/{{.ServiceName}}', ScalableDimension: 'ecs:service:DesiredCount', ServiceNamespace: ecs }
            CollectorCpuPolicy:
              Type: AWS::ApplicationAutoScaling::ScalingPolicy
              Properties: { PolicyName: {{quote .CPUPolicyName}}, PolicyType: TargetTrackingScaling, ScalingTargetId: !Ref CollectorScalableTarget, TargetTrackingScalingPolicyConfiguration: { PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }, TargetValue: {{.TargetCPUPercent}} } }
            CollectorMemoryPolicy:
              Type: AWS::ApplicationAutoScaling::ScalingPolicy
              Properties: { PolicyName: {{quote .MemoryPolicyName}}, PolicyType: TargetTrackingScaling, ScalingTargetId: !Ref CollectorScalableTarget, TargetTrackingScalingPolicyConfiguration: { PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageMemoryUtilization }, TargetValue: {{.TargetMemoryPercent}} } }
          {{end}}
          Outputs:
            OtlpGrpcEndpoint: { Value: !Sub '${CollectorNlb.DNSName}:4317' }
            OtlpHttpEndpoint: { Value: !Sub 'http://${CollectorNlb.DNSName}:4318' }
      - id: aws-fargate-collector-aws-cli
        variant: "aws-cli"
        variantLabel: "AWS CLI"
        title: "Deploy the regional Collector with AWS CLI"
        description: "Run these direct AWS CLI commands in {{.Region}} with your own deployment principal."
        format: "shell"
        steps:
          - "Install AWS CLI and jq, save the script as `odigos-collector-install.sh`, and run `bash odigos-collector-install.sh`. If you paste it, paste the whole parenthesized block; a failure stops that block and leaves your terminal open."
          - "Create the credential and licence secrets first. The cluster, execution role, subnets, security group and credential secret are filled from the values saved during setup. The licence secret ARN is looked up from its known name."
          - "Run with a principal allowed to create ECS, NLB and autoscaling resources. The connector's manual-mode AWS permissions remain read-only."
          - "If Collector scaling is automatic, pre-create the ECS Application Auto Scaling service-linked role or give this provisioning principal `iam:CreateServiceLinkedRole` for its first use in this account."
          - "Keep the identity and odigos-iac tags; do not add odigos-managed. Re-running this script reuses the named load balancer, target groups, listeners and ECS service, then updates the service to the new task definition."
          - "After deployment, verify the ECS service with `aws ecs describe-services --region {{.Region}} --cluster {{.ClusterRef}} --services odigos-collector-{{.Region}} --query 'services[].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount}' --output table`, then wait for the Collector to report Healthy in Odigos."
          - "When adding a routing destination, replace <WORKLOAD_SECURITY_GROUP_ID> with the sender group and allow ingress using `aws ec2 authorize-security-group-ingress --region {{.Region}} --group-id {{.SecurityGroupID}} --protocol tcp --port 4317 --source-group \"<WORKLOAD_SECURITY_GROUP_ID>\"` and `aws ec2 authorize-security-group-ingress --region {{.Region}} --group-id {{.SecurityGroupID}} --protocol tcp --port 4318 --source-group \"<WORKLOAD_SECURITY_GROUP_ID>\"`. Repeat for each sender group; an existing identical rule needs no change. Preserve your workload egress, routes and subnet ACLs."
        template: |-
          #!/usr/bin/env bash
          (
          set -o pipefail
          trap 'odigos_exit_code=$?; printf "Collector deployment stopped at line %s (exit %s). Check the AWS error above.\n" "$LINENO" "$odigos_exit_code" >&2; exit "$odigos_exit_code"' ERR
          REGION={{quote .Region}}
          VPC_ID={{quote .Network}}
          CLUSTER_ARN={{quote .ClusterRef}}
          CLUSTER_NAME={{quote .ClusterName}}
          EXECUTION_ROLE_ARN={{quote .ExecutionRoleARN}}
          SUBNET_IDS=({{range .SubnetIDs}}{{quote .}} {{end}})
          SECURITY_GROUP_ID={{quote .SecurityGroupID}}
          CREDENTIAL_SECRET_ARN={{quote .CredentialSecretARN}}
          BOOTSTRAP_SECRET_ARN=''
          IMAGE={{quote .Image}}
          TASK_FAMILY={{quote .TaskDefinitionFamily}}
          SERVICE_NAME={{quote .ServiceName}}
          NLB_NAME={{quote .LoadBalancerName}}
          GRPC_TARGET_NAME={{quote .TargetGroupGRPC}}
          HTTP_TARGET_NAME={{quote .TargetGroupHTTP}}
          CPU={{quote .CPU}}
          MEMORY={{quote .Memory}}
          ARCH={{quote .Arch}}
          DESIRED={{.DesiredCount}}
          PUBLIC_IP={{quote .PublicIPString}}
          CONNECTOR_NAME={{quote .ConnectorName}}
          CONNECTOR_ID={{quote .ConnectorID}}
          OPAMP_ENDPOINT={{quote .OpAMPEndpoint}}
          LOG_GROUP={{quote .LogGroupName}}
          for value in "$CLUSTER_ARN" "$CLUSTER_NAME" "$EXECUTION_ROLE_ARN" "${SUBNET_IDS[@]}" "$SECURITY_GROUP_ID" "$CREDENTIAL_SECRET_ARN" "$IMAGE" "$CONNECTOR_NAME" "$CONNECTOR_ID" "$OPAMP_ENDPOINT"; do
            case "$value" in
              ''|None|*'<'*|*'>'*) echo 'A required Collector value or secret is missing; finish the setup steps before deploying.' >&2; exit 1 ;;
            esac
          done
          printf 'Checking the registry licence secret...\n'
          LICENSE_SECRET_ARN=$(aws secretsmanager describe-secret --region "$REGION" --secret-id {{quote .LicenseSecretName}} --query ARN --output text)
          case "$LICENSE_SECRET_ARN" in
            ''|None|*'<'*|*'>'*) echo 'Create the registry licence secret before deploying.' >&2; exit 1 ;;
          esac
          SUBNETS_JSON=$(printf '%s\n' "${SUBNET_IDS[@]}" | jq -R . | jq -s .)
          ECS_TAG_ARGS=(key=odigos-component,value=collector "key=odigos-connector,value=$CONNECTOR_NAME" "key=odigos-connector-id,value=$CONNECTOR_ID" "key=odigos-region,value=$REGION" "key=odigos-network,value=$VPC_ID" key=odigos-iac,value=customer)
          ELB_TAG_ARGS=(Key=odigos-component,Value=collector "Key=odigos-connector,Value=$CONNECTOR_NAME" "Key=odigos-connector-id,Value=$CONNECTOR_ID" "Key=odigos-region,Value=$REGION" "Key=odigos-network,Value=$VPC_ID" Key=odigos-iac,Value=customer)
          SCALING_TAG_ARGS=(odigos-component=collector "odigos-connector=$CONNECTOR_NAME" "odigos-connector-id=$CONNECTOR_ID" "odigos-region=$REGION" "odigos-network=$VPC_ID" odigos-iac=customer)
          jq -n --arg family "$TASK_FAMILY" --arg cpu "$CPU" --arg memory "$MEMORY" --arg arch "$ARCH" --arg role "$EXECUTION_ROLE_ARN" --arg image "$IMAGE" --arg license "$LICENSE_SECRET_ARN" --arg credential "$CREDENTIAL_SECRET_ARN" --arg region "$REGION" --arg connector "$CONNECTOR_NAME" --arg connectorId "$CONNECTOR_ID" --arg endpoint "$OPAMP_ENDPOINT" --arg logGroup "$LOG_GROUP" '{
            family:$family,cpu:$cpu,memory:$memory,networkMode:"awsvpc",requiresCompatibilities:["FARGATE"],executionRoleArn:$role,
            runtimePlatform:{operatingSystemFamily:"LINUX",cpuArchitecture:$arch},
            containerDefinitions:[{name:"collector",image:$image,essential:true,{{if not .PublicECRImage}}repositoryCredentials:{credentialsParameter:$license},{{end}}
              command:["/odigosopampsupervisor","--config=/etc/odigos/managed-collector/supervisor.yaml"],
              portMappings:([4317,4318,13133,13134]|map({containerPort:.})),
              environment:[{name:"ODIGOS_CLOUD_PROVIDER",value:"aws"},{name:"ODIGOS_CLOUD_CONNECTOR_ID",value:$connectorId},{name:"ODIGOS_OPAMP_ENDPOINT",value:$endpoint}],
              secrets:[{name:"ODIGOS_ONPREM_TOKEN",valueFrom:($license+":password::")},{name:"ODIGOS_OPAMP_AUTHORIZATION",valueFrom:$credential}],
              logConfiguration:{logDriver:"awslogs",options:{"awslogs-group":$logGroup,"awslogs-region":$region,"awslogs-stream-prefix":"collector"}}}]
          }' > odigos-collector-task.json
          if [ -n "$BOOTSTRAP_SECRET_ARN" ]; then
            jq --arg bootstrap "$BOOTSTRAP_SECRET_ARN" '.containerDefinitions[0].secrets += [{name:"ODIGOS_COLLECTOR_BOOTSTRAP_CONFIG",valueFrom:$bootstrap}]' odigos-collector-task.json > odigos-collector-task-with-bootstrap.json
            mv odigos-collector-task-with-bootstrap.json odigos-collector-task.json
          fi
          printf 'Registering the Collector task definition...\n'
          TASK_ARN=$(aws ecs register-task-definition --region "$REGION" --cli-input-json file://odigos-collector-task.json --tags "${ECS_TAG_ARGS[@]}" --query taskDefinition.taskDefinitionArn --output text)
          printf 'Checking the Collector load balancer and target groups...\n'
          NLB_ARN=$(aws elbv2 describe-load-balancers --region "$REGION" --query "LoadBalancers[?LoadBalancerName=='$NLB_NAME'].LoadBalancerArn" --output text)
          if [ -z "$NLB_ARN" ] || [ "$NLB_ARN" = None ]; then
            NLB_ARN=$(aws elbv2 create-load-balancer --region "$REGION" --name "$NLB_NAME" --type network --scheme internal --subnets "${SUBNET_IDS[@]}" --security-groups "$SECURITY_GROUP_ID" --tags "${ELB_TAG_ARGS[@]}" --query 'LoadBalancers[0].LoadBalancerArn' --output text)
          else
            aws elbv2 set-security-groups --region "$REGION" --load-balancer-arn "$NLB_ARN" --security-groups "$SECURITY_GROUP_ID"
          fi
          aws elbv2 wait load-balancer-available --region "$REGION" --load-balancer-arns "$NLB_ARN"
          GRPC_TARGET_ARN=$(aws elbv2 describe-target-groups --region "$REGION" --query "TargetGroups[?TargetGroupName=='$GRPC_TARGET_NAME'].TargetGroupArn" --output text)
          if [ -z "$GRPC_TARGET_ARN" ] || [ "$GRPC_TARGET_ARN" = None ]; then
            GRPC_TARGET_ARN=$(aws elbv2 create-target-group --region "$REGION" --name "$GRPC_TARGET_NAME" --protocol TCP --port 4317 --vpc-id "$VPC_ID" --target-type ip --health-check-protocol TCP --health-check-port 13133 --tags "${ELB_TAG_ARGS[@]}" --query 'TargetGroups[0].TargetGroupArn' --output text)
          fi
          HTTP_TARGET_ARN=$(aws elbv2 describe-target-groups --region "$REGION" --query "TargetGroups[?TargetGroupName=='$HTTP_TARGET_NAME'].TargetGroupArn" --output text)
          if [ -z "$HTTP_TARGET_ARN" ] || [ "$HTTP_TARGET_ARN" = None ]; then
            HTTP_TARGET_ARN=$(aws elbv2 create-target-group --region "$REGION" --name "$HTTP_TARGET_NAME" --protocol TCP --port 4318 --vpc-id "$VPC_ID" --target-type ip --health-check-protocol TCP --health-check-port 13133 --tags "${ELB_TAG_ARGS[@]}" --query 'TargetGroups[0].TargetGroupArn' --output text)
          fi
          for target in "$GRPC_TARGET_ARN" "$HTTP_TARGET_ARN"; do
            aws elbv2 modify-target-group-attributes --region "$REGION" --target-group-arn "$target" --attributes Key=preserve_client_ip.enabled,Value=true Key=load_balancing.cross_zone.enabled,Value=true
          done
          GRPC_LISTENER_ARN=$(aws elbv2 describe-listeners --region "$REGION" --load-balancer-arn "$NLB_ARN" --query 'Listeners[?Port==`4317`].ListenerArn' --output text)
          if [ -z "$GRPC_LISTENER_ARN" ] || [ "$GRPC_LISTENER_ARN" = None ]; then
            aws elbv2 create-listener --region "$REGION" --load-balancer-arn "$NLB_ARN" --protocol TCP --port 4317 --default-actions "Type=forward,TargetGroupArn=$GRPC_TARGET_ARN"
          else
            aws elbv2 modify-listener --region "$REGION" --listener-arn "$GRPC_LISTENER_ARN" --default-actions "Type=forward,TargetGroupArn=$GRPC_TARGET_ARN"
          fi
          HTTP_LISTENER_ARN=$(aws elbv2 describe-listeners --region "$REGION" --load-balancer-arn "$NLB_ARN" --query 'Listeners[?Port==`4318`].ListenerArn' --output text)
          if [ -z "$HTTP_LISTENER_ARN" ] || [ "$HTTP_LISTENER_ARN" = None ]; then
            aws elbv2 create-listener --region "$REGION" --load-balancer-arn "$NLB_ARN" --protocol TCP --port 4318 --default-actions "Type=forward,TargetGroupArn=$HTTP_TARGET_ARN"
          else
            aws elbv2 modify-listener --region "$REGION" --listener-arn "$HTTP_LISTENER_ARN" --default-actions "Type=forward,TargetGroupArn=$HTTP_TARGET_ARN"
          fi
          jq -n --arg cluster "$CLUSTER_ARN" --arg service "$SERVICE_NAME" --arg task "$TASK_ARN" --argjson desired "$DESIRED" --argjson subnets "$SUBNETS_JSON" --arg group "$SECURITY_GROUP_ID" --arg public "$PUBLIC_IP" --arg grpc "$GRPC_TARGET_ARN" --arg http "$HTTP_TARGET_ARN" '{
            cluster:$cluster,serviceName:$service,taskDefinition:$task,launchType:"FARGATE",desiredCount:$desired,
            healthCheckGracePeriodSeconds:120,deploymentConfiguration:{minimumHealthyPercent:100,maximumPercent:200},
            propagateTags:"SERVICE",
            networkConfiguration:{awsvpcConfiguration:{subnets:$subnets,securityGroups:[$group],assignPublicIp:$public}},
            loadBalancers:[{targetGroupArn:$grpc,containerName:"collector",containerPort:4317},{targetGroupArn:$http,containerName:"collector",containerPort:4318}]
          }' > odigos-collector-service.json
          SERVICE_STATUS=$(aws ecs describe-services --region "$REGION" --cluster "$CLUSTER_ARN" --services "$SERVICE_NAME" --query 'services[0].status' --output text)
          case "$SERVICE_STATUS" in
            ACTIVE)
              jq '{cluster,service:.serviceName,taskDefinition,desiredCount,networkConfiguration,loadBalancers,forceNewDeployment:true}' odigos-collector-service.json > odigos-collector-service-update.json
              printf 'Updating the existing Collector service...\n'
              aws ecs update-service --region "$REGION" --cli-input-json file://odigos-collector-service-update.json
              ;;
            ''|None|INACTIVE)
              printf 'Creating the Collector service...\n'
              aws ecs create-service --region "$REGION" --cli-input-json file://odigos-collector-service.json --tags "${ECS_TAG_ARGS[@]}"
              ;;
            *) printf 'Collector service %s is %s; finish its current transition before retrying.\n' "$SERVICE_NAME" "$SERVICE_STATUS" >&2; exit 1 ;;
          esac
          {{if .ScalingAutomatic}}
          RESOURCE_ID=$(printf 'service/%s/%s' "$CLUSTER_NAME" "$SERVICE_NAME")
          aws application-autoscaling register-scalable-target --region "$REGION" --service-namespace ecs --scalable-dimension ecs:service:DesiredCount --resource-id "$RESOURCE_ID" --min-capacity {{.ScalingMin}} --max-capacity {{.ScalingMax}} --tags "${SCALING_TAG_ARGS[@]}"
          aws application-autoscaling put-scaling-policy --region "$REGION" --policy-name {{quote .CPUPolicyName}} --policy-type TargetTrackingScaling --service-namespace ecs --scalable-dimension ecs:service:DesiredCount --resource-id "$RESOURCE_ID" --target-tracking-scaling-policy-configuration '{"TargetValue":{{.TargetCPUPercent}},"PredefinedMetricSpecification":{"PredefinedMetricType":"ECSServiceAverageCPUUtilization"}}'
          aws application-autoscaling put-scaling-policy --region "$REGION" --policy-name {{quote .MemoryPolicyName}} --policy-type TargetTrackingScaling --service-namespace ecs --scalable-dimension ecs:service:DesiredCount --resource-id "$RESOURCE_ID" --target-tracking-scaling-policy-configuration '{"TargetValue":{{.TargetMemoryPercent}},"PredefinedMetricSpecification":{"PredefinedMetricType":"ECSServiceAverageMemoryUtilization"}}'
          {{end}}
          aws ecs wait services-stable --region "$REGION" --cluster "$CLUSTER_ARN" --services "$SERVICE_NAME"
          DNS_NAME=$(aws elbv2 describe-load-balancers --region "$REGION" --load-balancer-arns "$NLB_ARN" --query 'LoadBalancers[0].DNSName' --output text)
          printf 'OTLP gRPC: %s:4317\nOTLP HTTP: http://%s:4318\n' "$DNS_NAME" "$DNS_NAME"
          )

      - id: aws-fargate-collector-terraform
        variant: "terraform"
        variantLabel: "Terraform / OpenTofu"
        title: "Deploy the regional Collector"
        description: "Apply this customer-owned ECS Fargate service in {{.Region}}."
        format: "hcl"
        steps:
          - "Save the configuration as `odigos-collector.tf` in a dedicated regional workspace. It selects AWS region {{.Region}} and uses your existing provider authentication."
          - "Run `terraform init`, `terraform plan -out=odigos-collector.tfplan`, then `terraform apply odigos-collector.tfplan` after reviewing the plan. For OpenTofu use `tofu init`, `tofu plan -out=odigos-collector.tfplan`, and `tofu apply odigos-collector.tfplan`."
          - "Read the deployed endpoints with `terraform output -raw otlp_grpc_endpoint` and `terraform output -raw otlp_http_endpoint` (OpenTofu: `tofu output -raw otlp_grpc_endpoint` and `tofu output -raw otlp_http_endpoint`). Odigos discovers them from the tagged load balancer; do not paste these endpoints into the OpAMP credential field."
          - "Apply with your own IaC principal. The connector observes the finished Collector using its configured AWS credentials."
          - "Create the credential secret first and put the one-time Bearer header returned by the authenticated admin API into it. The licence secret must contain JSON with username odigos and password equal to your on-prem token."
          - "Set the log group to /odigos/collector/{{.ConnectorName}} and place both secrets under odigos/collector/{{.ConnectorName}}/. The connector discovers the NLB endpoint; do not set endpointOverride. Keep odigos-iac and the identity tags; do not add odigos-managed."
          - "Use aws_appautoscaling_target and target tracking policies if collector.regions.{{.Region}}.scaling.mode is auto; otherwise set desired_count to its configured manual value."
          - "After deployment, verify the ECS service with `aws ecs describe-services --region {{.Region}} --cluster {{.ClusterRef}} --services odigos-collector-{{.Region}} --query 'services[].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount}' --output table`, then wait for the Collector to report Healthy in Odigos."
          - "When adding a routing destination, replace <WORKLOAD_SECURITY_GROUP_ID> with the sender group and allow ingress using `aws ec2 authorize-security-group-ingress --region {{.Region}} --group-id {{.SecurityGroupID}} --protocol tcp --port 4317 --source-group \"<WORKLOAD_SECURITY_GROUP_ID>\"` and `aws ec2 authorize-security-group-ingress --region {{.Region}} --group-id {{.SecurityGroupID}} --protocol tcp --port 4318 --source-group \"<WORKLOAD_SECURITY_GROUP_ID>\"`. Repeat for each sender group; an existing identical rule needs no change. Preserve your workload egress, routes and subnet ACLs."
        template: |-
          provider "aws" {
            region = {{quote .Region}}
          }
          variable "cluster_arn" {
            type = string
            default = {{quote .ClusterRef}}
          }
          variable "cluster_name" {
            type = string
            default = {{quote .ClusterName}}
          }
          variable "execution_role_arn" {
            type = string
            default = {{quote .ExecutionRoleARN}}
          }
          variable "cloudwatch_log_group" {
            type = string
            default = {{quote .LogGroupName}}
            validation {
              condition = var.cloudwatch_log_group == {{quote .LogGroupName}}
              error_message = "The log group must match the documented execution-role scope."
            }
          }
          variable "subnet_ids" {
            type = list(string)
            default = [{{range $index, $id := .SubnetIDs}}{{if $index}}, {{end}}{{quote $id}}{{end}}]
          }
          variable "security_group_ids" {
            type = list(string)
            default = [{{quote .SecurityGroupID}}]
          }
          data "aws_secretsmanager_secret" "license" { name = {{quote .LicenseSecretName}} }
          variable "opamp_authorization_secret_arn" {
            type = string
            default = {{quote .CredentialSecretARN}}
            sensitive = true
          }
          variable "bootstrap_secret_arn" {
            type = string
            default = null
            sensitive = true
          }

          locals {
            collector_tags = {
              "odigos-component" = "collector"
              "odigos-connector" = {{quote .ConnectorName}}
              "odigos-connector-id" = {{quote .ConnectorID}}
              "odigos-region" = {{quote .Region}}
              "odigos-network" = {{quote .Network}}
              "odigos-iac" = "customer"
            }
          }
          resource "aws_ecs_task_definition" "collector" {
            family = {{quote .TaskDefinitionFamily}}
            cpu = {{quote .CPU}}
            memory = {{quote .Memory}}
            network_mode = "awsvpc"
            requires_compatibilities = ["FARGATE"]
            execution_role_arn = var.execution_role_arn
            runtime_platform {
              operating_system_family = "LINUX"
              cpu_architecture = {{quote .Arch}}
            }
            container_definitions = jsonencode([{
              name = "collector"
              image = {{quote .Image}}
              essential = true
          {{if not .PublicECRImage}}    repositoryCredentials = { credentialsParameter = data.aws_secretsmanager_secret.license.arn }{{end}}
              command = ["/odigosopampsupervisor", "--config=/etc/odigos/managed-collector/supervisor.yaml"]
              portMappings = [for p in [4317, 4318, 13133, 13134] : { containerPort = p }]
              environment = [{ name = "ODIGOS_CLOUD_PROVIDER", value = "aws" }, { name = "ODIGOS_CLOUD_CONNECTOR_ID", value = {{quote .ConnectorID}} }, { name = "ODIGOS_OPAMP_ENDPOINT", value = {{quote .OpAMPEndpoint}} }]
              secrets = concat([{ name = "ODIGOS_ONPREM_TOKEN", valueFrom = "${data.aws_secretsmanager_secret.license.arn}:password::" }, { name = "ODIGOS_OPAMP_AUTHORIZATION", valueFrom = var.opamp_authorization_secret_arn }], var.bootstrap_secret_arn == null ? [] : [{ name = "ODIGOS_COLLECTOR_BOOTSTRAP_CONFIG", valueFrom = var.bootstrap_secret_arn }])
              logConfiguration = { logDriver = "awslogs", options = { awslogs-group = var.cloudwatch_log_group, awslogs-region = {{quote .Region}}, awslogs-stream-prefix = "collector" } }
            }])
            tags = local.collector_tags
          }
          resource "aws_ecs_service" "collector" {
            name = {{quote .ServiceName}}
            cluster = var.cluster_arn
            task_definition = aws_ecs_task_definition.collector.arn
            desired_count = {{.DesiredCount}}
            health_check_grace_period_seconds = 120
            deployment_minimum_healthy_percent = 100
            deployment_maximum_percent = 200
            propagate_tags = "SERVICE"
            launch_type = "FARGATE"
            depends_on = [aws_lb_listener.grpc, aws_lb_listener.http]
            load_balancer {
              target_group_arn = aws_lb_target_group.grpc.arn
              container_name = "collector"
              container_port = 4317
            }
            load_balancer {
              target_group_arn = aws_lb_target_group.http.arn
              container_name = "collector"
              container_port = 4318
            }
            network_configuration {
              subnets = var.subnet_ids
              security_groups = var.security_group_ids
              assign_public_ip = {{.AssignPublicIP}}
            }
            tags = local.collector_tags{{if .ScalingAutomatic}}
            lifecycle { ignore_changes = [desired_count] }{{end}}
          }
          resource "aws_lb" "collector" {
            name = {{quote .LoadBalancerName}}
            internal = true
            load_balancer_type = "network"
            subnets = var.subnet_ids
            security_groups = var.security_group_ids
            tags = local.collector_tags
          }
          resource "aws_lb_target_group" "grpc" {
            name = {{quote .TargetGroupGRPC}}
            port = 4317
            protocol = "TCP"
            target_type = "ip"
            vpc_id = {{quote .Network}}
            preserve_client_ip = true
            load_balancing_cross_zone_enabled = "true"
            tags = local.collector_tags
            health_check {
              protocol = "TCP"
              port = "13133"
            }
          }
          resource "aws_lb_target_group" "http" {
            name = {{quote .TargetGroupHTTP}}
            port = 4318
            protocol = "TCP"
            target_type = "ip"
            vpc_id = {{quote .Network}}
            preserve_client_ip = true
            load_balancing_cross_zone_enabled = "true"
            tags = local.collector_tags
            health_check {
              protocol = "TCP"
              port = "13133"
            }
          }
          resource "aws_lb_listener" "grpc" {
            load_balancer_arn = aws_lb.collector.arn
            port = 4317
            protocol = "TCP"
            default_action {
              type = "forward"
              target_group_arn = aws_lb_target_group.grpc.arn
            }
          }
          resource "aws_lb_listener" "http" {
            load_balancer_arn = aws_lb.collector.arn
            port = 4318
            protocol = "TCP"
            default_action {
              type = "forward"
              target_group_arn = aws_lb_target_group.http.arn
            }
          }
          output "otlp_grpc_endpoint" { value = "${aws_lb.collector.dns_name}:4317" }
          output "otlp_http_endpoint" { value = "http://${aws_lb.collector.dns_name}:4318" }
          {{if .ScalingAutomatic}}
          resource "aws_appautoscaling_target" "collector" {
            depends_on = [aws_ecs_service.collector]
            max_capacity = {{.ScalingMax}}
            min_capacity = {{.ScalingMin}}
            resource_id = {{quote .TerraformResourceID}}
            scalable_dimension = "ecs:service:DesiredCount"
            service_namespace = "ecs"
          }
          resource "aws_appautoscaling_policy" "cpu" {
            name = {{quote .CPUPolicyName}}
            policy_type = "TargetTrackingScaling"
            resource_id = aws_appautoscaling_target.collector.resource_id
            scalable_dimension = aws_appautoscaling_target.collector.scalable_dimension
            service_namespace = aws_appautoscaling_target.collector.service_namespace
            target_tracking_scaling_policy_configuration {
              predefined_metric_specification {
                predefined_metric_type = "ECSServiceAverageCPUUtilization"
              }
              target_value = {{.TargetCPUPercent}}
            }
          }
          resource "aws_appautoscaling_policy" "memory" {
            name = {{quote .MemoryPolicyName}}
            policy_type = "TargetTrackingScaling"
            resource_id = aws_appautoscaling_target.collector.resource_id
            scalable_dimension = aws_appautoscaling_target.collector.scalable_dimension
            service_namespace = aws_appautoscaling_target.collector.service_namespace
            target_tracking_scaling_policy_configuration {
              predefined_metric_specification {
                predefined_metric_type = "ECSServiceAverageMemoryUtilization"
              }
              target_value = {{.TargetMemoryPercent}}
            }
          }
          {{end}}

setup:
  subtitle: Apply the selected IAM policy in your AWS account.
  artifacts:
    # PassRole is limited by explicit resource and service denies in every policy format.
    - id: policy-preview
      section: permissions
      title: Policy preview
      description: >-
        The IAM policy Odigos needs for the selected access level. The AWS CLI and IAM-user setup
        methods embed this policy in their setup script. PassRole is restricted to the explicitly supplied execution role ARNs and the ECS tasks or Bedrock AgentCore services. Include AgentCore runtime execution roles in the supplied role list when enabling AgentCore automatic instrumentation.
      format: json
      itemTemplate: '"{{permission}}"'
      itemSeparator: ",\n"
      template: |-
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "OdigosCloudConnector",
              "Effect": "Allow",
              "Action": [
                {{permissions}}
              ],
              "Resource": "*"
            },
            {
              "Sid": "RestrictPassRoleService",
              "Effect": "Deny",
              "Action": "iam:PassRole",
              "Resource": "*",
              "Condition": { "StringNotEquals": { "iam:PassedToService": ["ecs-tasks.amazonaws.com", "bedrock-agentcore.amazonaws.com"] } }
            },
            {
              "Sid": "RestrictPassRoleResources",
              "Effect": "Deny",
              "Action": "iam:PassRole",
              "NotResource": {{passRoleResources}}
            },
            {
              "Sid": "RestrictApplicationSignalsRoles",
              "Effect": "Deny",
              "Action": "iam:AttachRolePolicy",
              "NotResource": {{applicationSignalsRoleResources}}
            },
            {
              "Sid": "DenyUnrelatedPolicyAttachments",
              "Effect": "Deny",
              "Action": "iam:AttachRolePolicy",
              "Resource": "*",
              "Condition": {
                "ArnNotLike": { "iam:PolicyARN": "arn:*:iam::aws:policy/CloudWatchLambdaApplicationSignalsExecutionRolePolicy" }
              }
            },
            {
              "Sid": "DenyUnrelatedServiceLinkedRoles",
              "Effect": "Deny",
              "Action": "iam:CreateServiceLinkedRole",
              "Resource": "*",
              "Condition": {
                "StringNotEquals": { "iam:AWSServiceName": "application-signals.cloudwatch.amazonaws.com" }
              }
            }
          ]
        }

    - id: collector-auto-execution-role
      section: collector:aws.fargate-collector:automatic
      variantLabel: Overview
      title: Pre-create the Collector task execution role
      description: >-
        Create the role ECS uses to pull the Collector image, read only this connector's Collector
        secrets and write only this connector's Collector logs. Odigos uses the ARN but never creates,
        changes, tags or deletes the role. Create it once for this connector in the AWS account and
        reuse the ARN in every Collector region in that account.
      format: yaml
      steps:
        - Save the template below as `odigos-collector-execution-role.yaml`.
        - 'Run `aws cloudformation deploy --stack-name odigos-collector-{{connectorName}}-execution --template-file odigos-collector-execution-role.yaml --capabilities CAPABILITY_IAM --parameter-overrides ConnectorName={{connectorName}}` once in the Collector account. IAM roles are account-wide; reuse the role in other regions.'
        - 'In the same account and stack region, run `aws cloudformation describe-stacks --stack-name odigos-collector-{{connectorName}}-execution --query "Stacks[0].Outputs[?OutputKey==''ExecutionRoleArn''].OutputValue | [0]" --output text` and paste the output into Task execution role ARN. You can also copy ExecutionRoleArn from the stack Outputs tab.'
        - >-
          On the connector identity in automatic mode, allow `iam:PassRole` only for the output ARN and add the condition
          `iam:PassedToService = ecs-tasks.amazonaws.com`. Do not grant `CreateRole`, `PutRolePolicy`,
          `TagRole` or `DeleteRole`.
        - >-
          If `image.repositoryOverride` points at private ECR, add `ecr:GetAuthorizationToken` plus
          `ecr:BatchCheckLayerAvailability`, `ecr:BatchGetImage` and `ecr:GetDownloadUrlForLayer` for that
          repository. The default public image needs no ECR permission.
        - If the Collector secrets use a customer-managed KMS key, also allow `kms:Decrypt` on that key for the task execution role.
      template: &collector-execution-role |-
        AWSTemplateFormatVersion: "2010-09-09"
        Description: Customer-owned ECS task execution role for Odigos managed Collectors.

        Parameters:
          ConnectorName:
            Type: String
            MinLength: 1
            Description: Exact name of this connector in Odigos.

        Resources:
          CollectorExecutionRole:
            Type: AWS::IAM::Role
            Properties:
              Description: Customer-owned execution role for Odigos Collector Fargate tasks.
              AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Sid: EcsTasksAssume
                    Effect: Allow
                    Principal:
                      Service: ecs-tasks.amazonaws.com
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        aws:SourceAccount: !Ref AWS::AccountId
                      ArnLike:
                        aws:SourceArn: !Sub arn:${AWS::Partition}:ecs:*:${AWS::AccountId}:*
              Policies:
                - PolicyName: odigos-collector-execution
                  PolicyDocument:
                    Version: "2012-10-17"
                    Statement:
                      - Sid: CollectorLogs
                        Effect: Allow
                        Action:
                          - logs:CreateLogStream
                          - logs:PutLogEvents
                        Resource: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/odigos/collector/${ConnectorName}:*
                      - Sid: CollectorSecrets
                        Effect: Allow
                        Action: secretsmanager:GetSecretValue
                        Resource: !Sub arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:odigos/collector/${ConnectorName}/*
        Outputs:
          ExecutionRoleArn:
            Description: Supply as providerOverrides.aws.executionRoleArn.
            Value: !GetAtt CollectorExecutionRole.Arn

    - id: collector-auto-region
      section: collector:aws.fargate-collector:automatic
      title: Select the Collector region
      description: Choose the AWS region where the existing ECS cluster and Collector network are located.
      format: text
      template: 'Select the region in the field below.'

    - id: collector-auto-cluster
      section: collector:aws.fargate-collector:automatic
      title: List ECS clusters and choose one
      description: >-
        Choose an existing ACTIVE ECS cluster in this AWS account and region where the Collector
        Fargate service should run. A cluster does not need an existing service or EC2 instances.
        Odigos will create the Collector service here, but will not create the cluster.
      format: shell
      steps:
        - Run the first command to list cluster ARNs, then paste one ARN in the ECS cluster field below.
        - The second command uses that field as you type. Run it to confirm the selected cluster is ACTIVE.
      template: |-
        aws ecs list-clusters --region {{region}} --query 'clusterArns[]' --output table
        aws ecs describe-clusters --region {{region}} --clusters '{{clusterRef}}' --query 'clusters[].{ARN:clusterArn,Status:status}' --output table

    - id: collector-auto-network
      section: collector:aws.fargate-collector:automatic
      title: Choose the VPC and subnets
      description: >-
        Choose an available VPC in the selected account and region. VPC ID is required.
        Subnet IDs are optional and not entered here: Odigos chooses
        subnets with free IP addresses and usable outbound routes, preferably in two availability zones.
      format: shell
      steps:
        - List every VPC and inspect its ID, CIDR, state and default flag. Paste the chosen ID below.
        - The next commands use that field as you type. Check for subnets with free IP addresses and the effective route table for each subnet; subnets without an explicit association use the main table.
      template: |-
        aws ec2 describe-vpcs --region {{region}} --query 'Vpcs[].{ID:VpcId,CIDR:CidrBlock,State:State,Default:IsDefault}' --output table
        aws ec2 describe-subnets --region {{region}} --filters Name=vpc-id,Values={{networkId}} --query 'Subnets[].{ID:SubnetId,Zone:AvailabilityZone,FreeIPs:AvailableIpAddressCount,DefaultPublicIP:MapPublicIpOnLaunch}' --output table
        aws ec2 describe-route-tables --region {{region}} --filters Name=vpc-id,Values={{networkId}} --query 'RouteTables[].{ID:RouteTableId,Associations:Associations[].{Subnet:SubnetId,Main:Main},Routes:Routes[?DestinationCidrBlock==`0.0.0.0/0`]}' --output json

    - id: collector-auto-egress
      section: collector:aws.fargate-collector:automatic
      title: Choose the outbound path
      description: >-
        This controls how the Collector task reaches image registries, Secrets Manager, Odigos OpAMP
        and the telemetry destination. Private assigns no public IP and needs an active default route
        to NAT or central egress. Public assigns a task public IP and needs an internet-gateway route.
        Endpoint-only subnets must be pinned separately in regional settings. The Collector load
        balancer stays internal in either case.
      format: text
      template: 'Choose the path available from the VPC subnets. This setting controls task egress, not how workloads send telemetry to the Collector.'

    - id: collector-auto-size
      section: collector:aws.fargate-collector:automatic
      title: Choose the Collector size
      description: Select the CPU and memory for the regional ECS task.
      format: text
      template: 'Select a size below.'

    - id: collector-auto-scaling-linked-role
      section: collector:aws.fargate-collector:automatic
      title: Prepare automatic scaling when selected
      description: Only needed if `scaling.mode` is `auto`; the connector never creates this account-level role.
      format: shell
      template: |-
        aws iam get-role --role-name AWSServiceRoleForApplicationAutoScaling_ECSService ||
          aws iam create-service-linked-role --aws-service-name ecs.application-autoscaling.amazonaws.com

    - id: collector-auto-install-values
      section: collector:aws.fargate-collector:automatic
      title: Review and install the regional Collector
      description: Confirm the task execution role, cluster and network values. Odigos then creates the regional AWS Collector resources.
      format: text
      template: |-
        Review the selected region, task execution role ARN, active ECS cluster, VPC,
        outbound path and size below. Install Collector creates the AWS resources.

    - id: collector-manual-execution-role
      section: collector:aws.fargate-collector:manual
      variantLabel: Overview
      title: Create the customer-owned task execution role
      description: >-
        Create this scoped ECS task execution role once for this connector in the AWS account. Reuse
        its ARN for Collectors in every region of that account. Add `kms:Decrypt` on any customer-managed
        key used for the Collector secrets.
      format: yaml
      steps:
        - Save the template below as `odigos-collector-execution-role.yaml`.
        - 'Run `aws cloudformation deploy --stack-name odigos-collector-{{connectorName}}-execution --template-file odigos-collector-execution-role.yaml --capabilities CAPABILITY_IAM --parameter-overrides ConnectorName={{connectorName}}` once in the Collector account. IAM roles are account-wide; reuse the role in other regions.'
        - 'In the same account and stack region, run `aws cloudformation describe-stacks --stack-name odigos-collector-{{connectorName}}-execution --query "Stacks[0].Outputs[?OutputKey==''ExecutionRoleArn''].OutputValue | [0]" --output text` and paste the output into Task execution role ARN. You can also copy ExecutionRoleArn from the stack Outputs tab.'
      template: *collector-execution-role

    - id: collector-manual-region
      section: collector:aws.fargate-collector:manual
      title: Select the Collector region
      description: Choose the AWS region where the existing ECS cluster and Collector network are located.
      format: text
      template: 'Select the region in the field below.'

    - id: collector-manual-cluster
      section: collector:aws.fargate-collector:manual
      title: List ECS clusters and choose one
      description: >-
        Choose an existing ACTIVE ECS cluster in this AWS account and region where you will deploy
        the Collector Fargate service. It needs no existing service or EC2 instances. Odigos observes
        the cluster and does not create it in manual mode.
      format: shell
      steps:
        - Run the first command to list cluster ARNs, then paste one ARN in the ECS cluster field below.
        - The second command uses that field as you type. Run it to confirm the selected cluster is ACTIVE.
      template: |-
        aws ecs list-clusters --region {{region}} --query 'clusterArns[]' --output table
        aws ecs describe-clusters --region {{region}} --clusters '{{clusterRef}}' --query 'clusters[].{ARN:clusterArn,Status:status}' --output table

    - id: collector-manual-network
      section: collector:aws.fargate-collector:manual
      title: Choose the Collector VPC
      description: >-
        Choose an available VPC in this account and region for the Collector.
      format: shell
      steps:
        - List every VPC and inspect its ID, CIDR, state and default flag. Paste the chosen ID below.
        - Choose a VPC with subnets and an outbound path for image pulls, Secrets Manager, OpAMP and telemetry export.
      template: |-
        aws ec2 describe-vpcs --region {{region}} --query 'Vpcs[].{ID:VpcId,CIDR:CidrBlock,State:State,Default:IsDefault}' --output table

    - id: collector-manual-subnets
      section: collector:aws.fargate-collector:manual
      title: Choose the Collector subnets
      description: >-
        Select the exact subnet IDs for the customer-owned ECS service and internal load balancer.
        Choose subnets in the selected VPC with free IP addresses and a working outbound path;
        prefer two availability zones. Odigos records and validates your selection, then includes
        it in the generated deployment. It does not select subnets in manual mode.
      format: shell
      steps:
        - List the VPC subnets and paste one or more subnet IDs in the field below, separated by commas.
        - Inspect each subnet's effective route table. A subnet without an explicit association uses the main route table.
        - For private outbound access, choose subnets with NAT or central egress. Public outbound access needs an internet gateway route and a public IP on the Collector task.
      template: |-
        aws ec2 describe-subnets --region {{region}} --filters Name=vpc-id,Values={{networkId}} --query 'Subnets[].{ID:SubnetId,Zone:AvailabilityZone,FreeIPs:AvailableIpAddressCount,DefaultPublicIP:MapPublicIpOnLaunch}' --output table
        aws ec2 describe-route-tables --region {{region}} --filters Name=vpc-id,Values={{networkId}} --query 'RouteTables[].{ID:RouteTableId,Associations:Associations[].{Subnet:SubnetId,Main:Main},Routes:Routes[?DestinationCidrBlock==`0.0.0.0/0`]}' --output json

    - id: collector-manual-egress
      section: collector:aws.fargate-collector:manual
      title: Choose the outbound path
      description: >-
        This controls how the Collector task reaches image registries, Secrets Manager, Odigos OpAMP
        and the telemetry destination. Private assigns no public IP and needs an active default route
        to NAT or central egress. Public assigns a task public IP and needs an internet-gateway route.
        Endpoint-only subnets must be pinned separately in regional settings. The Collector load
        balancer stays internal in either case.
      format: text
      template: 'Choose the path available from the VPC subnets. This setting controls task egress, not how workloads send telemetry to the Collector.'

    - id: collector-manual-size
      section: collector:aws.fargate-collector:manual
      title: Choose the Collector size
      description: Select the CPU and memory for the regional ECS task.
      format: text
      template: 'Select a size below.'

    - id: collector-manual-security-group
      section: collector:aws.fargate-collector:manual
      title: Create the Collector security group and log group
      description: Create or reuse the dedicated group and scoped log group. The NLB and tasks share this group; allow self traffic on OTLP 4317/4318 and health port 13133. Add workload-source ingress when routing telemetry after deployment.
      format: shell
      steps:
        - Run this complete block in the selected account and region. It reuses the named group and log group, adds missing self-ingress rules and sets log retention to 30 days.
        - Copy the printed SecurityGroupId for the later security group field. Application VPCs, subnets and outbound routes must already exist.
      template: &collector-prerequisites-cli |-
        (
        REGION={{region}}
        VPC_ID={{networkId}}
        SG_NAME=odigos-collector-{{connectorName}}
        LOG_GROUP=/odigos/collector/{{connectorName}}
        COLLECTOR_SG=$(aws ec2 describe-security-groups --region "$REGION" --filters "Name=vpc-id,Values=$VPC_ID" "Name=group-name,Values=$SG_NAME" --query 'SecurityGroups[0].GroupId' --output text) || exit 1
        case "$COLLECTOR_SG" in
          ''|None) COLLECTOR_SG=$(aws ec2 create-security-group --region "$REGION" --vpc-id "$VPC_ID" --group-name "$SG_NAME" --description 'Customer-owned Odigos Collector' --query GroupId --output text) || exit 1 ;;
        esac
        for PORT in 4317 4318 13133; do
          SELF_GROUPS=$(aws ec2 describe-security-groups --region "$REGION" --group-ids "$COLLECTOR_SG" --query "SecurityGroups[0].IpPermissions[?IpProtocol=='tcp' && FromPort==\`$PORT\` && ToPort==\`$PORT\`].UserIdGroupPairs[].GroupId" --output text) || exit 1
          if ! printf '%s\n' "$SELF_GROUPS" | tr '\t' '\n' | grep -Fxq "$COLLECTOR_SG"; then
            aws ec2 authorize-security-group-ingress --region "$REGION" --group-id "$COLLECTOR_SG" --ip-permissions "IpProtocol=tcp,FromPort=$PORT,ToPort=$PORT,UserIdGroupPairs=[{GroupId=$COLLECTOR_SG}]" || exit 1
          fi
        done
        LOG_GROUPS=$(aws logs describe-log-groups --region "$REGION" --log-group-name-prefix "$LOG_GROUP" --query 'logGroups[].logGroupName' --output text) || exit 1
        if ! printf '%s\n' "$LOG_GROUPS" | tr '\t' '\n' | grep -Fxq "$LOG_GROUP"; then
          aws logs create-log-group --region "$REGION" --log-group-name "$LOG_GROUP" || exit 1
        fi
        aws logs put-retention-policy --region "$REGION" --log-group-name "$LOG_GROUP" --retention-in-days 30 || exit 1
        printf 'SecurityGroupId=%s\n' "$COLLECTOR_SG"
        )

    - id: collector-manual-log-group
      section: collector:aws.fargate-collector:manual
      title: Verify the scoped log group
      description: The prerequisite script created the log group and set its retention. Confirm the name matches the execution role's log permissions.
      format: shell
      template: |-
        aws logs describe-log-groups --region {{region}} --log-group-name-prefix /odigos/collector/{{connectorName}} --query "logGroups[?logGroupName=='/odigos/collector/{{connectorName}}'].{Name:logGroupName,RetentionDays:retentionInDays}" --output table

    - id: collector-manual-security-group-id
      section: collector:aws.fargate-collector:manual
      title: Record the Collector security group ID
      description: Paste the sg-... GroupId from the preceding script or stack output below. The customer-owned ECS service and internal load balancer must use this same group. The command updates to the entered ID so you can verify its VPC and self-ingress before saving.
      format: shell
      steps:
        - Enter the printed SecurityGroupId below, then run this lookup. Confirm it is in the selected VPC and allows self traffic on TCP 4317, 4318 and 13133.
        - Workload access is configured when routing telemetry after installation; it is not required just to start a healthy Collector.
      template: |-
        aws ec2 describe-security-groups --region {{region}} --group-ids "{{securityGroupId}}" --query 'SecurityGroups[].{ID:GroupId,VPC:VpcId,Ingress:IpPermissions}' --output json

    - id: collector-manual-declare
      section: collector:aws.fargate-collector:manual
      title: Save the Collector configuration in Odigos
      description: >-
        Review the region, ECS cluster, host VPC, selected subnets, security group ID, task execution role, outbound path and size, then save.
        This records what to observe; it does not create the customer-owned AWS Collector resources.
        The deployment and credential steps follow after saving.
      format: text
      template: |-
        Select Save Collector configuration below. Odigos saves the placement and starts observing
        the customer-owned deployment. The following steps create the credential and AWS resources.

    - id: collector-manual-credential-secret
      section: collector:aws.fargate-collector:manual
      title: Create or reuse the credential secret
      description: Use the existing secret if present. Save the complete suffixed ARN; the connector does not write its value.
      format: shell
      steps:
        - 'If you need the ARN again, run `aws secretsmanager describe-secret --region {{region}} --secret-id odigos/collector/{{connectorName}}/{{region}}/credential --query ARN --output text`. Paste the complete suffixed ARN into the credential panel; never use the license secret here.'
      template: |-
        (
        SECRET_NAME=odigos/collector/{{connectorName}}/{{region}}/credential
        if SECRET_ARN=$(aws secretsmanager describe-secret --region {{region}} --secret-id "$SECRET_NAME" --query ARN --output text 2>&1); then
          printf '%s\n' "$SECRET_ARN"
        else
          case "$SECRET_ARN" in
            *ResourceNotFoundException*) aws secretsmanager create-secret --region {{region}} --name "$SECRET_NAME" --query ARN --output text || exit 1 ;;
            *) printf '%s\n' "$SECRET_ARN" >&2; exit 1 ;;
          esac
        fi
        )

    - id: collector-manual-issue-credential
      section: collector:aws.fargate-collector:manual
      title: Issue the one-time OpAMP credential
      description: >-
        Click Issue credential below after creating the empty AWS secret. Odigos displays a
        complete Bearer header once. The Collector uses it to authenticate to Odigos OpAMP;
        this step does not write the customer-owned secret. Rotation and revocation are optional
        maintenance actions after the initial deployment.
      format: text
      template: 'Copy the displayed Bearer header, including the Bearer prefix, for the next step.'

    - id: collector-manual-store-credential
      section: collector:aws.fargate-collector:manual
      title: Store the Bearer header
      description: >-
        The command below uses the secret ARN and Bearer header from the preceding step. Run it
        before starting ECS tasks. The secret was created empty earlier, so this command stores
        its value with put-secret-value. The header remains visible until you close this wizard.
      format: shell
      template: |-
        aws secretsmanager put-secret-value --region {{region}} --secret-id {{credentialSecretArnShell}} --secret-string {{authorizationHeaderShell}}

    - id: collector-manual-license-secret
      section: collector:aws.fargate-collector:manual
      title: Store the registry licence JSON
      description: The task execution role reads this secret for image pull and the `password` field for `ODIGOS_ONPREM_TOKEN`.
      format: shell
      steps:
        - Replace <ON_PREM_TOKEN> in the JSON file with your token, preserving valid JSON. The block creates a missing secret or updates its value when it already exists.
        - Keep the printed license ARN for the deployment. It is separate from the OpAMP credential secret. Remove the local JSON file after storing it, according to your credential-file retention policy.
      template: |-
        (
        cat > odigos-collector-license.json <<'JSON'
        {"username":"odigos","password":"<ON_PREM_TOKEN>"}
        JSON
        SECRET_NAME=odigos/collector/{{connectorName}}/{{region}}/license
        if SECRET_ARN=$(aws secretsmanager describe-secret --region {{region}} --secret-id "$SECRET_NAME" --query ARN --output text 2>&1); then
          aws secretsmanager put-secret-value --region {{region}} --secret-id "$SECRET_ARN" --secret-string file://odigos-collector-license.json || exit 1
          printf '%s\n' "$SECRET_ARN"
        else
          case "$SECRET_ARN" in
            *ResourceNotFoundException*) aws secretsmanager create-secret --region {{region}} --name "$SECRET_NAME" --secret-string file://odigos-collector-license.json --query ARN --output text || exit 1 ;;
            *) printf '%s\n' "$SECRET_ARN" >&2; exit 1 ;;
          esac
        fi
        )

    - id: collector-manual-apply
      section: collector:aws.fargate-collector:manual
      title: Deploy the regional Collector
      description: Use your own provisioning principal and the generated regional AWS CLI, CloudFormation or Terraform document.
      format: text
      template: '{{managedCollectorInstructions}}'

    - id: collector-manual-verify
      section: collector:aws.fargate-collector:manual
      title: Verify task, target and OpAMP health
      description: Wait for Ready and a populated endpoint; fix image pull, secret, egress or target-health issues shown in the report.
      format: text
      template: 'Check managedCollectorReport(region:"{{region}}") until Ready.'

    # Uninstall guidance is separate from setup so it cannot become an installation stage or
    # appear as a setup-method choice. The UI renders the matching mode in the Uninstall drawer.
    - id: collector-uninstall-manual-prepare
      section: collector-uninstall:aws.fargate-collector:manual
      title: Prepare to stop this Collector
      description: This is a customer-owned deployment. Odigos can remove its declaration and revoke its credential, but cannot delete its AWS resources.
      format: text
      steps:
        - Check which workloads export to this Collector and arrange another telemetry path before taking it down.
        - Record the resource references below before deleting the Collector or closing this drawer.
      template: 'Region: {{region}}; cluster: {{clusterRef}}; VPC: {{networkId}}; subnets: {{subnetIds}}; service: {{serviceRef}}; task definition: {{revisionRef}}; load balancer: {{loadBalancerRef}}; security group: {{securityGroupId}}; execution role: {{executionRoleArn}}.'

    - id: collector-uninstall-manual-inventory
      section: collector-uninstall:aws.fargate-collector:manual
      title: Bill of materials for manual cleanup
      description: These resources are customer-owned. Remove each item only if it belongs to this Collector and is no longer used elsewhere.
      format: text
      steps:
        - 'ECS: service {{serviceRef}} in {{clusterRef}}, its running tasks, and every remaining revision of task definition family `odigos-collector-{{region}}` (current revision {{revisionRef}}). If you enabled automatic scaling, include its ECS scalable target and the `odigos-collector-{{region}}-cpu` and `odigos-collector-{{region}}-memory` policies.'
        - 'Ingress: internal Network Load Balancer {{loadBalancerRef}}, its TCP 4317 and 4318 listeners and target groups, and Collector security group {{securityGroupId}} in {{networkId}}.'
        - 'Secrets and logs: `odigos/collector/{{connectorName}}/{{region}}/credential`, `odigos/collector/{{connectorName}}/{{region}}/credential/bootstrap` if created, `odigos/collector/{{connectorName}}/{{region}}/license`, and log group `/odigos/collector/{{connectorName}}`.'
        - 'Account-wide prerequisites: execution role {{executionRoleArn}}, its inline policy and its CloudFormation stack if used. Remove them only after all regional Collectors using them are gone. The Application Auto Scaling ECS service-linked role, if created, may also serve other applications.'
        - 'Existing and separately configured infrastructure stays until you decide otherwise: ECS cluster {{clusterRef}}, VPC {{networkId}}, subnets {{subnetIds}}, plus any VPC peering, route entries, firewall or workload security-group rules, and DNS records added for Collector access.'
        - 'If you used CloudFormation or Terraform, check which items are in each stack or state and which were created separately. Deleting a regional deployment stack does not delete the separately created secrets, prerequisite stack or account-wide execution-role stack.'
      template: 'Check the inventory against your AWS account before finishing the manual uninstall.'

    - id: collector-uninstall-manual-aws
      section: collector-uninstall:aws.fargate-collector:manual
      title: Remove the customer-owned AWS deployment
      description: Use the same provisioning principal and tool that created the regional deployment.
      format: text
      steps:
        - 'CloudFormation: delete the regional `odigos-collector-{{connectorName}}-{{region}}` deployment stack, then the regional `odigos-collector-{{connectorName}}-prerequisites` stack if you created it. Wait for each deletion to finish.'
        - 'Terraform: destroy the regional Collector resources from the same workspace and state that created them. Remove the separately managed secrets, security group, log group and execution role only when that state does not already own them and they are no longer shared.'
        - 'AWS CLI: remove any ECS Application Auto Scaling target and policies, delete the `odigos-collector-{{region}}` ECS service from {{clusterRef}}, and wait for its tasks to stop. Delete the internal load balancer (which removes its listeners), then both OTLP target groups after AWS releases them. Delete the Collector security group after its network interfaces are gone.'
        - 'Deregister unused revisions of task definition family `odigos-collector-{{region}}`. Delete the credential, optional bootstrap and licence secrets and the Collector log group when no Collector still uses them.'
        - 'Remove the account-wide `odigos-collector-{{connectorName}}-execution` IAM role or its CloudFormation stack only after every regional Collector using it is gone. Review separately added peering, routes, firewall rules and DNS records before removing them.'
      template: 'The Collector infrastructure is customer-owned; Odigos does not run these AWS deletions in manual mode.'

    - id: collector-uninstall-manual-odigos
      section: collector-uninstall:aws.fargate-collector:manual
      title: Remove the declaration from Odigos
      description: After the AWS deployment is removed, choose Remove from Odigos below.
      format: text
      steps:
        - Odigos revokes this Collector's OpAMP credentials, removes the regional configuration and stops routing workloads to it.
        - The result lists any recorded customer resources still retained in AWS; remove those with your provisioning tool if needed.
      template: 'Choose Remove from Odigos to finish uninstalling this region.'

    - id: collector-uninstall-automatic
      section: collector-uninstall:aws.fargate-collector:automatic
      title: Uninstall the Odigos-managed Collector
      description: Odigos deletes AWS resources only when the Collector report confirms that Odigos created them and retained their resource references.
      format: text
      steps:
        - Check affected workloads and arrange another telemetry path before removing this regional endpoint.
        - Choose Uninstall below. Odigos disables the region, revokes Collector credentials and removes only its owned, recorded ECS service and tasks, scalable target and policies, internal load balancer and listeners, target groups, security group, regional secrets and log group. AWS resource release may require a retry.
        - Review the inventory below for resources that Odigos intentionally leaves behind.
      template: 'Odigos deletes only resources it created and can identify from its provisioning record.'

    - id: collector-uninstall-automatic-inventory
      section: collector-uninstall:aws.fargate-collector:automatic
      title: Bill of materials after automatic uninstall
      description: Automatic uninstall does not remove customer prerequisites or unrelated network access. Review these items after Odigos finishes.
      format: text
      steps:
        - 'ECS task definition family `odigos-collector-{{region}}` and its registered revisions remain (current revision {{revisionRef}}). Odigos removes the service and tasks it owns but does not deregister task definitions. Deregister unused revisions yourself if you want them gone.'
        - 'Customer prerequisites remain: task execution role {{executionRoleArn}}, its inline policy and its CloudFormation stack if used; ECS cluster {{clusterRef}}, VPC {{networkId}}, and subnets {{subnetIds}}. Remove the shared role only when no other regional Collector uses it; keep the cluster and network if other workloads use them.'
        - 'Any ECS Application Auto Scaling service-linked IAM role created as an account prerequisite remains. Keep it while other scaled ECS services use it.'
        - 'Any VPC peering connection, reciprocal route, firewall or workload security-group rule, and DNS record you added for Collector reachability remains. Review these separately; Odigos does not own them.'
        - 'Customer-supplied or adopted resources can remain: ECS service, load balancer {{loadBalancerRef}}, listeners, target groups, security groups {{securityGroupIds}}, secrets and log group. A regional licence secret or log group also remains while another Collector uses it. The uninstall result names retained objects that Odigos observed; inspect AWS for items created outside Odigos.'
      template: 'After uninstall, compare the reported retained objects with this inventory and your AWS account.'

    - id: collector-auto-cli-execution-role
      section: collector:aws.fargate-collector:automatic:aws-cli
      variantLabel: AWS CLI
      title: Create the customer-owned task execution role
      description: >-
        Run once for this connector in the Collector AWS account with an IAM principal allowed to
        create roles. Reuse the printed execution role ARN in every region of this account; IAM roles
        are account-wide. Add `kms:Decrypt` if the Collector secrets use a customer-managed key.
      format: shell
      steps:
        - 'After the script succeeds, run `aws iam get-role --role-name "odigos-collector-{{connectorName}}-execution" --query Role.Arn --output text` and paste the output into Task execution role ARN. Reuse this account-wide role for other regions.'
      template: &collector-execution-role-cli |-
        (
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text) || exit 1
        cat > odigos-collector-task-trust.json <<JSON || exit 1
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ecs-tasks.amazonaws.com"},"Action":"sts:AssumeRole","Condition":{"StringEquals":{"aws:SourceAccount":"${ACCOUNT_ID}"},"ArnLike":{"aws:SourceArn":"arn:aws:ecs:*:${ACCOUNT_ID}:*"}}}]}
        JSON
        if aws iam get-role --role-name odigos-collector-{{connectorName}}-execution >/dev/null 2>&1; then
          aws iam update-assume-role-policy --role-name odigos-collector-{{connectorName}}-execution --policy-document file://odigos-collector-task-trust.json || exit 1
        else
          aws iam create-role --role-name odigos-collector-{{connectorName}}-execution --assume-role-policy-document file://odigos-collector-task-trust.json || exit 1
        fi
        cat > odigos-collector-task-policy.json <<JSON || exit 1
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["logs:CreateLogStream","logs:PutLogEvents"],"Resource":"arn:aws:logs:*:${ACCOUNT_ID}:log-group:/odigos/collector/{{connectorName}}:*"},{"Effect":"Allow","Action":"secretsmanager:GetSecretValue","Resource":"arn:aws:secretsmanager:*:${ACCOUNT_ID}:secret:odigos/collector/{{connectorName}}/*"}]}
        JSON
        aws iam put-role-policy --role-name odigos-collector-{{connectorName}}-execution --policy-name odigos-collector-execution --policy-document file://odigos-collector-task-policy.json || exit 1
        ) && EXECUTION_ROLE_ARN=$(aws iam get-role --role-name odigos-collector-{{connectorName}}-execution --query Role.Arn --output text) && export EXECUTION_ROLE_ARN && printf 'ExecutionRoleArn=%s\n' "$EXECUTION_ROLE_ARN"

    - id: collector-auto-cfn-execution-role
      section: collector:aws.fargate-collector:automatic:cloudformation
      variantLabel: CloudFormation
      title: Deploy the customer-owned task execution role
      description: >-
        Deploy this stack once for this connector in the AWS account with `ConnectorName`; reuse its
        `ExecutionRoleArn` output in every region. IAM roles are account-wide. Add `kms:Decrypt` if the
        Collector secrets use a customer-managed key.
      format: yaml
      steps:
        - Save as `odigos-collector-execution-role.yaml`.
        - 'Run `aws cloudformation deploy --stack-name odigos-collector-{{connectorName}}-execution --template-file odigos-collector-execution-role.yaml --capabilities CAPABILITY_IAM --parameter-overrides ConnectorName={{connectorName}}` once with your provisioning credentials. Do not deploy another copy in a second region.'
        - 'In the same account and stack region, run `aws cloudformation describe-stacks --stack-name odigos-collector-{{connectorName}}-execution --query "Stacks[0].Outputs[?OutputKey==''ExecutionRoleArn''].OutputValue | [0]" --output text` and paste the output into Task execution role ARN.'
      template: *collector-execution-role

    - id: collector-manual-cli-execution-role
      section: collector:aws.fargate-collector:manual:aws-cli
      variantLabel: AWS CLI
      title: Create the customer-owned task execution role
      description: >-
        Run once for this connector in the Collector AWS account with an IAM principal allowed to
        create roles. Reuse the printed execution role ARN in every region of this account; IAM roles
        are account-wide. Add `kms:Decrypt` if the Collector secrets use a customer-managed key.
      format: shell
      steps:
        - 'After the script succeeds, run `aws iam get-role --role-name "odigos-collector-{{connectorName}}-execution" --query Role.Arn --output text` and paste the output into Task execution role ARN. Reuse this account-wide role for other regions.'
      template: *collector-execution-role-cli

    - id: collector-manual-cli-security-logs
      section: collector:aws.fargate-collector:manual:aws-cli
      title: Create the security group and log group
      description: Reuse the named Collector security group and log group if they already exist in the selected VPC and region.
      format: shell
      steps:
        - Run the commands with your provisioning credentials, then copy the printed SecurityGroupId into the later security group ID field.
      template: *collector-prerequisites-cli

    - id: collector-manual-cfn-execution-role
      section: collector:aws.fargate-collector:manual:cloudformation
      variantLabel: CloudFormation
      title: Deploy the task execution role
      description: >-
        Deploy this stack once for this connector in the AWS account. Reuse its `ExecutionRoleArn`
        output in every region; IAM roles are account-wide. Add `kms:Decrypt` if the Collector secrets
        use a customer-managed key.
      format: yaml
      steps:
        - Save as `odigos-collector-execution-role.yaml`.
        - 'Run `aws cloudformation deploy --stack-name odigos-collector-{{connectorName}}-execution --template-file odigos-collector-execution-role.yaml --capabilities CAPABILITY_IAM --parameter-overrides ConnectorName={{connectorName}}` once with your provisioning credentials. Do not deploy another copy in a second region.'
        - 'In the same account and stack region, run `aws cloudformation describe-stacks --stack-name odigos-collector-{{connectorName}}-execution --query "Stacks[0].Outputs[?OutputKey==''ExecutionRoleArn''].OutputValue | [0]" --output text` and paste the output into Task execution role ARN.'
      template: *collector-execution-role

    - id: collector-manual-cfn-security-logs
      section: collector:aws.fargate-collector:manual:cloudformation
      title: Create the security group and log group
      description: Save as `odigos-collector-prerequisites.yaml`; the stack creates the scoped log group and a security group allowing OTLP 4317/4318 and health 13133 from itself. The deployment instructions cover workload access when routing telemetry.
      format: yaml
      template: |-
        AWSTemplateFormatVersion: '2010-09-09'
        Parameters:
          VpcId: { Type: AWS::EC2::VPC::Id }
          ConnectorName: { Type: String }
        Resources:
          CollectorGroup:
            Type: AWS::EC2::SecurityGroup
            Properties:
              GroupDescription: Customer-owned Odigos Collector
              VpcId: !Ref VpcId
          CollectorHealthIngress:
            Type: AWS::EC2::SecurityGroupIngress
            Properties: { GroupId: !Ref CollectorGroup, IpProtocol: tcp, FromPort: 13133, ToPort: 13133, SourceSecurityGroupId: !Ref CollectorGroup }
          CollectorGrpcIngress:
            Type: AWS::EC2::SecurityGroupIngress
            Properties: { GroupId: !Ref CollectorGroup, IpProtocol: tcp, FromPort: 4317, ToPort: 4317, SourceSecurityGroupId: !Ref CollectorGroup }
          CollectorHttpIngress:
            Type: AWS::EC2::SecurityGroupIngress
            Properties: { GroupId: !Ref CollectorGroup, IpProtocol: tcp, FromPort: 4318, ToPort: 4318, SourceSecurityGroupId: !Ref CollectorGroup }
          CollectorLogs:
            Type: AWS::Logs::LogGroup
            Properties: { LogGroupName: !Sub '/odigos/collector/${ConnectorName}', RetentionInDays: 30 }
        Outputs:
          SecurityGroupId: { Value: !Ref CollectorGroup }
          LogGroupName: { Value: !Ref CollectorLogs }

    - id: collector-manual-cfn-apply
      section: collector:aws.fargate-collector:manual:cloudformation
      title: Apply prerequisites and check placement
      description: This stack creates the customer-owned security group and log group; the Collector deployment document appears after the configuration is saved.
      format: shell
      steps:
        - Deploy the prerequisite stack, then copy its SecurityGroupId output into the later security group ID field.
        - 'Query the group ID using `aws cloudformation describe-stacks --region {{region}} --stack-name odigos-collector-{{connectorName}}-prerequisites --query "Stacks[0].Outputs[?OutputKey==''SecurityGroupId''].OutputValue | [0]" --output text` and paste it into the next field.'
      template: |-
        (
        aws cloudformation deploy --region {{region}} --stack-name odigos-collector-{{connectorName}}-prerequisites --template-file odigos-collector-prerequisites.yaml --parameter-overrides VpcId={{networkId}} ConnectorName={{connectorName}} || exit 1
        aws cloudformation describe-stacks --region {{region}} --stack-name odigos-collector-{{connectorName}}-prerequisites --query 'Stacks[0].Outputs' --output table || exit 1
        )

    - id: create-role-cloudformation
      section: create-role
      variant: cloudformation
      variantLabel: CloudFormation
      title: Create IAM role
      description: >-
        Deploy the CloudFormation template below. It creates the IAM role with the permissions policy
        inline and returns the Role ARN as a stack output.
      format: yaml
      itemTemplate: '- {{permission}}'
      itemSeparator: "\n"
      steps:
        - Complete the source identity setup first. Confirm the target AWS Account ID, connector role name and External ID above; the trust policy already contains the chosen source principal.
        - Save the template below as odigos-connector.yaml.
        - "Console: open CloudFormation → Create stack → With new resources → Upload a template file."
        - "CLI: `aws cloudformation deploy --stack-name {{stackName}} --template-file odigos-connector.yaml --capabilities CAPABILITY_NAMED_IAM --parameter-overrides OdigosExternalId={{externalId}}`"
        - Acknowledge that the stack creates a named IAM resource, then deploy it.
        - Open the stack's Outputs tab and copy the RoleArn value into the field below.
        - >-
          Or query the deployed stack in the same AWS account and region:
          `aws cloudformation describe-stacks --stack-name {{stackName}} --query "Stacks[0].Outputs[?OutputKey=='RoleArn'].OutputValue | [0]" --output text`.
      template: |-
        AWSTemplateFormatVersion: "2010-09-09"
        Description: IAM role assumed by the Odigos cloud connector.

        Parameters:
          OdigosExternalId:
            Type: String
            MinLength: 2
            MaxLength: 1224
            AllowedPattern: "[A-Za-z0-9+=,.@:/-]+"
            Description: >-
              External ID Odigos presents when assuming this role. Pre-filled from the Odigos setup
              form; the stack will not deploy while it is empty.
            Default: "{{externalId}}"

        Resources:
          OdigosConnectorRole:
            Type: AWS::IAM::Role
            Properties:
              RoleName: "{{roleName}}"
              Description: Lets Odigos Central discover and instrument workloads in this account.
              AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Principal:
                      AWS: {{trustedPrincipalArn}}
                    Action: sts:AssumeRole
                    Condition:
                      StringEquals:
                        sts:ExternalId: !Ref OdigosExternalId
              Policies:
                - PolicyName: OdigosCloudConnector
                  PolicyDocument:
                    Version: "2012-10-17"
                    Statement:
                      - Sid: OdigosCloudConnector
                        Effect: Allow
                        Resource: "*"
                        Action:
                          {{permissions}}
                      - Sid: RestrictPassRoleService
                        Effect: Deny
                        Action: [iam:PassRole]
                        Resource: "*"
                        Condition:
                          StringNotEquals:
                            iam:PassedToService: [ecs-tasks.amazonaws.com, bedrock-agentcore.amazonaws.com]
                      - Sid: RestrictPassRoleResources
                        Effect: Deny
                        Action: [iam:PassRole]
                        NotResource: {{passRoleResources}}
                      - Sid: RestrictApplicationSignalsRoles
                        Effect: Deny
                        Action: [iam:AttachRolePolicy]
                        NotResource: {{applicationSignalsRoleResources}}
                      - Sid: DenyUnrelatedPolicyAttachments
                        Effect: Deny
                        Action: [iam:AttachRolePolicy]
                        Resource: "*"
                        Condition:
                          ArnNotLike:
                            iam:PolicyARN: "arn:*:iam::aws:policy/CloudWatchLambdaApplicationSignalsExecutionRolePolicy"
                      - Sid: DenyUnrelatedServiceLinkedRoles
                        Effect: Deny
                        Action: [iam:CreateServiceLinkedRole]
                        Resource: "*"
                        Condition:
                          StringNotEquals:
                            iam:AWSServiceName: application-signals.cloudwatch.amazonaws.com

        Outputs:
          RoleArn:
            Description: Paste this value into the Odigos setup form.
            Value: !GetAtt OdigosConnectorRole.Arn

    - id: create-role-terraform
      section: create-role
      variant: terraform
      variantLabel: Terraform / OpenTofu
      title: Create IAM role
      description: >-
        Provision the IAM role as code. The configuration below is complete — drop it into your
        Terraform workspace and apply it; role_arn is exposed as an output.
      format: shell
      itemTemplate: '"{{permission}}"'
      itemSeparator: ",\n"
      steps:
        - Complete the source identity setup first, then confirm the target AWS account, connector role name and External ID. The chosen source principal is already included in this trust policy.
        - Save the configuration below as odigos-connector.tf in your Terraform workspace.
        - Run `terraform init` and `terraform apply`, or `tofu init` and `tofu apply`, using your existing AWS provider authentication. Review and confirm the plan.
        - Run `terraform output -raw role_arn` (or `tofu output -raw role_arn`) and paste the value into the field below.
        - Use a dedicated IAM workspace for this panel. The AWS provider below uses us-east-1 for account-wide IAM and your existing authentication. When merging into a configured workspace, keep its provider block instead of adding a second one.
      template: |-
        provider "aws" {
          region = "us-east-1"
        }

        # odigos-connector.tf — requires the hashicorp/aws provider.

        variable "odigos_external_id" {
          type        = string
          description = "External ID Odigos presents when assuming the role."
          default     = "{{externalId}}"

          validation {
            condition     = length(var.odigos_external_id) >= 2 && length(var.odigos_external_id) <= 1224 && can(regex("^[A-Za-z0-9+=,.@:/-]+$", var.odigos_external_id))
            error_message = "Set an external ID: the connector role's trust policy requires one."
          }
        }

        data "aws_iam_policy_document" "odigos_trust" {
          statement {
            effect  = "Allow"
            actions = ["sts:AssumeRole"]

            principals {
              type        = "AWS"
              identifiers = ["{{trustedPrincipalArn}}"]
            }

            condition {
              test     = "StringEquals"
              variable = "sts:ExternalId"
              values   = [var.odigos_external_id]
            }
          }
        }

        data "aws_iam_policy_document" "odigos_permissions" {
          statement {
            sid       = "OdigosCloudConnector"
            effect    = "Allow"
            resources = ["*"]

            actions = [
              {{permissions}}
            ]
          }
          statement {
            sid = "RestrictPassRoleService"
            effect = "Deny"
            actions = ["iam:PassRole"]
            resources = ["*"]
            condition {
              test = "StringNotEquals"
              variable = "iam:PassedToService"
              values = ["ecs-tasks.amazonaws.com", "bedrock-agentcore.amazonaws.com"]
            }
          }
          statement {
            sid = "RestrictPassRoleResources"
            effect = "Deny"
            actions = ["iam:PassRole"]
            not_resources = {{passRoleResources}}
          }
          statement {
            sid = "RestrictApplicationSignalsRoles"
            effect = "Deny"
            actions = ["iam:AttachRolePolicy"]
            not_resources = {{applicationSignalsRoleResources}}
          }
          statement {
            sid       = "DenyUnrelatedPolicyAttachments"
            effect    = "Deny"
            resources = ["*"]
            actions   = ["iam:AttachRolePolicy"]
            condition {
              test     = "ArnNotLike"
              variable = "iam:PolicyARN"
              values   = ["arn:*:iam::aws:policy/CloudWatchLambdaApplicationSignalsExecutionRolePolicy"]
            }
          }
          statement {
            sid       = "DenyUnrelatedServiceLinkedRoles"
            effect    = "Deny"
            resources = ["*"]
            actions   = ["iam:CreateServiceLinkedRole"]
            condition {
              test     = "StringNotEquals"
              variable = "iam:AWSServiceName"
              values   = ["application-signals.cloudwatch.amazonaws.com"]
            }
          }
        }

        data "aws_caller_identity" "odigos_target" {}
        resource "aws_iam_role" "odigos_connector" {
          lifecycle {
            precondition {
              condition = data.aws_caller_identity.odigos_target.account_id == "{{accountId}}"
              error_message = "Use the target AWS account for this workspace."
            }
          }
          name               = "{{roleName}}"
          description        = "Lets Odigos Central discover and instrument workloads in this account."
          assume_role_policy = data.aws_iam_policy_document.odigos_trust.json
        }

        resource "aws_iam_role_policy" "odigos_connector" {
          name   = "OdigosCloudConnector"
          role   = aws_iam_role.odigos_connector.id
          policy = data.aws_iam_policy_document.odigos_permissions.json
        }

        output "role_arn" {
          value = aws_iam_role.odigos_connector.arn
        }

    - id: create-role-aws-cli
      section: create-role
      variant: aws-cli
      variantLabel: AWS CLI
      title: Create IAM role
      description: >-
        Create the role from your terminal. The script writes the trust policy, creates the role,
        attaches the permissions policy, and prints the Role ARN.
      format: shell
      steps:
        - Complete the source identity setup first, then confirm the target AWS Account ID, connector role name and External ID. The script already contains the chosen source principal.
        - The script writes the complete scoped permissions policy to odigos-policy.json before making changes.
        - Run with your existing authenticated AWS session in the target account, with permission to manage the IAM resources below.
        - Run the script below.
        - 'After setup succeeds, run `aws iam get-role --role-name "{{roleName}}" --query Role.Arn --output text` in the target account and paste that output into IAM Role ARN below. This queries the target connector role, not the caller user.'
        - Keep the same External ID that was used when creating the trust policy. The caller access key belongs in Caller credentials; the target role ARN belongs in Role credentials.
      template: |-
        (
        set -eu
        export ODIGOS_EXTERNAL_ID="{{externalId}}"
        ROLE_NAME="{{roleName}}"
        test -n "$ODIGOS_EXTERNAL_ID" || { echo "Set the External ID before running setup." >&2; exit 1; }
        test "$(aws sts get-caller-identity --query Account --output text)" = "{{accountId}}" || { echo "AWS CLI must use the target account." >&2; exit 1; }

        cat > odigos-policy.json <<'ODIGOS_POLICY'
        {{policyJson}}
        ODIGOS_POLICY

        cat > odigos-trust-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "AWS": "{{trustedPrincipalArn}}" },
              "Action": "sts:AssumeRole",
              "Condition": {
                "StringEquals": { "sts:ExternalId": "${ODIGOS_EXTERNAL_ID}" }
              }
            }
          ]
        }
        EOF

        if aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
          aws iam update-assume-role-policy --role-name "$ROLE_NAME" --policy-document file://odigos-trust-policy.json
        else
          aws iam create-role --role-name "$ROLE_NAME" --description "Odigos cloud connector" --assume-role-policy-document file://odigos-trust-policy.json
        fi

        aws iam put-role-policy \
          --role-name "$ROLE_NAME" \
          --policy-name OdigosCloudConnector \
          --policy-document file://odigos-policy.json

        aws iam get-role-policy --role-name "$ROLE_NAME" --policy-name OdigosCloudConnector

        aws iam get-role \
          --role-name "$ROLE_NAME" \
          --query 'Role.Arn' \
          --output text
        )

    - id: create-role-manual
      section: create-role
      variant: manual
      variantLabel: AWS Console
      title: Create IAM role
      description: >-
        Create the IAM role by hand in the AWS Console using the trust policy below, then return the
        Role ARN.
      format: json
      steps:
        - Complete the source identity setup above and confirm the External ID. The trust policy below already includes the chosen source principal.
        - Open the AWS Console → IAM → Roles → Create role.
        - Select Custom trust policy and paste the policy below.
        - First create a customer-managed IAM policy from the policy preview JSON (IAM → Policies → Create policy → JSON). Then select that policy on the role permissions screen.
        - Name the role using the role name entered above and create it.
        - Open the role summary and copy the Role ARN into the field below.
        - 'Alternatively, query the target role with `aws iam get-role --role-name "{{roleName}}" --query Role.Arn --output text` and paste the output into IAM Role ARN below.'
      template: |-
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "AWS": "{{trustedPrincipalArn}}" },
              "Action": "sts:AssumeRole",
              "Condition": {
                "StringEquals": { "sts:ExternalId": "{{externalId}}" }
              }
            }
          ]
        }

    - id: create-user-aws-cli
      section: create-role
      variant: iam-user
      variantLabel: AWS CLI
      title: Create IAM user
      description: >-
        For the access-keys authentication method. Creates a programmatic-only IAM user with the
        permissions policy attached, and prints an access key pair to paste below.
      format: shell
      steps:
        - The script writes the complete scoped permissions policy to odigos-policy.json before making changes.
        - Run with your existing authenticated AWS session in the target account, with permission to manage the IAM resources below.
        - Run the script below.
        - Copy AccessKeyId and SecretAccessKey from the output into the fields below.
        - Store the secret key somewhere safe — AWS will not show it again.
      template: |-
        (
        set -eu
        USER_NAME="{{roleName}}"
        test "$(aws sts get-caller-identity --query Account --output text)" = "{{accountId}}" || { echo "AWS CLI must use the target account." >&2; exit 1; }
        cat > odigos-policy.json <<'ODIGOS_POLICY'
        {{policyJson}}
        ODIGOS_POLICY
        aws iam get-user --user-name "$USER_NAME" >/dev/null 2>&1 || aws iam create-user --user-name "$USER_NAME"
        POLICY_ARN="arn:aws:iam::{{accountId}}:policy/$USER_NAME"
        if aws iam get-policy --policy-arn "$POLICY_ARN" >/dev/null 2>&1; then
          echo "Policy already exists. Review it and create a new default policy version if permissions changed before creating credentials." >&2
          exit 1
        fi
        aws iam create-policy --policy-name "$USER_NAME" --policy-document file://odigos-policy.json
        aws iam attach-user-policy --user-name "$USER_NAME" --policy-arn "$POLICY_ARN"
        aws iam create-access-key --user-name "$USER_NAME" --query 'AccessKey.{AccessKeyId:AccessKeyId,SecretAccessKey:SecretAccessKey}' --output table
        )

    - id: create-user-cloudformation
      section: create-role
      variant: iam-user-cloudformation
      variantLabel: CloudFormation
      title: Create IAM user
      description: Create a dedicated IAM user and managed permissions policy with CloudFormation, then issue its access key.
      format: json
      steps:
        - Use your existing authenticated session in the target AWS account. Save this template as odigos-user.json.
        - 'Run `aws cloudformation deploy --stack-name {{stackName}} --template-file odigos-user.json --capabilities CAPABILITY_NAMED_IAM`, or upload the template in the CloudFormation console.'
        - 'After the stack succeeds, run `aws iam create-access-key --user-name "{{roleName}}" --query AccessKey --output json`. Alternatively, open IAM → Users → {{roleName}} → Security credentials → Create access key.'
        - Paste AccessKeyId and SecretAccessKey into Odigos. The secret is shown only when the key is created; it is deliberately absent from stack outputs.
      template: |-
        {
          "AWSTemplateFormatVersion": "2010-09-09",
          "Description": "Dedicated IAM user for the Odigos connector. Issue an access key after deployment.",
          "Resources": {
            "OdigosConnectorUser": {
              "Type": "AWS::IAM::User",
              "Properties": { "UserName": "{{roleName}}" }
            },
            "OdigosConnectorPolicy": {
              "Type": "AWS::IAM::ManagedPolicy",
              "Properties": {
                "Description": "Odigos connector permissions",
                "Users": [{ "Ref": "OdigosConnectorUser" }],
                "PolicyDocument": {{policyJson}}
              }
            }
          },
          "Outputs": {
            "UserName": { "Value": { "Ref": "OdigosConnectorUser" } }
          }
        }

    - id: create-user-terraform
      section: create-role
      variant: iam-user-terraform
      variantLabel: Terraform / OpenTofu
      title: Create IAM user and access key
      description: Provision a dedicated IAM user, managed permissions policy and access key using your existing authenticated AWS provider.
      format: shell
      steps:
        - Save this configuration as odigos-user.tf in your AWS Terraform or OpenTofu workspace.
        - Run `terraform init` and `terraform apply`, or `tofu init` and `tofu apply`. Review and confirm the plan.
        - 'Run `terraform output -raw access_key_id` and `terraform output -raw secret_access_key` (OpenTofu: `tofu output -raw access_key_id` and `tofu output -raw secret_access_key`), then paste both values into Odigos.'
        - The secret output is marked sensitive but is stored in state. Protect your state backend and keep state files out of source control.
        - Use a dedicated IAM workspace for this panel. The AWS provider below uses us-east-1 for account-wide IAM and your existing authentication. When merging into a configured workspace, keep its provider block instead of adding a second one.
      template: |-
        provider "aws" {
          region = "us-east-1"
        }

        data "aws_caller_identity" "odigos_target" {}
        resource "aws_iam_user" "odigos_connector" {
          lifecycle {
            precondition {
              condition = data.aws_caller_identity.odigos_target.account_id == "{{accountId}}"
              error_message = "Use the target AWS account for this workspace."
            }
          }
          name = "{{roleName}}"
        }

        resource "aws_iam_policy" "odigos_connector" {
          name = "{{roleName}}"
          policy = <<-ODIGOS_POLICY
        {{policyJson}}
        ODIGOS_POLICY
        }

        resource "aws_iam_user_policy_attachment" "odigos_connector" {
          user       = aws_iam_user.odigos_connector.name
          policy_arn = aws_iam_policy.odigos_connector.arn
        }

        resource "aws_iam_access_key" "odigos_connector" {
          user = aws_iam_user.odigos_connector.name
          depends_on = [aws_iam_user_policy_attachment.odigos_connector]
        }

        output "access_key_id" {
          value     = aws_iam_access_key.odigos_connector.id
          sensitive = true
        }

        output "secret_access_key" {
          value     = aws_iam_access_key.odigos_connector.secret
          sensitive = true
        }

    - id: create-user-console
      section: create-role
      variant: iam-user-manual
      variantLabel: AWS Console
      title: Create IAM user
      description: Create a programmatic IAM user and attach the permissions policy below using the AWS Console.
      format: json
      steps:
        - In the target AWS account, open IAM → Policies → Create policy → JSON. Paste this policy and save it with a distinct connector policy name.
        - 'Open IAM → Users → Create user. Set the user name to {{roleName}} and leave console access disabled.'
        - Choose Attach policies directly, select the policy you just created, and create the user.
        - Open the user → Security credentials → Create access key. Choose Application running outside AWS, acknowledge the recommendation if prompted, and create the key.
        - Paste Access Key ID and Secret Access Key into Odigos. Save the secret now; AWS will not show it again.
      template: |-
        {{policyJson}}

    - id: workload-policy-aws-cli
      section: create-role
      variant: workload-aws-cli
      variantLabel: AWS CLI
      title: Grant permissions to the workload role
      description: Attach the connector permissions to your existing workload IAM role. This does not create access keys or change its trust policy.
      format: shell
      steps:
        - Enter the existing workload role name above. Run these commands with your existing authenticated session in the target account.
        - Configure workload identity for both Central backend and connector pods using this role. Use an existing trust binding or follow the workload identity deployment instructions.
        - Return to Odigos and verify. No credentials need to be pasted for this authentication method.
      template: |-
        (
        set -eu
        test "$(aws sts get-caller-identity --query Account --output text)" = "{{accountId}}" || { echo "AWS CLI must use the target account." >&2; exit 1; }
        cat > odigos-policy.json <<'ODIGOS_POLICY'
        {{policyJson}}
        ODIGOS_POLICY
        aws iam put-role-policy --role-name "{{roleName}}" --policy-name OdigosCloudConnector --policy-document file://odigos-policy.json
        )

    - id: workload-policy-cloudformation
      section: create-role
      variant: workload-cloudformation
      variantLabel: CloudFormation
      title: Grant permissions to the workload role
      description: Attach a managed policy to your existing workload IAM role. The role and its workload identity trust binding must already exist.
      format: json
      steps:
        - Enter the existing workload role name above and save this template as odigos-workload-policy.json.
        - 'Use your existing AWS session to run `aws cloudformation deploy --stack-name {{stackName}} --template-file odigos-workload-policy.json --capabilities CAPABILITY_IAM`, or upload the template in CloudFormation.'
        - Configure workload identity for both Central backend and connector pods using this role, then verify in Odigos. No access keys are created.
      template: |-
        {
          "AWSTemplateFormatVersion": "2010-09-09",
          "Resources": {
            "OdigosConnectorPolicy": {
              "Type": "AWS::IAM::ManagedPolicy",
              "Properties": {
                "Roles": ["{{roleName}}"],
                "PolicyDocument": {{policyJson}}
              }
            }
          }
        }

    - id: workload-policy-terraform
      section: create-role
      variant: workload-terraform
      variantLabel: Terraform / OpenTofu
      title: Grant permissions to the workload role
      description: Attach the policy to your existing workload IAM role. Manage its workload identity trust binding in your existing deployment configuration.
      format: shell
      steps:
        - Enter the existing workload role name above. Save this configuration as odigos-workload-policy.tf in your authenticated AWS workspace.
        - Run `terraform init` and `terraform apply`, or `tofu init` and `tofu apply`. Review and confirm the plan.
        - Configure both Central backend and connector pods to use this workload role, then verify in Odigos. No access keys are created.
        - Use a dedicated IAM workspace for this panel. The AWS provider below uses us-east-1 for account-wide IAM and your existing authentication. When merging into a configured workspace, keep its provider block instead of adding a second one.
      template: |-
        provider "aws" {
          region = "us-east-1"
        }

        resource "aws_iam_role_policy" "odigos_connector" {
          name = "OdigosCloudConnector"
          role = "{{roleName}}"
          policy = <<-ODIGOS_POLICY
        {{policyJson}}
        ODIGOS_POLICY
        }

    - id: workload-policy-console
      section: create-role
      variant: workload-manual
      variantLabel: AWS Console
      title: Grant permissions to the workload role
      description: Add the connector permissions to your existing workload IAM role without changing its trust policy.
      format: json
      steps:
        - Enter the existing workload role name above. In the target account, open IAM → Roles and select that role.
        - Open Permissions → Add permissions → Create inline policy → JSON. Paste this policy and save it as OdigosCloudConnector.
        - Configure workload identity for both Central backend and connector pods using this role, then verify in Odigos. No access keys are created.
      template: |-
        {{policyJson}}

    - id: source-user-aws-cli
      section: source-user
      variant: aws-cli
      title: "Create the source IAM user and access key"
      description: "Creates a dedicated user for Odigos authentication. The user can only assume the target connector role."
      format: "shell"
      steps:
        - "Create this source identity first, using your existing authenticated AWS session in source account {{sourceAccountId}}. It receives only permission to assume the connector role, with the matching External ID."
        - "Then create the target connector role in account {{accountId}} using the next panel. Its trusted principal ARN is already filled from the source account and user name."
        - "Run the complete script below. A user with this name must not already exist; choose Use existing caller credentials if it does."
        - "Copy AccessKeyId and SecretAccessKey into the Caller credentials fields in Enter connector credentials. The target Role ARN and External ID belong to the separate connector role."
        - 'To confirm the caller principal after creation, run `aws iam get-user --user-name "{{sourceName}}" --query User.Arn --output text` in the caller account. It must match the trusted principal in the next panel.'
        - The script creates and prints an access key once. Save both key values before proceeding; an existing secret access key cannot be queried later. Do not rerun key creation just to look up an ARN.
      template: |-
        (
        set -eu
        SOURCE_USER="{{sourceName}}"
        test "$(aws sts get-caller-identity --query Account --output text)" = "{{sourceAccountId}}" || { echo "Use the source AWS account for this panel." >&2; exit 1; }
        if aws iam get-user --user-name "$SOURCE_USER" >/dev/null 2>&1; then
          echo "Source user already exists. Choose Use existing caller credentials, or use a new source name." >&2
          exit 1
        fi
        cat > odigos-source-assume-policy.json <<'ODIGOS_SOURCE_POLICY'
        {{sourcePolicyJson}}
        ODIGOS_SOURCE_POLICY
        aws iam create-user --user-name "$SOURCE_USER"
        aws iam put-user-policy --user-name "$SOURCE_USER" --policy-name "{{sourcePolicyName}}" --policy-document file://odigos-source-assume-policy.json
        aws iam create-access-key --user-name "$SOURCE_USER" --query 'AccessKey.{AccessKeyId:AccessKeyId,SecretAccessKey:SecretAccessKey}' --output table
        aws iam get-user --user-name "$SOURCE_USER" --query User.Arn --output text
        )

    - id: source-user-cloudformation
      section: source-user
      variant: cloudformation
      title: "Create the source IAM user"
      description: "Creates the user and its scoped AssumeRole permission. Issue an access key after stack creation."
      format: "json"
      steps:
        - "Create this source identity first, using your existing authenticated AWS session in source account {{sourceAccountId}}. It receives only permission to assume the connector role, with the matching External ID."
        - "Then create the target connector role in account {{accountId}} using the next panel. Its trusted principal ARN is already filled from the source account and user name."
        - "Save the template as odigos-source-user.json and deploy in the source account: `aws cloudformation deploy --stack-name {{stackName}}-source --template-file odigos-source-user.json --capabilities CAPABILITY_NAMED_IAM`."
        - "After the stack succeeds, run `aws iam create-access-key --user-name \"{{sourceName}}\" --query AccessKey --output json`, or use IAM \u2192 Users \u2192 {{sourceName}} \u2192 Security credentials \u2192 Create access key."
        - "Paste that AccessKeyId and SecretAccessKey into the final source credential fields. The secret is not stored in stack outputs."
        - 'To confirm the caller principal, run `aws cloudformation describe-stacks --stack-name {{stackName}}-source --query "Stacks[0].Outputs[?OutputKey==''SourcePrincipalArn''].OutputValue | [0]" --output text` in the caller stack account and region. It must match the trusted principal in the target-role template.'
      template: |-
        {
          "AWSTemplateFormatVersion": "2010-09-09",
          "Resources": {
            "OdigosSourceUser": {
              "Type": "AWS::IAM::User",
              "Properties": {
                "UserName": "{{sourceName}}",
                "Policies": [{ "PolicyName": "{{sourcePolicyName}}", "PolicyDocument": {{sourcePolicyJson}} }]
              }
            }
          },
          "Outputs": {
            "SourcePrincipalArn": { "Value": { "Fn::GetAtt": ["OdigosSourceUser", "Arn"] } },
            "SourceUserName": { "Value": { "Ref": "OdigosSourceUser" } }
          }
        }

    - id: source-user-terraform
      section: source-user
      variant: terraform
      title: "Create the source IAM user and access key"
      description: "Creates a dedicated source user, scoped AssumeRole permission and credentials for Odigos."
      format: "shell"
      steps:
        - "Create this source identity first, using your existing authenticated AWS session in source account {{sourceAccountId}}. It receives only permission to assume the connector role, with the matching External ID."
        - "Then create the target connector role in account {{accountId}} using the next panel. Its trusted principal ARN is already filled from the source account and user name."
        - "Save as odigos-source.tf in a separate source-account workspace using your existing AWS provider authentication. Run `terraform init` and `terraform apply`, or `tofu init` and `tofu apply`."
        - "Run `terraform output -raw source_access_key_id` and `terraform output -raw source_secret_access_key` (OpenTofu: `tofu output -raw source_access_key_id` and `tofu output -raw source_secret_access_key`). Paste these into the final source credential fields."
        - "The secret is marked sensitive but remains in state. Protect the source workspace state backend and keep it out of source control."
        - 'Confirm the caller principal using `terraform output -raw source_principal_arn` (or `tofu output -raw source_principal_arn`) in the caller workspace. Use the separate target-role workspace for `role_arn`.'
        - Use a dedicated IAM workspace for this panel. The AWS provider below uses us-east-1 for account-wide IAM and your existing authentication. When merging into a configured workspace, keep its provider block instead of adding a second one.
      template: |-
        provider "aws" {
          region = "us-east-1"
        }

        data "aws_caller_identity" "odigos_source" {}
        resource "aws_iam_user" "odigos_source" {
          name = "{{sourceName}}"
          lifecycle {
            precondition {
              condition = data.aws_caller_identity.odigos_source.account_id == "{{sourceAccountId}}"
              error_message = "Use the source AWS account for this workspace."
            }
          }
        }
        resource "aws_iam_user_policy" "odigos_source" {
          name = "{{sourcePolicyName}}"
          user = aws_iam_user.odigos_source.name
          policy = <<-SOURCE_POLICY
        {{sourcePolicyJson}}
        SOURCE_POLICY
        }
        resource "aws_iam_access_key" "odigos_source" {
          user = aws_iam_user.odigos_source.name
          depends_on = [aws_iam_user_policy.odigos_source]
        }
        output "source_principal_arn" { value = aws_iam_user.odigos_source.arn }
        output "source_access_key_id" {
          value = aws_iam_access_key.odigos_source.id
          sensitive = true
        }
        output "source_secret_access_key" {
          value = aws_iam_access_key.odigos_source.secret
          sensitive = true
        }

    - id: source-user-manual
      section: source-user
      variant: manual
      title: "Create the source IAM user and access key"
      description: "Create a programmatic user whose only permission is to assume the connector role."
      format: "json"
      steps:
        - "Create this source identity first, using your existing authenticated AWS session in source account {{sourceAccountId}}. It receives only permission to assume the connector role, with the matching External ID."
        - "Then create the target connector role in account {{accountId}} using the next panel. Its trusted principal ARN is already filled from the source account and user name."
        - "In IAM \u2192 Users \u2192 Create user, enter {{sourceName}} and leave console access disabled. Create the user without granting other permissions."
        - "Open the user \u2192 Permissions \u2192 Add permissions \u2192 Create inline policy \u2192 JSON. Paste the policy below and save it as {{sourcePolicyName}}."
        - "Open Security credentials \u2192 Create access key \u2192 Application running outside AWS. Create the key and paste both values into the final source credential fields."
      template: |-
        {{sourcePolicyJson}}

    - id: source-irsa-aws-cli
      section: source-irsa
      variant: aws-cli
      title: "Create the EKS source workload role"
      description: "Creates the role used by the Odigos pods and grants permission to assume the target connector role."
      format: "shell"
      steps:
        - "Create this source workload role first in source account {{sourceAccountId}}, using your existing AWS session. Its OIDC trust is limited to the two Odigos service accounts in namespace {{centralNamespace}}."
        - "If the EKS cluster has no IAM OIDC provider for this issuer, select Create provider above. If it already exists, keep Use existing provider."
        - "For an installation that already uses workload identity, choose Use existing caller credentials instead of replacing its role. A new source role here is for initial Central setup."
        - "Run the complete script. It creates the IAM OIDC provider when requested, writes both policies, and creates the source role. Existing source role names are rejected."
        - "Continue to Configure Odigos workload identity below, then create the target connector role in the final role panel."
      template: |-
        (
        set -eu
        test "$(aws sts get-caller-identity --query Account --output text)" = "{{sourceAccountId}}" || { echo "Use the source AWS account for this panel." >&2; exit 1; }
        SOURCE_ROLE="{{sourceName}}"
        if aws iam get-role --role-name "$SOURCE_ROLE" >/dev/null 2>&1; then
          echo "Source role already exists. Choose Use existing caller credentials, or use a new source name." >&2
          exit 1
        fi
        OIDC_PROVIDER_ARN="arn:aws:iam::{{sourceAccountId}}:oidc-provider/{{oidcIssuer}}"
        if aws iam get-open-id-connect-provider --open-id-connect-provider-arn "$OIDC_PROVIDER_ARN" >/dev/null 2>&1; then
          aws iam add-client-id-to-open-id-connect-provider --open-id-connect-provider-arn "$OIDC_PROVIDER_ARN" --client-id sts.amazonaws.com
        elif test "{{createOidcProvider}}" = "true"; then
          aws iam create-open-id-connect-provider --url "https://{{oidcIssuer}}" --client-id-list sts.amazonaws.com
        else
          echo "IAM OIDC provider is missing. Select Create provider above, then copy this script again." >&2
          exit 1
        fi
        cat > odigos-source-trust.json <<'SOURCE_TRUST'
        {{sourceTrustJson}}
        SOURCE_TRUST
        cat > odigos-source-assume-policy.json <<'SOURCE_POLICY'
        {{sourcePolicyJson}}
        SOURCE_POLICY
        aws iam create-role --role-name "$SOURCE_ROLE" --assume-role-policy-document file://odigos-source-trust.json
        aws iam put-role-policy --role-name "$SOURCE_ROLE" --policy-name "{{sourcePolicyName}}" --policy-document file://odigos-source-assume-policy.json
        aws iam get-role --role-name "$SOURCE_ROLE" --query Role.Arn --output text
        )

    - id: source-irsa-cloudformation
      section: source-irsa
      variant: cloudformation
      title: "Create the EKS source workload role"
      description: "Creates the source role and, when selected, the EKS IAM OIDC provider."
      format: "json"
      steps:
        - "Create this source workload role first in source account {{sourceAccountId}}, using your existing AWS session. Its OIDC trust is limited to the two Odigos service accounts in namespace {{centralNamespace}}."
        - "If the EKS cluster has no IAM OIDC provider for this issuer, select Create provider above. If it already exists, keep Use existing provider."
        - "For an installation that already uses workload identity, choose Use existing caller credentials instead of replacing its role. A new source role here is for initial Central setup."
        - "Save as odigos-source-role.json. Deploy in the source account: `aws cloudformation deploy --stack-name {{stackName}}-source --template-file odigos-source-role.json --capabilities CAPABILITY_NAMED_IAM --parameter-overrides CreateOIDCProvider={{createOidcProvider}}`."
        - "After success, the SourcePrincipalArn output matches the principal already filled into the target role trust policy. Continue to Configure Odigos workload identity below."
      template: |-
        {
          "AWSTemplateFormatVersion": "2010-09-09",
          "Parameters": { "CreateOIDCProvider": { "Type": "String", "AllowedValues": ["true", "false"], "Default": "{{createOidcProvider}}" } },
          "Conditions": { "CreateOIDCProvider": { "Fn::Equals": [{ "Ref": "CreateOIDCProvider" }, "true"] } },
          "Resources": {
            "OdigosOIDCProvider": {
              "Type": "AWS::IAM::OIDCProvider",
              "Condition": "CreateOIDCProvider",
              "Properties": { "Url": "https://{{oidcIssuer}}", "ClientIdList": ["sts.amazonaws.com"] }
            },
            "OdigosSourceRole": {
              "Type": "AWS::IAM::Role",
              "Properties": {
                "RoleName": "{{sourceName}}",
                "AssumeRolePolicyDocument": {{sourceTrustCloudFormationJson}},
                "Policies": [{ "PolicyName": "{{sourcePolicyName}}", "PolicyDocument": {{sourcePolicyJson}} }]
              }
            }
          },
          "Outputs": { "SourcePrincipalArn": { "Value": { "Fn::GetAtt": ["OdigosSourceRole", "Arn"] } } }
        }

    - id: source-irsa-terraform
      section: source-irsa
      variant: terraform
      title: "Create the EKS source workload role"
      description: "Creates the source role and optional OIDC provider using your authenticated source-account AWS provider."
      format: "shell"
      steps:
        - "Create this source workload role first in source account {{sourceAccountId}}, using your existing AWS session. Its OIDC trust is limited to the two Odigos service accounts in namespace {{centralNamespace}}."
        - "If the EKS cluster has no IAM OIDC provider for this issuer, select Create provider above. If it already exists, keep Use existing provider."
        - "For an installation that already uses workload identity, choose Use existing caller credentials instead of replacing its role. A new source role here is for initial Central setup."
        - "Save as odigos-source.tf in a separate source-account workspace. Run `terraform init` and `terraform apply`, or `tofu init` and `tofu apply`. Apply this before the target connector role."
        - "Use the source_principal_arn output to confirm the source role, then continue to Configure Odigos workload identity below."
        - Use a dedicated IAM workspace for this panel. The AWS provider below uses us-east-1 for account-wide IAM and your existing authentication. When merging into a configured workspace, keep its provider block instead of adding a second one.
      template: |-
        provider "aws" {
          region = "us-east-1"
        }

        data "aws_caller_identity" "odigos_source" {}
        resource "aws_iam_openid_connect_provider" "odigos_source" {
          count = {{createOidcProvider}} ? 1 : 0
          url = "https://{{oidcIssuer}}"
          client_id_list = ["sts.amazonaws.com"]
        }
        resource "aws_iam_role" "odigos_source" {
          name = "{{sourceName}}"
          assume_role_policy = <<-SOURCE_TRUST
        {{sourceTrustJson}}
        SOURCE_TRUST
          depends_on = [aws_iam_openid_connect_provider.odigos_source]
          lifecycle {
            precondition {
              condition = data.aws_caller_identity.odigos_source.account_id == "{{sourceAccountId}}"
              error_message = "Use the source AWS account for this workspace."
            }
          }
        }
        resource "aws_iam_role_policy" "odigos_source" {
          name = "{{sourcePolicyName}}"
          role = aws_iam_role.odigos_source.id
          policy = <<-SOURCE_POLICY
        {{sourcePolicyJson}}
        SOURCE_POLICY
        }
        output "source_principal_arn" { value = aws_iam_role.odigos_source.arn }

    - id: source-irsa-manual
      section: source-irsa
      variant: manual
      title: "Create the EKS source workload role"
      description: "Create the OIDC trust and source IAM role before creating the connector target role."
      format: "json"
      steps:
        - "Create this source workload role first in source account {{sourceAccountId}}, using your existing AWS session. Its OIDC trust is limited to the two Odigos service accounts in namespace {{centralNamespace}}."
        - "If the EKS cluster has no IAM OIDC provider for this issuer, select Create provider above. If it already exists, keep Use existing provider."
        - "For an installation that already uses workload identity, choose Use existing caller credentials instead of replacing its role. A new source role here is for initial Central setup."
        - "In IAM \u2192 Identity providers, select the provider for https://{{oidcIssuer}} and verify its audience includes sts.amazonaws.com. If missing, Add provider \u2192 OpenID Connect with this URL and audience."
        - "Open IAM \u2192 Roles \u2192 Create role \u2192 Custom trust policy. Paste the policy below, skip broad permission policies, name the role {{sourceName}}, and create it."
        - "The following Configure Odigos workload identity panel provides the scoped AssumeRole policy to add to this source role, as well as the Helm settings for the pods."
      template: |-
        {{sourceTrustJson}}

    - id: source-irsa-binding
      section: source-irsa
      title: "Configure Odigos workload identity"
      description: "Finish source-role permissions and bind Central backend and AWS connector pods to the source role."
      format: "yaml"
      steps:
        - "In your existing Central Helm values, set cloudConnectors.aws.workloadIdentity.roleArn to {{trustedPrincipalArn}} and cloudConnectors.aws.workloadIdentity.serviceAccountName to odigos-aws-connectors. Apply using your existing release, namespace {{centralNamespace}}, and installed chart version. The chart annotates central-backend and creates the connector service account."
        - "After the Helm update, restart the pods so EKS injects workload credentials: `kubectl rollout restart deployment/central-backend deployment/connector-runtime --namespace {{centralNamespace}}`. The runtime assigns odigos-aws-connectors to the AWS connector pods."
        - "Now create the target connector role below in account {{accountId}}. In Enter connector credentials, provide its Role ARN and matching External ID. No access keys are required."
      template: |-
        cloudConnectors:
          aws:
            workloadIdentity:
              roleArn: "{{trustedPrincipalArn}}"
              serviceAccountName: odigos-aws-connectors

    - id: source-existing-aws-cli
      section: source-existing
      variant: aws-cli
      title: "Authorize the existing source identity"
      description: "Grant only the permission needed to assume this connector role."
      format: "shell"
      steps:
        - "Use your existing authenticated AWS session in source account {{sourceAccountId}} to grant the existing identity permission to assume the target role. This does not create credentials or replace its trust policy."
        - "Keep Odigos configured with this existing identity. Create the target connector role in account {{accountId}} using the next panel, then enter its Role ARN and External ID."
        - "Run this complete script before creating the target role."
      template: |-
        (
        set -eu
        test "$(aws sts get-caller-identity --query Account --output text)" = "{{sourceAccountId}}" || { echo "Use the source AWS account for this panel." >&2; exit 1; }
        cat > odigos-source-assume-policy.json <<'SOURCE_POLICY'
        {{sourcePolicyJson}}
        SOURCE_POLICY
        aws iam put-{{sourcePolicyIdentityProperty}}-policy --{{sourcePolicyIdentityProperty}}-name "{{sourceName}}" --policy-name "{{sourcePolicyName}}" --policy-document file://odigos-source-assume-policy.json
        )

    - id: source-existing-cloudformation
      section: source-existing
      variant: cloudformation
      title: "Authorize the existing source identity"
      description: "Attach a scoped managed policy to the existing role or user."
      format: "json"
      steps:
        - "Use your existing authenticated AWS session in source account {{sourceAccountId}} to grant the existing identity permission to assume the target role. This does not create credentials or replace its trust policy."
        - "Keep Odigos configured with this existing identity. Create the target connector role in account {{accountId}} using the next panel, then enter its Role ARN and External ID."
        - "Save as odigos-source-policy.json and deploy in the source account: `aws cloudformation deploy --stack-name {{stackName}}-source --template-file odigos-source-policy.json --capabilities CAPABILITY_IAM`."
      template: |-
        {
          "AWSTemplateFormatVersion": "2010-09-09",
          "Resources": {
            "OdigosSourcePolicy": {
              "Type": "AWS::IAM::ManagedPolicy",
              "Properties": { {{sourceAttachmentJson}}, "PolicyDocument": {{sourcePolicyJson}} }
            }
          }
        }

    - id: source-existing-terraform
      section: source-existing
      variant: terraform
      title: "Authorize the existing source identity"
      description: "Add a scoped inline policy without taking ownership of the existing identity."
      format: "shell"
      steps:
        - "Use your existing authenticated AWS session in source account {{sourceAccountId}} to grant the existing identity permission to assume the target role. This does not create credentials or replace its trust policy."
        - "Keep Odigos configured with this existing identity. Create the target connector role in account {{accountId}} using the next panel, then enter its Role ARN and External ID."
        - "Save as odigos-source-policy.tf in your source-account workspace. Run `terraform init` and `terraform apply`, or `tofu init` and `tofu apply`."
        - Use a dedicated IAM workspace for this panel. The AWS provider below uses us-east-1 for account-wide IAM and your existing authentication. When merging into a configured workspace, keep its provider block instead of adding a second one.
      template: |-
        provider "aws" {
          region = "us-east-1"
        }

        data "aws_caller_identity" "odigos_source" {}
        resource "{{sourcePolicyResourceType}}" "odigos_source" {
          name = "{{sourcePolicyName}}"
          {{sourcePolicyIdentityProperty}} = "{{sourceName}}"
          policy = <<-SOURCE_POLICY
        {{sourcePolicyJson}}
        SOURCE_POLICY
          lifecycle {
            precondition {
              condition = data.aws_caller_identity.odigos_source.account_id == "{{sourceAccountId}}"
              error_message = "Use the source AWS account for this workspace."
            }
          }
        }

