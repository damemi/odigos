# gateway: connector-wide regional Collector wiring; not part of either domain. Fargate services and
# VPC-attached Lambda functions are routed here when a same-region marker exists and the host/consumer
# VPC path plus Collector ingress are proven. Non-VPC Lambda functions remain direct.
gateway:
  enabled: true
  displayName: Gateway / collector wiring
  description: >-
    Route eligible Fargate and VPC-attached Lambda workloads to the ready managed regional Collector
    selected for their AWS region. Every routed workload requires proven Collector security-group
    ingress; directly peered VPCs additionally require reciprocal subnet routes. Non-VPC Lambda
    functions and workloads without a reachable regional path retain the global OTLP destination;
    removing the regional destination restores direct export. This capability never creates or changes
    a Lambda VpcConfig.
  types: []
