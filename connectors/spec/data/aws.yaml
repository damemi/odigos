    - id: instrument-fargate-cdk-nodejs
      section: instrumentation:aws.fargate-task
      language: nodejs
      variant: cdk
      variantLabel: AWS CDK
      title: Instrument a Node.js ECS Fargate service (AWS CDK)
      description: >-
        Minimal AWS CDK usage for a Node.js container. Full construct reference:
        https://docs.odigos.io/cloud-connectors/aws/cdk/fargate
      format: text
      steps:
        - Install @odigos/aws-cdk (pin the exact version).
        - Create one OdigosFargateInstrumentation and call instrument() once per container.
        - cdk diff, then cdk deploy — the service must roll onto the new revision.
      prerequisites:
        - >-
          Make sure that registry.odigos.io is accessible to the workload or change the connector to use a local image override (https://docs.odigos.io/cloud-connectors/add-connectors/add-aws-connector).
      template: |-
        npm install @odigos/aws-cdk@<PACKAGE_VERSION>    # Python CDK: pip install odigos-aws-cdk==<PACKAGE_VERSION>

        import { OdigosFargateInstrumentation, OdigosFargateLanguage } from '@odigos/aws-cdk';

        const odigos = new OdigosFargateInstrumentation(this, 'Odigos', {
          destination: {
            httpEndpoint: '<OTLP_ENDPOINT_URL>', // OTLP/HTTP, scheme-qualified
            // endpoint: 'host:4317',            // OTLP/gRPC as host:port, no scheme
          },
          // Optional: the construct RECORDS whichever image it stages and Odigos holds you to that,
          // so a package ahead of this connector is not drift. Pin only to match a mirror.
          agentsImage: 'registry.odigos.io/odigos-fargate-agents:v0.0.15',
        });

        odigos.instrument({
          container: appContainer,
          language: OdigosFargateLanguage.NODEJS,
          service: appService, // OTEL_SERVICE_NAME = ECS service name
          // serviceName: '<ODIGOS_SOURCE_NAME>',
        });

        // Full construct reference: https://docs.odigos.io/cloud-connectors/aws/cdk/fargate
        // What the construct writes (for cdk diff). Do NOT set ODIGOS_MANAGED or OTEL_LOG_LEVEL.
        // Staging: volume odigos-agent + non-essential container odigos-agent
        //   command ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/nodejs /var/odigos/nodejs"]
        //   mount /var/odigos read-only, DependsOn SUCCESS
          ODIGOS_IAC                  = {"v":1,"lang":"nodejs"}
          OTEL_SERVICE_NAME           = <ODIGOS_SOURCE_NAME>
          OTEL_RESOURCE_ATTRIBUTES    = cloud.provider=aws,cloud.platform=aws_ecs,cloud.region=<REGION>
          OTEL_EXPORTER_OTLP_ENDPOINT = <OTLP_ENDPOINT_URL>
          OTEL_EXPORTER_OTLP_PROTOCOL = http/protobuf
          OTEL_TRACES_EXPORTER        = otlp
          OTEL_METRICS_EXPORTER       = otlp
          OTEL_LOGS_EXPORTER          = otlp
          NODE_OPTIONS                = <existing> --require /var/odigos/nodejs/node_modules/@opentelemetry/auto-instrumentations-node/build/src/register.js
              # APPEND — joined by a space

