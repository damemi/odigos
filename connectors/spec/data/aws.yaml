        - Set the wrapper and compact configuration; record attribution with Lambda resource tags.
        - Replace every <ANGLE_BRACKETED> value.
        - Run the complete script with AWS CLI and jq installed. It waits for the function configuration update before applying tags.
        - Verify the function update succeeds and invoke it. If traffic uses published versions or aliases, publish an updated instrumented version and update all relevant aliases and weighted traffic targets; changing $LATEST does not modify existing published versions.
      prerequisites:
        - "<LAMBDA_DISTRO_PREREQUISITES>"
        - "Use preloaded Lambda layers v0.0.19 or newer: https://docs.odigos.io/cloud-connectors/aws/workloads/lambda/preload"
        - "Use newly built layers that contain the compact configuration launcher. SDK defaults and collector pipelines are expanded only at process startup."
        - "For AWS Lambda Web Adapter, select /opt/odigos-webserver and put the original AWS_LAMBDA_EXEC_WRAPPER in configuration field webWrapper (empty when none). ADOT supports handler mode only."
      template: |-
        # Compact settings: <ODIGOS_LAMBDA_CONFIG>
        # The SDK entry point is /opt/otel-handler.
        FUNCTION="<FUNCTION_NAME>"
        REGION="<REGION>"
        WRAPPER="<LAMBDA_EXEC_WRAPPER>"
        set -eu
        # Compatible with bash and zsh; AWS CLI and jq are required.
        # This JSON document contains only Odigos additions. Merge it with the live environment.
        cat > odigos-env.json <<'JSON'
        {
          "Variables": {
            "AWS_LAMBDA_EXEC_WRAPPER": "<WRAPPER>",
            "ODIGOS_LAMBDA_CONFIG": <LAMBDA_CONFIG_QUOTED>
          }
        }
        JSON
        aws lambda get-function-configuration --function-name "$FUNCTION" --region "$REGION" > current.json
        jq -s --arg wrapper "$WRAPPER" '{Variables: ((.[0].Environment.Variables // {}) + .[1].Variables + {AWS_LAMBDA_EXEC_WRAPPER: $wrapper} | del(.ODIGOS_MANAGED, .ODIGOS_IAC))}' current.json odigos-env.json > merged-env.json
        jq --argjson layers '[<LAMBDA_LAYER_ARNS_JSON>]' --slurpfile env merged-env.json '{FunctionName: .FunctionArn, RevisionId: .RevisionId, Layers: ([.Layers[]?.Arn | select(contains(":layer:odigos-otel-") | not)] + $layers | unique), Environment: $env[0]}' current.json > odigos-update.json
        aws lambda update-function-configuration --region "$REGION" --cli-input-json file://odigos-update.json
        aws lambda wait function-updated-v2 --region "$REGION" --function-name "$FUNCTION"
        cat > odigos-tags.json <<'JSON'
        <LAMBDA_TAGS_JSON>
        JSON
        aws lambda tag-resource --region "$REGION" --resource "$(jq -r .FunctionArn current.json)" --tags file://odigos-tags.json
        # Web Adapter: use /opt/odigos-webserver and set configuration field webWrapper to the original wrapper.

