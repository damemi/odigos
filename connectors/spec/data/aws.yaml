        {
          "Variables": {
            "ODIGOS_IAC": "{\"v\":1,\"layer\":\"<OTEL_LAYER_ARN>\"}",
            "AWS_LAMBDA_EXEC_WRAPPER": "<WRAPPER>",
            "OTEL_SERVICE_NAME": "<ODIGOS_SOURCE_NAME>",
            "OPENTELEMETRY_COLLECTOR_CONFIG_URI": "yaml:{receivers: {otlp: {protocols: {grpc: {endpoint: \"localhost:4317\"}, http: {endpoint: \"localhost:4318\"}}}}, processors: {memory_limiter: {check_interval: 1s, limit_percentage: 50, spike_limit_percentage: 20}, batch: {send_batch_size: 512, timeout: 200ms}, decouple: null}, exporters: {otlp: {endpoint: \"<OTLP_ENDPOINT>\", tls: {insecure: <OTLP_INSECURE>}}}, service: {telemetry: {metrics: {level: none}}, pipelines: {traces: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, metrics: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, logs: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}}}}"
          }
        }
        JSON
        sed -i.bak -e "s|<OTEL_LAYER_ARN>|$LAYER|g" -e "s|<WRAPPER>|$WRAPPER|g" odigos-env.json && rm -f odigos-env.json.bak

        # Keep the layers already attached — this appends ours rather than replacing them.
        EXISTING=$(aws lambda get-function-configuration --function-name "$FUNCTION" \
          --query 'Layers[].Arn' --output text | tr '\t' ' ')
        # A function with no layers has no Layers key at all, and the query then renders as the literal
        # "None" — which would be passed on as a layer ARN and fail the update. Blank it.
        [ "$EXISTING" = "None" ] && EXISTING=""

        aws lambda update-function-configuration \
          --function-name "$FUNCTION" \
          --layers $EXISTING "$LAYER" \
          --environment file://odigos-env.json

        # Do NOT add OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_HEADERS, ODIGOS_OTLP_ENDPOINT
        # or ODIGOS_OTLP_INSECURE. Odigos compares each against unset, so a value here is reported as
        # instrumentation drift.
        #
        # OTEL_LOG_LEVEL is different: it is compared against "debug" when this connector has debug telemetry
        # enabled and against unset otherwise, so leave it unset unless debug telemetry is on — in which case
        # it must be exactly "debug".
        #
        # OTEL_TRACES_EXPORTER, OTEL_METRICS_EXPORTER and OTEL_LOGS_EXPORTER must be UNSET for a signal your
        # destination accepts, and "none" for one it does not (also delete that signal's pipeline above).

        # WEB-SERVER ACTIVATION (AWS Lambda Web Adapter). The adapter owns AWS_LAMBDA_EXEC_WRAPPER, so drop
        # AWS_LAMBDA_EXEC_WRAPPER from odigos-env.json and add PYTHONPATH instead:
        #
        #   PYTHONPATH=/opt/python:/opt/python/opentelemetry/instrumentation/auto_instrumentation:/var/task:/var/task/site-packages
        #   OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
        #
        # PYTHONPATH is PREPENDED — our path first, then yours, joined by a colon. Appending it leaves
        # auto-instrumentation resolving your application's packages first and loading nothing.
        # --environment replaces the whole map, so include the value the function already had in it.

    - id: instrument-lambda-cdk-python
      section: instrumentation:aws.lambda
      language: python
      variant: cdk
      variantLabel: AWS CDK
      title: Instrument a Python Lambda function (AWS CDK)
      description: >-
        For a Python function defined in a TypeScript/JavaScript CDK app, using the Odigos CDK constructs,
        which resolve the layer ARN, render the collector configuration and write the IaC marker for you.
      format: text
      steps:
        - Install @odigos/aws-cdk in the app that defines the function, pinned to an exact version — the package version IS the layer version.
        - Add one OdigosLambdaInstrumentation per function, passing serviceName explicitly.
        - Run cdk diff to check the layer and the variables, then cdk deploy. Your function code is untouched, so this is a configuration-only update.
      prerequisites:
        - >-
          Make sure Odigos Lambda layers are preloaded into your AWS account (https://docs.odigos.io/cloud-connectors/add-connectors/add-aws-connector).
      template: |-
        npm install @odigos/aws-cdk@<PACKAGE_VERSION>    # Python CDK: pip install odigos-aws-cdk==<PACKAGE_VERSION>

        WHAT THE CONSTRUCT DOES for a Python function. It attaches the Python layer for the function's
        architecture, sets AWS_LAMBDA_EXEC_WRAPPER to /opt/otel-instrument, sets OTEL_SERVICE_NAME, renders
        OPENTELEMETRY_COLLECTOR_CONFIG_URI — the same renderer this connector uses, so the value matches byte for
        byte — and writes ODIGOS_IAC recording the layer it attached, which is what makes Odigos report the
        function as instrumented rather than as awaiting your deployment. Nothing below has to be added by hand.

        What it does NOT set is ODIGOS_MANAGED. That is the connector's record of a mutation IT performed,
        including the snapshot it rolls back from, and the package will not claim ownership of a function on
        your behalf. Do not add it yourself.

        import { Stack } from 'aws-cdk-lib';
        import { LAYER_ARNS, OdigosLambdaInstrumentation } from '@odigos/aws-cdk';

        // ONE CONSTRUCT PER FUNCTION. serviceName applies to every function a construct instruments, and
        // left unset it falls back to the CDK CONSTRUCT ID rather than the deployed function name —
        // lambda.Function.functionName resolves to a CloudFormation Ref even when you set it explicitly, so
        // the package cannot read it. OTEL_SERVICE_NAME must match the workload's name in Odigos, so pass it.
        new OdigosLambdaInstrumentation(this, 'OdigosApi', {
          destination: {
            endpoint: '<OTLP_ENDPOINT>',      // OTLP/gRPC as host:port, no scheme
            insecure: <OTLP_INSECURE>,        // plaintext destination only; must match this connector
            // httpEndpoint: 'https://...'    // instead of endpoint, for an OTLP/HTTP destination
            // headers: { authorization: 'Bearer ...' },  // see the credential warning below
          },
          serviceName: '<ODIGOS_SOURCE_NAME>',
          functions: [fn],
        });

        // THE MARKER IS WRITTEN FOR YOU — shown here so you recognise it in a cdk diff, not to be added by
        // hand. It records the ARN the construct actually attached, and Odigos checks the function against
        // the version recorded in it, so a version you pinned is respected instead of being reported as
        // drift. What it writes is ODIGOS_IAC = {"v":1,"layer":"<OTEL_LAYER_ARN>"}, with the package that
        // wrote it named alongside:
        //   ODIGOS_IAC = {"v":1,"source":"cdk","version":"<PACKAGE_VERSION>","layer":"<OTEL_LAYER_ARN>"}
        //
        // LAYER_ARNS is that same table, exported for a stack that needs the ARN for its own reasons:
        //   const layerArn = LAYER_ARNS[`${Stack.of(this).region}/python/${fn.architecture.name}`];

        WHERE THE LAYER COMES FROM
          layerSource: OdigosLayerSource.ODIGOS_PUBLIC   (default) the public Odigos layer version in the
            stack's region, resolved at SYNTH time from a table in the package. No extra resources, no
            deploy-time lookup — but it needs a concrete region, so an environment-agnostic stack throws.
          layerSource: OdigosLayerSource.IN_ACCOUNT      deploys the Odigos Serverless Application
            Repository application into your account as a nested stack (one per language/architecture) and
            wires its LayerVersionArn output into the function. Identical bytes, owned by your own stack —
            for organisations whose policy forbids attaching a layer owned by another AWS account. Needs
            serverlessrepo:CreateCloudFormationTemplate and serverlessrepo:GetApplication at deploy time.
          layerVersion: <your ILayerVersion>             a layer you mirrored yourself; neither path is used.

        The marker needs the ARN, and only the ODIGOS_PUBLIC path exposes it — LAYER_ARNS is a plain table
        you can index. IN_ACCOUNT resolves the ARN from a nested stack output that the construct does not
        hand back, so to record the marker there, either pass the layer in yourself through layerVersion and
        read its layerVersionArn, or read the nested application's LayerVersionArn output directly.

        HANDLER vs WEB-SERVER. The default mode is HANDLER, which sets AWS_LAMBDA_EXEC_WRAPPER to
        /opt/otel-instrument. A function behind the AWS Lambda Web Adapter needs
        mode: OdigosInstrumentationMode.WEB_SERVER, which leaves the wrapper to the adapter and loads the agent
        through PYTHONPATH instead:

          PYTHONPATH = /opt/python:/opt/python/opentelemetry/instrumentation/auto_instrumentation:/var/task:/var/task/site-packages
          OTEL_EXPORTER_OTLP_PROTOCOL = http/protobuf

        There, pass existingLoaderValue with whatever your function already needs in PYTHONPATH — CDK cannot
        read an environment variable back, and the construct's value is PREPENDED to it (the layer's packages must resolve first), so without it yours is
        replaced. Applying HANDLER to a web-adapter function stops it serving.

        Signals: destination.traces / metrics / logs default to true. Setting one false drops that pipeline
        from the configuration AND sets that signal's OTEL_TRACES_EXPORTER / OTEL_METRICS_EXPORTER /
        OTEL_LOGS_EXPORTER to "none" — which is exactly what this connector expects for a signal your
        destination does not accept. Leave a signal enabled and its variable stays unset, because "otlp" is
        already the SDK default. Turning all three off throws at synth.

        MUST NOT be set (Odigos compares each against unset, so a leftover value is reported as drift). The
        construct sets none of them; this list matters if an earlier attempt did:
          OTEL_EXPORTER_OTLP_ENDPOINT   OTEL_EXPORTER_OTLP_HEADERS
          ODIGOS_OTLP_ENDPOINT          ODIGOS_OTLP_INSECURE      (replaced by the configuration below)
          OTEL_LOG_LEVEL                (unless this connector has debug telemetry enabled: then "debug",
                                         which the construct writes for you when you pass debug: true)

        For reference, the OPENTELEMETRY_COLLECTOR_CONFIG_URI value the construct renders for a gRPC
        destination with all three signals on — this is what Odigos compares the live variable against:
          yaml:{receivers: {otlp: {protocols: {grpc: {endpoint: "localhost:4317"}, http: {endpoint: "localhost:4318"}}}}, processors: {memory_limiter: {check_interval: 1s, limit_percentage: 50, spike_limit_percentage: 20}, batch: {send_batch_size: 512, timeout: 200ms}, decouple: null}, exporters: {otlp: {endpoint: "<OTLP_ENDPOINT>", tls: {insecure: <OTLP_INSECURE>}}}, service: {telemetry: {metrics: {level: none}}, pipelines: {traces: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, metrics: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, logs: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}}}}

    - id: instrument-lambda-terraform-ruby
      section: instrumentation:aws.lambda
      language: ruby
      variant: terraform
      variantLabel: Terraform
      title: Instrument a Ruby Lambda function (Terraform)
      description: >-
        Anchored fragments for aws_lambda_function, for a Ruby function. Handler activation is the only
        activation Ruby has — there is no web-server (AWS Lambda Web Adapter) loader for it.
      format: shell
      steps:
        - Add the layer to your function's layers list — keep the ones already there.
        - Add the environment variables to environment.variables.
        - Replace every <ANGLE_BRACKETED> value.
      prerequisites:
        - >-
          Make sure Odigos Lambda layers are preloaded into your AWS account (https://docs.odigos.io/cloud-connectors/add-connectors/add-aws-connector).
      template: |-
        resource "aws_lambda_function" "app" {
          # ... your existing configuration ...

          # Keep your existing layers; the OpenTelemetry layer is added alongside them.
          layers = concat(var.existing_layers, ["<OTEL_LAYER_ARN>"])

          environment {
            variables = {
              # The value, unescaped, is exactly: {"v":1,"layer":"<OTEL_LAYER_ARN>"}
              ODIGOS_IAC              = "{\"v\":1,\"layer\":\"<OTEL_LAYER_ARN>\"}"
              # The Ruby layer's own wrapper script: it instruments the handler invocation. The script name
              # is language-specific, and a name the layer does not ship fails the function at cold start with
              # "does not exist".
              AWS_LAMBDA_EXEC_WRAPPER = "/opt/otel-handler"
              OTEL_SERVICE_NAME       = "<ODIGOS_SOURCE_NAME>"
              # The in-Lambda collector's entire configuration. Substitute the two placeholders and change
              # nothing else — Odigos compares the whole value. The space after every colon is required.
              # The value, unescaped, is exactly:
              #   yaml:{receivers: {otlp: {protocols: {grpc: {endpoint: "localhost:4317"}, http: {endpoint: "localhost:4318"}}}}, processors: {memory_limiter: {check_interval: 1s, limit_percentage: 50, spike_limit_percentage: 20}, batch: {send_batch_size: 512, timeout: 200ms}, decouple: null}, exporters: {otlp: {endpoint: "<OTLP_ENDPOINT>", tls: {insecure: <OTLP_INSECURE>}}}, service: {telemetry: {metrics: {level: none}}, pipelines: {traces: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, metrics: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, logs: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}}}}
              OPENTELEMETRY_COLLECTOR_CONFIG_URI = "yaml:{receivers: {otlp: {protocols: {grpc: {endpoint: \"localhost:4317\"}, http: {endpoint: \"localhost:4318\"}}}}, processors: {memory_limiter: {check_interval: 1s, limit_percentage: 50, spike_limit_percentage: 20}, batch: {send_batch_size: 512, timeout: 200ms}, decouple: null}, exporters: {otlp: {endpoint: \"<OTLP_ENDPOINT>\", tls: {insecure: <OTLP_INSECURE>}}}, service: {telemetry: {metrics: {level: none}}, pipelines: {traces: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, metrics: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}, logs: {receivers: [otlp], processors: [memory_limiter, batch, decouple], exporters: [otlp]}}}}"

              # Do NOT add OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_HEADERS, ODIGOS_OTLP_ENDPOINT
              # or ODIGOS_OTLP_INSECURE. Odigos compares each against unset, so a value here is reported as
              # instrumentation drift.
              #
              # OTEL_LOG_LEVEL is different: it is compared against "debug" when this connector has debug telemetry
              # enabled and against unset otherwise, so leave it unset unless debug telemetry is on — in which case
              # it must be exactly "debug".
              #
              # OTEL_TRACES_EXPORTER, OTEL_METRICS_EXPORTER and OTEL_LOGS_EXPORTER must be UNSET for a signal your
              # destination accepts, and "none" for one it does not (also delete that signal's pipeline above).
            }
          }
        }

        # THERE IS NO WEB-SERVER ACTIVATION FOR RUBY. The other runtimes can be instrumented behind the AWS
        # Lambda Web Adapter through their own loader variable, but the OpenTelemetry Ruby layer publishes no
        # verified equivalent — so the exec wrapper above is the only activation Ruby has.
        #
        # Applying this to a Ruby function that DOES run behind the adapter does not work and is not reported as
        # an unsupported workload: Odigos sees the marker, judges the function as a web-server one, finds no
        # loader, and reports it as instrumentation drift with the agent loader missing. Do not try to reproduce
        # another language's loader here either — the adapter already owns AWS_LAMBDA_EXEC_WRAPPER, and setting
        # it on such a function stops it serving.

    - id: instrument-lambda-cloudformation-ruby
      section: instrumentation:aws.lambda
