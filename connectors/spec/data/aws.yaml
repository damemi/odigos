      template: |-
        import { OdigosFargateInstrumentation, OdigosFargateLanguage } from '@odigos/aws-cdk';

        const odigos = new OdigosFargateInstrumentation(this, 'Odigos', {
          destination: {
            httpEndpoint: '<OTLP_ENDPOINT_URL>', // OTLP/HTTP, scheme-qualified
            // endpoint: 'host:4317',            // OTLP/gRPC as host:port, no scheme
          },
          // Optional: the construct RECORDS whichever image it stages and Odigos holds you to that,
          // so a package ahead of this connector is not drift. Pin only to match a mirror.
          agentsImage: 'registry.odigos.io/odigos-fargate-agents:v0.0.27',
