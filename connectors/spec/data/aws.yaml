        # PHP_INI_SCAN_DIR and RUBYOPT are SET to the value shown, replacing anything already there, and are
        # compared exactly — fold your own value into it before applying. php and ruby agent paths are per
        # runtime version: replace <RUNTIME_VERSION> with your application's major.minor (for example 8.3),
        # and set a runtime override on the source so Odigos resolves the same version.
        #
        # NOTES
        # - ODIGOS_MANAGED is per container and is the ONLY thing that tells Odigos a container is
        #   instrumented. Without it the container is reported as awaiting your deployment however completely
        #   the rest is applied, and the recorded language is what the activation env is compared against.
        # - If the container ALREADY sets JAVA_TOOL_OPTIONS / PYTHONPATH / NODE_OPTIONS, record its original
        #   value in the marker: {"v":1,"lang":"java","prevEnv":{"JAVA_TOOL_OPTIONS":"-Xmx512m"}}. Odigos
        #   rebuilds the expected value from what you recorded, so appending to an unrecorded value is
        #   reported as drift even when you applied this correctly.
        # - Every Odigos community agent exports over http/protobuf, so <OTLP_ENDPOINT_URL> must be the
        #   destination's OTLP/HTTP endpoint — standard port 4318, not the gRPC 4317. Endpoint and protocol
        #   are one decision; a mismatch fails at runtime as a connection reset that points nowhere near it.
        # - OTEL_SERVICE_NAME must match the workload's name in Odigos, or it is reported as drift. Set a
        #   signal's exporter to "none" for a signal your destination does not accept.
        # - Declare odigos-agent NON-essential: ECS only accepts a SUCCESS dependency against a
        #   non-essential container, so the two settings are one decision.
        # - AWS caps a task definition at 10 containers; one already at the limit has no room for the stager.
        # - Registering the revision is not enough — update the service to it, or it keeps running the old
        #   one. The image is pulled by the task's execution role; mirror it into a registry the task can
        #   reach if it cannot pull this one. The agents bundle is Linux-only, so a Windows task definition
        #   cannot be instrumented at all.
        # - AWS CDK: the same four moves through aws-cdk-lib/aws-ecs — taskDefinition.addVolume({ name:
        #   'odigos-agent' }), addContainer for the stager with essential: false, addMountPoints on each
        #   application container, and addContainerDependencies with
        #   ecs.ContainerDependencyCondition.SUCCESS. There is no addEnvironment on an ECS container, so the
        #   variables above go in the `environment` prop where the container is created.

    - id: instrument-fargate-cloudformation
      section: instrumentation:aws.fargate-task
      variant: cloudformation
      variantLabel: CloudFormation
      title: Instrument an ECS Fargate service (CloudFormation)
      description: >-
        The AWS::ECS::TaskDefinition properties to merge. Worked example in Java; the per-language appendix
        at the end of the template carries every other language.
      format: yaml
      steps:
        - Merge Volumes and the odigos-agent entry into your task definition.
        - Add the mount, dependency and environment to each application container.
        - Deploy, then make sure the service rolls onto the new revision.
      template: |-
        # Merge into Resources.<YourTaskDefinition>.Properties
        Volumes:
          # Bare name: on Fargate this is an ephemeral-storage bind mount scoped to the task.
          - Name: odigos-agent
        ContainerDefinitions:
          - Name: odigos-agent
            Image: "registry.odigos.io/odigos-fargate-agents:v0.0.9"
            # Non-essential: it stages the agent and exits 0. SUCCESS below is only valid against a
            # non-essential container, so the two settings are one decision.
            Essential: false
            Command: ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/java /var/odigos/java"]
            MountPoints:
              - SourceVolume: odigos-agent
                ContainerPath: /var/odigos
          - Name: "<YOUR_CONTAINER>"
            # ... your existing configuration ...
            MountPoints:
              - SourceVolume: odigos-agent
                ContainerPath: /var/odigos
                ReadOnly: true
            DependsOn:
              - ContainerName: odigos-agent
                Condition: SUCCESS
            Environment:
              - Name: ODIGOS_MANAGED
                Value: '{"v":1,"lang":"java"}'
              - Name: OTEL_SERVICE_NAME
                Value: "<ODIGOS_SOURCE_NAME>"
              - Name: OTEL_RESOURCE_ATTRIBUTES
                Value: "cloud.provider=aws,cloud.platform=aws_ecs,cloud.region=<REGION>"
              # Every Odigos community agent exports over http/protobuf, so this must be the destination's
              # OTLP/HTTP endpoint (standard port 4318, not the gRPC 4317).
              - Name: OTEL_EXPORTER_OTLP_ENDPOINT
                Value: "<OTLP_ENDPOINT_URL>"
              - Name: OTEL_EXPORTER_OTLP_PROTOCOL
                Value: "http/protobuf"
              - Name: OTEL_TRACES_EXPORTER
                Value: "otlp"
              - Name: OTEL_METRICS_EXPORTER
                Value: "otlp"
              - Name: OTEL_LOGS_EXPORTER
                Value: "otlp"
              # APPEND to the value your container already has — assigning it discards yours.
              - Name: JAVA_TOOL_OPTIONS
                Value: "<YOUR_EXISTING_VALUE> -javaagent:/var/odigos/java/javaagent.jar"
              # Do NOT set OTEL_LOG_LEVEL: compared against unset, so a value is reported as drift.

        # ---------------------------------------------------------------------------------------------
        # PER-LANGUAGE APPENDIX. The example above is Java. Every other language differs only in the
        # staging command, the marker's "lang", and the activation variables. APPEND means: keep the value
        # the container already carries and add ours after it, joined by the separator shown — assigning it
        # instead discards the customer's value.
        #
        # java    marker {"v":1,"lang":"java"}
        #         command ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/java /var/odigos/java"]
        #         JAVA_TOOL_OPTIONS  APPEND with " ":  -javaagent:/var/odigos/java/javaagent.jar
        #         OTEL_EXPORTER_OTLP_PROTOCOL = http/protobuf
        #
        # python  marker {"v":1,"lang":"python"}
        #         command ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/python /var/odigos/python"]
        #         PYTHONPATH  APPEND with ":":  /var/odigos/python:/var/odigos/python/opentelemetry/instrumentation/auto_instrumentation
        #         OTEL_PYTHON_CONFIGURATOR = odigos-python-configurator
        #         OTEL_EXPORTER_OTLP_PROTOCOL = http/protobuf
        #
        # nodejs  marker {"v":1,"lang":"nodejs"}
        #         command ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/nodejs /var/odigos/nodejs"]
        #         NODE_OPTIONS  APPEND with " ":  --require /var/odigos/nodejs/node_modules/@opentelemetry/auto-instrumentations-node/build/src/register.js
        #         OTEL_EXPORTER_OTLP_PROTOCOL = http/protobuf
        #
        # dotnet  marker {"v":1,"lang":"dotnet"}
        #         command ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/dotnet /var/odigos/dotnet"]
        #         CORECLR_ENABLE_PROFILING = 1
        #         CORECLR_PROFILER         = {918728DD-259F-4A6A-AC2B-B85E1B658318}
        #         CORECLR_PROFILER_PATH    = /var/odigos/dotnet/linux-glibc/OpenTelemetry.AutoInstrumentation.Native.so
        #         OTEL_DOTNET_AUTO_HOME    = /var/odigos/dotnet
        #         DOTNET_STARTUP_HOOKS     = /var/odigos/dotnet/net/OpenTelemetry.AutoInstrumentation.StartupHook.dll
        #         DOTNET_ADDITIONAL_DEPS   = /var/odigos/dotnet/AdditionalDeps
        #         DOTNET_SHARED_STORE      = /var/odigos/dotnet/store
        #         OTEL_EXPORTER_OTLP_PROTOCOL = http/protobuf
        #         glibc only — a musl (Alpine) based image is not supported.
        #
        # php     marker {"v":1,"lang":"php"}
        #         command ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/php /var/odigos/php"]
        #         PHP_INI_SCAN_DIR          = :/var/odigos/php/<RUNTIME_VERSION>
        #         OTEL_PHP_AUTOLOAD_ENABLED = true
        #         OTEL_PROPAGATORS          = tracecontext,baggage
        #         OTEL_EXPORTER_OTLP_PROTOCOL = http/protobuf   (pinned by the SDK — cannot be switched)
        #
        # ruby    marker {"v":1,"lang":"ruby"}
        #         command ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/ruby /var/odigos/ruby"]
        #         RUBYOPT          = -r/var/odigos/ruby/<RUNTIME_VERSION>/index.rb
        #         ODIGOS_GEM_PATH  = /var/odigos/ruby/<RUNTIME_VERSION>/bundle
        #         OTEL_PROPAGATORS = tracecontext,baggage
        #         OTEL_EXPORTER_OTLP_PROTOCOL = http/protobuf   (pinned by the SDK — cannot be switched)
        #
        # PHP_INI_SCAN_DIR and RUBYOPT are SET to the value shown, replacing anything already there, and are
        # compared exactly — fold your own value into it before applying. php and ruby agent paths are per
        # runtime version: replace <RUNTIME_VERSION> with your application's major.minor (for example 8.3),
        # and set a runtime override on the source so Odigos resolves the same version.
        #
        # NOTES
        # - ODIGOS_MANAGED is per container and is the ONLY thing that tells Odigos a container is
        #   instrumented. Without it the container is reported as awaiting your deployment however completely
        #   the rest is applied, and the recorded language is what the activation env is compared against.
        # - If the container ALREADY sets JAVA_TOOL_OPTIONS / PYTHONPATH / NODE_OPTIONS, record its original
        #   value in the marker: {"v":1,"lang":"java","prevEnv":{"JAVA_TOOL_OPTIONS":"-Xmx512m"}}. Odigos
        #   rebuilds the expected value from what you recorded, so appending to an unrecorded value is
        #   reported as drift even when you applied this correctly.
        # - Every Odigos community agent exports over http/protobuf, so <OTLP_ENDPOINT_URL> must be the
        #   destination's OTLP/HTTP endpoint — standard port 4318, not the gRPC 4317. Endpoint and protocol
        #   are one decision; a mismatch fails at runtime as a connection reset that points nowhere near it.
        # - OTEL_SERVICE_NAME must match the workload's name in Odigos, or it is reported as drift. Set a
        #   signal's exporter to "none" for a signal your destination does not accept.
        # - Declare odigos-agent NON-essential: ECS only accepts a SUCCESS dependency against a
        #   non-essential container, so the two settings are one decision.
        # - AWS caps a task definition at 10 containers; one already at the limit has no room for the stager.
        # - Registering the revision is not enough — update the service to it, or it keeps running the old
        #   one. The image is pulled by the task's execution role; mirror it into a registry the task can
