                Value: "<YOUR_EXISTING_VALUE> --require /var/odigos/nodejs/node_modules/@opentelemetry/auto-instrumentations-node/build/src/register.js"
              # Do NOT set OTEL_LOG_LEVEL: compared against unset, so a value is reported as drift.

        # Remove per-signal overrides so every signal follows this destination:
