            # it must be exactly "debug".
            #
            # OTEL_TRACES_EXPORTER, OTEL_METRICS_EXPORTER and OTEL_LOGS_EXPORTER must be UNSET for a signal your
            # destination accepts, and "none" for one it does not (also delete that signal's pipeline above).

        # WEB-SERVER ACTIVATION (AWS Lambda Web Adapter). The adapter owns AWS_LAMBDA_EXEC_WRAPPER: remove it
        # and load the agent through PYTHONPATH, whose value is PREPENDED to your existing path — the layer's
        # OpenTelemetry packages must resolve before your application's own, or nothing is instrumented.
        # CloudFormation cannot read an environment variable back, so fold your own value in by hand:
        #
        #   PYTHONPATH: "/opt/python:/opt/python/opentelemetry/instrumentation/auto_instrumentation:/var/task:/var/task/site-packages:<YOUR_EXISTING_VALUE>"
        #   OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"

    - id: instrument-lambda-aws-cli-python
      section: instrumentation:aws.lambda
      language: python
      variant: aws-cli
      variantLabel: AWS CLI
      title: Instrument a Python Lambda function (AWS CLI)
      description: >-
