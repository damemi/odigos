      title: Instrument a .NET Container App yourself
      description: >-
        The complete change for a .NET app, tool-independent. Read this first: it is the reference the
        Terraform, Bicep and az-cli variants show in their own syntax.
      format: text
      steps:
        - Add the shared volume and the odigos-agent init container to the app template.
        - Mount the volume into your application container.
        - Set the .NET environment variables listed below.
        - Deploy. Container Apps revisions are immutable, so this creates a new revision — in Multiple-revision mode, move traffic to it.
      prerequisites:
        - >-
          Make sure that registry.odigos.io is accessible to the workload or change the connector to use a local image override (https://docs.odigos.io/cloud-connectors/add-connectors/add-azure-connector).
      template: |-
        The .NET agent is staged by a container, not baked into your image: the "odigos-agent" init
        container copies the .NET agent into a shared volume your application container reads at /var/odigos.

        Container Apps has REAL init containers, so the stager exits when it is done and the platform starts
        your container only after it succeeds. There is no startup probe and no dependency to declare.

        APP TEMPLATE (properties.template.*)
          volumes: add
            name        = odigos-agent
            storageType = EmptyDir      (Container Apps accepts no size limit on it)
          initContainers: add
            name    = odigos-agent
            image   = us-central1-docker.pkg.dev/odigos-cloud/components/cloud-run-agents:v0.1.0
            command = ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/dotnet /var/odigos/dotnet"]
            volumeMounts = [{ volumeName = odigos-agent, mountPath = /var/odigos }]

        YOUR APPLICATION CONTAINER
          volumeMounts += { volumeName = odigos-agent, mountPath = /var/odigos }
          env          += the variables below

        ENVIRONMENT — identity and export
          ODIGOS_IAC                  = {"v":1,"lang":"dotnet"}

        Do NOT set ODIGOS_MANAGED — that is the connector's own record of a mutation IT
        performed, including the rollback snapshot; setting it by hand claims a rollback that
        was never recorded.
          OTEL_SERVICE_NAME           = <ODIGOS_SOURCE_NAME>
          OTEL_RESOURCE_ATTRIBUTES    = cloud.provider=azure,cloud.platform=azure_container_apps,cloud.region=<REGION>
          ODIGOS_OTLP_ENDPOINT        = <OTLP_ENDPOINT>
          OTEL_EXPORTER_OTLP_ENDPOINT = <OTLP_ENDPOINT_URL>
          OTEL_EXPORTER_OTLP_PROTOCOL = grpc
          OTEL_TRACES_EXPORTER        = otlp
          OTEL_METRICS_EXPORTER       = otlp
          OTEL_LOGS_EXPORTER          = otlp
        Leave OTEL_LOG_LEVEL unset unless debug telemetry is enabled on this connector (then set it to "debug").

        ODIGOS_OTLP_ENDPOINT is host:port; OTEL_EXPORTER_OTLP_ENDPOINT is the scheme-qualified URL — they are not interchangeable.

        ENVIRONMENT — .NET activation
        Every variable below is SET to exactly the value shown; none of them is a list to merge into.
          CORECLR_ENABLE_PROFILING    = 1
          CORECLR_PROFILER            = {918728DD-259F-4A6A-AC2B-B85E1B658318}
          CORECLR_PROFILER_PATH       = /var/odigos/dotnet/linux-glibc/OpenTelemetry.AutoInstrumentation.Native.so
          OTEL_DOTNET_AUTO_HOME       = /var/odigos/dotnet
          DOTNET_STARTUP_HOOKS        = /var/odigos/dotnet/net/OpenTelemetry.AutoInstrumentation.StartupHook.dll
          DOTNET_ADDITIONAL_DEPS      = /var/odigos/dotnet/AdditionalDeps
          DOTNET_SHARED_STORE         = /var/odigos/dotnet/store

    - id: instrument-container-apps-terraform-dotnet
      section: instrumentation:azure.container-apps
      language: dotnet
      variant: terraform
      variantLabel: Terraform
      title: Instrument a .NET Container App (Terraform)
      description: >-
        Anchored fragments for azurerm_container_app, staging and activating the .NET agent.
      format: shell
      steps:
        - Add the volume and init_container blocks inside template.
        - Add the volume mount and env to your application container.
        - Apply, then move ingress traffic to the new revision if you run in Multiple-revision mode.
      prerequisites:
        - >-
          Make sure that registry.odigos.io is accessible to the workload or change the connector to use a local image override (https://docs.odigos.io/cloud-connectors/add-connectors/add-azure-connector).
      template: |-
        resource "azurerm_container_app" "app" {
          # ... your existing configuration ...

          template {
            volume {
              name = "odigos-agent"
              # Container Apps accepts no size limit on an EmptyDir volume.
              storage_type = "EmptyDir"
            }

            # --- the .NET agent-staging init container: it stages the agent and exits, and Container Apps
            # --- starts the application container only after it succeeds. No probe or dependency is needed.
            init_container {
              name    = "odigos-agent"
              image   = "us-central1-docker.pkg.dev/odigos-cloud/components/cloud-run-agents:v0.1.0"
              command = ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/dotnet /var/odigos/dotnet"]

              volume_mounts {
                name = "odigos-agent"
                path = "/var/odigos"
              }
            }

            # --- your .NET application container ---
            container {
              name  = "<YOUR_CONTAINER>"
              image = var.app_image
              # ... your existing configuration ...

              volume_mounts {
                name = "odigos-agent"
                path = "/var/odigos"
              }

              env {
                # The IaC marker: it is what attributes this container to Odigos, and its recorded
                # language is the agent the activation environment below is checked against.
                # The value, unescaped, is exactly: {"v":1,"lang":"dotnet"}
                name  = "ODIGOS_IAC"
                value = "{\"v\":1,\"lang\":\"dotnet\"}"
              }
              # Do NOT add ODIGOS_MANAGED. That is the connector's own record of a mutation IT
              # performed, including the rollback snapshot; setting it by hand claims a rollback that
              # was never recorded. Remove it if an earlier attempt left one.
              env {
                name  = "OTEL_SERVICE_NAME"
                value = "<ODIGOS_SOURCE_NAME>"
              }
              env {
                name  = "OTEL_RESOURCE_ATTRIBUTES"
                value = "cloud.provider=azure,cloud.platform=azure_container_apps,cloud.region=<REGION>"
              }
              env {
                name  = "ODIGOS_OTLP_ENDPOINT"
                value = "<OTLP_ENDPOINT>"
              }
              env {
                # The scheme-qualified form. A bare host:port is accepted here and then exports nowhere.
                name  = "OTEL_EXPORTER_OTLP_ENDPOINT"
                value = "<OTLP_ENDPOINT_URL>"
              }
              env {
                name  = "OTEL_EXPORTER_OTLP_PROTOCOL"
                value = "grpc"
              }
              env {
                name  = "OTEL_TRACES_EXPORTER"
                value = "otlp"
              }
              env {
                name  = "OTEL_METRICS_EXPORTER"
                value = "otlp"
              }
              env {
                name  = "OTEL_LOGS_EXPORTER"
                value = "otlp"
              }
              # --- .NET activation ---
              env {
                name  = "CORECLR_ENABLE_PROFILING"
                value = "1"
              }
              env {
                name  = "CORECLR_PROFILER"
                value = "{918728DD-259F-4A6A-AC2B-B85E1B658318}"
              }
              env {
                name  = "CORECLR_PROFILER_PATH"
                value = "/var/odigos/dotnet/linux-glibc/OpenTelemetry.AutoInstrumentation.Native.so"
              }
              env {
                name  = "OTEL_DOTNET_AUTO_HOME"
                value = "/var/odigos/dotnet"
              }
              env {
                name  = "DOTNET_STARTUP_HOOKS"
                value = "/var/odigos/dotnet/net/OpenTelemetry.AutoInstrumentation.StartupHook.dll"
              }
              env {
                name  = "DOTNET_ADDITIONAL_DEPS"
                value = "/var/odigos/dotnet/AdditionalDeps"
              }
              env {
                name  = "DOTNET_SHARED_STORE"
                value = "/var/odigos/dotnet/store"
              }
              # Do NOT set OTEL_LOG_LEVEL — compared against unset, so a value is reported as drift.
            }
          }
        }

    - id: instrument-container-apps-bicep-dotnet
      section: instrumentation:azure.container-apps
      language: dotnet
      variant: bicep
      variantLabel: Bicep / ARM
      title: Instrument a .NET Container App (Bicep / ARM)
      description: >-
        The properties.template fragment to merge into your Microsoft.App/containerApps resource, staging and
        activating the .NET agent.
      format: shell
      steps:
        - Merge these template members into your Microsoft.App/containerApps resource.
        - Keep your container's existing settings — only the volumeMounts and env entries below are added.
        - Deploy, then move ingress traffic to the new revision if you run in Multiple-revision mode.
      prerequisites:
        - >-
          Make sure that registry.odigos.io is accessible to the workload or change the connector to use a local image override (https://docs.odigos.io/cloud-connectors/add-connectors/add-azure-connector).
      template: |-
        // Merge into the properties.template of your Microsoft.App/containerApps resource.
        resource app 'Microsoft.App/containerApps@2024-03-01' = {
          // ... your existing name, location, managedEnvironmentId, ingress ...
          properties: {
            template: {
              volumes: [
                {
                  name: 'odigos-agent'
                  // Container Apps accepts no size limit on an EmptyDir volume.
                  storageType: 'EmptyDir'
                }
              ]
              // A real init container: it stages the .NET agent and exits, and Container Apps starts your
              // container only after it succeeds. No probe and no dependency to declare.
              initContainers: [
                {
                  name: 'odigos-agent'
                  image: 'us-central1-docker.pkg.dev/odigos-cloud/components/cloud-run-agents:v0.1.0'
                  command: [ 'sh', '-c', 'mkdir -p /var/odigos && cp -r /instrumentations/dotnet /var/odigos/dotnet' ]
                  volumeMounts: [
                    { volumeName: 'odigos-agent', mountPath: '/var/odigos' }
                  ]
                }
              ]
              containers: [
                {
                  name: '<YOUR_CONTAINER>'
                  // ... your existing image, resources, probes ...
                  volumeMounts: [
                    { volumeName: 'odigos-agent', mountPath: '/var/odigos' }
                  ]
                  env: [
                    // The IaC marker: it is what attributes this container to Odigos, and its recorded
                    // language is the agent the activation environment below is checked against. Do NOT
                    // set ODIGOS_MANAGED — that is the connector's record of a mutation it performed, and
                    // it is what authorizes Odigos to change this app.
                    // The value, unescaped, is exactly: {"v":1,"lang":"dotnet"}
                    { name: 'ODIGOS_IAC', value: '{"v":1,"lang":"dotnet"}' }
                    { name: 'OTEL_SERVICE_NAME', value: '<ODIGOS_SOURCE_NAME>' }
                    { name: 'OTEL_RESOURCE_ATTRIBUTES', value: 'cloud.provider=azure,cloud.platform=azure_container_apps,cloud.region=<REGION>' }
                    { name: 'ODIGOS_OTLP_ENDPOINT', value: '<OTLP_ENDPOINT>' }
                    // The scheme-qualified form. A bare host:port is accepted here and then exports nowhere.
                    { name: 'OTEL_EXPORTER_OTLP_ENDPOINT', value: '<OTLP_ENDPOINT_URL>' }
                    { name: 'OTEL_EXPORTER_OTLP_PROTOCOL', value: 'grpc' }
                    { name: 'OTEL_TRACES_EXPORTER', value: 'otlp' }
                    { name: 'OTEL_METRICS_EXPORTER', value: 'otlp' }
                    { name: 'OTEL_LOGS_EXPORTER', value: 'otlp' }
                    // --- .NET activation ---
                    { name: 'CORECLR_ENABLE_PROFILING', value: '1' }
                    { name: 'CORECLR_PROFILER', value: '{918728DD-259F-4A6A-AC2B-B85E1B658318}' }
                    { name: 'CORECLR_PROFILER_PATH', value: '/var/odigos/dotnet/linux-glibc/OpenTelemetry.AutoInstrumentation.Native.so' }
                    { name: 'OTEL_DOTNET_AUTO_HOME', value: '/var/odigos/dotnet' }
                    { name: 'DOTNET_STARTUP_HOOKS', value: '/var/odigos/dotnet/net/OpenTelemetry.AutoInstrumentation.StartupHook.dll' }
                    { name: 'DOTNET_ADDITIONAL_DEPS', value: '/var/odigos/dotnet/AdditionalDeps' }
                    { name: 'DOTNET_SHARED_STORE', value: '/var/odigos/dotnet/store' }
                    // Do NOT set OTEL_LOG_LEVEL: it is compared against unset, so a value is reported as
                    // instrumentation drift.
                  ]
                }
              ]
            }
          }
        }

        // ---------------------------------------------------------------------------------------------

    - id: instrument-container-apps-az-cli-dotnet
      section: instrumentation:azure.container-apps
      language: dotnet
      variant: az-cli
      variantLabel: Azure CLI
      title: Instrument a .NET Container App (Azure CLI)
      description: >-
        Export the app definition, merge the .NET fragment, and apply it. The CLI has no flag for init
        containers or volumes, so this goes through a YAML round-trip rather than a one-liner.
      format: shell
      steps:
        - Export the live app definition.
        - Merge the volume, the odigos-agent init container and your container's mount/env into it, as shown.
        - Apply it with `az containerapp update --yaml`.
        - Move ingress traffic to the new revision if you run in Multiple-revision mode.
      prerequisites:
        - >-
          Make sure that registry.odigos.io is accessible to the workload or change the connector to use a local image override (https://docs.odigos.io/cloud-connectors/add-connectors/add-azure-connector).
      template: |-
        APP="<YOUR_APP_NAME>"
        RG="<YOUR_RESOURCE_GROUP>"

        # az containerapp has no flags for init containers or volumes, so edit the definition itself.
        az containerapp show --name "$APP" --resource-group "$RG" --output yaml > app.yaml

        # In app.yaml, under properties.template:
        #
        #   volumes:
        #     - name: odigos-agent
        #       storageType: EmptyDir
        #
        #   initContainers:
        #     - name: odigos-agent
        #       image: us-central1-docker.pkg.dev/odigos-cloud/components/cloud-run-agents:v0.1.0
        #       command: ["sh", "-c", "mkdir -p /var/odigos && cp -r /instrumentations/dotnet /var/odigos/dotnet"]
        #       volumeMounts:
        #         - volumeName: odigos-agent
        #           mountPath: /var/odigos
        #
        #   and on your .NET container <YOUR_CONTAINER>:
        #     volumeMounts:
        #       - volumeName: odigos-agent
        #         mountPath: /var/odigos
        #     env:
        #       # The IaC marker: it is what attributes this container to Odigos. Do NOT set ODIGOS_MANAGED —
        #       # that is the connector's record of a mutation it performed, and it is what authorizes Odigos
        #       # to change this app.
        #       - name: ODIGOS_IAC
        #         value: '{"v":1,"lang":"dotnet"}'
        #       - name: OTEL_SERVICE_NAME
        #         value: <ODIGOS_SOURCE_NAME>
        #       - name: OTEL_RESOURCE_ATTRIBUTES
        #         value: cloud.provider=azure,cloud.platform=azure_container_apps,cloud.region=<REGION>
        #       - name: ODIGOS_OTLP_ENDPOINT
        #         value: <OTLP_ENDPOINT>
        #       - name: OTEL_EXPORTER_OTLP_ENDPOINT
        #         value: <OTLP_ENDPOINT_URL>
        #       - name: OTEL_EXPORTER_OTLP_PROTOCOL
        #         value: grpc
        #       - name: OTEL_TRACES_EXPORTER
        #         value: otlp
        #       - name: OTEL_METRICS_EXPORTER
        #         value: otlp
        #       - name: OTEL_LOGS_EXPORTER
        #         value: otlp
        #       # --- .NET activation ---
        #       - name: CORECLR_ENABLE_PROFILING
        #         value: 1
        #       - name: CORECLR_PROFILER
        #         value: {918728DD-259F-4A6A-AC2B-B85E1B658318}
        #       - name: CORECLR_PROFILER_PATH
        #         value: /var/odigos/dotnet/linux-glibc/OpenTelemetry.AutoInstrumentation.Native.so
        #       - name: OTEL_DOTNET_AUTO_HOME
        #         value: /var/odigos/dotnet
        #       - name: DOTNET_STARTUP_HOOKS
        #         value: /var/odigos/dotnet/net/OpenTelemetry.AutoInstrumentation.StartupHook.dll
        #       - name: DOTNET_ADDITIONAL_DEPS
        #         value: /var/odigos/dotnet/AdditionalDeps
        #       - name: DOTNET_SHARED_STORE
        #         value: /var/odigos/dotnet/store
        #     (do NOT set OTEL_LOG_LEVEL — compared against unset, so a value is reported as drift)
# gateway: connector-wide collector wiring; not part of either domain. Implemented in a later phase.
gateway:
  enabled: false
  displayName: Gateway / collector wiring
  description: >-
    Wire instrumented workloads to managed-otelcol regional collectors. Implemented in a later phase.
  types: []
