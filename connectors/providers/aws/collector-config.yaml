# Odigos OTel Lambda collector config. Baked into every assembled layer at /opt/collector-config/config.yaml
# (overriding the upstream default), it is what the in-Lambda collector runs. The auto-instrumentation
# SDK exports to this collector on localhost (fast, never blocking the invocation on the remote
# destination); the collector forwards to the connector's OTLP destination, set per function via env:
#   ODIGOS_OTLP_ENDPOINT  — destination gRPC endpoint, "host:port"
#   ODIGOS_OTLP_INSECURE  — "true" when the destination has TLS disabled
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "localhost:4317"
      http:
        endpoint: "localhost:4318"

processors:
  batch:

exporters:
  otlp:
    endpoint: "${env:ODIGOS_OTLP_ENDPOINT}"
    tls:
      insecure: ${env:ODIGOS_OTLP_INSECURE}

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
