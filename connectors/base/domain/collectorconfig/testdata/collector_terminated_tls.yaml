receivers:
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317
                tls:
                    cert_file: /etc/odigos/collector/tls/tls.crt
                    key_file: /etc/odigos/collector/tls/tls.key
            http:
                endpoint: 0.0.0.0:4318
                tls:
                    cert_file: /etc/odigos/collector/tls/tls.crt
                    key_file: /etc/odigos/collector/tls/tls.key
processors:
    batch:
        send_batch_size: 8192
        timeout: 200ms
    memory_limiter:
        check_interval: 1s
        limit_mib: 1638
        spike_limit_mib: 327
    resource:
        attributes:
            - action: insert
              key: cloud.region
              value: us-east-1
    resourcedetection:
        detectors:
            - env
            - ecs
        override: false
        timeout: 2s
exporters:
    otlp:
        endpoint: otlp.vendor.example.com:4317
        tls:
            insecure: true
extensions:
    health_check:
        endpoint: 0.0.0.0:13133
service:
    extensions:
        - health_check
    pipelines:
        logs:
            receivers:
                - otlp
            processors:
                - memory_limiter
                - resourcedetection
                - resource
                - batch
            exporters:
                - otlp
        metrics:
            receivers:
                - otlp
            processors:
                - memory_limiter
                - resourcedetection
                - resource
                - batch
            exporters:
                - otlp
        traces:
            receivers:
                - otlp
            processors:
                - memory_limiter
                - resourcedetection
                - resource
                - batch
            exporters:
                - otlp
