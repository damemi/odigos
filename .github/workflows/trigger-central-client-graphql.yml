name: Notify central-client of GraphQL changes

on:
  push:
    branches: [main]
    paths:
      - 'central-ui/src/graphql/**'

permissions:
  id-token: write # for the octo-sts OIDC exchange
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Mint token to dispatch into central-client
        id: sts
        uses: odigos-io/ci-core/sts@main
        with:
          scope: odigos-io/odigos-central-client
          identity: trigger-regen-graphql
          output-git-config: false

      - name: Trigger regen in central-client
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.sts.outputs.GH_TOKEN }}
          repository: odigos-io/odigos-central-client
          event-type: enterprise-graphql-updated
          client-payload: '{"sha": "${{ github.sha }}"}'
