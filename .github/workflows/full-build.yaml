name: full odigos build

on:
  pull_request:
    branches:
      - 'releases/**'
    types:
      - opened
      - synchronize
      - reopened
      
  schedule:
    - cron: '0 0 * * *' # Nightly run at midnight

  workflow_dispatch:

jobs:
  # The instrumentor, insights, collector and operator images build in platform-k8s.yaml, which on
  # release-branch PRs builds both platforms without the layer cache.
  build-all-services:
    name: build-all-services
    strategy:
      matrix:
        service: [odiglet, agents, ui]
        include:
          - service: odiglet
            dockerfile_path: odiglet/enterprise
          - service: agents
            dockerfile_path: odiglet/enterprise
          - service: ui
            dockerfile_path: ui
    runs-on: depot-ubuntu-24.04-8
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Write npm auth
        id: npmrc
        uses: ./.github/actions/npm-auth
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.service }} Image
        uses: docker/build-push-action@v7
        with:
          # github_token: odiglet and agents download private instrumentation repos.
          secrets: |
            github_token=${{ secrets.RELEASE_BOT_TOKEN }}
          secret-files: |
            npmrc=${{ steps.npmrc.outputs.path }}
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          file: ${{ matrix.dockerfile_path }}/Dockerfile
          context: .
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          target: ${{ matrix.service == 'agents' && 'agents' || '' }}

  build-cli:
    runs-on: depot-ubuntu-24.04-8
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
      - name: Set up Goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean
