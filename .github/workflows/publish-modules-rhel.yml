name: Publish Modules for RHEL

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'image tag'
        required: true

jobs:
    publish-images-rhel:
        runs-on: ${{ matrix.runner }}
        permissions:
          contents: 'read'
          id-token: 'write'
          packages: 'write'
        strategy:
          fail-fast: false
          matrix:
            service: ['autoscaler', 'instrumentor', 'scheduler', 'collector', 'odiglet', 'ui', 'operator', 'agents', 'insights', 'central-backend', 'central-proxy', 'central-ui']
            include:
              - service: autoscaler
                runner: depot-ubuntu-latest
                summary: 'Autoscaler for Odigos'
                description: 'Compatibility image. Autoscaler controllers now run in the instrumentor.'
              - service: instrumentor
                runner: depot-ubuntu-latest
                summary: 'Instrumentor for Odigos'
                description: 'Instrumentor manages auto-instrumentation for workloads with Odigos.'
              - service: scheduler
                runner: depot-ubuntu-latest
                summary: 'Scheduler for Odigos'
                description: 'Compatibility image. Scheduler controllers now run in the instrumentor.'
              - service: collector
                runner: depot-ubuntu-24.04-16
                summary: 'Odigos Collector'
                description: 'The Odigos build of the OpenTelemetry Collector.'
              - service: odiglet
                runner: depot-ubuntu-24.04-4
                summary: 'Odiglet for Odigos'
                description: 'Odiglet is the core component of Odigos managing auto-instrumentation. This image requires a root user to load and manage eBPF programs.'
              - service: ui
                runner: depot-ubuntu-latest
                summary: 'UI for Odigos'
                description: 'UI provides the frontend webapp for managing an Odigos installation.'
              - service: operator
                runner: depot-ubuntu-latest
                summary: 'Odigos Operator'
                description: 'The Odigos Operator installs and manages Odigos in a cluster'
              - service: agents
                runner: depot-ubuntu-latest
                summary: 'Odigos Agents'
                description: 'The Odigos Agents used to copy Odigos agent relevant files into the user workloads.'
              - service: insights
                runner: depot-ubuntu-latest
                summary: 'Insights for Odigos'
                description: 'Insights learns per-transaction baselines from traces and scores deviations.'
              - service: central-backend
                runner: depot-ubuntu-24.04-4
                summary: 'Central Backend for Odigos'
                description: 'Central Backend provides the API and coordination for Odigos Central multi-cluster management.'
              - service: central-proxy
                runner: depot-ubuntu-24.04-4
                summary: 'Central Proxy for Odigos'
                description: 'Central Proxy connects Odigos in workload clusters to Odigos Central.'
              - service: central-ui
                runner: depot-ubuntu-24.04-4
                summary: 'Central UI for Odigos'
                description: 'Central UI provides the web application for managing Odigos Central.'
        steps:
          - name: Checkout repository
            uses: actions/checkout@v5
            with:
              ref: ${{ inputs.tag }}

          # This workflow runs from main for any tag, including patches of versions released before
          # odigos-enterprise moved here. Those tags build the community images from their own layout,
          # as they always did; newer tags build the enterprise images.
          - name: Resolve image for this tag
            id: image
            env:
              SERVICE: ${{ matrix.service }}
            run: |
              if [ -f instrumentor/enterprise/Dockerfile ]; then enterprise=true; else enterprise=false; fi
              # Release branches cut before odiglet/enterprise was folded into odiglet still build from it.
              if [ -f odiglet/enterprise/Dockerfile ]; then odiglet_file=odiglet/enterprise/Dockerfile; else odiglet_file=odiglet/Dockerfile; fi
              skip=false
              context=.
              case "$SERVICE" in
                autoscaler|scheduler|operator) image="odigos-$SERVICE"; file="$SERVICE/Dockerfile" ;;
                instrumentor|collector)
                  # The collector's enterprise build moved to collector/Dockerfile.
                  if $enterprise; then image="odigos-enterprise-$SERVICE"; file="$SERVICE/enterprise/Dockerfile"; [ -f "$file" ] || file="$SERVICE/Dockerfile"
                  else image="odigos-$SERVICE"; file="$SERVICE/Dockerfile"; fi ;;
                odiglet)
                  if $enterprise; then image="odigos-enterprise-odiglet"; file="$odiglet_file"
                  else image="odigos-odiglet"; file="odiglet/Dockerfile"; fi ;;
                agents)
                  if $enterprise; then image="odigos-enterprise-agents"; file="$odiglet_file"
                  else image="odigos-agents"; file="odiglet/Dockerfile"; fi ;;
                ui)
                  if $enterprise; then image="odigos-enterprise-ui"; file="ui/Dockerfile"
                  else image="odigos-ui"; file="frontend/Dockerfile"; fi ;;
                insights)
                  if $enterprise; then image="odigos-enterprise-insights"; file="insights/Dockerfile"
                  else skip=true; fi ;;
                # Tags from before Central moved here release it from odigos-enterprise.
                central-backend|central-proxy|central-ui)
                  if [ -f "$SERVICE/Dockerfile" ]; then image="odigos-enterprise-$SERVICE"; file="$SERVICE/Dockerfile"
                  else skip=true; fi
                  if [ "$SERVICE" = central-ui ]; then context=central-ui; fi ;;
              esac
              echo "skip=$skip" >> "$GITHUB_OUTPUT"
              echo "context=$context" >> "$GITHUB_OUTPUT"
              echo "image=$image" >> "$GITHUB_OUTPUT"
              echo "file=$file" >> "$GITHUB_OUTPUT"

          - name: Set up QEMU
            uses: docker/setup-qemu-action@v4
      
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
      
          - id: gcp-auth
            name: Authenticate with Google Cloud
            uses: google-github-actions/auth@v3
            with:
              token_format: 'access_token'
              workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
              service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
              access_token_lifetime: 1200s
      
          - name: Login to Artifact Registry
            uses: docker/login-action@v3
            with:
              registry: us-central1-docker.pkg.dev
              username: oauth2accesstoken
              password: ${{ steps.gcp-auth.outputs.access_token }}

          # Authenticate to AWS Public ECR so the Dockerfile's `COPY --from=public.ecr.aws/...`
          # references for community agents (python, nodejs, php, ruby) are pulled with the
          # higher per-account rate limit instead of the anonymous one (which causes 429s).
          - name: Configure AWS credentials for ECR Public
            uses: aws-actions/configure-aws-credentials@v5
            with:
              role-to-assume: arn:aws:iam::061717858829:role/ecr-pull-push-role
              aws-region: us-east-1

          - name: Login to Amazon ECR Public
            run: |
              aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

          - name: Login to Docker Hub
            uses: docker/login-action@v3
            with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

          - name: Login to Quay.io
            uses: docker/login-action@v3
            with:
              registry: quay.io
              username: ${{ secrets.QUAY_USERNAME }}
              password: ${{ secrets.QUAY_TOKEN }}

          - name: Write npm auth
            id: npmrc
            uses: ./.github/actions/npm-auth
            with:
              token: ${{ secrets.GITHUB_TOKEN }}
          - name: Build and Push Docker Image for ${{ matrix.service }}
            if: steps.image.outputs.skip != 'true'
            uses: docker/build-push-action@v7
            env:
              ODIGOS_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.extract_tag.outputs.tag}}
            with:
              # github_token: odiglet and agents download private instrumentation repos.
              secrets: |
                github_token=${{ secrets.RELEASE_BOT_TOKEN }}
              secret-files: |
                npmrc=${{ steps.npmrc.outputs.path }}
              # Use the checked-out files (at inputs.tag) instead of build-push-action's
              # default Git context, which would otherwise build from the workflow's
              # triggering ref (e.g. main) and ignore the actions/checkout above.
              context: ${{ steps.image.outputs.context }}
              push: true
              provenance: false
              tags: |
                us-central1-docker.pkg.dev/odigos-cloud/components/${{ steps.image.outputs.image }}-rhel-certified:${{ env.ODIGOS_TAG }}
                quay.io/odigos/${{ steps.image.outputs.image }}-rhel-certified:${{ env.ODIGOS_TAG }}
              build-args: |
                SERVICE_NAME=${{ matrix.service }}
                ODIGOS_VERSION=${{ env.ODIGOS_TAG }}
                RELEASE=${{ env.ODIGOS_TAG }}
                VERSION=${{ env.ODIGOS_TAG }}
                SUMMARY=${{ matrix.summary }}
                DESCRIPTION=${{ matrix.description }}
                LD_FLAGS=-s -w
                RHEL=true
              platforms: linux/amd64,linux/arm64
              file: ${{ steps.image.outputs.file }}
              target: >-
                ${{ matrix.service == 'agents' && 'agents-rhel' || 'rhel' }}

    publish-cli-rhel:
        needs: publish-images-rhel
        runs-on: depot-ubuntu-latest
        permissions:
          contents: 'read'
          id-token: 'write'
          packages: 'write'
        steps:
          - name: Checkout repository
            uses: actions/checkout@v5
            with:
              ref: ${{ inputs.tag }}

          - uses: actions/setup-go@v7
            with:
              go-version-file: cli/go.mod

          - name: Generate CLI licenses for RHEL base image
            working-directory: ./cli
            run: make licenses

          - id: gcp-auth
            name: Authenticate with Google Cloud
            uses: google-github-actions/auth@v3
            with:
              token_format: 'access_token'
              workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
              service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
              access_token_lifetime: 1200s

          - name: Login to Artifact Registry
            uses: docker/login-action@v3
            with:
              registry: us-central1-docker.pkg.dev
              username: oauth2accesstoken
              password: ${{ steps.gcp-auth.outputs.access_token }}

          - name: Login to Docker Hub
            uses: docker/login-action@v3
            with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

          - name: Login to Quay.io
            uses: docker/login-action@v3
            with:
              registry: quay.io
              username: ${{ secrets.QUAY_USERNAME }}
              password: ${{ secrets.QUAY_TOKEN }}

          - name: Set up QEMU
            uses: docker/setup-qemu-action@v4

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4

          - name: Build and push RHEL ko base image (/licenses for preflight)
            uses: docker/build-push-action@v7
            with:
              context: ./cli
              file: ./cli/Dockerfile.rhel-base
              platforms: linux/amd64,linux/arm64
              push: true
              provenance: false
              tags: |
                us-central1-docker.pkg.dev/odigos-cloud/components/odigos-cli-rhel-ko-base:${{ inputs.tag }}

          - uses: ko-build/setup-ko@v0.9

          - name: Set ko ldflags env (matches cli/.ko.yaml)
            id: vars
            run: |
              echo "short_commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
              echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

          - name: Publish CLI certified image to GCR registry
            id: ko-publish
            working-directory: ./cli
            env:
              KO_DOCKER_REPO: us-central1-docker.pkg.dev/odigos-cloud/components/odigos-cli-rhel-certified
              KO_CONFIG_PATH: ./.ko.yaml
              VERSION: ${{ inputs.tag }}
              SHORT_COMMIT: ${{ steps.vars.outputs.short_commit }}
              DATE: ${{ steps.vars.outputs.date }}
              KO_DEFAULTBASEIMAGE: us-central1-docker.pkg.dev/odigos-cloud/components/odigos-cli-rhel-ko-base:${{ inputs.tag }}
            run: |
              # `ko build --bare` prints the digest-pinned image reference of the
              # multi-arch index it just pushed; capture it so we can mirror to
              # the other registries below without rebuilding.
              IMAGE=$(ko build --bare --tags latest --tags ${{ inputs.tag }} \
                --image-label name=odigos-cli \
                --image-label vendor=Odigos \
                --image-label maintainer=Odigos \
                --image-label version=${{ inputs.tag }} \
                --image-label release=${{ inputs.tag }} \
                --image-label summary="Odigos CLI" \
                --image-label description="Odigos CLI to install and manage Odigos in your Kubernetes cluster." \
                --platform=all .)
              echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          - name: Install crane
            uses: imjasonh/setup-crane@v0.4

          # ko only supports a single KO_DOCKER_REPO, so mirror the published
          # multi-arch index to Quay with `crane copy` to
          # match the destinations used for the other RHEL-certified images.
          - name: Mirror CLI image to Quay
            env:
              SOURCE: ${{ steps.ko-publish.outputs.image }}
              TAG: ${{ inputs.tag }}
            run: |
              DEST=quay.io/odigos/odigos-cli-rhel-certified
              for T in "${TAG}" latest; do
                echo "Copying ${SOURCE} -> ${DEST}:${T}"
                crane copy "${SOURCE}" "${DEST}:${T}"
              done

    trigger-enterprise-publish:
        needs: publish-cli-rhel
        runs-on: ubuntu-latest
        permissions:
          contents: read
          id-token: write
        steps:
          # Tags that carry Central and the cloud connectors are released entirely from this repo; patches of
          # versions released before the move still publish their enterprise images from odigos-enterprise.
          - name: Check whether odigos-enterprise publishes this tag
            id: layout
            env:
              GH_TOKEN: ${{ github.token }}
              TAG: ${{ inputs.tag }}
              REPO: ${{ github.repository }}
            run: |
              if gh api "repos/${REPO}/contents/central-backend?ref=${TAG}" --silent 2>/dev/null; then
                echo "Tag ${TAG} carries Central and the connectors; nothing to publish from odigos-enterprise."
                echo "dispatch=false" >> "$GITHUB_OUTPUT"
              else
                echo "dispatch=true" >> "$GITHUB_OUTPUT"
              fi

          - name: Get sts tokens
            if: steps.layout.outputs.dispatch == 'true'
            id: sts-enterprise
            uses: odigos-io/ci-core/sts@main
            with:
              scope: odigos-io/odigos-enterprise
              identity: trigger-release-pr
              output-git-config: "false"

          - name: Trigger Enterprise Publish job
            if: steps.layout.outputs.dispatch == 'true'
            uses: peter-evans/repository-dispatch@v4
            with:
              token: ${{ steps.sts-enterprise.outputs.GH_TOKEN }}
              repository: odigos-io/odigos-enterprise
              event-type: publish_images_rhel
              client-payload: '{"tag": "${{ inputs.tag }}"}'
