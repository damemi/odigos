name: E2E Tests

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main, "releases/**"]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-cli:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "~1.26.6"
          check-latest: true
          cache: true
          cache-dependency-path: |
            **/go.sum

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.2

      - name: Build CLI
        run: |
          cd cli
          TAG=0.0.0-e2e-test
          sed -i -E 's/0.0.0/'"${TAG#v}"'/' ../helm/odigos/Chart.yaml
          sed -i -E 's/0.0.0/'"${TAG#v}"'/' ../helm/odigos-central/Chart.yaml
          helm package ../helm/odigos -d pkg/helm/embedded
          helm package ../helm/odigos-central -d pkg/helm/embedded
          go build -tags=embed_manifests \
            -ldflags "-X github.com/odigos-io/odigos/cli/pkg/helm.OdigosChartVersion=${TAG#v}" \
            -o odigos

      - name: Save CLI binary to cache
        uses: actions/cache/save@v4
        with:
          path: cli/odigos
          key: ${{ github.run_id }}-odigos-cli

  build-odigos-images:
    runs-on: depot-ubuntu-24.04-8
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write npm auth
        id: npmrc
        uses: ./.github/actions/npm-auth
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Odigos Images
        env:
          # odiglet and agents download private instrumentation repos.
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          TAG=e2e-test make build-images
          TAG=e2e-test EXTENDED=true make build-odiglet build-agents
          TAG=e2e-test make build-central-images build-connector-opamp-gateway
          docker save -o odigos-images.tar $(docker images --format "{{.Repository}}:{{.Tag}}" | grep "odigos")

      - uses: ko-build/setup-ko@v0.9

      - name: Build CLI Image
        run: |
          TAG=e2e-test make build-cli-image
          docker save registry.odigos.io/odigos-cli:e2e-test -o cli-image.tar

      # Victoria Metrics is published, not built in this repo. Materialize a single-platform
      # image (buildx --load) so kind load does not fail on multi-arch manifests.
      - name: Prepare Victoria Metrics Image
        run: |
          printf 'FROM registry.odigos.io/odigos-victoria-metrics:latest\n' | docker buildx build \
            --platform=linux/$(docker version -f '{{.Server.Arch}}') \
            --pull \
            -t registry.odigos.io/odigos-victoria-metrics:e2e-test \
            --load \
            -
          docker save registry.odigos.io/odigos-victoria-metrics:e2e-test -o victoria-metrics-image.tar

      # odigos-cache is only published on release. Until then e2e re-hosts upstream
      # Redis (pin must match REDIS_VERSION in release.yml).
      - name: Prepare Cache Image
        run: |
          printf 'FROM docker.io/library/redis:8.10.2\n' | docker buildx build \
            --platform=linux/$(docker version -f '{{.Server.Arch}}') \
            --pull \
            -t registry.odigos.io/odigos-cache:e2e-test \
            --load \
            -
          docker save registry.odigos.io/odigos-cache:e2e-test -o cache-image.tar

      - name: Save Odigos images to cache
        uses: actions/cache/save@v4
        with:
          path: |
            odigos-images.tar
            cli-image.tar
            victoria-metrics-image.tar
            cache-image.tar
          key: ${{ github.run_id }}-odigos-images

  kubernetes-test:
    name: kubernetes-test (${{ matrix.kube-version }}, ${{ matrix.test-scenario }})
    needs: [build-odigos-images, build-cli]
    runs-on: depot-ubuntu-24.04-8
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      # No max-parallel: readiness recheck + apply-timeout + install waits absorb
      # control-plane load better than serializing the matrix (which stretched CI
      # wall-clock). Reintroduce a cap only if signal:killed / OOM returns.
      matrix:
        kube-version: ["1.32"]
        test-scenario:
          - "central-install"
          - "central-infrastructure"
          - "central-ui"
          - "central-auth-idp"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Kubernetes test
        uses: ./.github/actions/kubernetes-tests
        with:
          kubernetes-version: ${{ matrix.kube-version }}
          test-scenario: ${{ matrix.test-scenario }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          onprem-token: ${{ secrets.ODIGOS_E2E_TESTS_API_KEY }}
