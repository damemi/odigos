name: verify collector ocb
on:
  pull_request:
    paths:
      - "collector/**"

jobs:
  verify-collector-ocb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
      # The collector distribution is collector/enterprise (verify-enterprise-collector-ocb);
      # this checks the generated code of the components under collector/.
      - name: Generate component metadata
        working-directory: ./collector
        run: "make generate"
      - name: Verify Generate
        working-directory: ./collector
        run: |
          if [[ $(git diff --exit-code) ]]; then
            git diff
            echo "collector components are out of sync with their metadata. Please run 'make generate' in 'collector' directory and commit the changes."
            exit 1
          fi
