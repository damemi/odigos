name: Build and push images

on:
  workflow_call: # Workflow trigger
    inputs:
      target_tag:
        description: 'The tag to use when pushing the images to the registry'
        required: false
        type: string
      registry:
        description: 'The registry to push images to'
        required: false
        type: string
        default: 061717858829.dkr.ecr.us-east-1.amazonaws.com
  workflow_dispatch: # Manual trigger
    inputs:
      target_tag:
        description: 'The tag to use when pushing the images to the registry'
        required: false
        type: string
      registry:
        description: 'The registry to push images to'
        required: false
        type: string
        default: 061717858829.dkr.ecr.us-east-1.amazonaws.com

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  build-images:
    runs-on: depot-ubuntu-24.04-8

    env:
      # The expression checks for an input from either the workflow_call context (inputs) or from workflow_dispatch (github.event.inputs).
      # If none is provided (as in pull_request), it defaults to github.sha for target_tag
      TARGET_TAG: ${{ (inputs.target_tag || github.event.inputs.target_tag) || github.sha }}
      # For REGISTRY, it falls back to the default value provided here if no input is available.
      REGISTRY: ${{ (inputs.registry || github.event.inputs.registry) || '061717858829.dkr.ecr.us-east-1.amazonaws.com' }}
      # TF_REGION: us-east-1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::061717858829:role/ecr-pull-push-role
          aws-region: us-east-1

      # Dev images include the enterprise components, so they go to a private registry.
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Write npm auth
        id: npmrc
        uses: ./.github/actions/npm-auth
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Images
        env:
          COMMIT_HASH: ${{ github.sha }}
          # odiglet and agents download private instrumentation repos.
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: make build-images TAG=${COMMIT_HASH}

      - uses: ko-build/setup-ko@v0.9
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - name: Build CLI Image
        env:
          COMMIT_HASH: ${{ github.sha }}
        run: make build-cli-image TAG=${COMMIT_HASH}

      - name: Push Docker Images to ECR
        env:
          COMMIT_HASH: ${{ github.sha }}
        run: |
          for image in odigos-enterprise-collector odigos-enterprise-instrumentor odigos-enterprise-ui odigos-enterprise-odiglet odigos-enterprise-agents odigos-enterprise-insights odigos-cli; do
            aws ecr describe-repositories --repository-names "$image" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$image" >/dev/null
            docker tag "registry.odigos.io/$image:${COMMIT_HASH}" "$REGISTRY/$image:${COMMIT_HASH}"
            docker push "$REGISTRY/$image:${COMMIT_HASH}"
          done
