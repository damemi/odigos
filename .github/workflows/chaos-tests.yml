# This pipeline was created in order to allow manual triggering of the job (Build images + run)
name: Run chaos tests

on:
  workflow_dispatch: # Manual trigger

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  build-images:
    uses: ./.github/workflows/build-dev-images.yml

  chaos-tests:
    needs: build-images
    runs-on: depot-ubuntu-24.04-8
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::061717858829:role/ecr-pull-push-role
          aws-region: us-east-1
      - name: Run chaos-tests
        uses: ./.github/actions/chaos-tests
        with:
          onprem-token: ${{ secrets.ODIGOS_E2E_TESTS_API_KEY }}
        env:
          GITHUB_SHA: ${{ github.sha }}