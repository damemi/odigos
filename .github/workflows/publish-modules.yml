name: Publish Modules

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'image tag'
        required: true
      force_run_on_zero_patch:
        description: 'Run even when tag is <MAJOR>.<MINOR>.0'
        required: false
        default: "false"

jobs:
  # Skip tags that are exactly v<MAJOR>.<MINOR>.0
  # unless force_run_on_zero_patch is "true".
  # This prevents publishing modules when a promote-rc-to-stable tag is created,
  # but allows overriding manually by setting force_run_on_zero_patch to "true"
  # when dispatching the workflow.
  decide:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      tag:  ${{ steps.decide.outputs.tag }}
    steps:
      - id: decide
        env:
          # Prefer manual input for dispatch; otherwise use the pushed tag
          TAG:   ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          # If workflow_dispatch, this can be set to "true" to override skipping
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run_on_zero_patch || 'false' }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.0$ ]]; then
            if [[ "$FORCE" == "true" ]]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi


  print-tag:
    if: ${{ needs.decide.outputs.skip != 'true' }}
    needs: decide
    runs-on: ubuntu-latest
    steps:
      - name: Extract Tag
        id: extract_tag
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Notify Slack Start
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "detected new git tag ${{ steps.extract_tag.outputs.tag }}, starting a release"
          failure-description: "error during detection of new git tag ${{ steps.extract_tag.outputs.tag }}"
          tag: ${{ steps.extract_tag.outputs.tag }}

  tag-modules:
    if: ${{ needs.decide.outputs.skip != 'true' }}
    needs: decide
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:

      - name: Get sts tokens
        id: sts-this-repo
        uses: odigos-io/ci-core/sts@main
        with:
          scope: odigos-io/odigos
          identity: push-tags
          output-git-config: "true"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for all tags and branches
          token: ${{ steps.sts-this-repo.outputs.GH_TOKEN }}

      - name: Extract Tag
        id: extract_tag
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Notify Slack Start
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "start tagging odigos modules so they can be consumed as libraries"
          failure-description: "error during tagging of odigos modules"
          tag: ${{ steps.extract_tag.outputs.tag }}

      - name: Tag Modules
        uses: ./.github/actions/tag-modules
        with:
          tag: ${{ steps.extract_tag.outputs.tag }}

      - name: Notify Slack
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Odigos go modules tagged successfully"
          failure-description: "ERROR: Odigos go modules tagging failed"
          tag: ${{ steps.extract_tag.outputs.tag }}

  trigger-enterprise-release-pr:
    # Deliberately not gated on decide.skip. That guard exists to stop Go modules
    # being republished when promote-rc-to-stable retags a vX.Y.0, but the enterprise
    # release PR is a separate concern — and a first stable is exactly when enterprise
    # needs to cut its matching release. v1.38.0 was promoted and never reached
    # enterprise because this job inherited the module guard.
    # tag-modules is skipped in that same case, so accept skipped as well as success.
    if: ${{ !cancelled() && needs.decide.result == 'success'
            && (needs['tag-modules'].result == 'success' || needs['tag-modules'].result == 'skipped') }}
    needs: [decide, tag-modules]
    runs-on: depot-ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:

      - name: Classify release
        id: meta
        env:
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-feat\. ]]; then
            echo "kind=feature" >> "$GITHUB_OUTPUT"
          else
            echo "kind=standard" >> "$GITHUB_OUTPUT"
          fi

      # Central and the cloud connectors moved here from odigos-enterprise. A tag that carries them is released
      # entirely from this repo; patches of versions released before the move still release their enterprise
      # components from odigos-enterprise.
      - name: Check whether odigos-enterprise releases this tag
        id: layout
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/${REPO}/contents/central-backend?ref=${TAG}" --silent 2>/dev/null; then
            echo "Tag ${TAG} carries Central and the connectors; nothing to release in odigos-enterprise."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
          else
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.meta.outputs.kind == 'feature' && steps.layout.outputs.dispatch == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.decide.outputs.tag }}

      - name: Read enterprise branch from tag annotation
        if: steps.meta.outputs.kind == 'feature' && steps.layout.outputs.dispatch == 'true'
        id: branch
        env:
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          MSG=$(git tag -l --format='%(contents)' "$TAG")
          BRANCH=""
          OSS_BRANCH=""
          while IFS= read -r line; do
            if [[ "$line" == enterprise_branch=* ]]; then
              BRANCH="${line#enterprise_branch=}"
            elif [[ "$line" == oss_branch=* ]]; then
              OSS_BRANCH="${line#oss_branch=}"
            fi
          done <<< "$MSG"
          if [ -z "$BRANCH" ]; then
            echo "ERROR: feature tag $TAG is missing enterprise_branch annotation"
            exit 1
          fi
          if [ -z "$OSS_BRANCH" ]; then
            echo "ERROR: feature tag $TAG is missing oss_branch annotation"
            exit 1
          fi
          echo "enterprise_branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "oss_branch=${OSS_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Tag annotation: '${MSG}'"
          echo "Enterprise branch: '${BRANCH}'"
          echo "OSS branch: '${OSS_BRANCH}'"

      - name: Get sts tokens
        if: steps.layout.outputs.dispatch == 'true'
        id: sts-enterprise
        uses: odigos-io/ci-core/sts@main
        with:
          scope: odigos-io/odigos-enterprise
          identity: trigger-release-pr
          output-git-config: "false"

      - name: Trigger create release PR workflow
        if: steps.meta.outputs.kind == 'standard' && steps.layout.outputs.dispatch == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.sts-enterprise.outputs.GH_TOKEN }}
          repository: odigos-io/odigos-enterprise
          event-type: create_release_pr
          client-payload: '{"tag": "${{ needs.decide.outputs.tag }}"}'

      - name: Trigger create feature-release PR workflow
        if: steps.meta.outputs.kind == 'feature' && steps.layout.outputs.dispatch == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.sts-enterprise.outputs.GH_TOKEN }}
          repository: odigos-io/odigos-enterprise
          event-type: create_feature_release_pr
          client-payload: '{"tag": "${{ needs.decide.outputs.tag }}", "branch": "${{ steps.branch.outputs.enterprise_branch }}", "oss_branch": "${{ steps.branch.outputs.oss_branch }}"}'

      - name: Notify Slack
        if: always() && steps.layout.outputs.dispatch != 'false'
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Triggered Odigos Enterprise ${{ steps.meta.outputs.kind }} release PR workflow"
          failure-description: "ERROR: Failed to trigger Odigos Enterprise ${{ steps.meta.outputs.kind }} release PR workflow"
          tag: ${{ needs.decide.outputs.tag }}

  publish-images:
    if: ${{ needs.decide.outputs.skip != 'true' }}
    needs: decide
    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'write'

    strategy:
      matrix:
        # odiglet and agents also publish an -extended variant (EXTENDED=true, tag suffix -extended).
        include:
          - service: autoscaler
            image: odigos-autoscaler
            file: autoscaler/Dockerfile
            runner: depot-ubuntu-latest
            summary: 'Autoscaler for Odigos'
            description: 'Compatibility image. Autoscaler controllers now run in the instrumentor.'
          - service: scheduler
            image: odigos-scheduler
            file: scheduler/Dockerfile
            runner: depot-ubuntu-latest
            summary: 'Scheduler for Odigos'
            description: 'Compatibility image. Scheduler controllers now run in the instrumentor.'
          - service: operator
            image: odigos-operator
            file: operator/Dockerfile
            runner: depot-ubuntu-latest
            summary: 'Odigos Operator'
            description: 'The Odigos Operator installs and manages Odigos in a cluster'
          - service: instrumentor
            image: odigos-enterprise-instrumentor
            file: instrumentor/enterprise/Dockerfile
            runner: depot-ubuntu-latest
            summary: 'Instrumentor for Odigos'
            description: 'Instrumentor manages auto-instrumentation for workloads with Odigos.'
          - service: collector
            image: odigos-enterprise-collector
            file: collector/Dockerfile
            runner: depot-ubuntu-24.04-16
            summary: 'Odigos Collector'
            description: 'The Odigos build of the OpenTelemetry Collector.'
          - service: odiglet
            image: odigos-enterprise-odiglet
            file: odiglet/Dockerfile
            runner: depot-ubuntu-24.04-4
            summary: 'Odiglet for Odigos'
            description: 'Odiglet is the core component of Odigos managing auto-instrumentation. This image requires a root user to load and manage eBPF programs.'
          - service: odiglet
            image: odigos-enterprise-odiglet
            file: odiglet/Dockerfile
            extended: true
            runner: depot-ubuntu-24.04-4
            summary: 'Odiglet for Odigos'
            description: 'Odiglet is the core component of Odigos managing auto-instrumentation. This image requires a root user to load and manage eBPF programs.'
          - service: agents
            image: odigos-enterprise-agents
            file: odiglet/Dockerfile
            target: agents
            runner: depot-ubuntu-latest
            summary: 'Odigos Agents'
            description: 'The Odigos Agents used to copy Odigos agent relevant files into the user workloads.'
          - service: agents
            image: odigos-enterprise-agents
            file: odiglet/Dockerfile
            target: agents
            extended: true
            runner: depot-ubuntu-latest
            summary: 'Odigos Agents'
            description: 'The Odigos Agents used to copy Odigos agent relevant files into the user workloads.'
          - service: ui
            image: odigos-enterprise-ui
            file: ui/Dockerfile
            runner: depot-ubuntu-latest
            summary: 'UI for Odigos'
            description: 'UI provides the frontend webapp for managing an Odigos installation.'
          - service: insights
            image: odigos-enterprise-insights
            file: insights/Dockerfile
            runner: depot-ubuntu-latest
            summary: 'Insights for Odigos'
            description: 'Insights learns per-transaction baselines from traces and scores deviations.'
          - service: central-backend
            image: odigos-enterprise-central-backend
            file: central-backend/Dockerfile
            runner: depot-ubuntu-24.04-4
            summary: 'Central Backend for Odigos'
            description: 'Central Backend is the core component of Odigos Central, responsible for managing the data flow from the cluster to the ui.'
          - service: central-proxy
            image: odigos-enterprise-central-proxy
            file: central-proxy/Dockerfile
            runner: depot-ubuntu-24.04-4
            summary: 'Central Proxy for Odigos'
            description: 'Central Proxy is handle the communication between the cluster that Odigos is running in and the Odigos Central.'
          - service: central-ui
            image: odigos-enterprise-central-ui
            # The Dockerfile path is relative to the central-ui context.
            file: Dockerfile
            context: '{{defaultContext}}:central-ui'
            runner: depot-ubuntu-24.04-4
            summary: 'Central UI for Odigos'
            description: 'Central UI is the web interface for Odigos Central, providing a user-friendly way to manage and visualize the data collected by Odigos.'
          - service: connector-opamp-gateway
            image: odigos-enterprise-connector-opamp-gateway
            file: connector-opamp-gateway/Dockerfile
            runner: depot-ubuntu-24.04-4
            summary: 'Managed Collector OpAMP Gateway for Odigos'
            description: 'Authenticates managed Collector OpAMP connections and routes each to the cloud connector its credential is bound to.'
          # Cloud connector images are best-effort: a failure does not fail the release or cancel the other images.
          - service: connector-runtime
            image: odigos-enterprise-connector-runtime
            file: connector-runtime/Dockerfile
            runner: depot-ubuntu-24.04-4
            best-effort: true
          - service: connector-aws
            image: odigos-enterprise-connector-aws
            file: connectors/providers/aws/Dockerfile
            runner: depot-ubuntu-24.04-4
            best-effort: true
          - service: connector-azure
            image: odigos-enterprise-connector-azure
            file: connectors/providers/azure/Dockerfile
            runner: depot-ubuntu-24.04-4
            best-effort: true
          - service: connector-gcp
            image: odigos-enterprise-connector-gcp
            file: connectors/providers/gcp/Dockerfile
            runner: depot-ubuntu-24.04-4
            best-effort: true
          - service: connector-mulesoft
            image: odigos-enterprise-connector-mulesoft
            file: connectors/providers/mulesoft/Dockerfile
            runner: depot-ubuntu-24.04-4
            best-effort: true
          - service: connector-postgres
            image: odigos-enterprise-connector-postgres
            # The Dockerfile path is relative to the connector-postgres context.
            file: Dockerfile
            context: '{{defaultContext}}:connector-postgres'
            runner: depot-ubuntu-24.04-4
            best-effort: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.best-effort == true }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Tag
        id: extract_tag
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Notify Slack Start
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "start publishing docker image ${{ matrix.image }}${{ matrix.extended && ' (extended)' || '' }}"
          failure-description: "error during building or publishing of docker image ${{ matrix.image }}${{ matrix.extended && ' (extended)' || '' }}"
          tag: ${{ steps.extract_tag.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - id: gcp-auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: 1200s

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write npm auth
        id: npmrc
        uses: ./.github/actions/npm-auth
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Docker Image for ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@v7
        env:
          ODIGOS_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.extract_tag.outputs.tag}}
          TAG_SUFFIX: ${{ matrix.extended && '-extended' || '' }}
        with:
          # github_token: odiglet and agents download private instrumentation repos.
          secrets: |
            github_token=${{ secrets.RELEASE_BOT_TOKEN }}
          secret-files: |
            npmrc=${{ steps.npmrc.outputs.path }}
          push: true
          provenance: false
          tags: |
            us-central1-docker.pkg.dev/odigos-cloud/components-private/${{ matrix.image }}:${{ env.ODIGOS_TAG }}${{ env.TAG_SUFFIX }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            ODIGOS_VERSION=${{ env.ODIGOS_TAG }}
            LD_FLAGS=-s -w
            RHEL=false
            EXTENDED=${{ matrix.extended && 'true' || 'false' }}
          platforms: linux/amd64,linux/arm64
          context: ${{ matrix.context || '{{defaultContext}}' }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target || '' }}

      # Runs in this job so it inherits the registry logins above. Signing is
      # fail-closed: a signing failure fails this publish job.
      - name: Sign image and attach SBOM
        uses: odigos-io/ci-core/sign-oci@main
        with:
          refs: us-central1-docker.pkg.dev/odigos-cloud/components-private/${{ matrix.image }}
          digest: ${{ steps.build.outputs.digest }}

      - name: Notify Slack
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Odigos image ${{ matrix.image }}${{ matrix.extended && ' (extended)' || '' }} released successfully"
          failure-description: "ERROR: Odigos image ${{ matrix.image }}${{ matrix.extended && ' (extended)' || '' }} release failed"
          tag: ${{ steps.extract_tag.outputs.tag }}

  # odigos-enterprise triggered the CLI and Helm chart release (release.yml) after publishing its images. Tags that
  # carry Central and the cloud connectors are released only from this repo, so this repo triggers it once its images
  # are published; older tags still get it from odigos-enterprise.
  trigger-cli-release:
    needs: [decide, publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check whether this repo releases the tag
        id: layout
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/${REPO}/contents/central-backend?ref=${TAG}" --silent 2>/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG} predates the move; odigos-enterprise triggers its CLI release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # promote-rc-to-stable already dispatches release_cli for a first stable; a second run would fail on the
      # CLI archives it already uploaded.
      - name: Skip CLI dispatch if GitHub release already has CLI assets
        if: steps.layout.outputs.release == 'true'
        id: skip-cli
        env:
          TAG: ${{ needs.decide.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          EXPECTED=(
            "cli_${VERSION}_darwin_amd64.tar.gz"
            "cli_${VERSION}_darwin_arm64.tar.gz"
            "cli_${VERSION}_linux_amd64.tar.gz"
            "cli_${VERSION}_linux_arm64.tar.gz"
            "cli_${VERSION}_windows_amd64.tar.gz"
            "cli_${VERSION}_windows_arm64.tar.gz"
            "checksums.txt"
          )
          if ! assets=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '[.assets[].name]' 2>/dev/null); then
            echo "No GitHub release for $TAG — will trigger CLI release"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=()
          for name in "${EXPECTED[@]}"; do
            if ! jq -e --arg n "$name" 'index($n) != null' <<< "$assets" >/dev/null; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "CLI archives already on $TAG — skipping duplicate CLI trigger"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Missing CLI assets on $TAG: ${missing[*]} — will trigger CLI release"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get sts token to trigger the release
        if: steps.layout.outputs.release == 'true' && steps.skip-cli.outputs.skip != 'true'
        id: sts-release
        uses: odigos-io/ci-core/sts@main
        with:
          scope: odigos-io/odigos
          identity: trigger-release
          output-git-config: "false"

      - name: Trigger CLI and Helm chart release
        if: steps.layout.outputs.release == 'true' && steps.skip-cli.outputs.skip != 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.sts-release.outputs.GH_TOKEN }}
          repository: odigos-io/odigos
          event-type: release_cli
          client-payload: '{"tag": "${{ needs.decide.outputs.tag }}"}'

      - name: Notify Slack
        if: always() && steps.layout.outputs.release == 'true'
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: ${{ steps.skip-cli.outputs.skip == 'true' && 'All Odigos images published. CLI GitHub release already has assets; skipped duplicate CLI trigger' || 'All Odigos images published. Triggered the CLI and Helm chart release' }}
          failure-description: "ERROR: failed to trigger the CLI and Helm chart release"
          tag: ${{ needs.decide.outputs.tag }}
