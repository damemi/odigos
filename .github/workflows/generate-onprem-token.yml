name: Generate On-Prem Token
run-name: "Generate On-Prem Token - { aud: ${{ inputs.jwt_audience }}, expires: ${{ inputs.token_expiry_days }}d, profiles: [${{ inputs.odigos_profiles || 'none' }}] }"

on:
  workflow_dispatch:
    inputs:
      jwt_audience:
        description: "The audience of the token (e.g. customer/organization name)"
        required: true
        type: string
      token_expiry_days:
        description: "Number of days the token is valid for (default: 30)"
        required: false
        default: "30"
        type: string
      odigos_profiles:
        description: >-
          Comma-separated list of client profiles. Available:
          kratos, greatwall, category-attributes, code-attributes, copy-scope,
          hostname-as-podname, full-payload-collection, db-payload-collection,
          query-operation-detector, semconv, semconvdynamo, semconvredis,
          reduce-span-name-cardinality, allow_concurrent_agents,
          java-ebpf-instrumentations, java-native-instrumentations,
          legacy-dotnet-instrumentation, mount-method-k8s-host-path,
          mount-method-k8s-virtual-device, pod-manifest-env-var-injection,
          disable-gin, small-batches
        required: false
        type: string
      notify:
        description: "Remind #odigos-onprem-tokens-tracker 7d, 24h and 1h before the token expires (the token is tracked in an issue either way)"
        required: false
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read
  issues: write # onprem-token tracker issues

env:
  SLACK_CHANNEL_ID: C0CC0GN01JM # #odigos-onprem-tokens-tracker; the ID survives renames
  SLACK_MENTIONS: U08CUJYCXUY,U0A0SAD7CLS # tagged on every reminder: Will Searle, Ray Mileo

jobs:
  generate-token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: onprem-token-generator/go.mod

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/onprem-token-generator
          aws-region: us-east-1

      - name: Fetch private key from SSM
        run: |
          KEYFILE=$(mktemp)
          aws ssm get-parameter --region us-east-1 --name onprem-jwts-private-key --with-decryption --query Parameter.Value --output text > "$KEYFILE"
          echo "KEYFILE=$KEYFILE" >> "$GITHUB_ENV"

      - name: Generate token
        id: generate
        working-directory: onprem-token-generator
        env:
          PRIVATE_KEY_FILE: ${{ env.KEYFILE }}
          JWT_AUDIENCE: ${{ inputs.jwt_audience }}
          TOKEN_EXPIRY_DAYS: ${{ inputs.token_expiry_days }}
          ODIGOS_PROFILES: ${{ inputs.odigos_profiles }}
        run: |
          go run . 2> token_output.txt
          TOKEN=$(grep 'Token:' token_output.txt | sed 's/.*Token: //')
          echo "$TOKEN" > token.txt
          rm -f token_output.txt "$PRIVATE_KEY_FILE"

      - name: Write job summary
        id: details
        working-directory: onprem-token-generator
        run: |
          TOKEN=$(cat token.txt)
          B64_HDR=$(echo "$TOKEN" | cut -d. -f1 | tr '_-' '/+')
          PAD_HDR=$(( (4 - ${#B64_HDR} % 4) % 4 ))
          HEADER=$(printf "%s%.*s" "$B64_HDR" "$PAD_HDR" "====" | base64 -d)
          B64=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          PAD=$(( (4 - ${#B64} % 4) % 4 ))
          PAYLOAD=$(printf "%s%.*s" "$B64" "$PAD" "====" | base64 -d)
          AUD=$(echo "$PAYLOAD" | jq -r '.aud')
          ISS=$(echo "$PAYLOAD" | jq -r '.iss')
          SUB=$(echo "$PAYLOAD" | jq -r '.sub')
          IAT=$(echo "$PAYLOAD" | jq -r '.iat')
          EXP=$(echo "$PAYLOAD" | jq -r '.exp')
          PROFILES=$(echo "$PAYLOAD" | jq -r '.profiles // [] | join(", ")')
          IAT_HUMAN=$(date -u -d "@$IAT" '+%Y-%m-%d %H:%M UTC')
          EXP_HUMAN=$(date -u -d "@$EXP" '+%Y-%m-%d %H:%M UTC')
          {
            echo "aud=$AUD"
            echo "iat=$IAT"
            echo "exp=$EXP"
            echo "profiles=$PROFILES"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Generated Token Details"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Audience** | \`$AUD\` |"
            echo "| **Issuer** | \`$ISS\` |"
            echo "| **Subject** | \`$SUB\` |"
            echo "| **Issued At** | \`$IAT_HUMAN\` |"
            echo "| **Expires** | \`$EXP_HUMAN\` |"
            # Only show profiles if they exist, otherwise show "none"
            echo "| **Profiles** | \`$( [ -n "$PROFILES" ] && echo "$PROFILES" || echo "none" )\` |"
            echo ""
            echo "<details><summary>Raw JWT header</summary>"
            echo ""
            echo '```json'
            echo "$HEADER" | jq .
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>Raw JWT payload</summary>"
            echo ""
            echo '```json'
            echo "$PAYLOAD" | jq .
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload token as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onprem-token-${{ inputs.jwt_audience }}
          path: onprem-token-generator/token.txt
          retention-days: 1

      # Short-lived token that can write the "On-prem tokens" org project
      # (organization_projects: write + issues: read), minted by octo-sts from
      # .github/chainguard/onprem-token-reminders.sts.yaml in this repo; the
      # default GITHUB_TOKEN cannot touch Projects v2. The board is optional: if
      # this step fails the token is empty and the tool skips the board, saying
      # so in the summary, and the next sweep syncs whatever missed it.
      - name: Get a project token (octo-sts)
        id: sts
        continue-on-error: true
        uses: odigos-io/ci-core/sts@main
        with:
          identity: onprem-token-reminders
          output-git-config: "false"

      # Always records the token in a tracker issue (label onprem-token) and puts
      # it on the org project with its dates and Status (Active, or "Expires soon" within
      # 30 days of expiry). With notify on it also hands Slack the reminders due
      # within the next two days; the daily onprem-token-reminders workflow arms
      # the rest the day before they fire. With notify off the reminders are
      # muted. The reminder carries the token's metadata, never the token itself.
      - name: Register token and schedule Slack reminders
        working-directory: onprem-token-reminders
        env:
          NOTIFY: ${{ inputs.notify }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_ONPREM_TOKENS_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ steps.sts.outputs.GH_TOKEN }}
          PROJECT_NUMBER: "4" # https://github.com/orgs/odigos-io/projects/4
          AUD: ${{ steps.details.outputs.aud }}
          IAT: ${{ steps.details.outputs.iat }}
          EXP: ${{ steps.details.outputs.exp }}
          PROFILES: ${{ steps.details.outputs.profiles }}
          ISSUED_BY: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: go run . register
