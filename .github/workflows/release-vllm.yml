name: Release vLLM Image

# odigos-enterprise-vllm bakes model weights into a large image that changes
# only when the vLLM version or the model changes. It is built on demand here
# and is not part of the Odigos release, so its tag names the vLLM version and
# model rather than an Odigos version. Keep the default tag in sync with
# LLM_IMAGE_TAG in insights/autopilot.mk and insights.autopilot.vllm.image.tag
# in helm/odigos/values.yaml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: true
        default: "v0.8.5-qwen2.5-coder-7b-awq"
      vllm_version:
        description: "vllm/vllm-openai base image tag"
        required: true
        default: "v0.8.5"
      hf_model:
        description: "Hugging Face model to bake into the image"
        required: true
        default: "Qwen/Qwen2.5-Coder-7B-Instruct-AWQ"

permissions: read-all

jobs:
  release-vllm:
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: depot-ubuntu-24.04-16
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - id: gcp-auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: 3600s

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Build and Push vLLM Image
        id: build
        uses: docker/build-push-action@v7
        with:
          file: insights/llm/Dockerfile
          context: insights/llm
          push: true
          provenance: false
          tags: |
            us-central1-docker.pkg.dev/odigos-cloud/components/odigos-enterprise-vllm:${{ inputs.tag }}
            us-central1-docker.pkg.dev/odigos-cloud/components-private/odigos-enterprise-vllm:${{ inputs.tag }}
          build-args: |
            VLLM_VERSION=${{ inputs.vllm_version }}
            HF_MODEL=${{ inputs.hf_model }}
          platforms: linux/amd64

      - name: Sign image and attach SBOM
        uses: odigos-io/ci-core/sign-oci@main
        with:
          refs: |
            us-central1-docker.pkg.dev/odigos-cloud/components/odigos-enterprise-vllm
            us-central1-docker.pkg.dev/odigos-cloud/components-private/odigos-enterprise-vllm
          digest: ${{ steps.build.outputs.digest }}
