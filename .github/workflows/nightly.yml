name: Nightly

on:
  schedule:
    - cron: '0 0 * * *' # Nightly run at midnight
  workflow_call:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Cross-cloud tests: cloud provider'
        required: false
        default: all
        type: choice
        options:
          - all
          - aks
          - eks
      test_scenario:
        description: 'Cross-cloud tests: scenario'
        required: false
        default: all
        type: choice
        options:
          - all
          - helm-chart
          - enterprise/multi-apps
      platform:
        description: 'Cross-cloud tests: CPU architecture'
        required: false
        default: all
        type: choice
        options:
          - all
          - amd
          - arm

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  build-cli:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "~1.26.6"
          check-latest: true
          cache: true
          cache-dependency-path: |
            **/go.sum

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.2

      - name: Build CLI
        run: |
          cd cli
          TAG=0.0.0-e2e-test
          sed -i -E 's/0.0.0/'"${TAG#v}"'/' ../helm/odigos/Chart.yaml
          sed -i -E 's/0.0.0/'"${TAG#v}"'/' ../helm/odigos-central/Chart.yaml
          helm package ../helm/odigos -d pkg/helm/embedded
          helm package ../helm/odigos-central -d pkg/helm/embedded
          go build -tags=embed_manifests \
            -ldflags "-X github.com/odigos-io/odigos/cli/pkg/helm.OdigosChartVersion=${TAG#v}" \
            -o odigos

      - name: Save CLI binary to cache
        uses: actions/cache/save@v4
        with:
          path: cli/odigos
          key: ${{ github.run_id }}-odigos-cli

  # Images are built once with the e2e-test tag: the Kubernetes tests load them into kind from
  # the cache, and the chaos tests pull the same images from ECR under the commit hash tag.
  build-images:
    runs-on: depot-ubuntu-24.04-8
    env:
      COMMIT_HASH: ${{ github.sha }}
      DOCKER_REGISTRY: registry.odigos.io
      # Dev images include the enterprise components, so they go to a private registry.
      REGISTRY: 061717858829.dkr.ecr.us-east-1.amazonaws.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write npm auth
        id: npmrc
        uses: ./.github/actions/npm-auth
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Odigos Images
        env:
          # odiglet and agents download private instrumentation repos.
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          TAG=e2e-test make build-images
          TAG=e2e-test EXTENDED=true make build-odiglet build-agents
          docker save -o odigos-images.tar $(docker images --format "{{.Repository}}:{{.Tag}}" | grep "odigos")

      - uses: ko-build/setup-ko@v0.9

      - name: Build CLI Image
        run: |
          TAG=e2e-test make build-cli-image
          docker save registry.odigos.io/odigos-cli:e2e-test -o cli-image.tar

      # Victoria Metrics is published, not built in this repo. Materialize a single-platform
      # image (buildx --load) so kind load does not fail on multi-arch manifests.
      - name: Prepare Victoria Metrics Image
        run: |
          printf 'FROM registry.odigos.io/odigos-victoria-metrics:latest\n' | docker buildx build \
            --platform=linux/$(docker version -f '{{.Server.Arch}}') \
            --pull \
            -t registry.odigos.io/odigos-victoria-metrics:e2e-test \
            --load \
            -
          docker save registry.odigos.io/odigos-victoria-metrics:e2e-test -o victoria-metrics-image.tar

      # odigos-cache is only published on release. Until then e2e re-hosts upstream
      # Redis (pin must match REDIS_VERSION in release.yml).
      - name: Prepare Cache Image
        run: |
          printf 'FROM docker.io/library/redis:8.10.2\n' | docker buildx build \
            --platform=linux/$(docker version -f '{{.Server.Arch}}') \
            --pull \
            -t registry.odigos.io/odigos-cache:e2e-test \
            --load \
            -
          docker save registry.odigos.io/odigos-cache:e2e-test -o cache-image.tar

      - name: Save Odigos images to cache
        uses: actions/cache/save@v4
        with:
          path: |
            odigos-images.tar
            cli-image.tar
            victoria-metrics-image.tar
            cache-image.tar
          key: ${{ github.run_id }}-odigos-images

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::061717858829:role/ecr-pull-push-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Push Docker Images to ECR
        run: |
          for image in odigos-enterprise-collector odigos-enterprise-instrumentor odigos-enterprise-ui odigos-enterprise-odiglet odigos-enterprise-agents odigos-enterprise-insights odigos-cli; do
            aws ecr describe-repositories --repository-names "$image" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$image" >/dev/null
            docker tag "${DOCKER_REGISTRY}/${image}:e2e-test" "${REGISTRY}/${image}:${COMMIT_HASH}"
            docker push "${REGISTRY}/${image}:${COMMIT_HASH}"
          done

  # The cloud clusters pull these images from private ECR, so they are pushed for both
  # architectures instead of being loaded into kind.
  build-cloud-images:
    runs-on: ${{ matrix.runner || 'depot-ubuntu-24.04-4' }}
    env:
      IMAGE_REGISTRY: 061717858829.dkr.ecr.us-east-1.amazonaws.com
      IMAGE_TAG: ${{ github.sha }}-multiarch
    strategy:
      matrix:
        service: [odiglet, instrumentor, ui, collector, agents, cli]
        include:
          - service: collector
            runner: depot-ubuntu-24.04-16
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::061717858829:role/ecr-pull-push-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$IMAGE_REGISTRY"
          REPOSITORY="${{ matrix.service == 'cli' && 'odigos-cli' || format('odigos-enterprise-{0}', matrix.service) }}"
          aws ecr describe-repositories --region us-east-1 --repository-names "$REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --region us-east-1 --repository-name "$REPOSITORY"

      - name: Write npm auth
        id: npmrc
        if: ${{ matrix.service == 'ui' }}
        uses: ./.github/actions/npm-auth
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        if: ${{ matrix.service != 'cli' }}
        env:
          # odiglet and agents download private instrumentation repos.
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          NPMRC: ${{ steps.npmrc.outputs.path }}
        run: make push-${{ matrix.service }} ORG="$IMAGE_REGISTRY" TAG="$IMAGE_TAG" PUSH_IMAGE=true

      # The instrumentor runs the cli image for the go offsets job, under the same image prefix and tag.
      - name: Build and Push CLI Image
        if: ${{ matrix.service == 'cli' }}
        uses: docker/build-push-action@v7
        with:
          file: cli/Dockerfile
          context: .
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/odigos-cli:${{ env.IMAGE_TAG }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            VERSION=${{ env.IMAGE_TAG }}
            CHART_VERSION=${{ env.IMAGE_TAG }}
            RELEASE=${{ env.IMAGE_TAG }}

  cross-cloud-tests:
    runs-on: depot-ubuntu-24.04-8
    needs: build-cloud-images
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.provider == 'all') && '["aks","eks"]' || format('["{0}"]', inputs.provider)) }}
        test_scenario: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.test_scenario == 'all') && '["enterprise/multi-apps","helm-chart"]' || format('["{0}"]', inputs.test_scenario)) }}
        platform: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.platform == 'all') && '["amd","arm"]' || format('["{0}"]', inputs.platform)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Cross-Cloud Tests
        if: ${{ !(matrix.provider == 'aks' && matrix.platform == 'arm') }}
        uses: ./.github/actions/cross-cloud-tests
        with:
          provider: ${{ matrix.provider }}
          test_scenario: ${{ matrix.test_scenario }}
          platform: ${{ matrix.platform }}
          image_registry: 061717858829.dkr.ecr.us-east-1.amazonaws.com
          image_tag: ${{ github.sha }}-multiarch
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          ODIGOS_API_KEY: ${{ secrets.ODIGOS_E2E_TESTS_API_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Report Test Outcome
        if: always() && !(matrix.provider == 'aks' && matrix.platform == 'arm')
        uses: ./.github/actions/nightly/report
        with:
          status: ${{ job.status }}
          suite_name: cross-cloud-tests
          suite_parameters: '{"provider": "${{ matrix.provider }}", "test_scenario": "${{ matrix.test_scenario }}", "platform": "${{ matrix.platform }}"}'
          slack_webhook_url: ${{ secrets.CLOUD_PROVIDERS_TESTS_WEBHOOK_URL }}

  kubernetes-tests:
    needs: [build-cli, build-images]
    runs-on: depot-ubuntu-24.04-8
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["1.21.12", "1.37"]
        test-scenario:
          - "ui"
          - "helm-chart"
          - "helm-upgrade"
          - "runtime-detection"
          - "instrumentation-lifecycle"
          - "instrumentation-rollback"
          - "instrumentation-rollback-stability-window"
          - "environment-variables"
          - "trace-collection"
          - "log-collection"
          - "source"
          - "webhooks"
          - "env-injection"
          - "data-streams"
          - "argo-rollouts"
          - "head-sampling-http-nodejs"
          - "head-sampling-http-python"
          - "head-sampling-http-java"
          - "tail-sampling-nodejs"
          - "enterprise/multi-apps"
          - "enterprise/jvm-metrics"
          - "enterprise/mount-method"
          - "enterprise/non-root"
          - "enterprise/control-plane"
          - "enterprise/instrumentation-rules"
          - "enterprise/python-ebpf"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Kubernetes test
        uses: ./.github/actions/kubernetes-tests
        with:
          kubernetes-version: ${{ matrix.kubernetes-version }}
          test-scenario: ${{ matrix.test-scenario }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          onprem-token: ${{ secrets.ODIGOS_E2E_TESTS_API_KEY }}

  kubernetes-tests-report:
    if: always()
    needs: kubernetes-tests
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        kubernetes-version: ["1.21.12", "1.37"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # needs.kubernetes-tests.result is aggregated over the whole matrix, so query the
      # per-job conclusions of this run and aggregate only the jobs for this version.
      - name: Aggregate results for Kubernetes version
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_PREFIX: "kubernetes-tests (${{ matrix.kubernetes-version }}, "
        run: |
          CONCLUSIONS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            | jq -r --arg prefix "$JOB_PREFIX" '.jobs[] | select(.name | startswith($prefix)) | .conclusion')

          TOTAL=$(printf '%s\n' "$CONCLUSIONS" | grep -c . || true)
          FAILED=$(printf '%s\n' "$CONCLUSIONS" | grep . | grep -c -v '^success$' || true)
          echo "Jobs matching '$JOB_PREFIX': total=$TOTAL failed=$FAILED"

          if [[ "$TOTAL" -gt 0 && "$FAILED" -eq 0 ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Report Test Outcome
        uses: ./.github/actions/nightly/report
        with:
          status: ${{ steps.result.outputs.status }}
          suite_name: kubernetes-tests
          suite_parameters: '{"kubernetes_version": "${{ matrix.kubernetes-version }}"}'
          slack_webhook_url: ${{ secrets.CLOUD_PROVIDERS_TESTS_WEBHOOK_URL }}

  chaos-tests:
    runs-on: depot-ubuntu-24.04-8
    needs: build-images
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::061717858829:role/ecr-pull-push-role
          aws-region: us-east-1

      - name: Run Chaos Tests
        uses: ./.github/actions/chaos-tests
        with:
          onprem-token: ${{ secrets.ODIGOS_E2E_TESTS_API_KEY }}

      - name: Report Test Outcome
        if: always()
        uses: ./.github/actions/nightly/report
        with:
          status: ${{ job.status }}
          suite_name: chaos-tests
          suite_parameters: ''
          slack_webhook_url: ${{ secrets.CLOUD_PROVIDERS_TESTS_WEBHOOK_URL }}
