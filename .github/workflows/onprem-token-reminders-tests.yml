name: On-Prem Token Reminders Tests

# Tests the onprem-token-reminders module only when it, or a workflow that runs
# it, changes. Kept out of platform-k8s.yaml's unit tests on purpose so the rest
# of the repo does not pay for it on every PR.

on:
  pull_request:
    paths: &paths
      - "onprem-token-reminders/**"
      - ".github/workflows/onprem-token-reminders.yml"
      - ".github/workflows/generate-onprem-token.yml"
      - ".github/workflows/onprem-token-reminders-tests.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests (onprem-token-reminders)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: onprem-token-reminders/go.mod
          cache-dependency-path: onprem-token-reminders/go.sum

      - name: Format, vet, test
        working-directory: onprem-token-reminders
        run: |
          test -z "$(gofmt -l .)" || { echo "::error::gofmt: $(gofmt -l . | tr '\n' ' ')"; exit 1; }
          go vet ./...
          go test ./... -race
