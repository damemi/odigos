# PR checks for the Odigos Kubernetes platform:
# - Builds the instrumentor, insights, collector, operator, odiglet, agents, ui and cli images, and the
#   extended odiglet and agents images, on Depot from platform-k8s.docker-bake.hcl and scans each for
#   vulnerabilities, along with the webapp's dependencies.
# - Runs the unit tests of every platform module, with the collector modules in their own job, and
#   builds the CLI binaries with goreleaser.
# - Packages the Helm charts and pushes the odigos chart to the project's Depot registry as an OCI chart.
# - Runs e2e tests on kind clusters with those images and the repo's chart, on Kubernetes 1.32 and the
#   versions of the PR's "test-k8s/<version>" labels.
#
# PRs to release branches build the Depot images for both platforms without the layer cache, and
# also run the e2e tests on Kubernetes 1.21.12, 1.29 and 1.37.
# Otherwise the "build: arm" and "build: no-cache" PR labels pick their build options.
#
# "Platform K8s CI" is the single required check: it always runs, and passes when every job succeeded.
name: platform-k8s

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main, "releases/**"]
    # labeled/unlabeled re-run the workflow when a "build: arm", "build: no-cache" or "test-k8s/<version>" label
    # is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]

env:
  IMAGE_TAG: pr-${{ github.event.number || github.run_number }}-${{ github.run_id }}
  # Depot project of this repo (see depot.json); builds are saved to its registry for the scan.
  DEPOT_PROJECT: 4kjksxtgnd
  DEPOT_SAVE_TAG: platform-k8s-pr-${{ github.event.number || github.run_number }}-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Each job bakes one target of platform-k8s.docker-bake.hcl on Depot and saves it to Depot's
  # registry as <DEPOT_SAVE_TAG>-<target>.
  build-depot-images:
    name: build-${{ matrix.service }}
    runs-on: depot-ubuntu-latest
    # id-token lets depot/bake-action authenticate to Depot over OIDC;
    # packages lets ui install the private @odigos-io/ui-kit from GitHub Packages;
    # pull-requests lets resolve-build-labels read the PR's labels.
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    # DEPOT_SAVE_TAG includes the run attempt; re-running only a failed e2e job keeps this attempt's
    # output, so the e2e job reads the tag the images were saved with from here.
    outputs:
      save-tag: ${{ env.DEPOT_SAVE_TAG }}
    strategy:
      fail-fast: false
      matrix:
        service: [instrumentor, insights, collector, operator, odiglet, agents, ui, cli, odiglet-extended, agents-extended]
    steps:
      - uses: actions/checkout@v7

      # Release builds (PRs and merge queue entries targeting a release branch): both platforms
      # without the layer cache, whatever the labels say.
      - name: Resolve build options from PR labels
        id: build-opts
        uses: odigos-io/ci-core/resolve-build-labels@main
        with:
          release: ${{ startsWith(github.base_ref, 'releases/') || startsWith(github.event.merge_group.base_ref, 'refs/heads/releases/') }}

      # Sets NPMRC, which the bake file reads for ui's npmrc secret.
      - name: Write npm auth
        uses: ./.github/actions/npm-auth
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: depot/setup-action@v1

      # Builds on Depot's remote builder, whose persistent layer cache also
      # keeps the Dockerfiles' --mount=type=cache Go caches between runs.
      - name: Build ${{ matrix.service }} Image
        uses: depot/bake-action@v1
        env:
          PLATFORMS: ${{ steps.build-opts.outputs.platforms }}
          # The operator's and the CLI's embedded Helm chart version.
          ODIGOS_VERSION: v0.0.0-pr${{ github.event.number || github.run_number }}
          # Read by the bake file as odiglet's github_token secret, for the private instrumentation repos.
          GITHUB_TOKEN: ${{ startsWith(matrix.service, 'odiglet') && secrets.RELEASE_BOT_TOKEN || '' }}
        with:
          files: platform-k8s.docker-bake.hcl
          targets: ${{ matrix.service }}
          no-cache: ${{ steps.build-opts.outputs.no-cache }}
          push: false
          save: true
          save-tag: ${{ env.DEPOT_SAVE_TAG }}

  # Scans the images saved by build-depot-images, after the builds, so the e2e tests don't wait for the scans.
  scan-depot-images:
    name: scan-depot-images
    needs: build-depot-images
    runs-on: depot-ubuntu-latest
    # id-token lets depot/setup-action authenticate to Depot over OIDC.
    permissions:
      contents: read
      id-token: write
    env:
      IMAGES_SAVE_TAG: ${{ needs.build-depot-images.outputs.save-tag }}
    steps:
      # oidc exchanges the job's GitHub OIDC token for a Depot token and exports it as DEPOT_TOKEN.
      - uses: depot/setup-action@v1
        with:
          oidc: true

      # registry: makes grype read the saved images from Depot instead of the local Docker daemon.
      - name: Log in to the Depot registry
        run: |
          echo "$DEPOT_TOKEN" | docker login registry.depot.dev --username x-token --password-stdin
          echo "IMAGE=registry:registry.depot.dev/$DEPOT_PROJECT:$IMAGES_SAVE_TAG" >> "$GITHUB_ENV"

      # Findings are reported, not failed on; an image that could not be scanned fails the step.
      - name: Scan images for vulnerabilities
        id: scan
        uses: odigos-io/ci-core/vulnerabilities-scanner@main
        with:
          images: |
            odigos-instrumentor=${{ env.IMAGE }}-instrumentor
            odigos-insights=${{ env.IMAGE }}-insights
            odigos-collector=${{ env.IMAGE }}-collector
            odigos-operator=${{ env.IMAGE }}-operator
            odigos-odiglet=${{ env.IMAGE }}-odiglet
            odigos-agents=${{ env.IMAGE }}-agents
            odigos-ui=${{ env.IMAGE }}-ui
            odigos-cli=${{ env.IMAGE }}-cli
          severity-cutoff: ""

      - name: Save scan JSONs
        if: always()
        env:
          RESULTS_DIR: ${{ steps.scan.outputs.results-dir }}
        run: |
          mkdir -p /tmp/scan-results
          for results in "$RESULTS_DIR"/*.json; do
            [ -e "$results" ] || continue
            name=$(basename "$results" .json)
            jq --arg img "$name" --arg tag "$IMAGE_TAG" '. + {imageName: $img, imageTag: $tag}' "$results" > "/tmp/scan-results/$name.json"
          done

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vuln-scan-result-platform-k8s-${{ github.sha }}
          path: /tmp/scan-results/
          retention-days: 30

  build-frontend:
    name: build-frontend
    runs-on: depot-ubuntu-24.04-8
    permissions:
      contents: read
      packages: read
    # setup-node's .npmrc reads this for every yarn command in the job, not just the install.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # webapp is scanned separately because it runs with yarn, while the rest of the frontend runs with golang.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@odigos-io'
      - name: Install webapp dependencies
        run: yarn install --frozen-lockfile
        working-directory: frontend/webapp
      - name: Scan frontend webapp for vulnerabilities
        id: scan-frontend-webapp
        uses: odigos-io/ci-core/vulnerabilities-scanner@main
        with:
          path: frontend/webapp
          severity-cutoff: "CRITICAL"
        continue-on-error: true
      - name: Save frontend webapp scan JSON
        if: always()
        env:
          RESULTS_FILE: ${{ steps.scan-frontend-webapp.outputs.results-file }}
        run: |
          mkdir -p /tmp/scan-results
          if [ -z "${RESULTS_FILE:-}" ] || [ ! -s "$RESULTS_FILE" ]; then
            echo "::error::No scan results produced; expected a report at '${RESULTS_FILE:-<unset>}'."
            exit 1
          fi
          jq --arg img "odigos-ui-webapp" --arg tag "pr-${{ github.event.number || github.run_number }}" '. + {imageName: $img, imageTag: $tag}' "$RESULTS_FILE" > /tmp/scan-results/odigos-ui-webapp.json
      - name: Upload frontend webapp scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vuln-scan-result-frontend-webapp-${{ github.sha }}.json
          path: /tmp/scan-results/odigos-ui-webapp.json
          retention-days: 30
      - name: Build webapp
        run: yarn build
        working-directory: frontend/webapp

  vulnerability-report:
    name: Generate Vulnerability Report
    needs:
      - scan-depot-images
      - build-frontend
    runs-on: depot-ubuntu-latest
    if: always()
    steps:
      - name: Download all scan JSON results
        uses: actions/download-artifact@v4
        with:
          pattern: vuln-scan-result-*
          path: scan-results
          merge-multiple: true

      - name: Zip individual scan results
        run: |
          if [ -d "scan-results" ] && ls scan-results/*.json 1> /dev/null 2>&1; then
            zip -j scan-results.zip scan-results/*.json
            echo "Created zip with $(unzip -l scan-results.zip | grep -c '\.json') JSON files"
          else
            echo "No scan results to zip"
            touch scan-results.zip
          fi

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: scan-results.zip
          retention-days: 90

  # Packages the Helm charts as in release.yml, versioned 0.0.0-<IMAGE_TAG>, and pushes the odigos
  # chart as an OCI chart to the registry of the repo's Depot project, tagged with its version.
  package-helm:
    name: Package Helm Charts
    runs-on: depot-ubuntu-latest
    # id-token lets the job log in to the Depot registry over OIDC.
    permissions:
      contents: read
      id-token: write
    outputs:
      chart-ref: ${{ steps.push-chart.outputs.chart-ref }}
    env:
      # Same as IMAGE_TAG; job env cannot read the workflow env.
      TAG: v0.0.0-pr-${{ github.event.number || github.run_number }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.15.2

      - name: Package Helm charts
        run: bash ./scripts/package-charts.sh

      # oidc exchanges the job's GitHub OIDC token for a Depot token and exports it as DEPOT_TOKEN.
      - uses: depot/setup-action@v1
        with:
          oidc: true

      - uses: oras-project/setup-oras@v1

      # The project registry only accepts the repository registry.depot.dev/<DEPOT_PROJECT>, and
      # helm push always appends the chart name to it. oras pushes the chart there with Helm's
      # media types, tagged with the chart version, since Helm only resolves semver tags.
      - name: Push odigos Helm chart to the Depot registry
        id: push-chart
        working-directory: helm
        run: |
          set -euo pipefail
          echo "$DEPOT_TOKEN" | oras login registry.depot.dev --username x-token --password-stdin
          CHART_REF="registry.depot.dev/$DEPOT_PROJECT:${TAG#v}"
          chart="odigos-${TAG#v}.tgz"
          helm show chart "$chart" | yq -o=json > chart-config.json
          oras push "$CHART_REF" \
            --config chart-config.json:application/vnd.cncf.helm.config.v1+json \
            "$chart:application/vnd.cncf.helm.chart.content.v1.tar+gzip"
          echo "Pushed oci://$CHART_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "chart-ref=$CHART_REF" >> "$GITHUB_OUTPUT"

  # The Kubernetes versions the e2e tests run on: 1.32, plus one per "test-k8s/<version>" PR label.
  # Release PRs and merge queue entries (targeting a release branch) also run on the oldest supported
  # version, one in the middle and the latest.
  resolve-kubernetes-versions:
    name: Resolve Kubernetes versions
    runs-on: depot-ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      versions: ${{ steps.k8s.outputs.versions }}
      release-tests: ${{ steps.release-tests.outputs.tests }}
    steps:
      - name: Resolve Kubernetes versions from PR labels
        id: k8s
        uses: odigos-io/ci-core/resolve-kubernetes-test-versions@main
        with:
          default-version: "1.32"
          release: ${{ startsWith(github.base_ref, 'releases/') || startsWith(github.event.merge_group.base_ref, 'refs/heads/releases/') }}
          # Each must be in the supported-versions of .github/actions/kubernetes-tests.
          release-versions: "1.21.12,1.29,1.37"

      # Release PRs (from a pre-releases/* or patch-release/* branch into releases/*) also run
      # important-customers, once per customer, and karpenter-mount-methods on the default version.
      - name: Resolve release-only tests
        id: release-tests
        env:
          RUN_RELEASE_TESTS: ${{ (startsWith(github.head_ref, 'pre-releases/') || startsWith(github.head_ref, 'patch-release/')) && startsWith(github.base_ref, 'releases/') }}
          RELEASE_TESTS: >-
            [{"kube-version": "1.32", "test": "important-customers", "customer": "greatwall", "extended": true},
            {"kube-version": "1.32", "test": "important-customers", "customer": "kratos"},
            {"kube-version": "1.32", "test": "karpenter-mount-methods"}]
        run: |
          tests='[]'
          if [[ "$RUN_RELEASE_TESTS" == true ]]; then
            tests=$RELEASE_TESTS
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  # Installs Odigos on a kind cluster of one Kubernetes version, with the images saved by
  # build-depot-images, and runs one e2e test against it.
  e2e:
    name: E2E (${{ matrix.kube-version }}, ${{ matrix.test }}${{ matrix.customer && format(', {0}', matrix.customer) || '' }})
    needs:
      - resolve-kubernetes-versions
      - build-depot-images
    # On 4 CPUs, Odigos and the test apps start slowly enough to fail probes and asserts.
    runs-on: depot-ubuntu-24.04-8
    strategy:
      fail-fast: false
      matrix:
        kube-version: ${{ fromJSON(needs.resolve-kubernetes-versions.outputs.versions) }}
        test:
          - head-sampling-http-nodejs
          - head-sampling-http-python
          - head-sampling-http-java
          - tail-sampling-nodejs
          - instrumentation-rollback
          - instrumentation-rollback-stability-window
          - runtime-detection
          - instrumentation-lifecycle
          - environment-variables
          - trace-collection
          - log-collection
          - source
          - webhooks
          - env-injection
          - data-streams
          - argo-rollouts
          - multi-apps
          - jvm-metrics
          - instrumentation-rules
          - helm-chart
          - mount-method
          - non-root
          - control-plane
          - python-ebpf
          - helm-upgrade
          - ui
          # <test>+wasp runs <test> with WASP_ENABLED.
          - helm-chart+wasp
          - python-ebpf+wasp
        exclude:
          # Control plane instrumentation is tested from k8s 1.29: older control plane binaries are built with
          # Go versions the enterprise Go agent does not fully support (stripped binaries, gRPC context propagation).
          - kube-version: "1.21.12"
            test: control-plane
        include: ${{ fromJSON(needs.resolve-kubernetes-versions.outputs.release-tests) }}
    permissions:
      contents: read
      id-token: write
      # packages lets the ui test install the private @odigos-io/ui-kit from GitHub Packages.
      packages: read
    env:
      IMAGES_SAVE_TAG: ${{ needs.build-depot-images.outputs.save-tag }}
    steps:
      - uses: actions/checkout@v7

      # oidc exchanges the job's GitHub OIDC token for a Depot token and exports it as DEPOT_TOKEN.
      - uses: depot/setup-action@v1
        with:
          oidc: true

      - name: Install Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.15.2

      - name: Install chainsaw
        uses: kyverno/action-install-chainsaw@v0.2.13

      # karpenter-mount-methods builds the Karpenter KWOK controller into the kind cluster with ko.
      - name: Set up Go
        if: matrix.test == 'karpenter-mount-methods'
        uses: actions/setup-go@v7
        with:
          go-version: "~1.26.6"
          check-latest: true
          cache: true

      - name: Install ko
        if: matrix.test == 'karpenter-mount-methods'
        uses: ko-build/setup-ko@v0.9

      # A test with its own kind-config.yaml runs on that cluster layout, as in the kubernetes-tests action.
      - name: Resolve test directory
        env:
          TEST: ${{ matrix.test }}
        run: |
          test_dir="tests/e2e/${TEST%+wasp}"
          kind_config="$test_dir/kind-config.yaml"
          [ -f "$kind_config" ] || kind_config=tests/common/apply/kind-config.yaml
          {
            echo "TEST_DIR=$test_dir"
            echo "KIND_CONFIG=$kind_config"
          } >> "$GITHUB_ENV"

      # The kind node image and minor version of each supported version are listed in the
      # kubernetes-tests action.
      - name: Resolve kind node image
        id: node-image
        env:
          KUBE_VERSION: ${{ matrix.kube-version }}
        run: |
          set -euo pipefail
          version=$(yq '.inputs.supported-versions.default' .github/actions/kubernetes-tests/action.yml \
            | jq -c --arg v "$KUBE_VERSION" '.[$v] // empty')
          if [ -z "$version" ]; then
            echo "::error::Unsupported Kubernetes version '$KUBE_VERSION'. Add it to the 'supported-versions' input of .github/actions/kubernetes-tests"
            exit 1
          fi
          echo "node-image=$(jq -r .nodeImage <<<"$version")" >> "$GITHUB_OUTPUT"
          echo "minor-version=$(jq -r .minorVersion <<<"$version")" >> "$GITHUB_OUTPUT"

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          node_image: ${{ steps.node-image.outputs.node-image }}
          version: "v0.33.0"
          cluster_name: kind
          config: ${{ env.KIND_CONFIG }}
          ignore_failed_clean: true

      - name: Wait for cluster readiness
        run: bash tests/common/wait_for_kind_ready.sh

      # Copies the odigos binary out of the cli image saved by build-depot-images to cli/odigos,
      # where the tests run it from. The image is distroless, so the container is created, never run.
      - name: Extract the CLI binary from the cli image
        run: |
          set -euo pipefail
          echo "$DEPOT_TOKEN" | docker login registry.depot.dev --username x-token --password-stdin
          container=$(docker create "registry.depot.dev/$DEPOT_PROJECT:$IMAGES_SAVE_TAG-cli")
          docker cp "$container:/odigos" cli/odigos
          docker rm "$container"
          cli/odigos version --cli

      # The cluster pulls the saved images from the Depot registry with a pull secret in the Odigos
      # namespace, as in odigos-local-env. Odiglet pre-pulls the agents image on every node, so the
      # instrumented test apps need no secret.
      - name: Create the Depot registry pull secret
        run: |
          set -euo pipefail
          kubectl create namespace odigos-test
          kubectl create secret docker-registry depot-registry \
            --namespace odigos-test \
            --docker-server=registry.depot.dev \
            --docker-username=x-token \
            --docker-password="$(depot pull-token --project "$DEPOT_PROJECT")"

      # Points each chart image component at its image saved by build-depot-images, in the values file
      # every test installs with. The scheduler and autoscaler Deployments run 0 replicas, so they need no override.
      # The chart does not add the -extended suffix to an image override, so a test that installs with
      # odiglet.extended gets the extended images here.
      - name: Write Helm values for the Depot images
        env:
          EXTENDED_SUFFIX: ${{ matrix.extended && '-extended' || '' }}
        run: |
          set -euo pipefail
          IMAGE="registry.depot.dev/$DEPOT_PROJECT:$IMAGES_SAVE_TAG"
          cat > tests/common/odigos-values.yaml <<EOF
          imagePullSecrets:
            - depot-registry
          images:
            enterprise-instrumentor: $IMAGE-instrumentor
            enterprise-collector: $IMAGE-collector
            enterprise-odiglet: $IMAGE-odiglet$EXTENDED_SUFFIX
            enterprise-agents: $IMAGE-agents$EXTENDED_SUFFIX
            enterprise-ui: $IMAGE-ui
            cli: $IMAGE-cli
            # Victoria Metrics is published, not built in this repo.
            victoria-metrics: registry.odigos.io/odigos-victoria-metrics:latest
          EOF
          cat tests/common/odigos-values.yaml

      # helm-upgrade installs this release before upgrading to the Depot images.
      - name: Get latest release tag
        if: matrix.test == 'helm-upgrade'
        id: latest-release
        uses: ./.github/actions/latest-release-tag
        with:
          onprem-token: ${{ secrets.ODIGOS_E2E_TESTS_API_KEY }}

      # The ui test runs yarn install in frontend/webapp, which reads ~/.npmrc.
      - name: Write npm auth
        if: matrix.test == 'ui'
        uses: ./.github/actions/npm-auth
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ~/.npmrc

      - name: Run E2E test
        env:
          ODIGOS_API_KEY: ${{ secrets.ODIGOS_E2E_TESTS_API_KEY }}
          # The image.tag the tests install with, which the CLI reports as the cluster's version.
          IMAGE_TAG: e2e-test
          WASP_ENABLED: ${{ endsWith(matrix.test, '+wasp') }}
          LATEST_RELEASE_TAG: ${{ steps.latest-release.outputs.tag }}
          KUBERNETES_MINOR_VERSION: ${{ steps.node-image.outputs.minor-version }}
          CUSTOMER: ${{ matrix.customer }}
        # The asserts read k8sMinorVersion (e.g. odiglet uses hostNetwork before 1.26), and
        # important-customers reads customer.
        run: |
          chainsaw test "$TEST_DIR" --apply-timeout 30s --values - <<EOF
          k8sMinorVersion: ${KUBERNETES_MINOR_VERSION}
          customer: "${CUSTOMER}"
          EOF

      - name: Cluster diagnostics
        if: failure()
        run: |
          echo "==== Nodes ===="; kubectl get nodes -o wide
          echo "==== Pods (all namespaces) ===="; kubectl get pods -A -o wide
          echo "==== Events ===="; kubectl get events -A --sort-by=.lastTimestamp | tail -n 200

      - name: Export kind logs
        if: failure()
        run: kind export logs kind-logs
        continue-on-error: true

      - name: Upload kind logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kind-logs-${{ matrix.kube-version }}-${{ matrix.test }}${{ matrix.customer && format('-{0}', matrix.customer) || '' }}
          path: kind-logs
        continue-on-error: true

      - name: Upload UI screenshots artifact
        if: failure() && matrix.test == 'ui'
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ matrix.kube-version }}
          path: frontend/webapp/cypress/screenshots
        continue-on-error: true

      - name: Upload UI videos artifact
        if: failure() && matrix.test == 'ui'
        uses: actions/upload-artifact@v4
        with:
          name: ui-videos-${{ matrix.kube-version }}
          path: frontend/webapp/cypress/videos
        continue-on-error: true

  # Builds the CLI binaries for every OS and architecture with goreleaser, as the release does.
  # The cli image is built by build-depot-images.
  build-cli-goreleaser:
    name: build-cli-goreleaser
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
      - name: Set up Goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean

  test-platform-k8s-modules:
    name: Platform K8s Unit Tests
    runs-on: depot-ubuntu-24.04-8
    permissions:
      contents: read
    env:
      MODULES: >-
        common
        k8sutils
        procdiscovery
        destinations
        instrumentor
        instrumentor/enterprise
        odiglet
        insights
        frontend
        ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache-dependency-path: "**/go.sum"
      # odiglet's tests generate and compile eBPF code.
      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
      # Tests every module even after a failure, then fails if any module failed.
      - name: Test modules
        run: |
          failed=()
          for module in $MODULES; do
            echo "::group::$module"
            case "$module" in
              # Their Makefiles prepare what the tests need: envtest (instrumentor) and generated eBPF
              # code (odiglet).
              common|instrumentor|odiglet) cmd=(make test) ;;
              *) cmd=(go test -ldflags=-checklinkname=0 ./...) ;;
            esac
            if ! (cd "$module" && "${cmd[@]}"); then
              echo "::error::Unit tests failed in $module"
              failed+=("$module")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed modules: ${failed[*]}"
            exit 1
          fi

  # The collector modules, in parallel with the other platform modules.
  test-collector-modules:
    name: Collector Unit Tests
    runs-on: depot-ubuntu-24.04-2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # The collector has no root go.mod; take the Go version from the module
      # that builds the collector binary.
      - uses: actions/setup-go@v7
        with:
          go-version-file: collector/odigosotelcol/go.mod
          cache-dependency-path: "collector/**/go.sum"
      # Tests every collector module and the distribution; -k keeps going after a module fails.
      - name: Test modules
        working-directory: ./collector
        run: make -k test

  # The single required check for this workflow. It always runs, and passes when every job succeeded.
  platform-k8s-ci:
    name: Platform K8s CI
    needs:
      - build-depot-images
      - scan-depot-images
      - build-frontend
      - vulnerability-report
      - package-helm
      - resolve-kubernetes-versions
      - e2e
      - build-cli-goreleaser
      - test-platform-k8s-modules
      - test-collector-modules
    if: always()
    runs-on: depot-ubuntu-latest
    steps:
      - name: Check platform job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::Platform jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          echo "All platform jobs succeeded."
