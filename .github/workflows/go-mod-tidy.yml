name: go mod tidy
on:
  merge_group:
    types: [checks_requested]
  pull_request:

jobs:
  go-mod-tidy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
      - id: sts
        uses: odigos-io/ci-core/sts@main
        with:
          pairs: |
            odigos-io/ebpf-core:ro
            odigos-io/ebpf-java-instrumentation:enterprise-ro
            odigos-io/ebpf-nodejs-instrumentation:enterprise-ro
            odigos-io/ebpf-generic-instrumentation:enterprise-ro
            odigos-io/enterprise-go-instrumentation:enterprise-ro
            odigos-io/mysql-instrumentation:enterprise-ro
            odigos-io/python-ebpf:enterprise-ro
            odigos-io/odigos-device-plugin:ro
      - name: run make go-mod-tidy
        env:
          GOPRIVATE: github.com/odigos-io/*
        run: make go-mod-tidy
      - name: Check clean repository
        run: make check-clean-work-tree

  # go mod tidy only resolves what's actually compiled, so it can pass even when a module's full
  # dependency graph is unresolvable (see CORE-1400). This reproduces gopls/GoLand's `go list -m all`
  # per module so a broken module graph fails CI instead of surfacing as red imports in a contributor's IDE.
  verify-go-mod-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
      - id: sts
        uses: odigos-io/ci-core/sts@main
        with:
          pairs: |
            odigos-io/ebpf-core:ro
            odigos-io/ebpf-java-instrumentation:enterprise-ro
            odigos-io/ebpf-nodejs-instrumentation:enterprise-ro
            odigos-io/ebpf-generic-instrumentation:enterprise-ro
            odigos-io/enterprise-go-instrumentation:enterprise-ro
            odigos-io/mysql-instrumentation:enterprise-ro
            odigos-io/python-ebpf:enterprise-ro
            odigos-io/odigos-device-plugin:ro
      - name: run make verify-go-mod-graph
        env:
          GOPRIVATE: github.com/odigos-io/*
        run: make verify-go-mod-graph
