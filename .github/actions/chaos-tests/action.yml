# .github/actions/run-chaos-tests/action.yml

name: "Chaos Tests"
description: "Chaos tests entrypoint"

inputs:
  onprem-token:
    description: "Odigos on-prem token the test installs Odigos with"
    required: true
  registry:
    description: "Private ECR registry holding the dev images; the caller must have AWS credentials that can pull from it"
    required: false
    default: 061717858829.dkr.ecr.us-east-1.amazonaws.com

runs:
  using: "composite"
  steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Chainsaw
      uses: kyverno/action-install-chainsaw@v0.2.12

    - name: Create Kind Cluster
      uses: helm/kind-action@v1.14.0
      with:
        node_image: 'kindest/node:v1.32.0@sha256:2458b423d635d7b01637cac2d6de7e1c1dca1148a2ba2e90975e214ca849e7cb'
        version: 'v0.25.0'
        cluster_name: kind-test-cluster
        config: tests/common/apply/kind-config.yaml
        # Ephemeral GHA runners: don't fail the job if kind/docker cleanup races.
        ignore_failed_clean: true

    - name: Build Odigos CLI
      uses: ./.github/actions/build/cli

    - name: Create image pull secret
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: |
        kubectl create namespace odigos-test
        kubectl create secret docker-registry odigos-ecr-pull -n odigos-test \
          --docker-server="$REGISTRY" --docker-username=AWS \
          --docker-password="$(aws ecr get-login-password --region us-east-1)"

    - name: Run Chaos Tests
      shell: bash
      env:
        ODIGOS_API_KEY: ${{ inputs.onprem-token }}
        IMAGE_PREFIX: ${{ inputs.registry }}
      run: |
        export COMMIT_HASH="${GITHUB_SHA}"
        chainsaw test tests/chaos/network-latency/leader-election