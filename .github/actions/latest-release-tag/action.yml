name: "Latest release tag"
description: >-
  Find the latest stable Odigos release for the base branch: the latest vX.Y.* chart in the registry
  for a releases/vX.Y.* branch, otherwise the latest stable chart.

inputs:
  onprem-token:
    description: "Odigos on-prem token, which authenticates to the chart registry"
    required: true

outputs:
  tag:
    description: "The release tag (e.g. v1.40.0)"
    value: ${{ steps.get-latest-tag.outputs.LATEST_RELEASE_TAG }}

runs:
  using: "composite"
  steps:
    - name: Get latest release tag for branch from the chart registry
      id: get-latest-tag
      shell: bash
      env:
        BRANCH: ${{ github.base_ref || github.event.merge_group.base_ref || github.ref_name }}
        ODIGOS_API_KEY: ${{ inputs.onprem-token }}
      run: |
        STABLE_VERSIONS=$(curl -fsSL -u "odigos:${ODIGOS_API_KEY}" https://registry.odigos.io/v2/charts/odigos/tags/list \
          | jq -r '.tags[]' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
        # merge_group exposes the base branch as a full ref (refs/heads/...).
        BRANCH="${BRANCH#refs/heads/}"

        if [[ "$BRANCH" == releases/* ]]; then
          VERSION_PREFIX=$(echo "$BRANCH" | sed -E 's|releases/v([0-9]+\.[0-9]+)\..*|\1|')
          echo "Release branch detected, looking for ${VERSION_PREFIX}.* in the chart registry"
          LATEST_VERSION=$(grep -E "^${VERSION_PREFIX//./\\.}\." <<< "$STABLE_VERSIONS" | tail -n 1 || true)
        fi
        # Non-release branches, and a release branch with no stable version yet, upgrade from the latest stable.
        if [ -z "$LATEST_VERSION" ]; then
          LATEST_VERSION=$(tail -n 1 <<< "$STABLE_VERSIONS")
        fi
        LATEST_RELEASE_TAG="${LATEST_VERSION:+v$LATEST_VERSION}"
        echo "LATEST_RELEASE_TAG=$LATEST_RELEASE_TAG" >> "$GITHUB_OUTPUT"
        echo "Latest release tag for branch $BRANCH: $LATEST_RELEASE_TAG"
