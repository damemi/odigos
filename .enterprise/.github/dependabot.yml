version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: /
    schedule:
      day: sunday
      interval: weekly
  - package-ecosystem: gomod
    directory: /odiglet
    schedule:
      day: sunday
      interval: weekly
  - package-ecosystem: gomod
    directory: /onprem-token-generator
    schedule:
      day: sunday
      interval: weekly
  - package-ecosystem: pip
    directory: /odiglet/agents/python
    schedule:
      day: sunday
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /
      - /odiglet
    schedule:
      day: sunday
      interval: weekly
    allow:
      - dependency-name: 'registry.access.redhat.com/ubi9*'
