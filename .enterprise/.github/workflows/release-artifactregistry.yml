name: Release Enterprise Components to Artifact Registry
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: true

permissions:
  contents: write
  packages: write
  id-token: 'write'

jobs:
  release:
    strategy:
      matrix:
        dockerfile: ['odiglet/Dockerfile', 'odiglet/Dockerfile.rhel']
    runs-on: large-runner
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - name: Set env
        id: vars
        run: |
          echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - id: gcp-auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: 1200s
        
      - name: Login to Artifact Registry
        uses: docker/login-action@v1
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Build and Push Odiglet Enterprise Image
        uses: docker/build-push-action@v6
        env:
          ODIGOS_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.vars.outputs.tag}}
        with:
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            us-central1-docker.pkg.dev/odigos-cloud/components/odigos-enterprise-odiglet${{ matrix.dockerfile == 'odiglet/Dockerfile.rhel' && '-ubi9' || '' }}:${{ env.ODIGOS_TAG }}
          build-args: |
            ODIGOS_VERSION=${{ env.ODIGOS_TAG }}
            SUMMARY="Odiglet for Odigos"
            DESCRIPTION="Odiglet is the core component of Odigos managing auto-instrumentation. This container requires a root user to run and manage eBPF programs."
            VERSION=${{ env.ODIGOS_TAG }}
            RELEASE=${{ env.ODIGOS_TAG }}
          platforms: linux/amd64,linux/arm64
          secrets: |
            "github_token=${{ secrets.RELEASE_BOT_TOKEN }}"
