name: Verify JavaBuilder Base Builder

# This workflow is designed to verify the javabuilder Base Builder Dockerfile on pull requests.
# It builds the Dockerfile without pushing it, ensuring that it's valid and can successfully create an image.

on:
  pull_request:
    paths:
      - "odiglet/javabuilder-base.Dockerfile"

jobs:
  verify-javabuilder-base-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c #v4.2.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 #v3.6.0
      - name: Verify JavaBuilder Base Builder
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a #v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./odiglet/javabuilder-base.Dockerfile
          push: false
