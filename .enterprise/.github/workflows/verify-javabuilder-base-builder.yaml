name: Verify JavaBuilder Base Builder

# This workflow is designed to verify the javabuilder Base Builder Dockerfile on pull requests.
# It builds the Dockerfile without pushing it, ensuring that it's valid and can successfully create an image.

on:
  pull_request:
    paths:
      - "odiglet/javabuilder-base.Dockerfile"

jobs:
  verify-javabuilder-base-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Verify JavaBuilder Base Builder
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./odiglet/javabuilder-base.Dockerfile
          push: false
