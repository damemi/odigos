name: Ensure release branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch (e.g. releases/v1.2.0)'
        required: true
  repository_dispatch:
    types: [ensure-release-branch]

permissions:
  contents: write  # needed to push a new branch

jobs:
  ensure-release-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.email "bot@keyval.dev"
          git config --global user.name "Odigos Release Bot"

      - name: Determine TAG input
        id: inputs
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          if [ -z "$BRANCH" ]; then BRANCH="${{ github.event.client_payload.branch }}"; fi
          if [ -z "$BRANCH" ]; then
            echo "BRANCH is required (workflow_dispatch input 'branch' or repository_dispatch client_payload.branch)"
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Ensure release branch exists
        run: |
          BRANCH="${{ steps.inputs.outputs.branch }}"

          if git rev-parse --verify "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists."
          else
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
          fi
