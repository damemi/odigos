name: Create Feature Release PR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Feature tag (e.g. v0.0.0-feat.otel-metrics.0)'
        required: true
        type: string
      branch:
        description: 'Enterprise branch to build against'
        required: false
        type: string
        default: main
      oss_branch:
        description: 'Base OSS branch used as BASE_BRANCH in e2e'
        required: false
        type: string
        default: main
  repository_dispatch:
    types: [create_feature_release_pr]

permissions: read-all

jobs:
  create_feature_release_pr:
    runs-on: depot-ubuntu-latest
    permissions:
      id-token: write
    env:
      GOPRIVATE: github.com/odigos-io/*
    steps:
      - name: Determine tag and branch
        id: inputs
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}
          GITHUB_EVENT_INPUTS_BRANCH: ${{ github.event.inputs.branch }}
          GITHUB_EVENT_INPUTS_OSS_BRANCH: ${{ github.event.inputs.oss_branch }}
          GITHUB_EVENT_CLIENT_PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH: ${{ github.event.client_payload.branch }}
          GITHUB_EVENT_CLIENT_PAYLOAD_OSS_BRANCH: ${{ github.event.client_payload.oss_branch }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${GITHUB_EVENT_INPUTS_TAG}"
            BRANCH="${GITHUB_EVENT_INPUTS_BRANCH}"
            OSS_BRANCH="${GITHUB_EVENT_INPUTS_OSS_BRANCH}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${GITHUB_EVENT_CLIENT_PAYLOAD_TAG}"
            BRANCH="${GITHUB_EVENT_CLIENT_PAYLOAD_BRANCH}"
            OSS_BRANCH="${GITHUB_EVENT_CLIENT_PAYLOAD_OSS_BRANCH}"
          else
            echo "Unknown event type"
            exit 1
          fi

          if [ -z "$TAG" ]; then
            echo "ERROR: tag is required"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-feat\. ]]; then
            echo "ERROR: tag $TAG is not a feature release (expected vX.Y.Z-feat.<slug>.<n>)"
            exit 1
          fi

          if [ -z "$BRANCH" ]; then
            BRANCH="main"
          fi
          if [[ "$BRANCH" =~ [[:space:]] ]]; then
            echo "ERROR: branch must not contain whitespace"
            exit 1
          fi

          if [ -z "$OSS_BRANCH" ]; then
            OSS_BRANCH="main"
          fi
          if [[ "$OSS_BRANCH" =~ [[:space:]] ]]; then
            echo "ERROR: oss_branch must not contain whitespace"
            exit 1
          fi

          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "base_branch_name=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "oss_branch_name=${OSS_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Resolved TAG: ${TAG}  enterprise branch: ${BRANCH}  oss branch: ${OSS_BRANCH}"

      - name: Notify Slack (start)
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Start creating feature-release PR for enterprise repo on branch ${{ steps.inputs.outputs.base_branch_name }}"
          failure-description: "ERROR: during creating feature-release PR for enterprise repo"
          tag: ${{ steps.inputs.outputs.release_tag }}

      - name: Get ro token for odigos-enterprise
        id: sts-ro-odigos-enterprise
        uses: odigos-io/ci-core/sts@main
        with:
          scope: odigos-io/odigos-enterprise
          identity: ro

      - uses: actions/checkout@7
        with:
          fetch-depth: 0
          token: ${{ steps.sts-ro-odigos-enterprise.outputs.GH_TOKEN }}

      - name: Get ro tokens for dependencies
        id: ro-sts
        uses: ./.github/sts/dependencies_ro

      - name: Checkout enterprise branch
        run: |
          BRANCH="${{ steps.inputs.outputs.base_branch_name }}"
          git fetch origin "$BRANCH" || true
          if git ls-remote --heads origin "$BRANCH" | grep -q "refs/heads/${BRANCH}$"; then
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"
          else
            echo "ERROR: Enterprise branch '$BRANCH' not found on origin."
            exit 1
          fi

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ./odiglet/go.mod

      - name: update all dependencies
        run: |
          make update-odigos-oss-mod-deps-all OSS_TAG=${{ steps.inputs.outputs.release_tag }}

      - name: Prepare PR branch metadata
        id: prep
        run: |
          echo "release_pr_branch_name=feature-release-bot-${{ steps.inputs.outputs.release_tag }}" >> "$GITHUB_OUTPUT"

      - name: Get create-pull-request token
        id: cpr-sts
        uses: odigos-io/ci-core/sts@main
        with:
          scope: odigos-io/odigos-enterprise
          identity: create-release-pr
          output-git-config: 'true'

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        id: cpr
        with:
          token: ${{ steps.cpr-sts.outputs.GH_TOKEN }}
          base: ${{ steps.inputs.outputs.base_branch_name }}
          branch: ${{ steps.prep.outputs.release_pr_branch_name }}
          title: "chore: feature release ${{ steps.inputs.outputs.release_tag }}"
          body: |
            Follow-up PR for an Odigos feature release to upgrade enterprise components.

            Version: ${{ steps.inputs.outputs.release_tag }}
            Base OSS branch: ${{ steps.inputs.outputs.oss_branch_name }}

            **Triggered by:** ${{ github.event_name }}
          commit-message: "chore: bump odigos dependencies to ${{ steps.inputs.outputs.release_tag }}"
          delete-branch: true
          sign-commits: true
          labels: |
            feature-branch-release

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ steps.cpr-sts.outputs.GH_TOKEN }}
        run: |
          PR="${{ steps.cpr.outputs.pull-request-number }}"
          if [ -z "$PR" ]; then
            echo "No pull-request-number; skipping automerge."
            exit 0
          fi
          if [ "$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            echo "Auto-merge already enabled for PR #$PR; skipping."
            exit 0
          fi
          gh pr merge --squash --auto "$PR"

      - name: Notify Slack
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Odigos feature-release PR for odigos enterprise repo created"
          failure-description: "ERROR: failed to create feature-release PR for odigos enterprise repo"
          tag: ${{ steps.inputs.outputs.release_tag }}
          release-pr-link: ${{ steps.cpr.outputs.pull-request-url }}
