name: Update Odigos Dependencies

on:   
  repository_dispatch:
    types: [process_update_dependencies_pr]
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: update odiglet dependencies
        working-directory: ./odiglet
        run: |
          git config --global url."https://${{ secrets.RELEASE_BOT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/odigos-io/*
          sed -i "s|replace github.com/odigos-io/odigos/api => github.com/odigos-io/odigos/api v.*|replace github.com/odigos-io/odigos/api => github.com/odigos-io/odigos/api main|g" go.mod
          sed -i "s|replace github.com/odigos-io/odigos/common => github.com/odigos-io/odigos/common v.*|replace github.com/odigos-io/odigos/common => github.com/odigos-io/odigos/common main|g" go.mod
          sed -i "s|replace github.com/odigos-io/odigos/k8sutils => github.com/odigos-io/odigos/k8sutils v.*|replace github.com/odigos-io/odigos/k8sutils => github.com/odigos-io/odigos/k8sutils main|g" go.mod
          sed -i "s|replace github.com/odigos-io/odigos/procdiscovery => github.com/odigos-io/odigos/procdiscovery v.*|replace github.com/odigos-io/odigos/procdiscovery => github.com/odigos-io/odigos/procdiscovery main|g" go.mod
          sed -i "s|replace github.com/odigos-io/odigos/opampserver => github.com/odigos-io/odigos/opampserver v.*|replace github.com/odigos-io/odigos/opampserver => github.com/odigos-io/odigos/opampserver main|g" go.mod
          sed -i "s|replace github.com/odigos-io/odigos/instrumentation => github.com/odigos-io/odigos/instrumentation v.*|replace github.com/odigos-io/odigos/instrumentation => github.com/odigos-io/odigos/instrumentation main|g" go.mod
          sed -i "s|replace go.opentelemetry.io/auto => github.com/odigos-io/enterprise-go-instrumentation .*|replace go.opentelemetry.io/auto => github.com/odigos-io/enterprise-go-instrumentation main|g" go.mod
          sed -i "s|github.com/odigos-io/ebpf-java-instrumentation.*|github.com/odigos-io/ebpf-java-instrumentation main|g" go.mod
          sed -i "s|github.com/odigos-io/ebpf-java-instrumentation/otel_agent_extension.*|github.com/odigos-io/ebpf-java-instrumentation/otel_agent_extension main|g" go.mod
          sed -i "s|github.com/odigos-io/ebpf-generic-instrumentation.*|github.com/odigos-io/ebpf-generic-instrumentation main|g" go.mod
          sed -i "s|github.com/odigos-io/ebpf-nodejs-instrumentation.*|github.com/odigos-io/ebpf-nodejs-instrumentation main|g" go.mod
          sed -i '0,/github.com\/odigos-io\/odigos\/odiglet.*/s//github.com\/odigos-io\/odigos\/odiglet main/' go.mod
          go mod tidy
      
      - name: update onprem token generator dependencies
        working-directory: ./onprem-token-generator
        run: |
          git config --global url."https://${{ secrets.RELEASE_BOT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/odigos-io/*
          sed -i "s|replace github.com/odigos-io/odigos/common => github.com/odigos-io/odigos/common v.*|replace github.com/odigos-io/odigos/common => github.com/odigos-io/odigos/common main|g" go.mod
          sed -i "s|replace github.com/odigos-io/odigos/profiles => github.com/odigos-io/odigos/profiles v.*|replace github.com/odigos-io/odigos/profiles => github.com/odigos-io/odigos/profiles main|g" go.mod
          go mod tidy
 
      - name: github preperation
        id: github_preperation
        run: |
          # Set global Git configurations
          git config --global user.email "bot@keyval.dev"
          git config --global user.name "Odigos Release Bot"
          echo "branch_name=sync-dependencies-bot" >> $GITHUB_OUTPUT

      - name: delete existing branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          # Check if a pull request already exists for the branch and close it if it does
          EXISTING_PR=$(gh pr list --head ${{ steps.github_preperation.outputs.branch_name }} --base main --state open --json number --jq '.[0].number')
          if [ ! -z "$EXISTING_PR" ]; then
              gh pr close $EXISTING_PR --delete-branch
          fi
          
          BRANCH_EXISTS=$(git ls-remote --heads origin ${{ steps.github_preperation.outputs.branch_name }})
          if [ ! -z "$BRANCH_EXISTS" ]; then
              git push origin --delete ${{ steps.github_preperation.outputs.branch_name }}
          fi
          
      - name: create dependencies update pr
        id: create_dependencies_update_pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          git checkout -b ${{ steps.github_preperation.outputs.branch_name }}
          git add .
          git commit -m "update Odigos enterprise dependencies"
          git push origin ${{ steps.github_preperation.outputs.branch_name }}

          PR_LINK=$(gh pr create \
          --title "chore: automatic dependencies syncer bot" \
          --body "Automated PR to update Odigos enterprise components after a dependency module merge. PR created by: @${{ github.event.client_payload.pr_creator }}. link to PR in source repository: ${{github.event.client_payload.source_pr_url}}"  \
          --base main \
          --head ${{ steps.github_preperation.outputs.branch_name }})
          echo "PR_LINK=$PR_LINK" >> $GITHUB_ENV

          # Extract PR number from PR_LINK
          PR_NUMBER=$(echo "$PR_LINK" | awk -F '/' '{print $NF}')
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV  
        
      - name: Add bot label to PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          curl -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/labels -d '{"labels": ["dependencies-syncer-bot"]}'
      
      - name: Enable Auto Merge on PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          gh pr merge ${{ env.PR_LINK }} --auto --squash

      - name: Notify Slack
        run: |
          if [[ -z "${{ secrets.SLACK_ENTERPRISE_SYNC_URL }}" ]]; then
            echo "SLACK_ENTERPRISE_SYNC_URL is missing!"
            exit 1
          fi

          curl -X POST -H 'Content-type: application/json' --data "$(jq -n \
            --arg link "${{ env.PR_LINK }}" \
            --arg source_pr_link "${{ github.event.client_payload.source_pr_url }}" \
            --arg description "PR created by: @${{ github.event.client_payload.pr_creator }} triggered a PR in Odigos enterprise by the dependencies syncer bot. Approve to continue." \
            '{link: $link, source_pr_link: $source_pr_link, description: $description}')" \
            ${{ secrets.SLACK_ENTERPRISE_SYNC_URL }}


      - name: Notify Slack on Failure
        if: failure()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PR_LINK: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SOURCE_PR_LINK: "${{ github.event.client_payload.source_pr_url }}"
          PR_CREATOR: "${{ github.event.client_payload.pr_creator }}"
          SLACK_URL: "${{ secrets.SLACK_ENTERPRISE_SYNC_URL }}"
        run: |
          if [[ -z "$SLACK_URL" ]]; then
            echo "SLACK_ENTERPRISE_SYNC_URL is missing!"
            exit 1
          fi
          
          # Set default values if SOURCE_PR_LINK or PR_CREATOR are missing
          SOURCE_PR_LINK=${SOURCE_PR_LINK:-"Not available"}
          PR_CREATOR=${PR_CREATOR:-"Unknown"}

          curl -X POST -H 'Content-type: application/json' --data "$(jq -n \
            --arg link "$PR_LINK" \
            --arg source_pr_link "$SOURCE_PR_LINK" \
            --arg description "ERROR: PR creation failed. Original PR by @$PR_CREATOR triggered a sync PR in Odigos enterprise, but it failed." \
            '{link: $link, source_pr_link: $source_pr_link, description: $description}')" \
            $SLACK_URL
