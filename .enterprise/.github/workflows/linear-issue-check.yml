name: "Require linked Linear issue"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  statuses: write

env:
  # Linear team prefixes (keep the trailing dash on each one)
  LINEAR_PREFIX_REGEX: '(CORE-|PLAT-|PRD-|RUN-|GEN-)'
  BOT_ACCOUNTS: '["dependabot[bot]","renovate[bot]","odigos-bot","github-actions[bot]","keyval-release-bot"]'

jobs:

  linear-check:
    runs-on: ubuntu-latest

    steps:
      - name: Skip Linear check for bots
        if: ${{ github.event.pull_request.user.type == 'Bot' ||
                contains(fromJson(env.BOT_ACCOUNTS), github.actor) }}
        run: echo "PR opened by ${{ github.actor }} – Linear check skipped."

      - name: Ensure PR links a Linear issue
        if: ${{ github.event.pull_request.user.type != 'Bot' &&
                !contains(fromJson(env.BOT_ACCOUNTS), github.actor) }}
        uses: copilotmoney/linear-pr-check@1.0.0
        with:
          prefix:       ${{ env.LINEAR_PREFIX_REGEX }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

