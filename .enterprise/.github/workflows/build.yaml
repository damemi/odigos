name: build

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-odiglet:
    runs-on: warp-ubuntu-latest-x64-4x-spot
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker Layers
        uses: WarpBuilds/cache@v1
        with:
          path: odiglet-enterprise-cache
          key: odiglet-enterprise-cache-${{ github.head_ref }}
      - name: Build Odiglet Image
        uses: docker/build-push-action@v4
        with:
          file: odiglet/Dockerfile
          context: .
          push: false
          tags: keyval/odigos-enterprise-odiglet:pr-${{ github.event.number }}
          secrets: |
            github_token=${{ secrets.RELEASE_BOT_TOKEN }}
          cache-to: type=local,mode=max,dest=odiglet-enterprise-cache
          cache-from: type=local,src=odiglet-enterprise-cache
          outputs: type=docker,dest=/tmp/odiglet-enterprise.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: odiglet-enterprise
          path: /tmp/odiglet-enterprise.tar
  kubernetes-tests:
    needs: build-odiglet
    runs-on: warp-ubuntu-latest-x64-4x-spot
    strategy:
      fail-fast: false
      matrix:
        kube-version:
          - "1.23"
          - "1.30"
        test-scenario:
          - "multi-apps"
          - "helm-chart"
        include:
          - kube-version: "1.23"
            kind-image: "kindest/node:v1.23.17@sha256:14d0a9a892b943866d7e6be119a06871291c517d279aedb816a4b4bc0ec0a5b3"
          - kube-version: "1.30"
            kind-image: "kindest/node:v1.30.0@sha256:047357ac0cfea04663786a612ba1eaba9702bef25227a794b52890dd8bcd692e"
    steps:
      - uses: actions/checkout@v4
        with:
          # we need the enterprise and oss to be siblings.
          # when using the default path and try to checkout the oss to be sibling, we get this:
          # Error: Repository path '/home/runner/work/odigos-enterprise/odigos' is not under '/home/runner/work/odigos-enterprise/odigos-enterprise'
          path: odigos-enterprise 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "~1.22"
          check-latest: true
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.9.0
      - name: Install chainsaw
        uses: kyverno/action-install-chainsaw@v0.2.4
      - name: Checkout Odigos OSS
        uses: actions/checkout@v4
        with:
          repository: odigos-io/odigos
          ref: main
          path: odigos # Checkout as a sibling to the current repository
      - name: Create Kind Cluster
        uses: helm/kind-action@v1.10.0
        with:
          node_image: ${{ matrix.kind-image }}
          version: "v0.23.0"
          cluster_name: kind
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: odiglet-enterprise
          path: /tmp
      - name: Load Odiglet Enterprise Image
        run: |
          docker load --input /tmp/odiglet-enterprise.tar
          docker images -a
          kind load docker-image keyval/odigos-enterprise-odiglet:pr-${{ github.event.number }}
      - name: Build CLI
        run: |
          cd odigos/cli
          go build -tags=embed_manifests -o odigos
      - name: Build and Load Odigos Images
        run: |
          cd odigos
          TAG=pr-${{ github.event.number }} make build-images load-to-kind
      - name: List all Docker images
        run: |
          docker images -a
      - name: Run E2E Tests
        env:
          IMAGE_TAG: pr-${{ github.event.number }}
          ODIGOS_API_KEY: ${{ secrets.ODIGOS_E2E_TESTS_API_KEY }}
        run: |
          chainsaw test odigos-enterprise/tests/e2e/${{ matrix.test-scenario }}