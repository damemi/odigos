name: Build and Test

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_TAG: e2e-test # pr-${{ github.event.number }}
  BASE_BRANCH: ${{ github.base_ref }}

jobs:
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      central: ${{ steps.filter.outputs.central }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 #v3.0.2
        id: filter
        with:
          filters: |
            central:
              - 'central-backend/**'
              - 'central-ui/**'
              - 'central-proxy/**'
              - 'tests/e2e/central-infrastructure/**'
              - 'tests/e2e/central-install/**'
              - 'tests/e2e/central-ui/**'
              - 'tests/common/assert/odigos-central-installed.yaml'

  unit-tests:
    name: Unit Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Go module that carries its own tests. The enterprise UI + shared
        # MCP modules live in their own go.mod, so they need explicit entries —
        # central-backend's `go test ./...` does not reach them.
        module: [central-backend, mcp, ui]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 #v5.5.0
        with:
          go-version-file: "${{ matrix.module }}/go.mod"
          cache-dependency-path: "${{ matrix.module }}/go.sum"

      - name: Run unit tests
        # The ui module pins OSS at the odigos commit that carries the importable
        # frontend/server package and McpAccessMode; -mod=mod lets the module
        # graph resolve it (and fall back to a direct fetch) until that lands in a
        # tagged release that the default proxy serves.
        env:
          GOFLAGS: -mod=mod
        run: |
          cd ${{ matrix.module }}
          go test ./... -race

  build-enterprise-components:
    name: build-enterprise-components (${{ matrix.service }}${{ matrix.rhel == 'true' && ', rhel' || '' }}${{ matrix.extended == 'true' && ', extended' || '' }})
    runs-on: depot-ubuntu-24.04-4
    strategy:
      matrix:
        service:
          [
            odiglet,
            instrumentor,
            central-ui,
            ui,
            central-proxy,
            central-backend,
            agents,
          ]
        rhel: ["true", "false"]
        # extended: ['false'] is needed so that standard builds have extended=false explicitly.
        # Without it, the include entries below (extended: 'true') would match existing
        # rhel:false combinations and merge into them instead of creating new jobs.
        extended: ["false"]
        include:
          # Extended builds (odiglet + agents with EXTENDED=true) are needed for
          # important-customers tests that set odiglet.extended=true in their helm config.
          # These mirror the -extended tag variants published in release-images.yml.
          # extended: 'true' does not exist in the base matrix values, so these create new jobs.
          - service: odiglet
            rhel: "false"
            extended: "true"
          - service: agents
            rhel: "false"
            extended: "true"

    steps:
      - name: Print tests run info
        run: |
          echo "Image tag: $IMAGE_TAG"
          echo "Base branch: $BASE_BRANCH"

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 #v3.11.1
      - name: Cache Docker Layers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 #v4.2.4
        with:
          path: ${{ matrix.service }}-enterprise-cache
          key: ${{ github.run_id }}-${{ matrix.service }}-docker-layers-${{ matrix.dockerfile }}
      - name: Build Image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 #v6.18.0
        with:
          file: >-
            ${{ matrix.service == 'odiglet' && 'odiglet/Dockerfile'
            || matrix.service == 'central-ui' && 'central-ui/Dockerfile'
            || matrix.service == 'ui' && 'ui/Dockerfile'
            || matrix.service == 'agents' && 'odiglet/Dockerfile'
            || 'Dockerfile' }}
          context: ${{ matrix.service == 'central-ui' && 'central-ui' || '.' }}
          push: false
          tags: registry.odigos.io/odigos-enterprise-${{ matrix.service }}${{ matrix.rhel == 'true' && '-rhel-certified' || '' }}:${{ env.IMAGE_TAG }}${{ matrix.extended == 'true' && '-extended' || '' }}
          provenance: false
          secrets: |
            github_token=${{ secrets.RELEASE_BOT_TOKEN }}
          cache-to: type=local,mode=max,dest=${{ matrix.service }}-enterprise-cache
          cache-from: type=local,src=${{ matrix.service }}-enterprise-cache
          outputs: type=docker,dest=/tmp/${{ matrix.service }}-enterprise${{ matrix.extended == 'true' && '-extended' || '' }}.tar
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            RHEL=${{ matrix.rhel }}
            EXTENDED=${{ matrix.extended || 'false' }}
            ODIGOS_VERSION=main
          target: >-
            ${{ matrix.service == 'agents' && matrix.rhel == 'true' && 'agents-rhel' ||
                matrix.service == 'agents' && 'agents' ||
                matrix.rhel == 'true' && 'rhel' ||
                '' }}
      - name: Save enterprise component to cache
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 #v4.2.4
        with:
          path: /tmp/${{ matrix.service }}-enterprise${{ matrix.extended == 'true' && '-extended' || '' }}.tar
          key: ${{ github.run_id }}-${{ matrix.service }}-enterprise-${{ matrix.extended == 'true' && 'extended' || (matrix.rhel == 'true' && 'rhel-certified' || 'standard') }}

      - name: Load Docker image for scanning
        run: docker load -i /tmp/${{ matrix.service }}-enterprise${{ matrix.extended == 'true' && '-extended' || '' }}.tar

      - name: Scan image for vulnerabilities
        id: scan
        uses: odigos-io/ci-core/vulnerabilities-scanner@main
        with:
          image: registry.odigos.io/odigos-enterprise-${{ matrix.service }}${{ matrix.rhel == 'true' && '-rhel-certified' || '' }}:${{ env.IMAGE_TAG }}${{ matrix.extended == 'true' && '-extended' || '' }}
          severity-cutoff: "CRITICAL"
        continue-on-error: true

      - name: Save scan JSON results
        if: always()
        run: |
          mkdir -p /tmp/scan-results
          IMAGE_NAME="odigos-enterprise-${{ matrix.service }}${{ matrix.rhel == 'true' && '-rhel-certified' || '' }}${{ matrix.extended == 'true' && '-extended' || '' }}"

          # Create a wrapper JSON with image metadata
          cat > /tmp/scan-results/${IMAGE_NAME}.json << 'EOF'
          ${{ steps.scan.outputs.results-json }}
          EOF

          # Add image name to the JSON
          jq --arg img "$IMAGE_NAME" --arg tag "${{ env.IMAGE_TAG }}" '. + {imageName: $img, imageTag: $tag}' /tmp/scan-results/${IMAGE_NAME}.json > /tmp/scan-results/${IMAGE_NAME}_enriched.json
          mv /tmp/scan-results/${IMAGE_NAME}_enriched.json /tmp/scan-results/${IMAGE_NAME}.json

      - name: Upload scan results JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: vuln-scan-result-${{ matrix.service }}-${{ matrix.extended == 'true' && 'extended' || (matrix.rhel == 'true' && 'rhel' || 'standard') }}-${{ github.sha }}.json
          path: /tmp/scan-results/*.json
          retention-days: 30

  build-oss-components-for-tests:
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout Odigos OSS
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
        with:
          repository: odigos-io/odigos
          ref: ${{ env.BASE_BRANCH }}
          path: odigos
          persist-credentials: false
      - name: Cache built OSS components
        id: cache-oss-components
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 #v4.2.4
        with:
          path: |
            /tmp/odigos-autoscaler.tar
            /tmp/odigos-scheduler.tar
            /tmp/odigos-collector.tar
            /tmp/odigos-cli
            /tmp/odigos-cli.tar
          key: ${{ github.run_id }}-odigos-oss-components
      - name: Set up Go # Needed to build the CLI
        if: steps.cache-oss-components.outputs.cache-hit != 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 #v5.5.0
        with:
          go-version-file: "odigos/cli/go.mod"
          cache-dependency-path: "odigos/cli/go.sum"

      - name: Build Odigos CLI
        if: steps.cache-oss-components.outputs.cache-hit != 'true'
        run: |
          cd odigos/cli
          TAG=0.0.0-e2e-test
          sed -i -E 's/0.0.0/'"${TAG#v}"'/' ../helm/odigos/Chart.yaml
          helm package ../helm/odigos -d pkg/helm/embedded
          go build -tags=embed_manifests \
            -ldflags "-X github.com/odigos-io/odigos/cli/pkg/helm.OdigosChartVersion=${TAG#v}" \
            -o /tmp/odigos-cli

      - name: Build OSS Odigos Components Used in e2e Tests
        if: steps.cache-oss-components.outputs.cache-hit != 'true'
        run: |
          cd odigos
          TAG=${{ env.IMAGE_TAG }} make -j 3 build-autoscaler build-scheduler build-collector

      - uses: ko-build/setup-ko@v0.9
      - name: Build Odigos CLI Image
        if: steps.cache-oss-components.outputs.cache-hit != 'true'
        run: |
          cd odigos
          TAG=${{ env.IMAGE_TAG }} make build-cli-image

      - name: Save Docker images as tar files
        if: steps.cache-oss-components.outputs.cache-hit != 'true'
        run: |
          docker save registry.odigos.io/odigos-autoscaler:${{ env.IMAGE_TAG }} -o /tmp/odigos-autoscaler.tar
          docker save registry.odigos.io/odigos-scheduler:${{ env.IMAGE_TAG }} -o /tmp/odigos-scheduler.tar
          docker save registry.odigos.io/odigos-collector:${{ env.IMAGE_TAG }} -o /tmp/odigos-collector.tar
          docker save registry.odigos.io/odigos-cli:${{ env.IMAGE_TAG }} -o /tmp/odigos-cli.tar

      - name: Scan autoscaler image for vulnerabilities
        if: steps.cache-oss-components.outputs.cache-hit != 'true'
        id: scan-autoscaler
        uses: odigos-io/ci-core/vulnerabilities-scanner@main
        with:
          image: registry.odigos.io/odigos-autoscaler:${{ env.IMAGE_TAG }}
          severity-cutoff: "CRITICAL"
        continue-on-error: true

      - name: Save autoscaler scan JSON
        if: always() && steps.cache-oss-components.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/scan-results
          cat > /tmp/scan-results/odigos-autoscaler.json << 'EOF'
          ${{ steps.scan-autoscaler.outputs.results-json }}
          EOF
          jq --arg img "odigos-autoscaler" --arg tag "${{ env.IMAGE_TAG }}" '. + {imageName: $img, imageTag: $tag}' /tmp/scan-results/odigos-autoscaler.json > /tmp/scan-results/odigos-autoscaler_enriched.json
          mv /tmp/scan-results/odigos-autoscaler_enriched.json /tmp/scan-results/odigos-autoscaler.json

      - name: Scan scheduler image for vulnerabilities
        if: steps.cache-oss-components.outputs.cache-hit != 'true'
        id: scan-scheduler
        uses: odigos-io/ci-core/vulnerabilities-scanner@main
        with:
          image: registry.odigos.io/odigos-scheduler:${{ env.IMAGE_TAG }}
          severity-cutoff: "CRITICAL"
        continue-on-error: true

      - name: Save scheduler scan JSON
        if: always() && steps.cache-oss-components.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/scan-results
          cat > /tmp/scan-results/odigos-scheduler.json << 'EOF'
          ${{ steps.scan-scheduler.outputs.results-json }}
          EOF
          jq --arg img "odigos-scheduler" --arg tag "${{ env.IMAGE_TAG }}" '. + {imageName: $img, imageTag: $tag}' /tmp/scan-results/odigos-scheduler.json > /tmp/scan-results/odigos-scheduler_enriched.json
          mv /tmp/scan-results/odigos-scheduler_enriched.json /tmp/scan-results/odigos-scheduler.json

      - name: Scan collector image for vulnerabilities
        if: steps.cache-oss-components.outputs.cache-hit != 'true'
        id: scan-collector
        uses: odigos-io/ci-core/vulnerabilities-scanner@main
        with:
          image: registry.odigos.io/odigos-collector:${{ env.IMAGE_TAG }}
          severity-cutoff: "CRITICAL"
        continue-on-error: true

      - name: Save collector scan JSON
        if: always() && steps.cache-oss-components.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/scan-results
          cat > /tmp/scan-results/odigos-collector.json << 'EOF'
          ${{ steps.scan-collector.outputs.results-json }}
          EOF
          jq --arg img "odigos-collector" --arg tag "${{ env.IMAGE_TAG }}" '. + {imageName: $img, imageTag: $tag}' /tmp/scan-results/odigos-collector.json > /tmp/scan-results/odigos-collector_enriched.json
          mv /tmp/scan-results/odigos-collector_enriched.json /tmp/scan-results/odigos-collector.json

      - name: Scan cli image for vulnerabilities
        if: steps.cache-oss-components.outputs.cache-hit != 'true'
        id: scan-cli
        uses: odigos-io/ci-core/vulnerabilities-scanner@main
        with:
          image: registry.odigos.io/odigos-cli:${{ env.IMAGE_TAG }}
          severity-cutoff: "CRITICAL"
        continue-on-error: true

      - name: Save cli scan JSON
        if: always() && steps.cache-oss-components.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/scan-results
          cat > /tmp/scan-results/odigos-cli.json << 'EOF'
          ${{ steps.scan-cli.outputs.results-json }}
          EOF
          jq --arg img "odigos-cli" --arg tag "${{ env.IMAGE_TAG }}" '. + {imageName: $img, imageTag: $tag}' /tmp/scan-results/odigos-cli.json > /tmp/scan-results/odigos-cli_enriched.json
          mv /tmp/scan-results/odigos-cli_enriched.json /tmp/scan-results/odigos-cli.json

      - name: Upload OSS scan results JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: vuln-scan-result-oss-components.json
          path: /tmp/scan-results/*.json
          retention-days: 30

  kubernetes-tests:
    name: kubernetes-tests (${{ matrix.kube-version }}, ${{ matrix.test-scenario }}${{ matrix.customer != '' && format(', {0}', matrix.customer) || '' }}${{ matrix.wasp-enabled == true && ', with_wasp' || '' }})
    needs:
      - detect-changes
      - build-enterprise-components
      - build-oss-components-for-tests
    runs-on: depot-ubuntu-24.04-4
    # Belt-and-suspenders cap. Individual chainsaw steps already enforce
    # their own timeouts; this prevents any pathological hang from running
    # out the GH job default of 6 hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        kube-version:
          - "1.21.12"
          - "1.23"
          - "1.32"
        test-scenario:
          - "multi-apps"
          - "helm-chart"
          - "cli-upgrade"
          - "central-install"
          - "central-infrastructure"
          - "central-ui"
        wasp-enabled: [false]
        include:
          - kube-version: "1.21.12"
            # use 1.21.12 for systemd cgroups compatibility changes in kind 0.13 https://github.com/kubernetes-sigs/kind/releases/tag/v0.13.0
            kind-image: "kindest/node:v1.21.12@sha256:ae05d44cc636ee961068399ea5123ae421790f472c309900c151a44ee35c3e3e"
            wasp-enabled: false
          - kube-version: "1.23"
            kind-image: "kindest/node:v1.23.17@sha256:14d0a9a892b943866d7e6be119a06871291c517d279aedb816a4b4bc0ec0a5b3"
            wasp-enabled: false
          - kube-version: "1.32"
            kind-image: "kindest/node:v1.32.0@sha256:2458b423d635d7b01637cac2d6de7e1c1dca1148a2ba2e90975e214ca849e7cb"
            wasp-enabled: false
          - kube-version: "1.32"
            kind-image: "kindest/node:v1.32.0@sha256:2458b423d635d7b01637cac2d6de7e1c1dca1148a2ba2e90975e214ca849e7cb"
            wasp-enabled: true
            test-scenario: "helm-chart"
          # control plane instrumentation. we test from k8s version 1.29
          # we suppose to support go versions >=1.17 which is the case in k8s v1.25
          # etcd go version satisfies the condition on k8s versions >= 1.26
          # some go instrumentation features like stripped bin support with interfaces extraction
          # and grpc context propagation do not work well enough in older go versions.
          # Hence we set the min version to 1.29, this can be improved on the instrumentation side.
          - kube-version: "1.29"
            kind-image: "kindest/node:v1.29.0@sha256:eaa1450915475849a73a9227b8f201df25e55e268e5d619312131292e324d570"
            test-scenario: "control-plane"
          - kube-version: "1.32"
            kind-image: "kindest/node:v1.32.0@sha256:2458b423d635d7b01637cac2d6de7e1c1dca1148a2ba2e90975e214ca849e7cb"
            test-scenario: "control-plane"
          # important-customers: one entry per customer, only runs on release PRs (release-bot-* → releases/*).
          # To add a customer: duplicate an entry below and set customer to the slug defined in
          # tests/e2e/important-customers/customers.sh (e.g. greatwall).
          - kube-version: "1.32"
            kind-image: "kindest/node:v1.32.0@sha256:2458b423d635d7b01637cac2d6de7e1c1dca1148a2ba2e90975e214ca849e7cb"
            test-scenario: "important-customers"
            wasp-enabled: false
            customer: "greatwall"
          - kube-version: "1.32"
            kind-image: "kindest/node:v1.32.0@sha256:2458b423d635d7b01637cac2d6de7e1c1dca1148a2ba2e90975e214ca849e7cb"
            test-scenario: "important-customers"
            wasp-enabled: false
            customer: "kratos"
    steps:
      # Check if this test scenario should run based on changed files
      - name: Check if test should run
        id: should-run
        run: |
          # Central tests only run if central-related files changed
          if [[ "${{ matrix.test-scenario }}" == "central-install" || "${{ matrix.test-scenario }}" == "central-infrastructure" || "${{ matrix.test-scenario }}" == "central-ui" ]]; then
            if [[ "${{ needs.detect-changes.outputs.central }}" != "true" ]]; then
              echo "Skipping ${{ matrix.test-scenario }} - no central files changed"
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "Running ${{ matrix.test-scenario }} - central files changed"
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          # important-customers only runs on release PRs: head branch release-bot-* → base branch releases/*
          elif [[ "${{ matrix.test-scenario }}" == "important-customers" ]]; then
            HEAD_REF="${{ github.head_ref }}"
            BASE_REF="${{ github.base_ref }}"
            if [[ "$HEAD_REF" == release-bot-* && "$BASE_REF" == releases/* ]]; then
              echo "Running important-customers - release PR detected (head: $HEAD_REF, base: $BASE_REF)"
              echo "skip=false" >> $GITHUB_OUTPUT
            else
              echo "Skipping important-customers - not a release PR (head: $HEAD_REF, base: $BASE_REF)"
              echo "skip=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "Running ${{ matrix.test-scenario }} - always runs"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # we need the enterprise and oss to be siblings.
      # when using the default path and try to checkout the oss to be sibling, we get this:
      # Error: Repository path '/home/runner/work/odigos-enterprise/odigos' is not under '/home/runner/work/odigos-enterprise/odigos-enterprise'
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
        if: steps.should-run.outputs.skip != 'true'
        with:
          path: odigos-enterprise
          persist-credentials: false

      - name: Set WASP_ENABLED environment variable
        if: steps.should-run.outputs.skip != 'true'
        run: |
          if [ "${{ matrix.wasp-enabled }}" = "true" ]; then
            echo "WASP_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "WASP_ENABLED=false" >> "$GITHUB_ENV"
          fi

      - name: Set up Helm
        if: steps.should-run.outputs.skip != 'true'
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 #v4.3.0
        with:
          version: v3.9.0

      - name: Install chainsaw
        if: steps.should-run.outputs.skip != 'true'
        uses: kyverno/action-install-chainsaw@f2b47b97dc889c12702113753d713f01ec268de5 #v0.2.12

      - name: Checkout Odigos OSS
        if: steps.should-run.outputs.skip != 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
        with:
          repository: odigos-io/odigos
          ref: ${{ env.BASE_BRANCH }}
          path: odigos
          persist-credentials: false

      - name: Download Kind Config
        if: steps.should-run.outputs.skip != 'true'
        run: |
          curl -o kind-config.yaml https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/kind-config.yaml

      - name: Create Kind Cluster
        if: steps.should-run.outputs.skip != 'true'
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 #v1.12.0
        with:
          node_image: ${{ matrix.kind-image }}
          version: "v0.25.0"
          cluster_name: kind
          config: kind-config.yaml

      - name: wait for cluster readiness
        if: steps.should-run.outputs.skip != 'true'
        run: |
          kubectl wait --for=condition=Ready node --all --timeout=180s
          kubectl wait -n kube-system --for=condition=Ready pod --all --timeout=300s
          kubectl rollout status -n kube-system deployment/coredns --timeout=300s

      - name: Restore Odiglet Enterprise from Cache
        if: steps.should-run.outputs.skip != 'true'
        id: restore-odiglet-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 #v4.2.4
        with:
          path: /tmp/odiglet-enterprise.tar
          fail-on-cache-miss: true
          key: ${{ github.run_id }}-odiglet-enterprise-standard

      - name: Check if Odiglet cache was restored
        if: steps.should-run.outputs.skip != 'true' && steps.restore-odiglet-cache.outputs.cache-hit != 'true'
        run: |
          echo "❌ Cache miss for Odiglet Enterprise - this should not happen!"
          echo "Expected cache key: ${{ github.run_id }}-odiglet-enterprise-standard"
          exit 1

      - name: Restore Instrumentor Enterprise from Cache
        if: steps.should-run.outputs.skip != 'true'
        id: restore-instrumentor-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 #v4.2.4
        with:
          path: /tmp/instrumentor-enterprise.tar
          fail-on-cache-miss: true
          key: ${{ github.run_id }}-instrumentor-enterprise-standard

      - name: Check if Instrumentor cache was restored
        if: steps.should-run.outputs.skip != 'true' && steps.restore-instrumentor-cache.outputs.cache-hit != 'true'
        run: |
          echo "❌ Cache miss for Instrumentor Enterprise - this should not happen!"
          echo "Expected cache key: ${{ github.run_id }}-instrumentor-enterprise-standard"
          exit 1

      - name: Restore UI Enterprise from Cache
        if: steps.should-run.outputs.skip != 'true'
        id: restore-ui-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 #v4.2.4
        with:
          path: /tmp/ui-enterprise.tar
          fail-on-cache-miss: true
          key: ${{ github.run_id }}-ui-enterprise-standard

      - name: Check if UI cache was restored
        if: steps.should-run.outputs.skip != 'true' && steps.restore-ui-cache.outputs.cache-hit != 'true'
        run: |
          echo "❌ Cache miss for UI Enterprise - this should not happen!"
          echo "Expected cache key: ${{ github.run_id }}-ui-enterprise-standard"
          exit 1

      - name: Restore Extended Odiglet from Cache
        if: steps.should-run.outputs.skip != 'true'
        id: restore-odiglet-extended-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 #v4.2.4
        with:
          path: /tmp/odiglet-enterprise-extended.tar
          fail-on-cache-miss: true
          key: ${{ github.run_id }}-odiglet-enterprise-extended

      - name: Restore Extended Agents from Cache
        if: steps.should-run.outputs.skip != 'true'
        id: restore-agents-extended-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 #v4.2.4
        with:
          path: /tmp/agents-enterprise-extended.tar
          fail-on-cache-miss: true
          key: ${{ github.run_id }}-agents-enterprise-extended

      - name: Restore Odigos OSS Components from Cache
        if: steps.should-run.outputs.skip != 'true'
        id: restore-oss-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 #v4.2.4
        with:
          path: |
            /tmp/odigos-autoscaler.tar
            /tmp/odigos-scheduler.tar
            /tmp/odigos-collector.tar
            /tmp/odigos-cli
            /tmp/odigos-cli.tar
          fail-on-cache-miss: true
          key: ${{ github.run_id }}-odigos-oss-components

      - name: Check if OSS components cache was restored
        if: steps.should-run.outputs.skip != 'true' && steps.restore-oss-cache.outputs.cache-hit != 'true'
        run: |
          echo "❌ Cache miss for OSS components - this should not happen!"
          echo "Expected cache key: ${{ github.run_id }}-odigos-oss-components"
          exit 1

      - name: Restore Central Backend Enterprise from Cache
        if: steps.should-run.outputs.skip != 'true' && (matrix.test-scenario == 'central-install' || matrix.test-scenario == 'central-infrastructure' || matrix.test-scenario == 'central-ui')
        id: restore-central-backend-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 #v4.2.4
        with:
          path: /tmp/central-backend-enterprise.tar
          fail-on-cache-miss: true
          key: ${{ github.run_id }}-central-backend-enterprise-standard

      - name: Check if Central Backend cache was restored
        if: steps.should-run.outputs.skip != 'true' && (matrix.test-scenario == 'central-install' || matrix.test-scenario == 'central-infrastructure' || matrix.test-scenario == 'central-ui') && steps.restore-central-backend-cache.outputs.cache-hit != 'true'
        run: |
          echo "❌ Cache miss for Central Backend Enterprise - this should not happen!"
          echo "Expected cache key: ${{ github.run_id }}-central-backend-enterprise-standard"
          exit 1

      - name: Restore Central UI Enterprise from Cache
        if: steps.should-run.outputs.skip != 'true' && (matrix.test-scenario == 'central-install' || matrix.test-scenario == 'central-infrastructure' || matrix.test-scenario == 'central-ui')
        id: restore-central-ui-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 #v4.2.4
        with:
          path: /tmp/central-ui-enterprise.tar
          fail-on-cache-miss: true
          key: ${{ github.run_id }}-central-ui-enterprise-standard

      - name: Check if Central UI cache was restored
        if: steps.should-run.outputs.skip != 'true' && (matrix.test-scenario == 'central-install' || matrix.test-scenario == 'central-infrastructure' || matrix.test-scenario == 'central-ui') && steps.restore-central-ui-cache.outputs.cache-hit != 'true'
        run: |
          echo "❌ Cache miss for Central UI Enterprise - this should not happen!"
          echo "Expected cache key: ${{ github.run_id }}-central-ui-enterprise-standard"
          exit 1

      - name: Restore Central Proxy Enterprise from Cache
        if: steps.should-run.outputs.skip != 'true' && (matrix.test-scenario == 'central-install' || matrix.test-scenario == 'central-infrastructure' || matrix.test-scenario == 'central-ui')
        id: restore-central-proxy-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 #v4.2.4
        with:
          path: /tmp/central-proxy-enterprise.tar
          fail-on-cache-miss: true
          key: ${{ github.run_id }}-central-proxy-enterprise-standard

      - name: Check if Central Proxy cache was restored
        if: steps.should-run.outputs.skip != 'true' && (matrix.test-scenario == 'central-install' || matrix.test-scenario == 'central-infrastructure' || matrix.test-scenario == 'central-ui') && steps.restore-central-proxy-cache.outputs.cache-hit != 'true'
        run: |
          echo "❌ Cache miss for Central Proxy Enterprise - this should not happen!"
          echo "Expected cache key: ${{ github.run_id }}-central-proxy-enterprise-standard"
          exit 1

      - name: Load Odigos Components to Kind Cluster
        if: steps.should-run.outputs.skip != 'true'
        run: |
          kind load image-archive /tmp/odiglet-enterprise.tar
          kind load image-archive /tmp/odiglet-enterprise-extended.tar
          kind load image-archive /tmp/instrumentor-enterprise.tar
          kind load image-archive /tmp/agents-enterprise-extended.tar
          kind load image-archive /tmp/odigos-autoscaler.tar
          kind load image-archive /tmp/odigos-scheduler.tar
          kind load image-archive /tmp/odigos-collector.tar
          kind load image-archive /tmp/odigos-cli.tar
          kind load image-archive /tmp/ui-enterprise.tar

      - name: Load Central Components to Kind Cluster
        if: steps.should-run.outputs.skip != 'true' && (matrix.test-scenario == 'central-install' || matrix.test-scenario == 'central-infrastructure' || matrix.test-scenario == 'central-ui')
        run: |
          kind load image-archive /tmp/central-backend-enterprise.tar
          kind load image-archive /tmp/central-ui-enterprise.tar
          kind load image-archive /tmp/central-proxy-enterprise.tar

      - name: Load Latest UI Image from Container Registry
        if: steps.should-run.outputs.skip != 'true'
        run: |
          # The UI will still be installed by the CLI with the TAG, but it's not used in the tests so no need to build it
          LATEST_TAG=$(curl -s "https://artifactregistry.us-central1.rep.googleapis.com/v1/projects/odigos-cloud/locations/us-central1/repositories/components/packages/odigos-ui/tags?pageSize=1000" | jq -r '[.tags[].name | capture(".*/(?<tag>v[0-9\\.]+)$").tag] | sort_by(split(".") | map(ltrimstr("v") | tonumber)) | last')
          docker pull "registry.odigos.io/odigos-ui:$LATEST_TAG"
          docker tag "registry.odigos.io/odigos-ui:$LATEST_TAG" registry.odigos.io/odigos-ui:${{ env.IMAGE_TAG }}
          kind load docker-image registry.odigos.io/odigos-ui:${{ env.IMAGE_TAG }}

      - name: Copy CLI to Expected Path
        if: steps.should-run.outputs.skip != 'true'
        run: |
          # Copy the CLI executable to the expected path which is in the OSS repo sibling to the enterprise repo
          cp /tmp/odigos-cli odigos/cli/odigos
          chmod +x odigos/cli/odigos

      - name: Get latest release tag for branch from Helm
        id: get-latest-tag
        run: |
          echo "📦 Updating Helm repositories..."
          helm repo add odigos https://odigos-io.github.io/odigos/ || true
          helm repo update

          BRANCH="${{ github.base_ref || github.ref_name }}"
          # If on a release branch (e.g., releases/v1.14.0), get latest Helm version for that version line
          # Otherwise (main), get the latest overall Helm chart version
          if [[ "$BRANCH" == releases/* ]]; then
            VERSION_PREFIX=$(echo "$BRANCH" | sed -E 's|releases/v([0-9]+\.[0-9]+)\..*|\1|')
            echo "Release branch detected, looking for v${VERSION_PREFIX}.* in Helm"
            LATEST_RELEASE_TAG=$(helm search repo odigos/odigos --versions | awk -v prefix="^v${VERSION_PREFIX}\\\\." '$1 == "odigos/odigos" && $3 ~ prefix {print $3; exit}')
            # On the first rc of a new version line (e.g. v1.29.0-rc0 on releases/v1.29.0),
            # no stable v1.29.* chart is published yet (and `helm search` hides prereleases),
            # so the search above is empty. Fall back to the latest overall stable chart,
            # which matches the latest released images used by the e2e tests.
            if [[ -z "$LATEST_RELEASE_TAG" ]]; then
              echo "No stable v${VERSION_PREFIX}.* chart found, falling back to latest overall Helm chart version"
              LATEST_RELEASE_TAG=$(helm search repo odigos/odigos | awk '$1 == "odigos/odigos" {print $3}')
            fi
          else
            echo "Non-release branch, using latest Helm chart version"
            LATEST_RELEASE_TAG=$(helm search repo odigos/odigos | awk '$1 == "odigos/odigos" {print $3}')
          fi
          if [[ -z "$LATEST_RELEASE_TAG" ]]; then
            echo "❌ ERROR: Failed to determine LATEST_RELEASE_TAG from Helm"
            exit 1
          fi
          echo "LATEST_RELEASE_TAG=$LATEST_RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "Latest release tag for branch $BRANCH: $LATEST_RELEASE_TAG"

      - name: Run E2E Tests
        if: steps.should-run.outputs.skip != 'true'
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          ODIGOS_API_KEY: ${{ secrets.ODIGOS_E2E_TESTS_API_KEY }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          LATEST_RELEASE_TAG: ${{ steps.get-latest-tag.outputs.LATEST_RELEASE_TAG }}
        run: |

          # Extract minor version number from the kube-version
          MINOR_VERSION=$(echo ${{ matrix.kube-version }} | sed -E 's/^1\.([0-9]+).*$/\1/')

          # Replace {{BASE_BRANCH}} placeholders in the test scenario
          # We're doing that to run the tests against the base branch and not always main
          sed -i "s|{{BASE_BRANCH}}|$BASE_BRANCH|g" odigos-enterprise/tests/e2e/${{ matrix.test-scenario }}/chainsaw-test.yaml

          # Run chainsaw with the extracted minor version

          chainsaw test odigos-enterprise/tests/e2e/${{ matrix.test-scenario }} --values - <<EOF
          k8sMinorVersion: ${MINOR_VERSION}
          customer: "${{ matrix.customer }}"
          EOF

      - name: Cluster diagnostics
        if: failure() && steps.should-run.outputs.skip != 'true'
        run: |
          echo "==== Nodes ===="; kubectl get nodes -o wide
          echo "==== Pods (all namespaces) ===="; kubectl get pods -A -o wide
          echo "==== Events (last 10m) ===="; kubectl get events -A --sort-by=.lastTimestamp | tail -n 200
          echo "==== Deployments not ready ===="; kubectl get deploy -A | awk '$4!="0/0" && $4!=$5 {print $1,$2}' | while read ns name; do
            echo "--- describe deploy $ns/$name ---"
            kubectl describe deploy -n "$ns" "$name" || true
          done

      - name: Run diagnose command
        if: failure() && steps.should-run.outputs.skip != 'true'
        run: |
          odigos/cli/odigos diagnose
        continue-on-error: true

      - name: Upload diagnose artifact
        if: failure() && steps.should-run.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: run-details-${{ matrix.test-scenario }}-${{ matrix.kube-version }}
          path: odigos_debug*.tar.gz
        continue-on-error: true

  vulnerability-report:
    name: Generate Vulnerability Report
    needs: [build-enterprise-components, build-oss-components-for-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all scan JSON results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 #v4.1.8
        with:
          pattern: vuln-scan-result-*
          path: scan-results
          merge-multiple: true

      - name: Zip individual scan results
        run: |
          if [ -d "scan-results" ] && ls scan-results/*.json 1> /dev/null 2>&1; then
            zip -j scan-results.zip scan-results/*.json
            echo "Created zip with $(unzip -l scan-results.zip | grep -c '\.json') JSON files"
          else
            echo "No scan results to zip"
            touch scan-results.zip
          fi

      - name: Upload scan results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: vulnerability-report
          path: scan-results.zip
          retention-days: 90
