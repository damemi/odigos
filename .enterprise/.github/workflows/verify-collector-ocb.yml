name: verify collector ocb

on:
  pull_request:
    paths:
      - "collector/**"
      - ".github/workflows/verify-collector-ocb.yml"

permissions:
  contents: read
  id-token: write

env:
  GOPRIVATE: github.com/odigos-io/*

jobs:
  verify-collector-ocb:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
      - id: sts
        name: Get read-only token for private odigos-io modules
        uses: odigos-io/ci-core/sts@main
        with:
          pairs: |
            odigos-io/odigos:enterprise-ro
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version-file: collector/odigosotelcol/go.mod

      - name: Generate collector with ocb and component metadata
        working-directory: ./collector
        run: make genodigoscol generate

      - name: Verify Generate
        working-directory: ./collector
        run: |
          if [ -n "$(git status --porcelain .)" ]; then
            git status --porcelain .
            git diff .
            echo "::error::collector/ is out of sync with its sources. Run 'make genodigoscol generate' in collector/ and commit the result."
            exit 1
          fi

  test-collector:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
      - id: sts
        name: Get read-only token for private odigos-io modules
        uses: odigos-io/ci-core/sts@main
        with:
          pairs: |
            odigos-io/odigos:enterprise-ro
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version-file: collector/odigosotelcol/go.mod

      - name: Test collector components and distribution
        working-directory: ./collector
        run: make test
