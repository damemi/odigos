name: Enterprise documentation
on:
  pull_request:
    paths: &docs-paths
      - 'docs/**'
      - 'odigosauth/**'
      - 'onprem-token-generator/**'
      - '.github/workflows/docs.yaml'
  push:
    branches: [main]
    paths: *docs-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enterprise-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check source formatting
        run: |
          npm install --global pnpm@11.19.0
          pnpm --dir docs install --frozen-lockfile --ignore-scripts
          pnpm --dir docs format:check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: odigosauth/go.sum
      - id: sts
        name: Get read-only token for private odigos-io modules
        uses: odigos-io/ci-core/sts@main
        with:
          pairs: |
            odigos-io/odigos:enterprise-ro
      - name: Test and vet authentication
        working-directory: odigosauth
        env:
          GOWORK: 'off'
          GOPRIVATE: github.com/odigos-io/*
        run: |
          gofmt -l docslogin cmd/docs-server docs_token_test.go | tee "$RUNNER_TEMP/docs-gofmt.txt"
          test ! -s "$RUNNER_TEMP/docs-gofmt.txt"
          go test -race ./...
          go vet ./...
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test release orchestration
        run: python3 -m unittest discover -s docs/deploy -p 'test_*.py'
      - name: Lint infrastructure
        run: |
          pip install cfn-lint==1.56.0 black==26.5.1
          black --check --config docs/pyproject.toml docs/deploy docs/scripts
          cfn-lint docs/deploy/*.yaml
      - name: Lint workflow
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint .github/workflows/docs.yaml
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: sts
        name: Get read-only token for private odigos-io modules
        uses: odigos-io/ci-core/sts@main
        with:
          pairs: |
            odigos-io/odigos:enterprise-ro
      - name: Build production image and validate docs sources
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docs/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: odigos-enterprise-docs:ci
          secret-files: |
            gitconfig=${{ steps.sts.outputs.GIT_CONFIG_PATH }}
          cache-from: type=gha,scope=enterprise-docs
          cache-to: type=gha,mode=max,scope=enterprise-docs
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/docs-browser" --no-save playwright@1.63.0
          "$RUNNER_TEMP/docs-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test compiled pages, private resources, search and expiry
        env:
          NODE_PATH: ${{ runner.temp }}/docs-browser/node_modules
        run: node docs/scripts/test-container.cjs odigos-enterprise-docs:ci
      - name: Save the verified image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save odigos-enterprise-docs:ci -o "$RUNNER_TEMP/enterprise-docs.tar"
      - name: Pass the verified image to deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enterprise-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/enterprise-docs.tar
          retention-days: 1
          compression-level: 0
  deploy:
    needs: [checks, documentation]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ''
      DOCS_REGISTRY: 061717858829.dkr.ecr.us-east-1.amazonaws.com
      DOCS_REPOSITORY: 061717858829.dkr.ecr.us-east-1.amazonaws.com/odigos-enterprise-docs
      DOCS_STACK: odigos-enterprise-docs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Skip a superseded docs revision
        id: revision
        run: |
          git fetch --no-tags --depth=1 origin main
          if git diff --quiet HEAD FETCH_HEAD -- docs odigosauth onprem-token-generator .github/workflows/docs.yaml; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "A newer docs revision is on main; leaving deployment to its workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.revision.outputs.current == 'true'
        with:
          name: enterprise-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Authenticate to AWS with GitHub OIDC
        if: steps.revision.outputs.current == 'true'
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: arn:aws:iam::061717858829:role/odigos-enterprise-docs-github
          role-session-name: docs-${{ github.run_id }}
          aws-region: us-east-1
          allowed-account-ids: '061717858829'
      - name: Publish and deploy the verified image
        if: steps.revision.outputs.current == 'true'
        run: |
          docker load -i "$RUNNER_TEMP/enterprise-docs.tar"
          DOCS_TAG="sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$DOCS_REGISTRY"
          docker tag odigos-enterprise-docs:ci "$DOCS_REPOSITORY:$DOCS_TAG"
          docker push "$DOCS_REPOSITORY:$DOCS_TAG"
          DOCS_DIGEST=$(aws ecr describe-images --repository-name odigos-enterprise-docs --image-ids "imageTag=$DOCS_TAG" --query 'imageDetails[0].imageDigest' --output text)
          python3 docs/deploy/release.py --stack "$DOCS_STACK" --image "$DOCS_REPOSITORY@$DOCS_DIGEST"
          echo "Deployed [$GITHUB_SHA](https://enterprise.docs.odigos.io) as $DOCS_DIGEST." >> "$GITHUB_STEP_SUMMARY"
