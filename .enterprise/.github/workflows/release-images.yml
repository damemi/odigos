name: Release Enterprise Components to Artifact Registry
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    strategy:
      matrix:
        # Base matrix builds all services with extended=false (standard builds without legacy .NET)
        service:
          [
            "odiglet",
            "instrumentor",
            "ui",
            "collector",
            "central-proxy",
            "central-backend",
            "connector-opamp-gateway",
            "central-ui",
            "agents",
            "insights",
          ]
        extended: ['false']
        include:
          # Odiglet extended variants (with legacy .NET instrumentation)
          - service: odiglet
            extended: 'true'
            summary: "Odiglet for Odigos"
            description: "Odiglet is the core component of Odigos managing auto-instrumentation. This container requires a root user to run and manage eBPF programs."
          # Agents extended variants (with legacy .NET instrumentation)
          - service: agents
            extended: 'true'
            summary: "Odigos Enterprise Agents"
            description: "The Odigos Agents used to copy Odigos agent relevant files into the user workloads."
          - service: instrumentor
            summary: "Instrumentor for Odigos"
            description: "Instrumentor manages auto-instrumentation for workloads with Odigos."
          - service: central-proxy
            summary: "Central Proxy for Odigos"
            description: "Central Proxy is handle the communication between the cluster that Odigos is running in and the Odigos Central."
          - service: connector-opamp-gateway
            summary: "Managed Collector OpAMP Gateway for Odigos"
            description: "Authenticates managed Collector OpAMP connections and routes each to the cloud connector its credential is bound to."
          - service: central-backend
            summary: "Central Backend for Odigos"
            description: "Central Backend is the core component of Odigos Central, responsible for managing the data flow from the cluster to the ui."
          - service: central-ui
            summary: "Central UI for Odigos"
            description: "Central UI is the web interface for Odigos Central, providing a user-friendly way to manage and visualize the data collected by Odigos."
          - service: ui
            summary: "Enterprise UI for Odigos"
            description: "Enterprise build of the Odigos web frontend."
          - service: insights
            summary: "Insights for Odigos"
            description: "Insights ingests distributed traces, learns per-entity baselines, and exposes anomaly queries to the UI."
          - service: collector
            runner: depot-ubuntu-24.04-16
            summary: "Collector for Odigos"
            description: "Enterprise build of the Odigos OpenTelemetry Collector."

    runs-on: ${{ matrix.runner || 'depot-ubuntu-24.04-4' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
        with:
          fetch-depth: 0
      - run: git fetch --force --tags

      - name: Set env
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Notify Slack (Start)
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.vars.outputs.tag }}
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Start releasing Odigos enterprise component: ${{ matrix.service }}. (Standard image${{ matrix.extended == 'true' && ' - Extended' || '' }})."
          failure-description: "ERROR: starting enterprise component release: ${{ matrix.service }}. (Standard image${{ matrix.extended == 'true' && ' - Extended' || '' }})"
          tag: ${{ env.TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c #v4.2.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 #v3.6.0

      - id: gcp-auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@b7593ed2efd1c1617e1b0254da33b86225adb2a5 #v2.1.12
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          # Collector multi-arch compile can exceed 20m on smaller runners; keep headroom for push.
          access_token_lifetime: 3600s

      # Single registry host; WIF access token authorizes push to public (components)
      # and private (components-private) repositories.
      - name: Login to Artifact Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 #v3.5.0
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Login to Docker Hub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 #v3.5.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Enterprise Image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a #v7.3.0
        env:
          ODIGOS_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.vars.outputs.tag }}
        with:
          file: >-
            ${{ matrix.service == 'odiglet' && 'odiglet/Dockerfile'
            || matrix.service == 'central-ui' && 'central-ui/Dockerfile'
            || matrix.service == 'ui' && 'ui/Dockerfile'
            || matrix.service == 'agents' && 'odiglet/Dockerfile'
            || matrix.service == 'collector' && 'collector/Dockerfile'
            || 'Dockerfile' }}
          context: ${{ matrix.service == 'central-ui' && 'central-ui' || '.' }}
          push: true
          tags: |
            us-central1-docker.pkg.dev/odigos-cloud/components/odigos-enterprise-${{ matrix.service }}:${{ env.ODIGOS_TAG }}${{ matrix.extended == 'true' && '-extended' || '' }}
            us-central1-docker.pkg.dev/odigos-cloud/components-private/odigos-enterprise-${{ matrix.service }}:${{ env.ODIGOS_TAG }}${{ matrix.extended == 'true' && '-extended' || '' }}
            keyval/odigos-enterprise-${{ matrix.service }}:${{ env.ODIGOS_TAG }}${{ matrix.extended == 'true' && '-extended' || '' }}
            ghcr.io/odigos-io/odigos-enterprise-${{ matrix.service }}:${{ env.ODIGOS_TAG }}${{ matrix.extended == 'true' && '-extended' || '' }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            LD_FLAGS=-s -w
            RHEL=false
            EXTENDED=${{ matrix.extended }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          target: >-
            ${{ matrix.service == 'agents' && 'agents' || '' }}
          secrets: |
            "github_token=${{ secrets.RELEASE_BOT_TOKEN }}"

      # Runs in this job so it inherits the registry logins above. One build
      # writes the same digest to four registries; each ref gets its own
      # signature. Fail-closed: a signing failure fails this publish job.
      - name: Sign image and attach SBOM
        uses: odigos-io/ci-core/sign-oci@main
        with:
          refs: |
            us-central1-docker.pkg.dev/odigos-cloud/components/odigos-enterprise-${{ matrix.service }}
            us-central1-docker.pkg.dev/odigos-cloud/components-private/odigos-enterprise-${{ matrix.service }}
            keyval/odigos-enterprise-${{ matrix.service }}
            ghcr.io/odigos-io/odigos-enterprise-${{ matrix.service }}
          digest: ${{ steps.build.outputs.digest }}

      - name: Notify Slack
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.vars.outputs.tag }}
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Odigos enterprise component ${{ matrix.service }} Standard image${{ matrix.extended == 'true' && ' (Extended)' || '' }} published to registry"
          failure-description: "ERROR: failed to publish odigos enterprise component ${{ matrix.service }} Standard image${{ matrix.extended == 'true' && ' (Extended)' || '' }} to registry"
          tag: ${{ env.TAG }}

  # Cloud connector images (connector-runtime, connector-aws, connector-azure, connector-gcp, connector-postgres).
  # These build fully in parallel (fail-fast: false) and independently of the main `release` job.
  # The job is best-effort (continue-on-error) and is intentionally NOT wired into
  # trigger-cli-release's `needs`, so a connector build failure never blocks the OSS CLI release.
  release-connectors:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: connector-runtime
            dockerfile: connector-runtime/Dockerfile
            context: .
            build-contexts: odigos=odigos-oss
            ld-flags: "-s -w"
          - service: connector-aws
            dockerfile: connectors/providers/aws/Dockerfile
            context: .
            ld-flags: "-s -w"
          - service: connector-azure
            dockerfile: connectors/providers/azure/Dockerfile
            context: .
            ld-flags: "-s -w"
          - service: connector-gcp
            dockerfile: connectors/providers/gcp/Dockerfile
            context: .
            ld-flags: "-s -w"
          - service: connector-postgres
            dockerfile: connector-postgres/Dockerfile
            context: connector-postgres

    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
        with:
          fetch-depth: 0
      - run: git fetch --force --tags

      - name: Set env
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      # connector-runtime consumes the OSS odigos api/common modules via local-path replaces, so wire
      # the matching odigos checkout in as the `odigos` build context. Pin it to the release tag — the
      # same ref the other enterprise components resolve OSS.
      - name: Checkout Odigos OSS (connector-runtime build context)
        if: matrix.service == 'connector-runtime'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
        with:
          repository: odigos-io/odigos
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.vars.outputs.tag }}
          path: odigos-oss
          persist-credentials: false

      - name: Notify Slack (Start)
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.vars.outputs.tag }}
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Start releasing Odigos enterprise connector: ${{ matrix.service }}."
          failure-description: "ERROR: starting enterprise connector release: ${{ matrix.service }}"
          tag: ${{ env.TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c #v4.2.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 #v3.6.0

      - id: gcp-auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@b7593ed2efd1c1617e1b0254da33b86225adb2a5 #v2.1.12
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: 1200s

      # Single registry host; WIF access token authorizes push to public (components)
      # and private (components-private) repositories.
      - name: Login to Artifact Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 #v3.5.0
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Login to Docker Hub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 #v3.5.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Connector Image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a #v7.3.0
        env:
          ODIGOS_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.vars.outputs.tag }}
        with:
          file: ${{ matrix.dockerfile }}
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.build-contexts }}
          push: true
          tags: |
            us-central1-docker.pkg.dev/odigos-cloud/components/odigos-enterprise-${{ matrix.service }}:${{ env.ODIGOS_TAG }}
            us-central1-docker.pkg.dev/odigos-cloud/components-private/odigos-enterprise-${{ matrix.service }}:${{ env.ODIGOS_TAG }}
            keyval/odigos-enterprise-${{ matrix.service }}:${{ env.ODIGOS_TAG }}
            ghcr.io/odigos-io/odigos-enterprise-${{ matrix.service }}:${{ env.ODIGOS_TAG }}
          build-args: |
            ${{ matrix.ld-flags && format('LD_FLAGS={0}', matrix.ld-flags) || '' }}
            ${{ matrix.service == 'connector-runtime' && format('COLLECTOR_TAG={0}', env.ODIGOS_TAG) || '' }}
            ${{ matrix.service == 'connector-runtime' && 'COLLECTOR_REGISTRY=us-central1-docker.pkg.dev/odigos-cloud/components/odigos-enterprise-collector' || '' }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          secrets: |
            "github_token=${{ secrets.RELEASE_BOT_TOKEN }}"

      # Runs in this job so it inherits the registry logins above. One build
      # writes the same digest to four registries; each ref gets its own
      # signature. Fail-closed: a signing failure fails this publish job.
      - name: Sign image and attach SBOM
        uses: odigos-io/ci-core/sign-oci@main
        with:
          refs: |
            us-central1-docker.pkg.dev/odigos-cloud/components/odigos-enterprise-${{ matrix.service }}
            us-central1-docker.pkg.dev/odigos-cloud/components-private/odigos-enterprise-${{ matrix.service }}
            keyval/odigos-enterprise-${{ matrix.service }}
            ghcr.io/odigos-io/odigos-enterprise-${{ matrix.service }}
          digest: ${{ steps.build.outputs.digest }}

      - name: Notify Slack
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.vars.outputs.tag }}
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Odigos enterprise connector ${{ matrix.service }} published to registry"
          failure-description: "ERROR: failed to publish odigos enterprise connector ${{ matrix.service }} to registry"
          tag: ${{ env.TAG }}

  trigger-cli-release:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - name: Resolve release tag
        id: release-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/*/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG}"

      # promote-rc-to-stable already dispatches release_cli for a first stable.
      # After that, this job would trigger a second run that 422s on already-uploaded
      # CLI archives. Skip the dispatch when those assets are already on the release.
      - name: Skip CLI dispatch if GitHub release already has CLI assets
        id: skip-cli
        env:
          TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          EXPECTED=(
            "cli_${VERSION}_darwin_amd64.tar.gz"
            "cli_${VERSION}_darwin_arm64.tar.gz"
            "cli_${VERSION}_linux_amd64.tar.gz"
            "cli_${VERSION}_linux_arm64.tar.gz"
            "cli_${VERSION}_windows_amd64.tar.gz"
            "cli_${VERSION}_windows_arm64.tar.gz"
            "checksums.txt"
          )

          HTTP_STATUS=$(curl -sS -o /tmp/odigos-release.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/odigos-io/odigos/releases/tags/${TAG}")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "No GitHub release for $TAG (HTTP $HTTP_STATUS) — will trigger CLI release"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=()
          for name in "${EXPECTED[@]}"; do
            if ! jq -e --arg n "$name" 'any(.assets[].name; . == $n)' /tmp/odigos-release.json >/dev/null; then
              missing+=("$name")
            fi
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "CLI archives already on $TAG — skipping duplicate CLI trigger"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Missing CLI assets on $TAG: ${missing[*]} — will trigger CLI release"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Oss Release Sts Token
        if: steps.skip-cli.outputs.skip != 'true'
        id: sts-oss-release
        uses: odigos-io/ci-core/sts@main
        with:
          scope: odigos-io/odigos
          identity: trigger-release

      - name: Trigger OSS Release Workflow
        if: steps.skip-cli.outputs.skip != 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.sts-oss-release.outputs.GH_TOKEN }}
          repository: odigos-io/odigos
          event-type: release_cli
          client-payload: '{"tag": "${{ steps.release-tag.outputs.tag }}"}'

      - name: Notify Slack
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: ${{ steps.skip-cli.outputs.skip == 'true' && 'All odigos enterprise components published to registry. CLI GitHub release already has assets; skipped duplicate CLI trigger' || 'All odigos enterprise components published to registry. Triggered CLI release in Odigos Main Repo' }}
          failure-description: "ERROR: failed to trigger CLI release in Odigos Main Repo"
          tag: ${{ steps.release-tag.outputs.tag }}

