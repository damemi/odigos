name: Release Enterprise Components to Artifact Registry
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    strategy:
      matrix:
        service:
          [
            "odiglet",
            "instrumentor",
            "central-proxy",
            "central-backend",
            "central-ui",
            "agents",
          ]
        dockerfile: ["Dockerfile", "Dockerfile.rhel"]
        include:
          - service: odiglet
            summary: "Odiglet for Odigos"
            description: "Odiglet is the core component of Odigos managing auto-instrumentation. This container requires a root user to run and manage eBPF programs."
          - service: instrumentor
            summary: "Instrumentor for Odigos"
            description: "Instrumentor manages auto-instrumentation for workloads with Odigos."
          - service: central-proxy
            summary: "Central Proxy for Odigos"
            description: "Central Proxy is handle the communication between the cluster that Odigos is running in and the Odigos Central."
          - service: central-backend
            summary: "Central Backend for Odigos"
            description: "Central Backend is the core component of Odigos Central, responsible for managing the data flow from the cluster to the ui."
          - service: central-ui
            summary: "Central UI for Odigos"
            description: "Central UI is the web interface for Odigos Central, providing a user-friendly way to manage and visualize the data collected by Odigos."
          - service: agents
            summary: "Odigos Enterprise Agents"
            description: "The Odigos Agents used to copy Odigos agent relevant files into the user workloads."

    runs-on: large-runner
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
        with:
          fetch-depth: 0
      - run: git fetch --force --tags

      - name: Set env
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Notify Slack (Start)
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.vars.outputs.tag }}
        with: 
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Start releasing Odigos enterprise component: ${{ matrix.service }}. (${{ matrix.dockerfile == 'Dockerfile.rhel' && 'UBI9' || 'Standard' }} image)."
          failure-description: "ERROR: starting enterprise component release: ${{ matrix.service }}. (${{ matrix.dockerfile == 'Dockerfile.rhel' && 'UBI9' || 'Standard' }} image)"
          tag: ${{ env.TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 #v3.11.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 #v3.6.0

      - id: gcp-auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@b7593ed2efd1c1617e1b0254da33b86225adb2a5 #v2.1.12
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: 1200s

      - name: Login to Artifact Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 #v3.5.0
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Login to Docker Hub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 #v3.5.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Enterprise Image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 #v6.18.0
        env:
          ODIGOS_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.vars.outputs.tag }}
        with:
          file: >-
            ${{ matrix.service == 'odiglet' && format('odiglet/{0}', matrix.dockerfile)
            || matrix.service == 'central-ui' && format('central-ui/{0}', matrix.dockerfile)
            || matrix.service == 'agents' && format('agents/{0}', matrix.dockerfile)
            || matrix.dockerfile }}
          context: ${{ matrix.service == 'central-ui' && 'central-ui' || '.' }}
          push: true
          tags: |
            us-central1-docker.pkg.dev/odigos-cloud/components/odigos-enterprise-${{ matrix.service }}${{ matrix.dockerfile == 'Dockerfile.rhel' && '-ubi9' || '' }}:${{ env.ODIGOS_TAG }}
            keyval/odigos-enterprise-${{ matrix.service }}${{ matrix.dockerfile == 'Dockerfile.rhel' && '-ubi9' || '' }}:${{ env.ODIGOS_TAG }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            ODIGOS_VERSION=${{ env.ODIGOS_TAG }}
            SUMMARY=${{ matrix.summary }}
            DESCRIPTION=${{ matrix.description }}
            VERSION=${{ env.ODIGOS_TAG }}
            RELEASE=${{ env.ODIGOS_TAG }}
            LD_FLAGS=-s -w
          platforms: linux/amd64,linux/arm64
          provenance: false
          secrets: |
            "github_token=${{ secrets.RELEASE_BOT_TOKEN }}"

      - name: Notify Slack
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.vars.outputs.tag }}
        with: 
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Odigos enterprise component ${{ matrix.service }} ${{ matrix.dockerfile == 'Dockerfile.rhel' && 'UBI9' || 'Standard' }} image published to registry"
          failure-description: "ERROR: failed to publish odigos enterprise component ${{ matrix.service }} ${{ matrix.dockerfile == 'Dockerfile.rhel' && 'UBI9' || 'Standard' }} image to registry"
          tag: ${{ env.TAG }}

  trigger-cli-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
        with:
          fetch-depth: 0
      - run: git fetch --force --tags

      - name: Set env
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Trigger CLI Release in Odigos Main Repo
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.vars.outputs.tag }}
        run: |
            payload=$(jq -n --arg tag "${TAG}" '{"event_type": "release_cli", "client_payload": {"tag": $tag}}')
            curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.RELEASE_BOT_TOKEN }}" \
            https://api.github.com/repos/odigos-io/odigos/dispatches \
            -d "$payload"
      
      - name: Notify Slack
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.vars.outputs.tag }}
        with: 
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "All odigos enterprise components published to registry. Triggered CLI release in Odigos Main Repo"
          failure-description: "ERROR: failed to trigger CLI release in Odigos Main Repo"
          tag: ${{ env.TAG }}

