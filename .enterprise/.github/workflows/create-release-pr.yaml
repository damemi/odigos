name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release (e.g. v1.2.3 or v1.2.3-rc4)'
        required: true
  repository_dispatch:
    types: [create_release_pr]

permissions: read-all

jobs:
  create_release_pr:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      GOPRIVATE: github.com/odigos-io/*
    steps:
      - name: Determine Tag Value
        id: tag
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}
          GITHUB_EVENT_CLIENT_PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${GITHUB_EVENT_INPUTS_TAG}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${GITHUB_EVENT_CLIENT_PAYLOAD_TAG}"
          else
            echo "Unknown event type"
            exit 1
          fi

          echo "release_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Resolved TAG: ${TAG}"

      - name: Derive base branch from TAG
        id: base
        env:
          TAG: ${{ steps.tag.outputs.release_tag }}
        run: |
          # If the tag is v1.1.1 (with minor and patch) or rc we will release it from the release/VERSION branch
          # If the tag is pre release tag -pre i.e. v1.1.1-pre we will release it from the main branch
          if echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$'; then
            # Strip optional -rcN
            CLEAN_TAG=$(echo "$TAG" | sed -E 's/-rc[0-9]+$//')
            # Extract major, minor, patch
            VER_NO_V=${CLEAN_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VER_NO_V"

            # Force patch to 0 for the base branch
            BASE_VERSION="v${MAJOR}.${MINOR}.0"
            BASE_BRANCH="releases/${BASE_VERSION}"
          else
            echo "TAG '$TAG' doesn't match vMAJOR.MINOR.PATCH[-rcN]; falling back to main"
            BASE_BRANCH="main"
          fi

          echo "Using base branch: $BASE_BRANCH"
          echo "base_branch_name=$BASE_BRANCH" >> $GITHUB_OUTPUT

      - name: Notify Slack (start)
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Start creating release PR for enterprise repo on branch ${{ steps.base.outputs.base_branch_name }}"
          failure-description: "ERROR: during creating release PR for enterprise repo"
          tag: ${{ steps.tag.outputs.release_tag }}

      - name: Get ro token for odigos-enterprise
        id: sts-ro-odigos-enterprise
        uses: odigos-io/ci-core/sts@main
        with:
          scope: odigos-io/odigos-enterprise
          identity: ro

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
        with:
          fetch-depth: 0
          token: ${{ steps.sts-ro-odigos-enterprise.outputs.GH_TOKEN }}

      - name: Get ro tokens for dependencies
        id: ro-sts
        uses: ./.github/sts/dependencies_ro  

      - name: Ensure base branch exists locally and checkout
        run: |
          git fetch origin "${{ steps.base.outputs.base_branch_name }}" || true
          if git ls-remote --heads origin "${{ steps.base.outputs.base_branch_name }}" | grep -q "refs/heads/${{ steps.base.outputs.base_branch_name }}$"; then
            git checkout "${{ steps.base.outputs.base_branch_name }}"
            git pull --ff-only origin "${{ steps.base.outputs.base_branch_name }}"
          else
            echo "ERROR: Base branch '${{ steps.base.outputs.base_branch_name }}' not found on origin."
            echo "If TAG is an RC, ensure the releases/* branch was created earlier."
            exit 1
          fi

      # We are using go commands later on, so need go installed
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ./odiglet/go.mod

      - name: update all dependencies
        run: |
          make update-odigos-oss-mod-deps-all OSS_TAG=${{ steps.tag.outputs.release_tag }}

      - name: Prepare PR branch metadata
        id: prep
        run: |
          BRANCH_PREFIX="release-bot-"
          echo "release_pr_branch_name=${BRANCH_PREFIX}${{ steps.tag.outputs.release_tag }}" >> $GITHUB_OUTPUT

      - name: Get create-pull-request token
        id: cpr-sts
        uses: odigos-io/ci-core/sts@main
        with:
          scope: odigos-io/odigos-enterprise
          identity: create-release-pr
          output-git-config: 'true'

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        id: cpr
        with:
          token: ${{ steps.cpr-sts.outputs.GH_TOKEN }}
          base: ${{ steps.base.outputs.base_branch_name }}
          branch: ${{ steps.prep.outputs.release_pr_branch_name }}
          title: "chore: automatic release ${{ steps.tag.outputs.release_tag }}"
          body: |
            Follow-up PR for Odigos release to upgrade enterprise components.

            Version: ${{ steps.tag.outputs.release_tag }}

            **Triggered by:** ${{ github.event_name }}
          commit-message: "chore: bump odigos dependencies to ${{ steps.tag.outputs.release_tag }}"
          delete-branch: true
          sign-commits: true
          labels: |
            release-bot

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ steps.cpr-sts.outputs.GH_TOKEN }}
        run: |
          PR="${{ steps.cpr.outputs.pull-request-number }}"
          if [ -z "$PR" ]; then
            echo "No pull-request-number; skipping automerge."
            exit 0
          fi
          if [ "$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            echo "Auto-merge already enabled for PR #$PR; skipping."
            exit 0
          fi
          gh pr merge --squash --auto "$PR"

      - name: Notify Slack
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Odigos release PR for odigos enterprise repo created"
          failure-description: "ERROR: failed to create release PR for odigos enterprise repo"
          tag: ${{ steps.tag.outputs.release_tag }}
          release-pr-link: ${{ steps.cpr.outputs.pull-request-url }}
