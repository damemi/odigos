name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release"
        required: true

  repository_dispatch:
    types: [create_release_pr]

permissions:
  contents: write
  pull-requests: write

jobs:
  create_release_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Tag Value
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "TAG=${{ github.event.client_payload.tag }}" >> $GITHUB_ENV
          else
            echo "Unknown event type"
            exit 1
          fi

      - uses: actions/checkout@v4

      # we are using go commands later on, so need go installed
      - uses: actions/setup-go@v4
        with:
          go-version: "1.21.0"

      - name: update odigos dependencies
        working-directory: ./odiglet
        run: |
          git config --global url."https://${{ secrets.RELEASE_BOT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/keyval-dev/enterprise-go-instrumentation
          go get -u github.com/keyval-dev/odigos/odiglet@${TAG} github.com/keyval-dev/odigos/api@${TAG} github.com/keyval-dev/odigos/common@${TAG}
          sed -i "s|replace github.com/keyval-dev/odigos/common => github.com/keyval-dev/odigos/common v.*|replace github.com/keyval-dev/odigos/common => github.com/keyval-dev/odigos/common ${TAG}|g" go.mod
          go mod tidy

      - name: github preperation
        id: github_preperation
        run: |
          # Set global Git configurations
          git config --global user.email "bot@keyval.dev"
          git config --global user.name "Odigos Release Bot"

          echo "branch_name=auto-release-${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT

      - name: delete previous branch
        run: |
          # Check if the branch already exists on the remote and delete it if it does
          if git ls-remote --heads origin ${{ steps.github_preperation.outputs.branch_name }}; then
              git push origin --delete ${{ steps.github_preperation.outputs.branch_name }}
          fi

          # Check if a pull request already exists for the branch and close it if it does
          EXISTING_PR=$(gh pr list --head ${{ steps.github_preperation.outputs.branch_name }} --base main --state open --json number --jq '.[0].number')
          if [ ! -z "$EXISTING_PR" ]; then
              gh pr close $EXISTING_PR --delete-branch
          fi

      - name: create release pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          git checkout -b ${{ steps.github_preperation.outputs.branch_name }}
          git add .
          git commit -m "bump odigos dependencise to use ${{ github.event.inputs.tag }}"
          git push origin ${{ steps.github_preperation.outputs.branch_name }}
          PR_LINK=$(gh pr create --title "chore: automatic release ${{ github.event.inputs.tag }}" --body "follow up PR for odigos release ${{ github.event.inputs.tag }} to upgrade enterprise components" --base main --head ${{ steps.github_preperation.outputs.branch_name }})
          echo "PR_LINK=$PR_LINK" >> $GITHUB_ENV

      # we want to save as many clicks as possible, so we mark the PR as auto mergeable.
      # Thus, when the PR is approved and build succeeds, it will be merged automatically.
      #   - name: Enable Auto Merge on PR
      #     env:
      #       GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
      #     run: |
      #       gh pr merge ${{ env.PR_LINK }} --auto --squash

      - name: Echo Length of Slack Webhook URL
        run: |
          echo "Length of SLACK_WEBHOOK_URL is ${#SLACK_WEBHOOK_URL}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"link":"${{ env.PR_LINK }}", "description":"ODigos enterprise PR created. Approve to continue:", "tag":"${{ github.event.inputs.tag }}"}' ${{ env.SLACK_WEBHOOK_URL }}
