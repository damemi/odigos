name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release'
        required: true

  repository_dispatch:
    types: [create_release_pr]

permissions:
  contents: write
  pull-requests: write

jobs:
  create_release_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Tag Value
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "TAG=${{ github.event.client_payload.tag }}" >> $GITHUB_ENV
          else
            echo "Unknown event type"
            exit 1
          fi

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"description":"Detected new tag, creating PR in enterprise", "tag":"${{ env.TAG }}"}' ${{ env.SLACK_WEBHOOK_URL }}

      - uses: actions/checkout@v4

      # we are using go commands later on, so need go installed
      - uses: actions/setup-go@v5
        with:
          go-version-file: ./odiglet/go.mod

      - name: update distros dependencies
        working-directory: ./distros
        run: |
          git config --global url."https://${{ secrets.RELEASE_BOT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/odigos-io/*
          go get github.com/odigos-io/odigos/distros@${TAG}
          go mod tidy

      - name: update odiglet dependencies
        working-directory: ./odiglet
        run: |
          git config --global url."https://${{ secrets.RELEASE_BOT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/odigos-io/*
          sed -i "s|replace github.com/odigos-io/odigos/api => github.com/odigos-io/odigos/api v.*|replace github.com/odigos-io/odigos/api => github.com/odigos-io/odigos/api main|g" go.mod
          sed -i "s|replace github.com/odigos-io/odigos/common => github.com/odigos-io/odigos/common v.*|replace github.com/odigos-io/odigos/common => github.com/odigos-io/odigos/common ${TAG}|g" go.mod
          sed -i "s|replace github.com/odigos-io/odigos/k8sutils => github.com/odigos-io/odigos/k8sutils v.*|replace github.com/odigos-io/odigos/k8sutils => github.com/odigos-io/odigos/k8sutils ${TAG}|g" go.mod
          sed -i "s|replace github.com/odigos-io/odigos/procdiscovery => github.com/odigos-io/odigos/procdiscovery v.*|replace github.com/odigos-io/odigos/procdiscovery => github.com/odigos-io/odigos/procdiscovery ${TAG}|g" go.mod
          sed -i "s|replace github.com/odigos-io/odigos/opampserver => github.com/odigos-io/odigos/opampserver v.*|replace github.com/odigos-io/odigos/opampserver => github.com/odigos-io/odigos/opampserver ${TAG}|g" go.mod
          sed -i "s|replace github.com/odigos-io/odigos/instrumentation => github.com/odigos-io/odigos/instrumentation v.*|replace github.com/odigos-io/odigos/instrumentation => github.com/odigos-io/odigos/instrumentation ${TAG}|g" go.mod
          sed -i "s|replace go.opentelemetry.io/auto => github.com/odigos-io/enterprise-go-instrumentation .*|replace go.opentelemetry.io/auto => github.com/odigos-io/enterprise-go-instrumentation main|g" go.mod
          sed -i "s|github.com/odigos-io/ebpf-java-instrumentation.*|github.com/odigos-io/ebpf-java-instrumentation main|g" go.mod
          sed -i "s|github.com/odigos-io/ebpf-java-instrumentation/otel_agent_extension.*|github.com/odigos-io/ebpf-java-instrumentation/otel_agent_extension main|g" go.mod
          sed -i "s|github.com/odigos-io/ebpf-generic-instrumentation.*|github.com/odigos-io/ebpf-generic-instrumentation main|g" go.mod
          sed -i "s|github.com/odigos-io/ebpf-nodejs-instrumentation.*|github.com/odigos-io/ebpf-nodejs-instrumentation main|g" go.mod
          go get github.com/odigos-io/odigos/odiglet@${TAG} github.com/odigos-io/odigos/api@${TAG} github.com/odigos-io/odigos/common@${TAG} github.com/odigos-io/odigos/k8sutils@${TAG} github.com/odigos-io/odigos/opampserver@${TAG} github.com/odigos-io/odigos/instrumentation@${TAG}
          go mod tidy

      - name: update instrumentor dependencies
        working-directory: ./instrumentor
        run: |
          git config --global url."https://${{ secrets.RELEASE_BOT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/odigos-io/*
          sed -i "s|github.com/odigos-io/odigos/api => github.com/odigos-io/odigos/api v.*|github.com/odigos-io/odigos/api => github.com/odigos-io/odigos/api main|g" go.mod
          sed -i "s|github.com/odigos-io/odigos/common => github.com/odigos-io/odigos/common v.*|github.com/odigos-io/odigos/common => github.com/odigos-io/odigos/common ${TAG}|g" go.mod
          sed -i "s|github.com/odigos-io/odigos/distros => github.com/odigos-io/odigos/distros v.*|github.com/odigos-io/odigos/distros => github.com/odigos-io/odigos/distros ${TAG}|g" go.mod
          sed -i "s|github.com/odigos-io/odigos/k8sutils => github.com/odigos-io/odigos/k8sutils v.*|github.com/odigos-io/odigos/k8sutils => github.com/odigos-io/odigos/k8sutils ${TAG}|g" go.mod
          go get github.com/odigos-io/odigos/instrumentor@${TAG} github.com/odigos-io/odigos/distros@${TAG}
          go mod tidy

      - name: update centralized-proxy dependencies
        working-directory: ./centralized-proxy
        run: |
          git config --global url."https://${{ secrets.RELEASE_BOT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/odigos-io/*
          go get github.com/odigos-io/odigos/api@${TAG} github.com/odigos-io/odigos/common@${TAG} github.com/odigos-io/odigos/k8sutils@${TAG}
          go mod tidy

      - name: github preperation
        id: github_preperation
        run: |
          # Set global Git configurations
          git config --global user.email "bot@keyval.dev"
          git config --global user.name "Odigos Release Bot"

          BRANCH_PREFIX="release-bot-"
          echo "branch_prefix=${BRANCH_PREFIX}-" >> $GITHUB_OUTPUT
          echo "branch_name=${BRANCH_PREFIX}${{ env.TAG }}" >> $GITHUB_OUTPUT

      - name: delete existing branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          # Check if a pull request already exists for the branch and close it if it does
          EXISTING_PR=$(gh pr list --head ${{ steps.github_preperation.outputs.branch_name }} --base main --state open --json number --jq '.[0].number')
          if [ ! -z "$EXISTING_PR" ]; then
              gh pr close $EXISTING_PR --delete-branch
          fi

          BRANCH_EXISTS=$(git ls-remote --heads origin ${{ steps.github_preperation.outputs.branch_name }})
          if [ ! -z "$BRANCH_EXISTS" ]; then
              git push origin --delete ${{ steps.github_preperation.outputs.branch_name }}
          fi

      - name: create release pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          git checkout -b ${{ steps.github_preperation.outputs.branch_name }}
          git add .
          git commit -m "bump odigos dependencise to use ${{ env.TAG }}"
          git push origin ${{ steps.github_preperation.outputs.branch_name }}

          PR_LINK=$(gh pr create \
            --title "chore: automatic release ${{ env.TAG }}" \
            --body "follow up PR for odigos release to upgrade enterprise components.
            Version:${{ env.TAG }}" \
            --base main \
            --head ${{ steps.github_preperation.outputs.branch_name }})
          echo "PR_LINK=$PR_LINK" >> $GITHUB_ENV

          # Extract PR number from PR_LINK
          PR_NUMBER=$(echo "$PR_LINK" | awk -F '/' '{print $NF}')
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV

      - name: Add bot label to PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          curl -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/labels -d '{"labels": ["release-bot"]}'

      # we want to save as many clicks as possible, so we mark the PR as auto mergeable.
      # Thus, when the PR is approved and build succeeds, it will be merged automatically.
      - name: Enable Auto Merge on PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          gh pr merge ${{ env.PR_LINK }} --auto --squash

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"link":"${{ env.PR_LINK }}/files", "description":"Odigos enterprise PR created. Approve to continue:", "tag":"${{ env.TAG }}"}' ${{ env.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on Failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"link":"https://github.com/${{ env.GITHUB_REPOSITORY }}/actions/runs/${{ env.GITHUB_RUN_ID }}", "description":"ERROR: odigos enterprise PR not created", "tag":"${{ env.TAG }}"}' ${{ env.SLACK_WEBHOOK_URL }}
