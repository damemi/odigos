name: Release Odigos Central Components to Artifact Registry
on:
  push:
    tags:
      - 'central-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: true

permissions:
  contents: write
  packages: write
  id-token: 'write'

jobs:
  release-central-images:
    strategy:
      matrix:
        service: ['central-ui', 'central-backend']
        dockerfile: ['Dockerfile', 'Dockerfile.rhel']
        include:
          - service: central-ui
            summary: 'Central UI for Odigos'
            description: 'The Central UI is the web interface for Central Odigos, providing a user-friendly experience for managing and visualizing data.'
            path: central-ui
          - service: central-backend
            summary: 'Central Backend for Odigos'
            description: 'The Central Backend is the core component of Central Odigos, responsible for data processing and management.'
            path: central-backend
    runs-on: large-runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - name: Set env
        id: vars
        run: |
          FULL_TAG="${GITHUB_REF#refs/*/}"
          VERSION_TAG="${FULL_TAG#central-}"
          echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
      - name: Notify Slack Start
        env:
          ODIGOS_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.vars.outputs.tag}}
          SLACK_WEBHOOK_URL: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
          "description":"Start releasing Odigos central component: ${{ matrix.service }}. (${{ matrix.dockerfile == 'Dockerfile.rhel' && 'UBI9' || 'Standard' }} image). This should take few minutes",
          "tag":"${{ env.ODIGOS_TAG }}"}' ${{ env.SLACK_WEBHOOK_URL }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - id: gcp-auth
        name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: 1200s

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Enterprise Image
        uses: docker/build-push-action@v6
        env:
          ODIGOS_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.vars.outputs.tag}}
        with:
          file: >-
            ${{ matrix.service == 'central-ui' && format('central-ui/{0}', matrix.dockerfile)
            || matrix.service == 'central-backend' && format('central-backend/{0}', matrix.dockerfile)
            || matrix.dockerfile }}
          context: ${{ matrix.path }}
          push: true
          tags: |
            us-central1-docker.pkg.dev/odigos-cloud/components/odigos-enterprise-${{ matrix.service }}${{ matrix.dockerfile == 'Dockerfile.rhel' && '-ubi9' || '' }}:${{ env.ODIGOS_TAG }}
            keyval/odigos-enterprise-${{ matrix.service }}${{ matrix.dockerfile == 'Dockerfile.rhel' && '-ubi9' || '' }}:${{ env.ODIGOS_TAG }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            ODIGOS_VERSION=${{ env.ODIGOS_TAG }}
            SUMMARY=${{ matrix.summary }}
            DESCRIPTION=${{ matrix.description }}
            VERSION=${{ env.ODIGOS_TAG }}
            RELEASE=${{ env.ODIGOS_TAG }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          secrets: |
            "github_token=${{ secrets.RELEASE_BOT_TOKEN }}"

      - name: Notify Slack on Failure
        if: failure()
        env:
          ODIGOS_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.vars.outputs.tag}}
          SLACK_WEBHOOK_URL: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          IMAGE_NAME: us-central1-docker.pkg.dev/odigos-cloud/components/odigos-enterprise-${{ matrix.service }}${{ matrix.dockerfile == 'Dockerfile.rhel' && '-ubi9' || '' }}
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "link":"https://github.com/${{ env.GITHUB_REPOSITORY }}/actions/runs/${{ env.GITHUB_RUN_ID }}",
            "description":"ERROR: Failed to build ${{ matrix.service }} (${{ matrix.dockerfile == 'Dockerfile.rhel' && 'UBI9' || 'Standard' }} image). Image: ${{ env.IMAGE_NAME }}:${{ env.ODIGOS_TAG }}",
            "tag":"${{ env.ODIGOS_TAG }}"
          }' ${{ env.SLACK_WEBHOOK_URL }}
