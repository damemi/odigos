apiVersion: internal.odigos.io/v1beta1
kind: OtelDistribution
metadata:
  name: golang-enterprise
spec:
  name: golang-enterprise
  language: go
  runtimeEnvironments:
    - name: go-runtime
      supportedVersions: '>= 1.17'
  displayName: Golang Enterprise eBPF Instrumentation
  description: |
    This distribution is for Golang applications using Odigos enterprise version, with ebpf-based SDK and instrumentation libraries, additional features and libraries coverage.
  environmentVariables:
    staticVariables:
      - envName: GODEBUG
        envValue: 'tracebackancestors=5'
  # Device not needed in go, but adding the device mount here ensures Go pods are scheduled only on nodes with the Odiglet installed,
  # since we intentionally skip setting node affinity when the mount method is 'virtual device'.
  runtimeAgent:
    device: 'instrumentation.odigos.io/generic'
