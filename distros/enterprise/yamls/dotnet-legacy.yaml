apiVersion: internal.odigos.io/v1beta1
kind: OtelDistribution
metadata:
  name: dotnet-legacy
spec:
  name: dotnet-legacy
  language: dotnet
  requireParameters:
    - LIBC_TYPE
  runtimeEnvironments:
    - name: dotnet-version
      supportedVersions: '>=3 <7'
  displayName: 'Dotnet Community Native Instrumentation for Legacy Versions'
  description: |
    This distribution is for Dotnet applications running on old runtimes, using OpenTelemetry Native SDK and instrumentation libraries from the OpenTelemetry community.
  environmentVariables:
    otlpHttpLocalNode: true
    signalsAsStaticOtelEnvVars: true
    staticVariables:
      - envName: 'CORECLR_ENABLE_PROFILING'
        envValue: '1'
      - envName: 'CORECLR_PROFILER'
        envValue: '{918728DD-259F-4A6A-AC2B-B85E1B658318}'
      - envName: 'CORECLR_PROFILER_PATH'
        envValue: '/var/odigos/legacy-dotnet/OpenTelemetry.AutoInstrumentation.Native.so'
      - envName: 'OTEL_DOTNET_AUTO_HOME'
        envValue: '/var/odigos/legacy-dotnet'
      - envName: 'DOTNET_STARTUP_HOOKS'
        envValue: '/var/odigos/legacy-dotnet/netcoreapp3.1/OpenTelemetry.AutoInstrumentation.StartupHook.dll'
      - envName: 'DOTNET_ADDITIONAL_DEPS'
        envValue: '/var/odigos/legacy-dotnet/AdditionalDeps'
      - envName: 'DOTNET_SHARED_STORE'
        envValue: '/var/odigos/legacy-dotnet/store'
  runtimeAgent:
    directoryNames:
      - "{{ODIGOS_AGENTS_DIR}}/legacy-dotnet"
    k8sAttrsViaEnvVars: true
    device: 'instrumentation.odigos.io/generic'
