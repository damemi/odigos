apiVersion: internal.odigos.io/v1beta1
kind: OtelDistribution
metadata:
  name: nodejs-enterprise-14
spec:
  name: nodejs-enterprise-14
  language: javascript
  runtimeEnvironments:
    - name: nodejs
      supportedVersions: '>= 14'
  displayName: Node.js Enterprise eBPF Processing
  description: |
    This distribution is for legacy Node.js applications (>=14) using an efficient eBPF-based SDK, and native instrumentation libraries from the OpenTelemetry community.
  isEbpf: true
  environmentVariables:
    opAmpClientEnvironments: true
    appendOdigosVariables:
      - envName: NODE_OPTIONS
        replacePattern: "{{ORIGINAL_ENV_VALUE}} --require {{ODIGOS_AGENTS_DIR}}/nodejs-ebpf-14/autoinstrumentation.js"
  runtimeAgent:
    directoryNames:
      - "{{ODIGOS_AGENTS_DIR}}/nodejs-ebpf-14"
      - "{{ODIGOS_AGENTS_DIR}}/opentelemetry-node-14"
    device: 'instrumentation.odigos.io/generic'
    fileOpenTriggers:
      - "{{ODIGOS_AGENTS_DIR}}/nodejs-ebpf-14/build/Release/dtrace-injector-native.node"
    k8sAttrsViaEnvVars: true
    ldPreloadInjectionSupported: true
  traces:
    headersCollection:
      supported: true
