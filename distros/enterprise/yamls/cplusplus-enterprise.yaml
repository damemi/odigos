apiVersion: internal.odigos.io/v1beta1
kind: OtelDistribution
metadata:
  name: cplusplus-enterprise
spec:
  name: cplusplus-enterprise
  language: cplusplus
  displayName: CPlusPlus Enterprise eBPF Instrumentation
  description: |
    This distribution is for CPlusPlus applications using Odigos enterprise version, with ebpf-based SDK and instrumentation libraries, additional features and libraries coverage.

  # Device not needed in cpp, but adding the device mount here ensures CplusPlus pods are scheduled only on nodes with the Odiglet installed,
  # since we intentionally skip setting node affinity when the mount method is 'virtual device'.
  runtimeAgent:
    device: 'instrumentation.odigos.io/generic'
    k8sAttrsViaEnvVars: false
