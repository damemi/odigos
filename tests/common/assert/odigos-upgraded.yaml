apiVersion: v1
kind: Namespace
metadata:
  name: odigos-test
  labels:
    odigos.io/system-object: "true"
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/name: odigos-instrumentor
  namespace: odigos-test
spec:
  containers:
    - name: manager
      # The image built for this run: instrumentor:e2e-test by make, <save-tag>-instrumentor on Depot.
      (ends_with(image, 'instrumentor:e2e-test') || ends_with(image, '-instrumentor')): true
status:
  containerStatuses:
    - name: manager
      ready: true
      restartCount: 0
      started: true
  phase: Running
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/name: odiglet
    odigos.io/collector-role: NODE_COLLECTOR
  namespace: odigos-test
  ownerReferences:
    - apiVersion: apps/v1
      blockOwnerDeletion: true
      controller: true
      kind: DaemonSet
      name: odiglet
spec:
  (containers[?name=='odiglet']):
    - resources: {}
      securityContext:
        privileged: false
      # The image built for this run: odiglet:e2e-test by make, <save-tag>-odiglet on Depot.
      (ends_with(image, 'odiglet:e2e-test') || ends_with(image, '-odiglet')): true
  (containers[?name=='data-collection']):
    - securityContext:
        privileged: false
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: GOMEMLIMIT
          (value != null): true
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              containerName: data-collection
              divisor: "0"
              resource: limits.cpu
        - name: ODIGOS_ONPREM_TOKEN
          valueFrom:
            secretKeyRef:
              key: odigos-onprem-token
              name: odigos-pro
      resources:
        requests:
          (memory != null): true
        limits:
          (memory != null): true
  (containers[?name=='deviceplugin']):
    - resources: {}
  (($values.k8sMinorVersion < `26` && hostNetwork != null) || (hostNetwork == null)): true
  hostPID: true
  nodeName: kind-control-plane
  nodeSelector:
    kubernetes.io/os: linux
  serviceAccount: odiglet
  serviceAccountName: odiglet
status:
  containerStatuses:
    - name: data-collection
      ready: true
      started: true
    - name: deviceplugin
      ready: true
      restartCount: 0
      started: true
    - name: odiglet
      ready: true
      restartCount: 0
      started: true
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/name: odiglet
    odigos.io/collector-role: NODE_COLLECTOR
  namespace: odigos-test
  ownerReferences:
    - apiVersion: apps/v1
      blockOwnerDeletion: true
      controller: true
      kind: DaemonSet
      name: odiglet
spec:
  (containers[?name=='odiglet']):
    - resources: {}
      securityContext:
        privileged: false
      # The image built for this run: odiglet:e2e-test by make, <save-tag>-odiglet on Depot.
      (ends_with(image, 'odiglet:e2e-test') || ends_with(image, '-odiglet')): true
  (containers[?name=='data-collection']):
    - securityContext:
        privileged: false
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: GOMEMLIMIT
          (value != null): true
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              containerName: data-collection
              divisor: "0"
              resource: limits.cpu
        - name: ODIGOS_ONPREM_TOKEN
          valueFrom:
            secretKeyRef:
              key: odigos-onprem-token
              name: odigos-pro
      resources:
        requests:
          (memory != null): true
        limits:
          (memory != null): true
  (containers[?name=='deviceplugin']):
    - resources: {}
  (($values.k8sMinorVersion < `26` && hostNetwork != null) || (hostNetwork == null)): true
  hostPID: true
  nodeName: kind-worker
  nodeSelector:
    kubernetes.io/os: linux
  serviceAccount: odiglet
  serviceAccountName: odiglet
status:
  containerStatuses:
    - name: data-collection
      ready: true
      started: true
    - name: deviceplugin
      ready: true
      restartCount: 0
      started: true
    - name: odiglet
      ready: true
      restartCount: 0
      started: true
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    odigos.io/collector-role: CLUSTER_GATEWAY
  namespace: odigos-test
spec:
  containers:
    - name: gateway
      # The image built for this run: collector:e2e-test by make, <save-tag>-collector on Depot.
      (ends_with(image, 'collector:e2e-test') || ends_with(image, '-collector')): true
status:
  containerStatuses:
    - name: gateway
      ready: true
      restartCount: 0
      started: true
  phase: Running
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odigos-gateway
  namespace: odigos-test
  labels:
    odigos.io/collector-role: CLUSTER_GATEWAY
status:
  replicas: 2
  readyReplicas: 2
  updatedReplicas: 2
  availableReplicas: 2
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    (odigos.io/config == null): true
    odigos.io/system-object: "true"
  name: destinations.odigos.io
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    (odigos.io/config == null): true
    odigos.io/system-object: "true"
  name: processors.odigos.io
