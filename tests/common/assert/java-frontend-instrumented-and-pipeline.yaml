apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: default
status:
  conditions:
    - type: Available
      status: "True"
    - type: Progressing
      status: "True"
  replicas: 1
  readyReplicas: 1
  availableReplicas: 1
  updatedReplicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    odigos.io/collector-role: "CLUSTER_GATEWAY"
  name: odigos-gateway
  namespace: odigos-test
  ownerReferences:
    - apiVersion: odigos.io/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: CollectorsGroup
      name: odigos-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      odigos.io/collector-role: "CLUSTER_GATEWAY"
status:
  availableReplicas: 2
  readyReplicas: 2
  replicas: 2
---
apiVersion: odigos.io/v1alpha1
kind: CollectorsGroup
metadata:
  name: odigos-data-collection
  namespace: odigos-test
spec:
  role: NODE_COLLECTOR
status:
  ready: true
---
apiVersion: odigos.io/v1alpha1
kind: CollectorsGroup
metadata:
  name: odigos-gateway
  namespace: odigos-test
spec:
  role: CLUSTER_GATEWAY
status:
  ready: true
---
# frontend pod - java-ebpf-instrumentations distro has noRestartRequired: true,
# so the pod is NOT restarted and no env vars or resource limits are injected.
apiVersion: v1
kind: Pod
metadata:
  namespace: default
  labels:
    app: frontend
spec:
  containers:
    - name: frontend
status:
  containerStatuses:
    - name: frontend
      ready: true
      restartCount: 0
      started: true
  phase: Running
