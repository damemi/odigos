apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: metrics
status:
  conditions:
    - type: Available
      status: "True"
    - type: Progressing
      status: "True"
  replicas: 1
  readyReplicas: 1
  availableReplicas: 1
  updatedReplicas: 1
---
apiVersion: v1
kind: Pod
metadata:
  namespace: metrics
  labels:
    app: prometheus
status:
  containerStatuses:
    - name: prometheus
      ready: true
      started: true
  phase: Running
