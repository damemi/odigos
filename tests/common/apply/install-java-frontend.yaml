##################################################
# Frontend (Java) - JVM metrics e2e target
##################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: default
  labels:
    app: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/odigos-io/simple-demo/odigos-demo-frontend:v0.1.39
          imagePullPolicy: IfNotPresent
          env:
            - name: INVENTORY_SERVICE_HOST
              value: inventory:8080
            - name: PRICING_SERVICE_HOST
              value: pricing:8080
            - name: COUPON_SERVICE_HOST
              value: coupon:8080
            - name: CURRENCY_SERVICE_HOST
              value: currency:8080
            - name: GEOLOCATION_SERVICE_HOST
              value: geolocation:8080
            - name: SHIPPING_SERVICE_HOST
              value: shipping:8080
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: default
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
