apiVersion: v1
kind: Namespace
metadata:
  name: ($traceDbNamespace)
---
apiVersion: v1
kind: Secret
metadata:
  name: depot-test-images
  namespace: ($traceDbNamespace)
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: >-
    (($values.depotPullTokenTestImages && to_string({auths: {"p0xd21zf5r.registry.depot.dev": {username: 'x-token', password: $values.depotPullTokenTestImages}}})) || '{"auths":{}}')
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-trace-db
  namespace: ($traceDbNamespace)
  labels:
    app: simple-trace-db
spec:
  selector:
    matchLabels:
      app: simple-trace-db
  template:
    metadata:
      labels:
        app: simple-trace-db
    spec:
      imagePullSecrets: (($values.depotPullTokenTestImages && `[{"name":"depot-test-images"}]`) || `[]`)
      containers:
        - name: simple-trace-db
          image: (($values.depotPullTokenTestImages && 'p0xd21zf5r.registry.depot.dev/test/simple-trace-db:v0.0.13') || 'us-central1-docker.pkg.dev/odigos-cloud/components/simple-trace-db:v0.0.13')
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4318
---
kind: Service
apiVersion: v1
metadata:
  name: simple-trace-db
  namespace: ($traceDbNamespace)
spec:
  selector:
    app: simple-trace-db
  ports:
    - protocol: TCP
      port: 4318
