apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: helm-chart
spec:
  description: This e2e test install Odigos via helm chart on custom namespace
  skipDelete: true
  steps:
  - name: Prepare destination
    try:
      - script:
          timeout: 60s
          content: |
            if helm status e2e-tests -n traces >/dev/null 2>&1; then
              echo "e2e-tests helm already installed, probably from previous run. Skipping..."
            else
              helm repo add grafana https://grafana.github.io/helm-charts
              helm repo update
              helm install e2e-tests grafana/tempo -n traces --create-namespace --set tempo.storage.trace.block.version=vParquet4 --version 1.10.1
            fi
      - assert:
          file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/assert/tempo-running.yaml
  - name: Wait for destination to be ready
    try:
      - script:
          timeout: 60s
          content: ../../common/wait_for_dest.sh
  - name: Install Odigos
    try:
    - script:
        content: |
          # use the helm chart from main repo which is expected to be in a sibling directory to this repo
          helm upgrade --install odigos  ../../../../odigos/helm/odigos --create-namespace --namespace odigos-test --set image.tag=$IMAGE_TAG --set onPremToken=$ODIGOS_API_KEY
          kubectl label namespace odigos-test odigos.io/system-object="true"
        timeout: 60s
  - name: Verify Odigos Installation
    try:
    - script:
        content: |
          export ACTUAL_VERSION=$(../../../../odigos/cli/odigos version --cluster)
          if [ "$ACTUAL_VERSION" != "$IMAGE_TAG" ]; then
            echo "Odigos version is not $IMAGE_TAG, got $ACTUAL_VERSION"
            exit 1
          fi
    - assert:
        file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/assert/odigos-installed.yaml
    catch:
      - script:
          content: |
            kubectl get pods -n odigos-system


  - name: Verify node Odiglet installed label has been added
    try:
      - assert:
          file: ../../common/assert/node-odiglet-label.yaml

  - name: Install Demo App
    try:
    - script:
        timeout: 100s
        content: |
          docker pull keyval/odigos-demo-inventory:v0.1
          docker pull keyval/odigos-demo-membership:v0.1
          docker pull keyval/odigos-demo-coupon:v0.1
          docker pull keyval/odigos-demo-inventory:v0.1
          docker pull keyval/odigos-demo-frontend:v0.2
          kind load docker-image keyval/odigos-demo-inventory:v0.1
          kind load docker-image keyval/odigos-demo-membership:v0.1
          kind load docker-image keyval/odigos-demo-coupon:v0.1
          kind load docker-image keyval/odigos-demo-inventory:v0.1
          kind load docker-image keyval/odigos-demo-frontend:v0.2
    - apply:
        file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/install-simple-demo.yaml
    - assert:
        file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/assert/simple-demo-installed.yaml
  - name: Detect Languages
    try:
    - apply:
        file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/instrument-default-ns.yaml
    - assert:
        timeout: 2m    
        file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/assert/simple-demo-runtime-detected.yaml
  - name: Add Destination
    try:
    - apply:
        file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/add-tempo-traces-destination.yaml
    - assert:
        file: assert-instrumented-and-pipeline.yaml
  - name: Generate Traffic
    try:
      - script:
          timeout: 60s
          content: |
            # Apply the job
            kubectl apply -f https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/generate-traffic-job.yaml
          
            # Wait for the job to complete
            job_name=$(kubectl get -f https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/generate-traffic-job.yaml -o=jsonpath='{.metadata.name}')
            kubectl wait --for=condition=complete job/$job_name
          
            # Delete the job
            kubectl delete -f https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/generate-traffic-job.yaml
            while true; do
              sleep 5
            
              # Run the wait-for-trace script
              ../../common/traceql_runner.sh tracesql/wait-for-trace.yaml
              if [ $? -eq 0 ]; then
                break
              else
                ../../common/flush_traces.sh
              fi
            done
  - name: Verify Trace - Context Propagation
    try:
    - script:
        content: |
          ../../common/traceql_runner.sh tracesql/context-propagation.yaml
    catch:
    - podLogs:
        name: odiglet
        namespace: odigos-system
  - name: Verify Trace - Resource Attributes
    try:
    - script:
        content: |
          export TAG=${IMAGE_TAG:-e2e-test}
          envsubst < tracesql/resource-attributes.yaml > tracesql/resource-attributes.yaml.tmp
          cat tracesql/resource-attributes.yaml.tmp
          ../../common/traceql_runner.sh tracesql/resource-attributes.yaml.tmp
    catch:
    - podLogs:
        name: odiglet
        namespace: odigos-system
  - name: Verify Trace - Span Attributes
    try:
      - script:
          content: |
            ../../common/traceql_runner.sh tracesql/span-attributes.yaml
    catch:
      - podLogs:
          name: odiglet
          namespace: odigos-system
