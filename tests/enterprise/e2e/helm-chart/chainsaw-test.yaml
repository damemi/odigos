apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: helm-chart
spec:
  description: This e2e test install Odigos via helm chart on custom namespace
  skipDelete: true
  steps:
    - name: Prepare destination
      try:
        - apply:
            file: ../../../../odigos/tests/common/apply/simple-trace-db-deployment.yaml

    - name: Install - Simple Demo Apps
      try:
        - apply:
            file: ../../../../odigos/tests/common/apply/install-simple-demo.yaml

    - name: Install Odigos
      try:
        - script:
            timeout: 2m
            content: |
              # use the helm chart from main repo which is expected to be in a sibling directory to this repo
              helm upgrade --install odigos \
                ../../../../odigos/helm/odigos \
                --create-namespace \
                --namespace odigos-test \
                --set image.tag=$IMAGE_TAG \
                --set onPremToken=$ODIGOS_API_KEY \
                --set goAutoOffsetsCron="0 0 * * *" \
                --set goAutoOffsetsMode="direct" \
                $ODIGOS_INSTALL_FLAGS
              kubectl label namespace odigos-test odigos.io/system-object="true"
              # if WASP is enabled in the test, we need to force the instrumentations supporting it to use it since
              # the underlying kernel where the test runs might not require WASP, but we want to force its usage for testing purposes.
              # this env var is only meant for testing purposes, and it is defined and used only in the e2e tests here and the tests in the go instrumentation repo.
              if [ "$WASP_ENABLED" = "true" ]; then
                kubectl patch daemonset -n odigos-test odiglet --type=strategic -p '
                {
                  "spec": {
                    "template": {
                      "spec": {
                        "containers": [
                          {
                            "name": "odiglet",
                            "env": [
                              {
                                "name": "ODIGOS_FORCE_WASP",
                                "value": "true"
                              }
                            ]
                          }
                        ]
                      }
                    }
                  }
                }'
              fi

    - name: Verify Odigos Installation
      try:
        - script:
            timeout: 2m
            content: |
              echo "Starting Odigos version check..."
              export ACTUAL_VERSION=$(../../../../odigos/cli/odigos version --cluster)
              echo "Actual Version: $ACTUAL_VERSION"
              echo "Expected Version: $IMAGE_TAG"

        - assert:
            timeout: 4m
            file: ../../common/assert/odigos-installed.yaml

        - assert:
            timeout: 4m
            file: initial-go-offeset-job-applied.yaml

      catch:
        - script:
            content: |
              echo "🔍 Listing all resources in namespace 'odigos-test'..."
              kubectl get all -n odigos-test

              echo "📝 Describing all resources in namespace 'odigos-test'..."
              kubectl describe deployments -n odigos-test

    - name: Verify Node Odiglet label has been added
      try:
        - assert:
            timeout: 1m10s
            file: ../../common/assert/node-odiglet-label.yaml

    - name: Assert Trace DB is up
      try:
        - assert:
            timeout: 1m10s
            file: ../../../../odigos/tests/common/assert/simple-trace-db-running.yaml

    - name: Add Destination
      try:
        - apply:
            file: ../../../../odigos/tests/common/apply/add-simple-trace-db-destination.yaml

    - name: Assert - Simple Demo Apps Installed
      try:
        - assert:
            timeout: 1m10s
            file: ../../../../odigos/tests/common/assert/simple-demo-installed.yaml

    - name: Instrument Namespace
      try:
        - apply:
            file: ../../../../odigos/tests/common/apply/instrument-default-ns.yaml

    - name: Assert Runtime Detected
      try:
        - assert:
            timeout: 1m10s
            file: ../../../../odigos/tests/common/assert/simple-demo-runtime-detected.yaml

    - name: Odigos pipeline ready
      try:
        - assert:
            timeout: 1m10s
            file: ../../common/assert/pipeline-ready.yaml

    - name: Simple-demo instrumented after destination added
      try:
        - assert:
            timeout: 1m30s
            file: ../../common/assert/instrumented-and-pipeline.yaml

    # The first request through a freshly instrumented java app can't propagate
    # context (http client instrumentations load lazily on first use). /rate only
    # reaches currency, so warmup traces don't affect the trace assertions below.
    - name: Warm Up Java Frontend
      try:
        - script:
            timeout: 3m
            content: |
              kubectl delete pod warmup-traffic -n default --ignore-not-found
              kubectl run warmup-traffic -n default --image=curlimages/curl:8.4.0 --restart=Never --command -- \
                sh -c 'for i in 1 2 3; do curl -s -o /dev/null "http://frontend:8080/rate/usd-eur"; sleep 2; done'
              kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/warmup-traffic -n default --timeout=90s
              kubectl delete pod warmup-traffic -n default --ignore-not-found

    - name: Generate Traffic
      try:
        - apply:
            file: ../../../../odigos/tests/common/apply/generate-traffic-job.yaml
        - script:
            timeout: 2m30s
            content: |
              kubectl wait --for=condition=complete job/$(kubectl get -f ../../../../odigos/tests/common/apply/generate-traffic-job.yaml -o=jsonpath='{.metadata.name}')
        - delete:
            file: ../../../../odigos/tests/common/apply/generate-traffic-job.yaml

    - name: Wait For Trace
      try:
        - script:
            timeout: 1m10s
            content: |
              yaml=$(mktemp)
              script=$(mktemp)
              cp ../../../../odigos/tests/common/queries/wait-for-trace.yaml "$yaml"
              cp ../../../../odigos/tests/common/simple_trace_db_query_runner.sh "$script"

              while true; do
                bash "$script" "$yaml"
                if [ $? -eq 0 ]; then
                  break
                fi
                sleep 1
              done

              rm -f "$yaml" "$script"
      catch:
        - script:
            content: |
              java_pod_name=$(kubectl get pods -n default -o jsonpath="{.items[*].metadata.name}" | tr ' ' '\n' | grep ^frontend)
              kubectl logs $java_pod_name -n default
      finally:
        - script:
            timeout: 1m
            # a failing finally operation fails the step, the report should never fail a passing test
            content: |
              bash ../../../../odigos/tests/common/simple_trace_db_report.sh || true

    - name: Verify Trace - Context Propagation
      try:
        - script:
            timeout: 1m10s
            content: |
              yaml=$(mktemp)
              script=$(mktemp)

              cp ../../../../odigos/tests/common/queries/context-propagation.yaml "$yaml"
              cp ../../../../odigos/tests/common/simple_trace_db_query_runner.sh "$script"

              while true; do
                bash "$script" "$yaml"
                if [ $? -eq 0 ]; then
                  break
                fi
                sleep 1
              done

              rm -f "$yaml" "$script"
      catch:
        - podLogs:
            name: odiglet
            namespace: odigos-test

    - name: Verify Trace - Resource Attributes
      try:
        - script:
            content: |
              yaml=$(mktemp)
              cp ../../../../odigos/tests/common/queries/resource-attributes.yaml "$yaml"
              bash ../../../../odigos/tests/common/simple_trace_db_query_runner.sh "$yaml"
      catch:
        - podLogs:
            name: odiglet
            namespace: odigos-test

    - name: Verify Trace - Span Attributes
      try:
        - script:
            content: |
              yaml=$(mktemp)
              cp ../../../../odigos/tests/common/queries/span-attributes.yaml "$yaml"
              bash ../../../../odigos/tests/common/simple_trace_db_query_runner.sh "$yaml"
      catch:
        - podLogs:
            name: odiglet
            namespace: odigos-test
