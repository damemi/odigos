apiVersion: odigos.io/v1alpha1
kind: CollectorsGroup
metadata:
  name: odigos-data-collection
  namespace: odigos-test
spec:
  role: NODE_COLLECTOR
status:
  ready: true
---
apiVersion: odigos.io/v1alpha1
kind: CollectorsGroup
metadata:
  name: odigos-gateway
  namespace: odigos-test
spec:
  role: CLUSTER_GATEWAY
status:
  ready: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    odigos.io/collector-role: "CLUSTER_GATEWAY"
  name: odigos-gateway
  namespace: odigos-test
  ownerReferences:
    - apiVersion: odigos.io/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: CollectorsGroup
      name: odigos-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      odigos.io/collector-role: "CLUSTER_GATEWAY"
  template:
    metadata:
      labels:
        odigos.io/collector-role: "CLUSTER_GATEWAY"
    spec:
      containers:
        - env:
            - name: ODIGOS_VERSION
              valueFrom:
                configMapKeyRef:
                  key: ODIGOS_VERSION
                  name: odigos-deployment
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: GOMEMLIMIT
              (value != null): true
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  containerName: gateway
                  divisor: "0"
                  resource: limits.cpu
          name: gateway
          resources:
            requests:
              (memory != null): true
              (cpu != null): true
            limits:
              (memory != null): true
              (cpu != null): true
          volumeMounts:
            - mountPath: /conf
              name: collector-conf
      volumes:
        - configMap:
            defaultMode: 420
            items:
              - key: collector-conf
                path: collector-conf.yaml
            name: odigos-gateway
          name: collector-conf
status:
  availableReplicas: 1
  readyReplicas: 1
  replicas: 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: odigos-gateway
  namespace: odigos-test
  ownerReferences:
    - apiVersion: odigos.io/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: CollectorsGroup
      name: odigos-gateway
(data != null): true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: odigos-data-collection
  namespace: odigos-test
  ownerReferences:
    - apiVersion: odigos.io/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: CollectorsGroup
      name: odigos-data-collection
(data != null): true
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    odigos.io/collector-role: "NODE_COLLECTOR"
  name: odigos-data-collection
  namespace: odigos-test
  ownerReferences:
    - apiVersion: odigos.io/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: CollectorsGroup
      name: odigos-data-collection
spec:
  selector:
    matchLabels:
      odigos.io/collector-role: "NODE_COLLECTOR"
  template:
    metadata:
      labels:
        odigos.io/collector-role: "NODE_COLLECTOR"
    spec:
      containers:
        - name: data-collection
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /conf
              name: conf
            - mountPath: /var/lib/docker/containers
              name: varlibdockercontainers
              readOnly: true
            - mountPath: /var/log
              name: varlog
              readOnly: true
            - mountPath: /hostfs
              name: hostfs
              readOnly: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: GOMEMLIMIT
              (value != null): true
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  containerName: data-collection
                  divisor: "0"
                  resource: limits.cpu
          resources:
            limits:
              (memory != null): true
            requests:
              (memory != null): true
      (($values.k8sMinorVersion < `26` && hostNetwork != null) || (hostNetwork == null)): true
      nodeSelector:
        kubernetes.io/os: linux
      securityContext: {}
      serviceAccount: odigos-data-collection
      serviceAccountName: odigos-data-collection
      volumes:
        - configMap:
            defaultMode: 420
            items:
              - key: conf
                path: conf.yaml
            name: odigos-data-collection
          name: conf
        - hostPath:
            path: /var/log
            type: ""
          name: varlog
        - hostPath:
            path: /var/lib/docker/containers
            type: ""
          name: varlibdockercontainers
        - hostPath:
            path: /
            type: ""
          name: hostfs
status:
  numberAvailable: 1
  numberReady: 1
---
apiVersion: v1
kind: Pod
metadata:
  namespace: default
  labels:
    app: frontend
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: odigos.io/odiglet-enterprise-installed
                operator: In
                values:
                  - "true"
  containers:
    - name: frontend
      resources:
        limits:
          instrumentation.odigos.io/generic: "1"
        requests:
          instrumentation.odigos.io/generic: "1"
      (env[?name == 'ODIGOS_CONTAINER_NAME']):
        - value: 'frontend'
      (env[?name == 'ODIGOS_DISTRO_NAME']):
        - value: 'java-enterprise'
      (env[?name == 'ODIGOS_POD_NAME']):
        - valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
      (env[?name == 'ODIGOS_WORKLOAD_NAMESPACE']):
        - value: 'default'
      (env[?name == 'JAVA_OPTS']):
        - value: '-javaagent:/var/odigos/java-ext-ebpf/javaagent.jar -Dotel.javaagent.extensions=/var/odigos/java-ext-ebpf/otel_agent_extension.jar'
      (env[?name == 'JAVA_TOOL_OPTIONS']):
        - value: '-javaagent:/var/odigos/java-ext-ebpf/javaagent.jar -Dotel.javaagent.extensions=/var/odigos/java-ext-ebpf/otel_agent_extension.jar'
status:
  containerStatuses:
    - name: frontend
      ready: true
      restartCount: 0
      started: true
  phase: Running
---
