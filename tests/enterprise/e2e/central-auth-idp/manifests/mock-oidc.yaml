apiVersion: v1
kind: Service
metadata:
  name: mock-oidc
  namespace: odigos-central
spec:
  type: NodePort
  selector:
    app: mock-oidc
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30089
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-oidc
  namespace: odigos-central
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-oidc
  template:
    metadata:
      labels:
        app: mock-oidc
    spec:
      containers:
        - name: mock-oidc
          image: ghcr.io/navikt/mock-oauth2-server:2.1.10
          ports:
            - containerPort: 8080
          env:
            # Keep issued URLs stable for both in-cluster and NodePort clients.
            - name: SERVER_PORT
              value: "8080"
            # Non-interactive auth-code flow for CI/curl: /authorize redirects with a code.
            - name: JSON_CONFIG
              value: '{"interactiveLogin":false,"tokenCallbacks":[{"issuerId":"default","tokenExpiry":3600,"requestMappings":[{"requestParam":"client_id","match":".*","claims":{"sub":"e2e-user","email":"e2e-user@example.com","email_verified":true,"preferred_username":"e2e-user","given_name":"E2E","family_name":"User"}}]}]}'
          readinessProbe:
            httpGet:
              path: /default/.well-known/openid-configuration
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
