apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: jvm-metrics
spec:
  description: Verify JVM runtime metrics are exported to a Prometheus destination
  skipDelete: true
  steps:
    - name: Prepare Prometheus destination backend
      try:
        - apply:
            file: ../../common/apply/prometheus-deployment.yaml

    - name: Install Java Frontend App
      try:
        - apply:
            file: ../../common/apply/install-java-frontend.yaml

    - name: Install Odigos
      try:
        - script:
            timeout: 5m
            content: |
              echo "Installing Odigos with tag $IMAGE_TAG"
              ../../../../odigos/cli/odigos install --ns odigos-test \
                --set image.tag=$IMAGE_TAG \
                --set onPremToken=$ODIGOS_API_KEY \
                --set metricsSources.agentMetrics.runtimeMetrics.java.disabled=false
              kubectl label namespace odigos-test odigos.io/system-object="true"
              ../../common/verify_odigos_installation.sh odigos-test
        - assert:
            timeout: 4m
            file: ../../common/assert/odigos-installed.yaml
      catch:
        - script:
            content: |
              kubectl describe pods -n odigos-test

    - name: Verify node Odiglet installed label has been added
      try:
        - assert:
            timeout: 30s
            file: ../../common/assert/node-odiglet-label.yaml

    - name: Assert Prometheus is up
      try:
        - assert:
            timeout: 1m
            file: ../../common/assert/prometheus-running.yaml

    - name: Assert Java Frontend Installed
      try:
        - assert:
            timeout: 3m
            file: ../../common/assert/java-frontend-installed.yaml

    - name: Instrument Namespace
      try:
        - apply:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/apply/instrument-default-ns.yaml

    - name: Assert Runtime Detected
      try:
        - assert:
            timeout: 1m
            file: ../../common/assert/java-frontend-runtime-detected.yaml

    - name: Add Prometheus Destination
      try:
        - apply:
            file: ../../common/apply/add-prometheus-destination.yaml

    - name: Frontend instrumented and metrics pipeline ready
      try:
        - assert:
            timeout: 3m
            file: ../../common/assert/java-frontend-instrumented-and-pipeline.yaml
      catch:
        - script:
            content: |
              kubectl describe pods -n default
              kubectl get destination -n odigos-test -o yaml
              kubectl get collectorsgroup -n odigos-test -o yaml

    - name: Generate JVM activity
      try:
        - apply:
            file: ../../common/apply/generate-jvm-metrics-traffic-job.yaml
        - script:
            timeout: 2m
            content: |
              kubectl wait --for=condition=complete job/jvm-metrics-traffic --timeout=90s || true
        - delete:
            file: ../../common/apply/generate-jvm-metrics-traffic-job.yaml

    - name: Wait for JVM metrics in Prometheus
      try:
        - script:
            timeout: 3m
            content: |
              script=../../common/assert_prometheus_jvm_metrics.sh
              chmod +x "$script"

              while true; do
                if bash "$script" frontend; then
                  break
                fi
                sleep 5
              done
      catch:
        - script:
            content: |
              echo "=== Prometheus JVM series sample ==="
              kubectl get --raw '/api/v1/namespaces/metrics/services/prometheus:9090/proxy/api/v1/query?query=%7B__name__%3D~%22jvm_.*%22%7D' | jq .
              echo "=== Frontend pod logs ==="
              java_pod_name=$(kubectl get pods -n default -o jsonpath="{.items[*].metadata.name}" | tr ' ' '\n' | grep ^frontend | head -1)
              kubectl logs "$java_pod_name" -n default || true
              echo "=== Odiglet logs ==="
              kubectl logs -n odigos-test -l app.kubernetes.io/name=odiglet --tail=100 || true
              echo "=== Gateway collector config (metrics exporters) ==="
              kubectl get cm odigos-gateway -n odigos-test -o yaml || true
