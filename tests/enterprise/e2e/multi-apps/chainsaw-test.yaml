apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: multi-apps
spec:
  description: This e2e test runs a multi-apps scenario
  skipDelete: true
  steps:
    - name: Prepare destination
      try:
        - apply:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/simple-trace-db-deployment.yaml
        - assert:
            timeout: 1m
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/assert/simple-trace-db-running.yaml

    - name: Install Odigos
      try:
        - script:
            timeout: 3m
            content: |
              echo "Installing Odigos with tag $IMAGE_TAG"
              ../../../../odigos/cli/odigos install --namespace odigos-test --version $IMAGE_TAG --onprem-token $ODIGOS_API_KEY
        - assert:
            timeout: 1m
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/assert/odigos-installed.yaml
      catch:
        - script:
            content: |
              kubectl describe pods -n odigos-test

    - name: Verify node Odiglet installed label has been added
      try:
        - assert:
            file: ../../common/assert/node-odiglet-label.yaml

    - name: Install Simple Demo Apps
      try:
        - apply:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/install-simple-demo.yaml
        - script:
            timeout: 2m
            content: |
              kubectl wait --for=condition=ready pod -l app=frontend --timeout=120s
              kubectl wait --for=condition=ready pod -l app=coupon --timeout=120s
              kubectl wait --for=condition=ready pod -l app=inventory --timeout=120s
              kubectl wait --for=condition=ready pod -l app=pricing --timeout=120s
              kubectl wait --for=condition=ready pod -l app=membership --timeout=120s
              kubectl wait --for=condition=ready pod -l app=currency --timeout=120s
        - assert:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/assert/simple-demo-installed.yaml

    - name: Instrument Namespace & Assert Detect Languages
      try:
        - apply:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/instrument-default-ns.yaml
        - assert:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/assert/simple-demo-runtime-detected.yaml

    - name: Add Destination
      try:
        - apply:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/add-simple-trace-db-destination.yaml
        - assert:
            file: assert-instrumented-and-pipeline.yaml

    - name: Generate Traffic
      try:
        - apply:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/generate-traffic-job.yaml
        - script:
            timeout: 1m
            content: |
              kubectl wait --for=condition=complete job/$(kubectl get -f https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/generate-traffic-job.yaml -o=jsonpath='{.metadata.name}')
        - delete:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/generate-traffic-job.yaml

    - name: Wait For Trace
      try:
        - script:
            timeout: 1m
            content: |
              while true; do
                yaml=$(mktemp)
                curl -sSL -o "$yaml" https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/queries/wait-for-trace.yaml
                curl -sSL https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/simple_trace_db_query_runner.sh | bash -s -- "$yaml"

                status=$?
                rm -f "$yaml"

                [ $status -eq 0 ] && break
                sleep 1
              done
      catch:
        - script:
            content: |
              java_pod_name=$(kubectl get pods -n default -o jsonpath="{.items[*].metadata.name}" | tr ' ' '\n' | grep ^frontend)
              kubectl logs $java_pod_name -n default

    - name: Verify Trace - Context Propagation
      try:
        - script:
            content: |
              yaml=$(mktemp)
              curl -sSL -o "$yaml" https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/queries/context-propagation.yaml
              curl -sSL https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/simple_trace_db_query_runner.sh | bash -s -- "$yaml"
      catch:
        - podLogs:
            name: odiglet
            namespace: odigos-test

    - name: Verify Trace - Resource Attributes
      try:
        - script:
            content: |
              yaml=$(mktemp)
              curl -sSL -o "$yaml" https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/queries/resource-attributes.yaml
              curl -sSL https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/simple_trace_db_query_runner.sh | bash -s -- "$yaml"
      catch:
        - podLogs:
            name: odiglet
            namespace: odigos-test

    - name: Verify Trace - Span Attributes
      try:
        - script:
            content: |
              yaml=$(mktemp)
              curl -sSL -o "$yaml" https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/queries/span-attributes.yaml
              curl -sSL https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/simple_trace_db_query_runner.sh | bash -s -- "$yaml"
      catch:
        - podLogs:
            name: odiglet
            namespace: odigos-test
