apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cli-upgrade
spec:
  description: Check successful upgrade from latest version of CLI
  skipDelete: true
  steps:
    - name: Prepare destination
      try:
        - apply:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/apply/simple-trace-db-deployment.yaml

    - name: Install - Simple Demo Apps
      try:
        - apply:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/apply/install-simple-demo.yaml

    - name: Install Odigos latest release from GitHub for pre upgrade setup
      try:
        - script:
            content: |
              #!/bin/bash

              # Define variables
              REPO_URL="https://api.github.com/repos/odigos-io/odigos/releases/latest"
              ARCH=$(uname -m) # Get the system architecture
              OS=$(uname | tr '[:upper:]' '[:lower:]') # Get the OS name in lowercase

              # Convert architecture to match GitHub naming conventions if necessary
              if [ "$ARCH" = "x86_64" ]; then
                  ARCH="amd64"
              elif [ "$ARCH" = "aarch64" ]; then
                  ARCH="arm64"
              fi

              # Fetch the release assets from GitHub API
              ASSETS_JSON=$(curl -s --retry 5 --retry-delay 5 "$REPO_URL")

              # Find the download URL that matches the OS and architecture
              DOWNLOAD_URL=$(echo "$ASSETS_JSON" | grep "browser_download_url" | grep "$OS" | grep "$ARCH" | cut -d '"' -f 4)

              # Check if the download URL was found
              if [ -z "$DOWNLOAD_URL" ]; then
                  echo "No matching release found for OS: $OS and Architecture: $ARCH"
                  exit 1
              fi

              # Download the matched asset
              curl -L --retry 5 --retry-delay 5 -o odigos-latest.tar.gz "$DOWNLOAD_URL"

              # Extract the downloaded file
              tar -xvzf odigos-latest.tar.gz

              # cleanup any existing installation of odigos the might be left over from previous runs while developing
              ./odigos uninstall --yes

              ./odigos install --namespace odigos-test --onprem-token $ODIGOS_API_KEY

              ../../common/verify_odigos_installation.sh odigos-test
            timeout: 5m # longer timeout since the images are being pulled from dockerhub
        - assert:
            timeout: 1m
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/assert/odigos-installed.yaml
      catch:
        - script:
            content: |
              kubectl describe pods -n odigos-test

    - name: Verify node Odiglet installed label has been added
      try:
        - assert:
            timeout: 30s
            file: ../../common/assert/node-odiglet-label.yaml

    - name: Assert Trace DB is up
      try:
        - assert:
            timeout: 1m
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/assert/simple-trace-db-running.yaml

    - name: Assert - Simple Demo Apps Installed
      try:
        - assert:
            timeout: 3m
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/assert/simple-demo-installed.yaml

    - name: Instrument Namespace
      try:
        - apply:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/apply/instrument-default-ns.yaml

    - name: Ruby Detected, Rollout Restart
      try:
        - assert:
            timeout: 3m
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/assert/ruby-partial-runtime-detected.yaml
        - script:
            timeout: 1m
            content: |
              kubectl rollout restart deployment geolocation
              kubectl wait --for=condition=ready pod -l app=geolocation --timeout=60s

    - name: Assert Runtime Detected
      try:
        - assert:
            timeout: 3m
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/assert/simple-demo-runtime-detected.yaml

    - name: Add Destination
      try:
        - apply:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/apply/add-simple-trace-db-destination.yaml

    - name: Use custom Go offsets file to make sure it works with upgrade
      try:
        - script:
            content: ../../../../odigos/cli/odigos pro update-offsets
        - assert:
            file: assert-custom-offsets.yaml

    - name: Upgrade to HEAD version with the current compiled cli
      try:
        - script:
            timeout: 3m
            content: ../../../../odigos/cli/odigos install --ns odigos-test --set image.tag=$IMAGE_TAG --set onPremToken=$ODIGOS_API_KEY
        - assert:
            timeout: 3m
            file: assert-odigos-upgraded-with-custom-offsets.yaml

    - name: Assert simple demo apps ready after upgrade
      try:
        - assert:
            timeout: 3m
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/assert/simple-demo-installed.yaml

    - name: Instrumented and pipeline ready after upgrade
      try:
        - assert:
            timeout: 3m
            file: ../../common/assert/instrumented-and-pipeline.yaml
      catch:
        - script:
            content: |
              kubectl describe pods -n default

    - name: Generate Traffic
      try:
        - apply:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/apply/generate-traffic-job.yaml
        - script:
            timeout: 1m
            content: |
              kubectl wait --for=condition=complete job/$(kubectl get -f https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/apply/generate-traffic-job.yaml -o=jsonpath='{.metadata.name}')
        - delete:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/apply/generate-traffic-job.yaml

    - name: Wait For Trace
      try:
        - script:
            timeout: 1m
            content: |
              yaml=$(mktemp)
              script=$(mktemp)
              curl -sSL --retry 5 --retry-delay 5 -o "$yaml" https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/queries/wait-for-trace.yaml
              curl -sSL --retry 5 --retry-delay 5 -o "$script" https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/simple_trace_db_query_runner.sh

              while true; do
                bash "$script" "$yaml"
                status=$?
                if [ $status -eq 0 ]; then
                  break
                fi
                sleep 1
              done

              rm -f "$yaml" "$script"
      catch:
        - script:
            content: |
              java_pod_name=$(kubectl get pods -n default -o jsonpath="{.items[*].metadata.name}" | tr ' ' '\n' | grep ^frontend)
              kubectl logs $java_pod_name -n default

    - name: Verify Trace - Context Propagation
      try:
        - script:
            content: |
              yaml=$(mktemp)
              curl -sSL --retry 5 --retry-delay 5 -o "$yaml" https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/queries/context-propagation.yaml
              curl -sSL --retry 5 --retry-delay 5 https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/simple_trace_db_query_runner.sh | bash -s -- "$yaml"
      catch:
        - podLogs:
            name: odiglet
            namespace: odigos-test

    - name: Verify Trace - Resource Attributes
      try:
        - script:
            content: |
              yaml=$(mktemp)
              curl -sSL --retry 5 --retry-delay 5 -o "$yaml" https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/queries/resource-attributes.yaml
              curl -sSL --retry 5 --retry-delay 5 https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/simple_trace_db_query_runner.sh | bash -s -- "$yaml"
      catch:
        - podLogs:
            name: odiglet
            namespace: odigos-test

    - name: Verify Trace - Span Attributes
      try:
        - script:
            content: |
              yaml=$(mktemp)
              curl -sSL --retry 5 --retry-delay 5 -o "$yaml" https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/queries/span-attributes.yaml
              curl -sSL --retry 5 --retry-delay 5 https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/{{BASE_BRANCH}}/tests/common/simple_trace_db_query_runner.sh | bash -s -- "$yaml"
      catch:
        - podLogs:
            name: odiglet
            namespace: odigos-test

    - name: Revert custom Go offsets
      try:
        - script:
            content: ../../../../odigos/cli/odigos pro update-offsets --default
        - assert:
            file: assert-odigos-upgraded.yaml
