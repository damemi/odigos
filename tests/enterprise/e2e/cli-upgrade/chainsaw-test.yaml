apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cli-upgrade
spec:
  description: Check successful upgrade from latest version of CLI
  skipDelete: true
  steps:
    - name: Prepare destination
      try:
        - apply:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/simple-trace-db-deployment.yaml
        - assert:
            timeout: 1m
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/assert/simple-trace-db-running.yaml

    - name: Install Odigos latest release from GitHub for pre upgrade setup
      try:
        - script:
            content: |
              #!/bin/bash

              # Define variables
              REPO_URL="https://api.github.com/repos/odigos-io/odigos/releases/latest"
              ARCH=$(uname -m) # Get the system architecture
              OS=$(uname | tr '[:upper:]' '[:lower:]') # Get the OS name in lowercase

              # Convert architecture to match GitHub naming conventions if necessary
              if [ "$ARCH" = "x86_64" ]; then
                  ARCH="amd64"
              elif [ "$ARCH" = "aarch64" ]; then
                  ARCH="arm64"
              fi

              # Fetch the release assets from GitHub API
              ASSETS_JSON=$(curl -s "$REPO_URL")

              # Find the download URL that matches the OS and architecture
              DOWNLOAD_URL=$(echo "$ASSETS_JSON" | grep "browser_download_url" | grep "$OS" | grep "$ARCH" | cut -d '"' -f 4)

              # Check if the download URL was found
              if [ -z "$DOWNLOAD_URL" ]; then
                  echo "No matching release found for OS: $OS and Architecture: $ARCH"
                  exit 1
              fi

              # Download the matched asset
              curl -L -o odigos-latest.tar.gz "$DOWNLOAD_URL"

              # Extract the downloaded file
              tar -xvzf odigos-latest.tar.gz

              # cleanup any existing installation of odigos the might be left over from previous runs while developing
              ./odigos uninstall --yes
              # Run the Odigos CLI installation
              ./odigos install --namespace odigos-test --onprem-token $ODIGOS_API_KEY

              curl -sSL -o verify_odigos_installation.sh https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/verify_odigos_installation.sh
              bash verify_odigos_installation.sh odigos-test
            timeout: 4m # longer timeout since the images are being pulled from dockerhub
        - assert:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/assert/odigos-installed.yaml

    - name: Install Simple Demo Apps
      try:
        - apply:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/install-simple-demo.yaml
        - script:
            timeout: 2m
            content: |
              kubectl wait --for=condition=ready pod -l app=frontend --timeout=120s
              kubectl wait --for=condition=ready pod -l app=coupon --timeout=120s
              kubectl wait --for=condition=ready pod -l app=inventory --timeout=120s
              kubectl wait --for=condition=ready pod -l app=pricing --timeout=120s
              kubectl wait --for=condition=ready pod -l app=membership --timeout=120s
              kubectl wait --for=condition=ready pod -l app=currency --timeout=120s
        - assert:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/assert/simple-demo-installed.yaml

    - name: Instrument Namespace & Assert Detect Languages
      try:
        - apply:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/instrument-default-ns.yaml
        - assert:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/assert/simple-demo-runtime-detected.yaml

    - name: Add Destination
      try:
        - apply:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/add-simple-trace-db-destination.yaml

    - name: Use custom Go offsets file to make sure it works with upgrade
      try:
        - script:
            content: ../../../../odigos/cli/odigos pro update-offsets
        - assert:
            file: assert-custom-offsets.yaml

    - name: Odigos pipeline pods ready
      # We make sure that the pipeline pods are ready before proceeding with the next steps
      # This is intentionally different from pipeline-ready.yaml, which checks for the pipeline CRDs
      # When adding a feature related to the pipeline, if we would use the same assert before the upgrade, the test would fail.
      # Since the version installed here is latest official one.
      try:
        - script:
            timeout: 1m
            content: |
              curl -sSL https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/assert_pipeline_pods_ready.sh | bash -s -- "odigos-test" "120s"

    - name: Upgrade to HEAD version with the current compiled cli
      try:
        - script:
            timeout: 3m
            content: ../../../../odigos/cli/odigos upgrade --version $IMAGE_TAG --skip-version-check # since the tag e2e-test is not a valid semantic version, we need to bypass it with --skip-version-check
        - assert:
            timeout: 3m
            file: assert-odigos-upgraded-with-custom-offsets.yaml

    - name: Instrumented and pipeline ready after upgrade
      try:
        - assert:
            file: ../../common/assert/instrumented-and-pipeline.yaml

    - name: Generate Traffic
      try:
        - apply:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/generate-traffic-job.yaml
        - script:
            timeout: 1m
            content: |
              kubectl wait --for=condition=complete job/$(kubectl get -f https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/generate-traffic-job.yaml -o=jsonpath='{.metadata.name}')
        - delete:
            file: https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/apply/generate-traffic-job.yaml

    - name: Wait For Trace
      try:
        - script:
            timeout: 1m
            content: |
              while true; do
                yaml=$(mktemp)
                curl -sSL -o "$yaml" https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/queries/wait-for-trace.yaml
                curl -sSL https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/simple_trace_db_query_runner.sh | bash -s -- "$yaml"

                status=$?
                rm -f "$yaml"

                [ $status -eq 0 ] && break
                sleep 1
              done
      catch:
        - script:
            content: |
              java_pod_name=$(kubectl get pods -n default -o jsonpath="{.items[*].metadata.name}" | tr ' ' '\n' | grep ^frontend)
              kubectl logs $java_pod_name -n default

    - name: Verify Trace - Context Propagation
      try:
        - script:
            content: |
              yaml=$(mktemp)
              curl -sSL -o "$yaml" https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/queries/context-propagation.yaml
              curl -sSL https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/simple_trace_db_query_runner.sh | bash -s -- "$yaml"
      catch:
        - podLogs:
            name: odiglet
            namespace: odigos-test

    - name: Verify Trace - Resource Attributes
      try:
        - script:
            content: |
              yaml=$(mktemp)
              curl -sSL -o "$yaml" https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/queries/resource-attributes.yaml
              curl -sSL https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/simple_trace_db_query_runner.sh | bash -s -- "$yaml"
      catch:
        - podLogs:
            name: odiglet
            namespace: odigos-test

    - name: Verify Trace - Span Attributes
      try:
        - script:
            content: |
              yaml=$(mktemp)
              curl -sSL -o "$yaml" https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/queries/span-attributes.yaml
              curl -sSL https://raw.githubusercontent.com/odigos-io/odigos/refs/heads/main/tests/common/simple_trace_db_query_runner.sh | bash -s -- "$yaml"
      catch:
        - podLogs:
            name: odiglet
            namespace: odigos-test

    - name: Revert custom Go offsets
      try:
        - script:
            content: ../../../../odigos/cli/odigos pro update-offsets --default
        - assert:
            file: assert-odigos-upgraded.yaml
