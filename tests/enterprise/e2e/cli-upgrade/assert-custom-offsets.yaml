apiVersion: v1
kind: ConfigMap
metadata:
  name: odigos-go-offsets
  namespace: odigos-test
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/name: odiglet
  namespace: odigos-test
  ownerReferences:
    - apiVersion: apps/v1
      blockOwnerDeletion: true
      controller: true
      kind: DaemonSet
      name: odiglet
spec:
  containers:
    - name: odiglet
      resources: {}
      securityContext:
        capabilities:
          add:
            - SYS_PTRACE
        privileged: true
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: CURRENT_NS
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: OTEL_LOG_LEVEL
          value: info
        - name: ODIGOS_ONPREM_TOKEN
          valueFrom:
            secretKeyRef:
              key: odigos-onprem-token
              name: odigos-pro
        - name: OTEL_GO_OFFSETS_FILE
          value: /offsets/go_offset_results.json
    - name: deviceplugin
status:
  containerStatuses:
    - name: deviceplugin
      ready: true
      restartCount: 0
      started: true
    - name: odiglet
      ready: true
      restartCount: 0
      started: true
