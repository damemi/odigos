apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    odigos.io/collector-role: "CLUSTER_GATEWAY"
  name: odigos-gateway
  namespace: odigos-test
  ownerReferences:
    - apiVersion: odigos.io/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: CollectorsGroup
      name: odigos-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      odigos.io/collector-role: "CLUSTER_GATEWAY"
  template:
    metadata:
      labels:
        odigos.io/collector-role: "CLUSTER_GATEWAY"
    spec:
      containers:
        # Do not assert the full gateway env list here: this file is used both
        # pre-upgrade (released build, no collector ODIGOS_ONPREM_TOKEN) and on
        # HEAD (token present). Token injection is covered by odigos-installed /
        # pipeline-ready / post-upgrade asserts.
        - name: gateway
          resources:
            requests:
              (memory != null): true
              (cpu != null): true
            limits:
              (memory != null): true
              (cpu != null): true
status:
  availableReplicas: 2
  readyReplicas: 2
  replicas: 2
---
