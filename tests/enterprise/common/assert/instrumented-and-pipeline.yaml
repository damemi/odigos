apiVersion: v1
kind: Pod
metadata:
  namespace: default
  labels:
    app: coupon
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: odigos.io/odiglet-enterprise-installed
                operator: In
                values:
                  - 'true'
  containers:
    - name: coupon
      resources:
        limits:
          instrumentation.odigos.io/generic: '1'
        requests:
          instrumentation.odigos.io/generic: '1'
      (env[?name == 'ODIGOS_CONTAINER_NAME']):
        - value: 'coupon'
      (env[?name == 'ODIGOS_DISTRO_NAME']):
        - value: 'nodejs-enterprise'
      (env[?name == 'ODIGOS_POD_NAME']):
        - valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
      (env[?name == 'ODIGOS_WORKLOAD_NAMESPACE']):
        - value: 'default'
      (env[?name == 'NODE_OPTIONS']):
        - value: '--require /var/odigos/nodejs-ebpf/autoinstrumentation.js'
status:
  containerStatuses:
    - name: coupon
      ready: true
      restartCount: 0
      started: true
  phase: Running
---
apiVersion: v1
kind: Pod
metadata:
  namespace: default
  labels:
    app: currency
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: odigos.io/odiglet-enterprise-installed
                operator: In
                values:
                  - 'true'
  containers:
    - name: currency
      resources:
        limits:
          instrumentation.odigos.io/generic: '1'
        requests:
          instrumentation.odigos.io/generic: '1'
      (env[?name == 'ODIGOS_CONTAINER_NAME']):
        - value: currency
      (env[?name == 'ODIGOS_DISTRO_NAME']):
        - value: php-enterprise
      (env[?name == 'ODIGOS_POD_NAME']):
        - valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
      (env[?name == 'ODIGOS_WORKLOAD_NAMESPACE']):
        - value: default
      (env[?name == 'NODE_IP']):
        - valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
      (env[?name == 'OTEL_EXPORTER_OTLP_ENDPOINT']):
        - (($values.k8sMinorVersion < `26` && value == 'http://$(NODE_IP):4318') || value == 'http://odigos-data-collection-local-traffic.odigos-test:4318'): true
      (env[?name == 'PHP_INI_SCAN_DIR']):
        - value: ':/var/odigos/php/8.2'
      (env[?name == 'OTEL_PHP_AUTOLOAD_ENABLED']):
        - value: 'true'
      (env[?name == 'OTEL_EXPORTER_OTLP_PROTOCOL']):
        - value: 'http/protobuf'
      (env[?name == 'OTEL_PROPAGATORS']):
        - value: 'tracecontext,baggage'
      (env[?name == 'OTEL_SERVICE_NAME']):
        - value: currency
      (env[?name == 'OTEL_RESOURCE_ATTRIBUTES']):
        - value: 'k8s.pod.name=$(ODIGOS_POD_NAME),k8s.container.name=currency,k8s.namespace.name=default,k8s.deployment.name=currency'
      (env[?name == 'OTEL_LOGS_EXPORTER']):
        - value: none
      (env[?name == 'OTEL_METRICS_EXPORTER']):
        - value: none
      (env[?name == 'OTEL_TRACES_EXPORTER']):
        - value: otlp
    - name: nginx
status:
  containerStatuses:
    - name: currency
      ready: true
      restartCount: 0
      started: true
    - name: nginx
      ready: true
      restartCount: 0
      started: true
  phase: Running
