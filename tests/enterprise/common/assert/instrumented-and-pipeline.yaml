apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    odigos.io/collector-role: 'NODE_COLLECTOR'
  name: odigos-data-collection
  namespace: odigos-test
  ownerReferences:
    - apiVersion: odigos.io/v1alpha1
      blockOwnerDeletion: true
      controller: true
      kind: CollectorsGroup
      name: odigos-data-collection
spec:
  selector:
    matchLabels:
      odigos.io/collector-role: 'NODE_COLLECTOR'
  template:
    metadata:
      labels:
        odigos.io/collector-role: 'NODE_COLLECTOR'
    spec:
      containers:
        - name: data-collection
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /var/lib/docker/containers
              name: varlibdockercontainers
              readOnly: true
            - mountPath: /var/log
              name: varlog
              readOnly: true
            # - mountPath: /mnt/var/log
            #   name: mntvarlog
            #   readOnly: true
            - mountPath: /hostfs
              name: hostfs
              readOnly: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: GOMEMLIMIT
              (value != null): true
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  containerName: data-collection
                  divisor: '0'
                  resource: limits.cpu
          resources:
            limits:
              (memory != null): true
            requests:
              (memory != null): true
      (($values.k8sMinorVersion < `26` && hostNetwork != null) || (hostNetwork == null)): true
      nodeSelector:
        kubernetes.io/os: linux
      securityContext: {}
      serviceAccount: odigos-data-collection
      serviceAccountName: odigos-data-collection
      volumes:
        - hostPath:
            path: /var/log
            type: ''
          name: varlog
        # - hostPath:
        #     path: /mnt/var/log
        #     type: ''
        #   name: mntvarlog
        - hostPath:
            path: /var/lib/docker/containers
            type: ''
          name: varlibdockercontainers
        - hostPath:
            path: /
            type: ''
          name: hostfs
status:
  numberAvailable: 2
  numberReady: 2
---
