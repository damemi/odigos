apiVersion: v1
kind: Pod
metadata:
  namespace: default
  labels:
    app: coupon
spec:
  containers:
    - name: coupon
      resources:
        limits:
          instrumentation.odigos.io/generic: "1"
        requests:
          instrumentation.odigos.io/generic: "1"
      (env[?name == 'ODIGOS_CONTAINER_NAME']):
        - value: "coupon"
      (env[?name == 'ODIGOS_DISTRO_NAME']):
        - value: "nodejs-enterprise"
      (env[?name == 'ODIGOS_POD_NAME']):
        - valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
      (env[?name == 'ODIGOS_WORKLOAD_NAMESPACE']):
        - value: "default"
      (env[?name == 'LD_PRELOAD']):
        - value: "/var/odigos/loader/loader.so"
status:
  containerStatuses:
    - name: coupon
      ready: true
      restartCount: 0
      started: true
  phase: Running
