apiVersion: v1
kind: Pod
metadata:
  namespace: default
  labels:
    app: inventory
spec:
  containers:
    - name: inventory
      resources:
        limits:
          instrumentation.odigos.io/generic: "1"
        requests:
          instrumentation.odigos.io/generic: "1"
      (env[?name == 'ODIGOS_CONTAINER_NAME']):
        - value: "inventory"
      (env[?name == 'ODIGOS_DISTRO_NAME']):
        - value: "python-enterprise"
      (env[?name == 'ODIGOS_POD_NAME']):
        - valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
      (env[?name == 'ODIGOS_WORKLOAD_NAMESPACE']):
        - value: "default"
      (env[?name == 'OTEL_PYTHON_CONFIGURATOR']):
        - value: "ebpf"
      # OpAMP transport selection depends on the instrumentor version: fresh installs on this branch pick unix (ODIGOS_OPAMP_UNIX_SOCKET), 
      # while cli-upgrade pods instrumented by the previous release still have the http var (ODIGOS_OPAMP_SERVER_HOST). Accept either.
      (env[?name == 'ODIGOS_OPAMP_UNIX_SOCKET' || name == 'ODIGOS_OPAMP_SERVER_HOST']):
        - ((name == 'ODIGOS_OPAMP_UNIX_SOCKET' && value == '/var/odigos/exchange/exchange.sock') || (name == 'ODIGOS_OPAMP_SERVER_HOST' && (($values.k8sMinorVersion < `26` && value == '$(NODE_IP):4320') || value == 'odiglet-local.odigos-test:4320'))): true
      (env[?name == 'LD_PRELOAD']):
        - value: "/var/odigos/loader/loader.so"
status:
  containerStatuses:
    - name: inventory
      ready: true
      restartCount: 0
      started: true
  phase: Running
