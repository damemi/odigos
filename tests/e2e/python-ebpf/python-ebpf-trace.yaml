apiVersion: e2e.tests.odigos.io/v1
kind: TraceTest
description: |
  inventory's server span comes from python-ebpf and continues the trace of the Java frontend that
  called it, so python-ebpf read the incoming traceparent.
query: |
  length([?
    span.serviceName == 'inventory' && span.kind == 'server' &&
    span.resourceAttributes."telemetry.distro.name" == 'python-ebpf' &&
    span.resourceAttributes."telemetry.sdk.language" == 'python' &&
    span.resourceAttributes."k8s.pod.name" &&
    parent.span.serviceName == 'frontend' && parent.span.resourceAttributes."telemetry.sdk.language" == 'java'
  ]) > `0`
expected:
  minimum: 1
