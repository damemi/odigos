apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: helm-upgrade
spec:
  description: Check successful upgrade from latest version of Helm chart
  skipDelete: true
  bindings:
    - name: traceDbNamespace
      value: traces
  steps:
    - name: Prepare destination
      try:
        - apply:
            file: ../../common/apply/simple-trace-db-deployment.yaml

    - name: Install - Simple Demo Apps
      try:
        - apply:
            file: ../../common/apply/install-simple-demo.yaml

    - name: Install Odigos latest release from the chart registry for pre upgrade setup
      try:
        - script:
            timeout: 2m
            content: |
              #!/bin/bash

              echo "🧼 Cleaning up any existing installation that might be left over from previous runs..."
              helm uninstall odigos -n odigos-test || true

              if [ -z "$LATEST_RELEASE_TAG" ]; then
                echo "❌ ERROR: LATEST_RELEASE_TAG is empty, aborting..."
                exit 1
              fi
              IMAGE_TAG="$LATEST_RELEASE_TAG"

              echo "$ODIGOS_API_KEY" | helm registry login registry.odigos.io -u odigos --password-stdin

              echo "🚀 Installing Odigos $IMAGE_TAG from oci://registry.odigos.io/charts/odigos..."
              helm upgrade --install odigos oci://registry.odigos.io/charts/odigos --version "${IMAGE_TAG#v}" \
                --set onPremToken="$ODIGOS_API_KEY" \
                --create-namespace \
                --namespace odigos-test \
                --set nodeSelector."kubernetes\.io/os"=linux
              kubectl label namespace odigos-test odigos.io/system-object="true"
        - assert:
            timeout: 4m
            file: ../../common/assert/latest-odigos-version-installed.yaml

    - name: Assert Trace DB is up
      try:
        - assert:
            timeout: 1m10s
            file: ../../common/assert/simple-trace-db-running.yaml

    - name: Assert - Simple Demo Apps Installed
      try:
        - assert:
            timeout: 1m10s
            file: ../../common/assert/simple-demo-installed.yaml

    - name: Instrument Namespace
      try:
        - apply:
            file: ../../common/apply/instrument-default-ns.yaml

    - name: Assert Runtime Detected
      try:
        - assert:
            timeout: 1m10s
            file: ../../common/assert/simple-demo-runtime-detected.yaml

    - name: Add Destination
      try:
        - apply:
            file: ../../common/apply/add-simple-trace-db-destination.yaml

    - name: Odigos pipeline pods ready
      # We make sure that the pipeline pods are ready before proceeding with the next steps
      # This is intentionally different from pipeline-ready.yaml, which checks for the pipeline CRDs
      # When adding a feature related to the pipeline, if we would use the same assert before the upgrade, the test would fail.
      # Since the version installed here is latest official one.
      try:
        - script:
            content: ../../common/assert_pipeline_pods_ready.sh
            timeout: 1m20s

    - name: Simple-demo instrumented after destination added
      try:
        - assert:
            file: simple-demo-instrumented-pre-upgrade.yaml

    - name: Upgrade to HEAD version with local Helm chart
      try:
        - script:
            content: |
              # The pwd is the directory of this file, so we have to walk up to the project root to find the helm chart
              P="../../.."
              helm upgrade odigos $P/helm/odigos --set onPremToken="$ODIGOS_API_KEY" \
                --namespace odigos-test \
                -f ../../common/odigos-values.yaml \
                --set image.tag=e2e-test \
                --set nodeSelector."kubernetes\.io/os"=linux
            timeout: 1m10s
        - assert:
            file: ../../common/assert/odigos-upgraded.yaml
            timeout: 4m
      catch:
        - get:
            apiVersion: v1
            kind: Pod

    - name: Verify Helm upgrade version
      try:
        - script:
            timeout: 1m10s
            content: |
              echo "Starting Odigos version check after upgrade..."
              export ACTUAL_VERSION=$(../../../cli/odigos version --cluster)
              echo "Actual Version: $ACTUAL_VERSION"

              if [ "$ACTUAL_VERSION" != "e2e-test" ]; then
                echo "❌ Odigos version is not e2e-test, got $ACTUAL_VERSION"
                exit 1
              fi
              echo "✅ Odigos version verification passed"

    - name: Odigos pipeline ready after upgrade
      try:
        - assert:
            timeout: 1m10s
            file: ../../common/assert/pipeline-ready.yaml

    # Wait for the upgraded instrumentor's injection webhook to actually serve
    # (pods rolled out + Ready = serving cert mounted) before checking that the
    # demo apps are instrumented. Without this, the workload rollout can race the
    # kubelet secret-volume sync (cert-controller#35) and be admitted uninjected.
    - name: Wait for instrumentor webhook to be serving after upgrade
      try:
        - assert:
            timeout: 1m
            file: ../../common/assert/instrumentor-webhook-ready.yaml

    - name: Wait for instrumentation
      try:
        - script:
            timeout: 3m
            content: bash ../../common/wait_for_instrumentation.sh

    - name: Simple-demo instrumented after upgrade
      try:
        - assert:
            timeout: 3m
            file: simple-demo-instrumented-post-upgrade.yaml

    # The first request through a freshly instrumented Java app can't propagate context: its HTTP client
    # instrumentations load on first use. /rate only reaches currency, so the warm-up does not affect the trace assertions.
    - name: Warm Up Java Frontend
      try:
        - script:
            timeout: 3m
            content: |
              kubectl delete pod warmup-traffic -n default --ignore-not-found
              kubectl run warmup-traffic -n default --image=curlimages/curl:8.4.0 --restart=Never --command -- \
                sh -c 'for i in 1 2 3; do curl -s -o /dev/null "http://frontend:8080/rate/usd-eur"; sleep 2; done'
              kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/warmup-traffic -n default --timeout=90s
              kubectl delete pod warmup-traffic -n default --ignore-not-found

    - name: Generate Traffic
      try:
        - apply:
            file: ../../common/apply/generate-traffic-job.yaml
        - script:
            timeout: 1m10s
            content: |
              kubectl wait --for=condition=complete --timeout=1m job/$(kubectl get -f ../../common/apply/generate-traffic-job.yaml -o=jsonpath='{.metadata.name}')
        - delete:
            file: ../../common/apply/generate-traffic-job.yaml

    - name: Wait For Trace
      try:
        - script:
            timeout: 1m10s
            content: bash ../../common/simple_trace_db_query_runner.sh --wait ../../common/queries/wait-for-trace.yaml
      catch:
        - script:
            content: |
              java_pod_name=$(kubectl get pods -n default -o jsonpath="{.items[*].metadata.name}" | tr ' ' '\n' | grep ^frontend)
              kubectl logs $java_pod_name -n default

    - name: Verify Trace - Context Propagation
      try:
        - script:
            timeout: 1m10s
            content: bash ../../common/simple_trace_db_query_runner.sh --wait ../../common/queries/context-propagation.yaml

    - name: Verify Trace - Resource Attributes
      try:
        - script:
            content: |
              ../../common/simple_trace_db_query_runner.sh ../../common/queries/resource-attributes.yaml

    - name: Verify Trace - Span Attributes
      try:
        - script:
            content: |
              ../../common/simple_trace_db_query_runner.sh ../../common/queries/span-attributes.yaml
