# Java pods are left out: the enterprise Java agent (java-ebpf-instrumentations) injects no environment variables.
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: inventory
  namespace: default
spec:
  containers:
    - image: registry.odigos.io/odigos-demo-inventory:v0.1.14
      # the user defined PYTHONPATH remains unchanged
      # and we add the loader.
      name: inventory
      (env[?name=='PYTHONPATH']):
       - valueFrom:
          configMapKeyRef:
            key: PYTHONPATH
            name: env-configmap
      (env[?name=='ORIGINAL_PYTHONPATH']): []
      (env[?name=='LD_PRELOAD']):
      - value: "/var/odigos/loader/loader.so"
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: python-alpine
  namespace: default
spec:
  containers:
    - image: public.ecr.aws/odigos/python-alpine:v0.0.1
      name: python-alpine
      # the python-alpine container is running in secure-execution mode - hence we should avoid using the loader
      # and fallback to the pod-manifest env vars.
      (env[?name=='PYTHONPATH']):
      - value: /app:/var/odigos/python-ebpf:/var/odigos/python/opentelemetry/instrumentation/auto_instrumentation:/var/odigos/python
      (env[?name=='LD_PRELOAD']): []