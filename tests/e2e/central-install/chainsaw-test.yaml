apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: central-install
spec:
  description: This e2e test installs both Odigos OSS (odigos-test) and Odigos Central (odigos-central) via helm charts
  skipDelete: true
  steps:
    - name: Prepare destination
      try:
        - apply:
            file: ../../../tests/common/apply/simple-trace-db-deployment.yaml

    - name: Install - Simple Demo Apps
      try:
        - apply:
            file: ../../../tests/common/apply/install-simple-demo.yaml

    - name: Install Odigos OSS
      try:
        - script:
            timeout: 1m10s
            content: |
              # Install regular Odigos in odigos-test namespace
              helm upgrade --install odigos \
                ../../../helm/odigos \
                -f ../../common/odigos-values.yaml \
                --create-namespace \
                --namespace odigos-test \
                --set image.tag=$IMAGE_TAG \
                --set onPremToken=$ODIGOS_API_KEY \
                --set clusterName=testing \
                --set centralProxy.centralBackendURL="central-backend.odigos-central.svc.cluster.local:8081"

              kubectl label namespace odigos-test odigos.io/system-object="true"

    - name: Install Odigos Central
      try:
        - script:
            timeout: 1m10s
            content: |
              # Install Odigos Central in odigos-central namespace
              helm upgrade --install odigos-central \
                ../../../helm/odigos-central \
                -f ../../common/central-values.yaml \
                --create-namespace \
                --namespace odigos-central \
                --set image.tag=$IMAGE_TAG \
                --set image.repository=registry.odigos.io/odigos-enterprise \
                --set onPremToken=$ODIGOS_API_KEY \
                --set auth.enabled=false \
                --set keycloak.enabled=false \
                --set auth.adminUsername=admin \
                --set auth.adminPassword=admin \
                --set auth.javaOpts="-Xms128m -Xmx256m -XX:ActiveProcessorCount=1"

              kubectl label namespace odigos-central odigos.io/system-object="true"

    - name: Verify Odigos OSS Installation
      try:
        - script:
            timeout: 1m10s
            content: |
              echo "Starting Odigos OSS version check..."
              export ACTUAL_VERSION=$(../../../cli/odigos version --cluster)
              echo "Actual Version: $ACTUAL_VERSION"
              echo "Expected Version: $IMAGE_TAG"

        - assert:
            timeout: 2m50s
            file: ../../common/assert/odigos-installed.yaml

      catch:
        - script:
            content: |
              echo "🔍 Listing all resources in namespace 'odigos-test'..."
              kubectl get all -n odigos-test

              echo "📝 Describing all resources in namespace 'odigos-test'..."
              kubectl describe deployments -n odigos-test

    - name: Verify Odigos Central Installation
      try:
        - assert:
            # Keycloak cold-start on kind regularly exceeds ~2m; backend waits on it.
            timeout: 5m
            file: ../../common/assert/odigos-central-installed.yaml

      catch:
        - script:
            content: |
              echo "🔍 Listing all resources in namespace 'odigos-central'..."
              kubectl get all -n odigos-central

              echo "📝 Describing deployments in namespace 'odigos-central'..."
              kubectl describe deployments -n odigos-central

    - name: Test Central GraphQL Integration By Instrumenting Namespace on the testing odigos installation
      try:
        - script:
            # Includes wait for central-backend /readyz (Keycloak init can lag kubelet Ready).
            timeout: 5m
            content: |
              ./test-central-graphql.sh

    - name: Verify Node Odiglet label has been added
      try:
        - assert:
            timeout: 1m10s
            file: ../../common/assert/node-odiglet-label.yaml

    - name: Assert Trace DB is up
      try:
        - assert:
            timeout: 1m10s
            file: ../../../tests/common/assert/simple-trace-db-running.yaml

    - name: Add Destination
      try:
        - apply:
            file: ../../../tests/common/apply/add-simple-trace-db-destination.yaml

    - name: Assert - Simple Demo Apps Installed
      try:
        - assert:
            timeout: 1m10s
            file: ../../../tests/common/assert/simple-demo-installed.yaml

    - name: Instrument Namespace
      try:
        - apply:
            file: ../../../tests/common/apply/instrument-default-ns.yaml

    - name: Assert Runtime Detected
      try:
        - assert:
            timeout: 1m10s
            file: ../../../tests/common/assert/simple-demo-runtime-detected.yaml

    - name: Odigos pipeline ready
      try:
        - assert:
            timeout: 1m10s
            file: ../../common/assert/pipeline-ready.yaml

    # helm-upgrade's assert for the latest release, which CI installs. The Odigos tests check the traces.
    - name: Simple-demo instrumented after destination added
      try:
        - assert:
            timeout: 1m30s
            file: ../helm-upgrade/simple-demo-instrumented-pre-upgrade.yaml
