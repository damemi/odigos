  - go.opentelemetry.io/collector/config/configgrpc => github.com/odigos-io/odigos/collector/config/configgrpc v1.36.0-pre9.0.20260902094221-4dd3fa8fc75e
  - github.com/odigos-io/odigos/collector/extension/odigosconfigk8sextension => github.com/odigos-io/odigos/collector/extension/odigosconfigk8sextension v1.36.0-pre9.0.20260902094221-4dd3fa8fc75e
  # Same commit as common above; this module has no published tag yet.
  - github.com/odigos-io/odigos/collector/extension/odigoscapabilitiesextension => github.com/odigos-io/odigos/collector/extension/odigoscapabilitiesextension v1.36.0-pre9.0.20260902094221-4dd3fa8fc75e
