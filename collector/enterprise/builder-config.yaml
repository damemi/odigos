  - gomod: odigosk8scmprovider v0.159.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.65.0

# Upstream points these at sibling directories; here they are pinned module versions.
# Each left-hand side must be the path that module's go.mod declares - Go validates a replacement
# against the path it replaces, and a directory replacement skips that check while this does not.
# Re-pin with `make update-collector-oss-deps`.
replaces:
  - odigosconditionalattributes => ../../processors/odigosconditionalattributes
  - odigossqldboperationprocessor => ../../processors/odigossqldboperationprocessor
  - github.com/odigos-io/odigos/collector/processor/odigossqlqueryprocessor => ../../processors/odigossqlqueryprocessor
  - github.com/odigos-io/odigos/collector/processor/odigospiimaskingprocessor => ../../processors/odigospiimaskingprocessor
  - github.com/odigos-io/odigos/collector/processors/odigostracestateprocessor => ../../processors/odigostracestateprocessor
  - github.com/open-telemetry/opentelemetry-collector-contrib/odigos/exporter/azureblobstorageexporter => ../../exporters/azureblobstorageexporter
  - github.com/open-telemetry/opentelemetry-collector-contrib/odigos/exporter/googlecloudstorageexporter => ../../exporters/googlecloudstorageexporter
  - github.com/open-telemetry/opentelemetry-collector-contrib/odigos/exporter/mockdestinationexporter => ../../exporters/mockdestinationexporter
  - github.com/open-telemetry/opentelemetry-collector-contrib/odigos/processor/odigostrafficmetrics => ../../processors/odigostrafficmetrics
  - github.com/odigos-io/odigos/collector/processors/odigostailsamplingprocessor => ../../processors/odigostailsamplingprocessor
  - github.com/odigos-io/odigos/collector/processor/odigosurltemplateprocessor => ../../processors/odigosurltemplateprocessor
  - github.com/odigos-io/odigos/collector/processor/odigoslogsresourceattrsprocessor => ../../processors/odigoslogsresourceattrsprocessor
  - github.com/odigos-io/odigos/collector/processor/odigosextractattributeprocessor => ../../processors/odigosextractattributeprocessor
  - github.com/odigos-io/odigos/collector/processors/odigostracefilterprocessor => ../../processors/odigostracefilterprocessor
  # Enterprise-owned: ocb resolves these from the working tree, so they carry no
  # version and `make update-collector-oss-deps` leaves them alone.
  - github.com/odigos-io/odigos/collector/enterprise/processors/odigosprofilesprocessor => ../processors/odigosprofilesprocessor
  - github.com/odigos-io/odigos/collector/enterprise/processors/odigosvmprofileattrsprocessor => ../processors/odigosvmprofileattrsprocessor
  - github.com/odigos-io/odigos/collector/enterprise/processors/odigossymbolizeprocessor => ../processors/odigossymbolizeprocessor
  - github.com/odigos-io/odigos/collector/enterprise/receivers/odigosebpfreceiver => ../receivers/odigosebpfreceiver
  - github.com/odigos-io/odigos/collector/enterprise/extension/odigosenterpriseauthextension => ../extension/odigosenterpriseauthextension
  - github.com/odigos-io/odigos/collector/enterprise/extension/odigosconfigvmextension => ../extension/odigosconfigvmextension
  - github.com/odigos-io/odigos/collector/enterprise/extension/odigosconfigconnectorextension => ../extension/odigosconfigconnectorextension
  - github.com/odigos-io/odigos/collector/enterprise/exporters/odigosurltemplatizationexporter => ../exporters/odigosurltemplatizationexporter
  # Not a component itself - enterprise-only shared logic (the counterpart of OSS common, incl.
  # the eBPF map exchange with odiglet) that components use, so the generated dist has to resolve it too.
  - odigosk8scmprovider => ../../providers/odigosk8scmprovider
  - github.com/odigos-io/odigos/collector/connectors/odigosrouterconnector => ../../connectors/odigosrouterconnector
  - github.com/open-telemetry/opentelemetry-collector-contrib/connector/servicegraphconnector => ../../connectors/servicegraphconnector
  # Past the tag: odigoscapabilitiesextension needs common/capabilities, added after v1.34.0-pre3.
  - github.com/odigos-io/odigos/common => ../../../common
  - github.com/odigos-io/odigos/odigosauth => ../../../odigosauth
  - go.opentelemetry.io/collector/config/configgrpc => ../../config/configgrpc
  - github.com/odigos-io/odigos/collector/extension/odigosconfigk8sextension => ../../extension/odigosconfigk8sextension
  # Same commit as common above; this module has no published tag yet.
  - github.com/odigos-io/odigos/collector/extension/odigoscapabilitiesextension => ../../extension/odigoscapabilitiesextension
  # Security floors for modules the component graph still resolves below the fixed version. The
  # left-hand side names the vulnerable version, so each replace applies only while the graph
  # selects exactly that version and goes inert once a component bump moves past it; an unversioned
  # replace would instead hold the module back, as `apache/thrift => v0.23.0` did. Drop an entry
  # once odigosotelcol/go.mod no longer requires its left-hand version.
  - golang.org/x/crypto v0.55.0 => golang.org/x/crypto v0.56.0
  - golang.org/x/mod v0.39.0 => golang.org/x/mod v0.40.0
  - golang.org/x/net v0.58.0 => golang.org/x/net v0.60.0
  - google.golang.org/grpc v1.83.1 => google.golang.org/grpc v1.83.2
