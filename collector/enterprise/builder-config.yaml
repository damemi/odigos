# Upstream points these at sibling directories; here they are pinned module versions.
# Each left-hand side must be the path that module's go.mod declares - Go validates a replacement
# against the path it replaces, and a directory replacement skips that check while this does not.
# Re-pin with `make update-collector-oss-deps`.
