  - github.com/odigos-io/odigos/collector/processor/odigosextractattributeprocessor => github.com/odigos-io/odigos/collector/processors/odigosextractattributeprocessor v1.36.0-pre9.0.20260902094221-4dd3fa8fc75e
  - github.com/odigos-io/odigos/collector/processors/odigostracefilterprocessor => github.com/odigos-io/odigos/collector/processors/odigostracefilterprocessor v1.36.0-pre9.0.20260902094221-4dd3fa8fc75e
  # Enterprise-owned: ocb resolves these from the working tree, so they carry no
